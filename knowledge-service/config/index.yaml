# The settings of the knowledge index and of its search (architecture 4.6 and 4.7, plan part 6, decisions D11 and D12).
# Every value here is part of the index build id: change one and the id changes.
schema: index-config/1

# D12: an English MiniLM-class model (ADR-045) at a revision pinned by hash. Apache-2.0 per the model card.
# The weights are fetched once, at image build time, to a local directory; nothing is downloaded at start.
model:
  repo: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  license: apache-2.0

# txtai embeddings: content store for the SQL, a dense index, and a BM25 keyword index whose scores are normalised.
# normalize: true is what makes `weights=0.7` mean 70% of the dense SCORE and 30% of the keyword SCORE (4.7);
# with it off txtai fuses by rank and the 70/30 split would weight rank positions. The loader refuses anything else.
embeddings:
  content: true
  backend: faiss
  scoring:
    method: bm25
    terms: true
    normalize: true

search:
  # a single value w gives w to the dense score and 1 - w to the keyword score (4.7)
  weights: 0.7
  # the window similar() takes before the SQL filters; D11 (c): becomes max(40, corpus size) if the recall test shows a miss
  candidates: 40
  # the top of the pack (4.7) and the most cross-referenced chunks added after it
  limit: 4
  expansions_max: 6
  # section 5.4 gives the knowledge chunks 2,000 tokens; expansions are added only while the pack stays inside it
  budget_tokens: 2000
  # ADR-043: the query is built from an intent template, the state codes and the English question. Part 8 shortened the templates
  # from five to eight words each to ONE word each. Measured on the whole corpus (141 chunks, part 8): with the long templates the
  # words of the template, not the question, picked the chunks (the DIRECTION template pulled the generic D3 chunks to the top of every
  # DIRECTION search), 16 of the 320 state-code searches of part 7 missed their own playbook section, the state code alone found 10 of 32
  # sections (28 are required) and 59 of 91 natural questions about D3 to D5 found their chunk; with one word each the figures are 0 of 320,
  # 32 of 32 and 82 of 91 (with no template at all: 0, 32 of 32 and 87 of 91). The word is only a hint of the intent. Part 9's labelled set
  # decides the final form, including none.
  intent_templates:
    DIRECTION: direction
    ENTRY_TIMING: entry
    EXIT_TARGETS: targets
    RISK_SIZING: risk
    EXPLAIN: explain
    NEWS: news
    REPORT_2: ''
    OUT_OF_SCOPE: ''
    INSTANT_M5_INSPECT: M5
    INSTANT_M15_INSPECT: M15

# 4.6 item 3: whole sections, split on ## and ###, merged under 200 tokens, split over 450 (tokens counted with the
# embedding model's own tokenizer, D11 (f)). 450 is the part 7 decision (Davin and the Advisor, 2026-10-13, reading 1 of the
# part 6 hand-off): the dense vector sees only the first 512 tokens of a chunk (MiniLM-L6-v2's pooling window), so a chunk
# of at most 450 is embedded whole, with room for the special tokens. Architecture 4.6 item 3 says 1,500; that figure is
# amended in part 10 (D17). max_chars is the packet's own limit on one chunk (KNOWLEDGE_CHUNK_MAX_CHARS in
# lib/intake/packet.ts); for English prose 450 tokens come to about 2,000 characters, so the token limit is the one that binds.
chunker:
  min_tokens: 200
  max_tokens: 450
  max_chars: 4000
