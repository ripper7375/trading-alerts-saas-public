# Dependabot version updates (T3-e / OPS-02).
#
# - pnpm is covered by the "npm" ecosystem: Dependabot reads pnpm-lock.yaml.
# - Minor and patch updates arrive as ONE grouped pull request per ecosystem
#   each week. A major update is never grouped: it gets its own pull request,
#   so it is reviewed on its own.
# - Security updates (a GitHub advisory for a dependency we use) are switched
#   on in the repository settings, not here. They are not grouped, so a fix to
#   an auth or payment dependency is reviewed alone.
# - Dependabot never edits `overrides` / `pnpm.overrides`. Those are changed
#   only in a dedicated "fix(security): ..." PR on main
#   (.claude/rules/security-overrides.md, check-overrides.yml), and a package
#   an override pins (next, lodash, jose, ...) is not moved by a Dependabot PR
#   alone.
# - Not covered yet: the NestJS services (money-service, operation-service,
#   railway-gateway; own package-lock.json), knowledge-service and mt5-service
#   (pip). Add an entry per directory when Davin wants them.
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
