name: Next.js CI (Progressive)

# Purpose: Progressive CI/CD for Next.js application
# Active: Activates incrementally as project is built during Phase 3
# Design: Checks for prerequisites before running each step

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '20'

jobs:
  check-project-status:
    name: Check Project Readiness
    runs-on: ubuntu-latest
    outputs:
      has_config: ${{ steps.check.outputs.has_config }}
      has_typescript: ${{ steps.check.outputs.has_typescript }}
      has_app_dir: ${{ steps.check.outputs.has_app_dir }}
      has_tests: ${{ steps.check.outputs.has_tests }}
      project_phase: ${{ steps.check.outputs.project_phase }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project configuration
        id: check
        run: |
          # Check for Next.js config
          if [ -f "next.config.js" ] || [ -f "next.config.mjs" ] || [ -f "next.config.ts" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
            echo "✅ Next.js config found"
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "⏭️  Next.js config not found (expected in Phase 3)"
          fi

          # Check for TypeScript config
          if [ -f "tsconfig.json" ]; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
            echo "✅ TypeScript config found"
          else
            echo "has_typescript=false" >> $GITHUB_OUTPUT
            echo "⏭️  tsconfig.json not found (expected in Phase 3)"
          fi

          # Check for app directory with content
          if [ -d "app" ] && [ "$(find app -name '*.tsx' -o -name '*.ts' 2>/dev/null | wc -l)" -gt 2 ]; then
            echo "has_app_dir=true" >> $GITHUB_OUTPUT
            echo "✅ app/ directory has substantial content"
          else
            echo "has_app_dir=false" >> $GITHUB_OUTPUT
            echo "⏭️  app/ directory minimal (expected in Phase 1-2)"
          fi

          # Check for test files
          if [ "$(find . -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' 2>/dev/null | grep -v node_modules | wc -l)" -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "✅ Test files found"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "⏭️  No test files (expected in Phase 1-2)"
          fi

          # Determine project phase
          if [ -f "next.config.js" ] || [ -f "next.config.mjs" ] || [ -f "next.config.ts" ]; then
            echo "project_phase=phase3-or-later" >> $GITHUB_OUTPUT
            echo "📍 Project Phase: 3+ (Implementation)"
          else
            echo "project_phase=phase1-2" >> $GITHUB_OUTPUT
            echo "📍 Project Phase: 1-2 (Planning/Documentation)"
          fi

      - name: Display project status
        run: |
          echo "📊 Next.js Project Status"
          echo "========================"
          echo ""
          echo "Configuration:"
          echo "  Next.js config: ${{ steps.check.outputs.has_config }}"
          echo "  TypeScript config: ${{ steps.check.outputs.has_typescript }}"
          echo ""
          echo "Code:"
          echo "  app/ directory: ${{ steps.check.outputs.has_app_dir }}"
          echo "  Test files: ${{ steps.check.outputs.has_tests }}"
          echo ""
          echo "Phase: ${{ steps.check.outputs.project_phase }}"
          echo ""
          if [ "${{ steps.check.outputs.project_phase }}" == "phase1-2" ]; then
            echo "ℹ️  Project is in planning phase - most CI steps will be skipped"
            echo "   This is expected and normal. CI will activate progressively during Phase 3."
          else
            echo "✅ Project ready for CI/CD validation"
          fi

  check-frontend-sync:
    name: Check Frontend Sync Status
    runs-on: ubuntu-latest
    needs: check-project-status
    if: needs.check-project-status.outputs.has_config == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if frontend sync is needed
        id: sync-check
        run: |
          echo "🔍 Checking frontend-backend sync status..."
          if pnpm run sync:check; then
            echo "✅ Frontend is in sync with backend"
            echo "sync_needed=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Frontend sync required!"
            echo "sync_needed=true" >> $GITHUB_OUTPUT
            echo ""
            echo "Modified files require frontend sync:"
            git diff --name-only HEAD~1..HEAD | grep -E '^(types/|lib/tier)' || true
            echo ""
            echo "📋 To fix this issue:"
            echo "   1. Run: npm run sync:frontend"
            echo "   2. Commit the synced files"
            echo "   3. Push changes"
            exit 1
          fi

      - name: Display sync status
        if: always()
        run: |
          if [ "${{ steps.sync-check.outputs.sync_needed }}" == "true" ]; then
            echo "❌ Frontend sync check FAILED"
            echo ""
            echo "This means that shared files between backend and frontend are out of sync."
            echo "Please run 'npm run sync:frontend' locally and commit the changes."
          else
            echo "✅ Frontend sync check PASSED"
            echo "All shared files are synchronized between backend and frontend."
          fi

  install-and-build:
    name: Install Dependencies & Build
    runs-on: ubuntu-latest
    needs: check-project-status
    if: needs.check-project-status.outputs.has_config == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          echo "📦 Installing pnpm dependencies..."
          pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          echo "🔨 Generating Prisma Client..."
          pnpm exec prisma generate

      - name: Build Next.js application
        run: |
          echo "🔨 Building Next.js application..."
          pnpm run build
          echo "✅ Build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  type-check:
    name: TypeScript Type Checking
    runs-on: ubuntu-latest
    needs: check-project-status
    if: needs.check-project-status.outputs.has_typescript == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run TypeScript type checking
        run: |
          echo "🔍 Running TypeScript type checking..."
          pnpm run type-check
          echo "✅ Type checking passed"

  lint:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    needs: check-project-status

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run ESLint
        continue-on-error: true
        run: |
          echo "🔍 Running ESLint..."
          pnpm run lint || echo "⚠️  Linting issues found (non-blocking during development)"

      - name: Check code formatting
        continue-on-error: true
        run: |
          echo "🔍 Checking code formatting..."
          pnpm run format:check || echo "⚠️  Formatting issues found (non-blocking during development)"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-project-status
    if: needs.check-project-status.outputs.has_tests == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          pnpm test
          echo "✅ Tests passed"
        env:
          CI: true

      - name: Upload test coverage
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [check-project-status, check-frontend-sync, install-and-build, type-check, lint, test]
    if: always()

    steps:
      - name: Display CI summary
        run: |
          echo "📊 Next.js CI Summary"
          echo "===================="
          echo ""
          echo "Project Phase: ${{ needs.check-project-status.outputs.project_phase }}"
          echo ""
          echo "Jobs Executed:"
          echo "  check-project-status: ✅"
          echo "  check-frontend-sync: ${{ needs.check-frontend-sync.result || '⏭️  skipped' }}"
          echo "  install-and-build: ${{ needs.install-and-build.result || '⏭️  skipped' }}"
          echo "  type-check: ${{ needs.type-check.result || '⏭️  skipped' }}"
          echo "  lint: ${{ needs.lint.result || '⏭️  skipped' }}"
          echo "  test: ${{ needs.test.result || '⏭️  skipped' }}"
          echo ""
          if [ "${{ needs.check-project-status.outputs.project_phase }}" == "phase1-2" ]; then
            echo "ℹ️  Most jobs skipped - this is expected during Phase 1-2"
            echo ""
            echo "📝 What this means:"
            echo "  - The repository is in planning/documentation phase"
            echo "  - CI/CD will progressively activate as you build the application"
            echo "  - When next.config.js and tsconfig.json are created, builds will run"
            echo "  - When test files are added, tests will run"
            echo ""
            echo "🚀 Next steps:"
            echo "  - Continue with Phase 3 implementation using Aider"
            echo "  - CI will automatically detect new files and activate appropriate checks"
          else
            echo "✅ Full CI/CD pipeline active"
            echo ""
            echo "All configured checks are running. Review any failures above."
          fi
