name: Tests

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

# Least privilege: read-only by default; a job that needs more declares its own permissions.
permissions:
  contents: read

jobs:
  unit-and-component-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Python-backed suites in __tests__/lib/intake (roster drift check
      # `scripts/intake/build_roster.py --check`, canonical-JSON and JSON Schema
      # parity) skip silently when `import yaml, jsonschema` fails. Install both
      # so they run, pinned to the versions they were verified with.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.0

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run TypeScript check
        run: pnpm run type-check

      - name: Run ESLint
        run: pnpm run lint

      - name: Check operating docs & agent scripts
        run: |
          node scripts/agents/check-operating-docs.mjs --tracked-only
          node --test scripts/agents/check-operating-docs.test.mjs scripts/agents/prune-state.test.mjs

      - name: Run unit and component tests
        run: pnpm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-and-component-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          NODE_ENV: test

  build-check:
    name: Production Build Check
    runs-on: ubuntu-latest
    needs: [unit-and-component-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build Next.js
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Check bundle size
        run: |
          # The measured figure is the shipped build output: .next WITHOUT .next/cache.
          # .next/cache is Turbopack's build cache (written by default since Next.js 16.3, never
          # read on a fresh CI runner, not part of a deployment) and it moved by about 100 MB with
          # a Next.js upgrade alone. The pattern is anchored (.next/cache) so a route folder named
          # "cache" still counts. Keep these thresholds in step with bundle-monitor.yml.
          BUNDLE_SIZE=$(du -sm --exclude=.next/cache .next/ | cut -f1)
          CACHE_SIZE=$(du -sm .next/cache 2>/dev/null | cut -f1)
          echo "📊 Bundle size (without .next/cache): ${BUNDLE_SIZE}MB"
          echo "ℹ️ .next/cache (build cache, not shipped): ${CACHE_SIZE:-0}MB"

          # Bundle size thresholds (MB, .next without .next/cache):
          # - Target: <200MB
          # - Acceptable: <250MB
          # - Warning: <275MB
          # - Critical: <=300MB
          # - Panic: >300MB (hard fail - requires immediate action)

          if [ $BUNDLE_SIZE -gt 300 ]; then
            echo "❌ PANIC: Bundle size exceeds 300MB - immediate action required!"
            exit 1
          elif [ $BUNDLE_SIZE -ge 275 ]; then
            echo "🚨 CRITICAL: Bundle size is 275MB or more, nearing the 300MB panic threshold"
          elif [ $BUNDLE_SIZE -ge 250 ]; then
            echo "⚠️ WARNING: Bundle size is 250MB or more"
          elif [ $BUNDLE_SIZE -ge 200 ]; then
            echo "ℹ️ INFO: Bundle size above 200MB target, within normal limits"
          else
            echo "✅ EXCELLENT: Bundle size under 200MB target!"
          fi

          echo "✅ Bundle size check passed"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-and-component-tests, integration-tests, build-check]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit & Component Tests: ${{ needs.unit-and-component-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build Check: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any test failed
        if: |
          needs.unit-and-component-tests.result == 'failure' ||
          needs.integration-tests.result == 'failure' ||
          needs.build-check.result == 'failure'
        run: |
          echo "❌ One or more test jobs failed"
          exit 1
