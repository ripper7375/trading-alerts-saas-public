name: Dependencies Security Scan

# Purpose: Scan npm and Python dependencies for security vulnerabilities
# Active: Phase 1-4 (always active)
# Design: Informative feedback, plus ONE blocking gate: high and critical
#         advisories in production dependencies (see below)
#
# IMPORTANT: This is the ONLY workflow that runs pnpm audit.
# The all-dependencies scan (moderate and up) stays non-blocking
# (continue-on-error) to prevent a recurring merge-conflict loop where every
# feature branch independently adds pnpm.overrides, then conflicts with main
# on merge. See errors/continuous-pr-errors/ for the full history.
#
# THE PRODUCTION GATE ("Production audit gate (high and critical)", T3-e / OPS-01):
#   `pnpm audit --prod --audit-level=high` is BLOCKING (no continue-on-error)
#   since 2026-10-18, when the dedicated "fix(security): ..." PR cleared the
#   28 advisories it reported that day (one critical, in next-auth). A new
#   high or critical advisory in a production dependency now fails this job on
#   main and on every PR. Clear it in a dedicated "fix(security): ..." PR on
#   main: dependency and pnpm.overrides changes are not allowed on feature
#   branches (.claude/rules/security-overrides.md, check-overrides.yml), and a
#   next-auth change is also auth, which escalates to Davin.
#
# DO NOT add pnpm audit to other workflows (e.g. security-checks.yml).
# DO NOT remove continue-on-error from the all-dependencies audit step below.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mt5-service/requirements*.txt'
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  npm-security:
    name: npm Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Check if package.json exists
        id: check_npm
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ package.json found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️  package.json not found, skipping pnpm audit"
          fi

      - name: Install dependencies
        if: steps.check_npm.outputs.exists == 'true'
        run: |
          # Use --no-frozen-lockfile so pnpm.overrides in package.json are
          # applied even if the lockfile predates the override entries.
          pnpm install --no-frozen-lockfile

      # All dependencies, moderate and up: informative only, never blocking.
      - name: Run pnpm audit
        if: steps.check_npm.outputs.exists == 'true'
        continue-on-error: true
        run: |
          echo "🔍 Running pnpm security audit..."
          pnpm audit --audit-level=moderate || echo "⚠️  Security vulnerabilities detected"
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⚠️  DO NOT add pnpm.overrides in feature branches to     ║"
          echo "║     fix these vulnerabilities.                              ║"
          echo "║                                                             ║"
          echo "║  Security overrides MUST be added via a dedicated PR        ║"
          echo "║  directly to main. Adding them in feature branches causes   ║"
          echo "║  recurring merge conflicts (7+ documented occurrences).     ║"
          echo "║  See: errors/continuous-pr-errors/                          ║"
          echo "║                                                             ║"
          echo "║  This scan is INFORMATIVE ONLY and does not block merging.  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Check for outdated dependencies
        if: steps.check_npm.outputs.exists == 'true'
        continue-on-error: true
        run: |
          echo "📦 Checking for outdated pnpm packages..."
          pnpm outdated || true
          echo ""
          echo "Note: Consider updating packages periodically"

      # Production dependencies only, high and critical only: the class of
      # finding that should never reach a release. BLOCKING: there is no
      # continue-on-error on this step (see the header). It is the last step of
      # the job so that the informative output above is always printed first.
      # --ignore-registry-errors keeps an outage of the advisory endpoint from
      # reading as a finding.
      - name: Production audit gate (high and critical)
        if: steps.check_npm.outputs.exists == 'true'
        run: |
          echo "🔍 Running pnpm audit --prod --audit-level=high ..."
          if pnpm audit --prod --audit-level=high --ignore-registry-errors; then
            echo "✅ No high or critical production advisories reported."
          else
            echo ""
            echo "❌ High or critical advisories in production dependencies (list above)."
            echo "   Fix them in a dedicated 'fix(security): ...' PR directly on main."
            echo "   Do NOT add pnpm.overrides on a feature branch"
            echo "   (.claude/rules/security-overrides.md, check-overrides.yml)."
            exit 1
          fi

  python-security:
    name: Python Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check if Python requirements exist
        id: check_python
        run: |
          if [ -f "mt5-service/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Python requirements found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️  Python requirements not found, skipping safety scan"
          fi

      - name: Install dependencies
        if: steps.check_python.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r mt5-service/requirements.txt
          pip install pip-audit bandit

      - name: Run pip-audit security scan
        if: steps.check_python.outputs.exists == 'true'
        continue-on-error: true
        run: |
          echo "🔍 Running Python pip-audit security scan..."
          cd mt5-service
          pip-audit --desc || {
            echo "⚠️  Security vulnerabilities detected (see above)"
            echo ""
            echo "Note: This is informative during development phase"
            echo "Action: Review vulnerabilities and update dependencies when appropriate"
            exit 0
          }
          echo "✅ No security vulnerabilities detected"

      - name: Run Bandit security analysis
        if: steps.check_python.outputs.exists == 'true'
        continue-on-error: true
        run: |
          echo "🔍 Running Bandit static security analysis..."
          cd mt5-service
          if [ -d "app" ] && [ "$(ls -A app)" ]; then
            bandit -r app/ -f json -o bandit-report.json || true
            echo "✅ Bandit analysis completed"

            # Show summary if issues found
            if [ -f "bandit-report.json" ]; then
              echo ""
              echo "📋 Bandit Report Summary:"
              python -c "import json; data=json.load(open('bandit-report.json')); print(f\"Total issues: {len(data.get('results', []))}\")" || true
            fi
          else
            echo "⏭️  app/ directory is empty, skipping Bandit analysis"
            echo "   This is normal during Phase 1-2 (planning phase)"
          fi

      - name: Upload security reports
        if: steps.check_python.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: python-security-reports
          path: |
            mt5-service/bandit-report.json
          retention-days: 30
          if-no-files-found: ignore

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [npm-security, python-security]
    if: always()

    steps:
      - name: Report summary
        run: |
          echo "🔐 Security Scan Summary"
          echo "======================="
          echo ""
          echo "✅ Security scans completed"
          echo ""
          echo "📝 Notes:"
          echo "  - The production audit gate (high and critical advisories in"
          echo "    production dependencies) is BLOCKING: see the npm-security job"
          echo "  - Every other scan here is informative and does not block"
          echo "  - Review findings and address critical vulnerabilities"
          echo "  - Moderate and low findings stay informative"
          echo ""
          echo "🔗 Check the 'npm-security' and 'python-security' job outputs for details"
