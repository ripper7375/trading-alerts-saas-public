name: Regenerate Lockfile

# Purpose: After any push to main that modifies package.json, automatically
# regenerate pnpm-lock.yaml so it always reflects the current overrides.
# This prevents lockfile drift that causes merge conflicts in feature branches.

on:
  push:
    branches: [main]
    paths: [package.json]

# Prevent concurrent runs — only the latest push matters
concurrency:
  group: lockfile-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate pnpm-lock.yaml
    runs-on: ubuntu-latest

    # Skip if the push was from this workflow (prevent infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit if lockfile changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "✅ pnpm-lock.yaml is already up to date — no commit needed."
          else
            git commit -m "chore: regenerate pnpm-lock.yaml after package.json change [skip ci]"
            git push
            echo "✅ pnpm-lock.yaml regenerated and committed."
          fi
