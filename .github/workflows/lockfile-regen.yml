name: Regenerate Lockfile

# Purpose: After any push to main that modifies package.json, automatically
# regenerate pnpm-lock.yaml so it always reflects the current overrides.
# This prevents lockfile drift that causes merge conflicts in feature branches.

on:
  push:
    branches: [main]
    paths: [package.json]

# Prevent concurrent runs — only the latest push matters
concurrency:
  group: lockfile-regen-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only by default; a job that needs more declares its own permissions.
permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate pnpm-lock.yaml
    runs-on: ubuntu-latest

    # Skip if the push was from this workflow (prevent infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit if lockfile changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "✅ pnpm-lock.yaml is already up to date — no commit needed."
          else
            git commit -m "chore: regenerate pnpm-lock.yaml after package.json change [skip ci]"
            git push
            echo "✅ pnpm-lock.yaml regenerated and committed."
          fi
