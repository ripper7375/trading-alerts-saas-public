name: Security Checks

# Comprehensive security checks for pre-launch validation
# Runs on all PRs and pushes to main/claude branches
#
# NOTE: Dependency audit (pnpm audit) is NOT included here.
# It runs in dependencies-security.yml as a non-blocking informational scan.
# Keeping audit out of this workflow prevents the recurring merge-conflict
# loop where every feature branch independently adds pnpm.overrides,
# then conflicts with main on merge (see errors/continuous-pr-errors/).

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: |
          echo "🔍 Running TypeScript type check..."
          pnpm run type-check
          echo "✅ No type errors found"

  lint:
    name: ESLint Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          pnpm run lint
          echo "✅ No linting errors found"

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          echo "🔍 Scanning tracked files for hardcoded secrets..."

          FOUND=0

          # Tracked source and config files only: `git grep` never reads
          # node_modules, .next or other build output. seed-code/ (the
          # read-only reference copy) stays out, as it always has.
          # Matches are reported by FILE NAME only: printing the matching line
          # would copy the secret into the CI log.
          FILES=('*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.json' '*.yml' '*.yaml' '*.sh' '*.py' ':!seed-code')

          # Test code sets env fixtures (process.env['NEXTAUTH_SECRET'] =
          # 'test-nextauth-secret'): a pattern keyed on a variable NAME cannot
          # tell those from a real value, so such patterns skip these paths.
          # Token-shaped patterns (sk_live_..., whsec_...) scan them too.
          TEST_PATHS=(
            ':(exclude,glob)**/__tests__/**'
            ':(exclude,glob)**/test/**'
            ':(exclude,glob)**/tests/**'
            ':(exclude,glob)e2e/**'
            ':(exclude,glob)**/*.test.*'
            ':(exclude,glob)**/*.spec.*'
            ':(exclude,glob)**/*.e2e-spec.*'
            ':(exclude,glob)**/jest.setup.*'
          )

          # scan LABEL PATTERN [EXTRA PATHSPEC...]
          scan() {
            label="$1"
            pattern="$2"
            shift 2
            # -e: several patterns begin with dashes
            if git grep -lIE -e "$pattern" -- "${FILES[@]}" "$@"; then
              echo "❌ Found potential $label (files listed above)"
              FOUND=1
            fi
          }

          # A quote character, for the assignment patterns below
          Q="[\"']"

          # Value-shaped tokens (a prefix that only real keys carry)
          scan "Stripe live secret key" "sk_live_[A-Za-z0-9]{20,}"
          scan "Stripe restricted live key" "rk_live_[A-Za-z0-9]{20,}"
          scan "Stripe webhook signing secret" "whsec_[A-Za-z0-9]{24,}"
          scan "AWS access key" "AKIA[A-Z0-9]{16}"
          scan "GitHub token" "ghp_[A-Za-z0-9]{36}"
          scan "OpenRouter API key" "sk-or-v1-[A-Za-z0-9]{32,}"
          scan "Resend API key" "re_[A-Za-z0-9]{6,}_[A-Za-z0-9]{20,}"
          scan "Vercel Blob read-write token" "vercel_blob_rw_[A-Za-z0-9]+_[A-Za-z0-9]+"
          scan "private key" "-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY( BLOCK)?-----"

          # Secrets with no telltale prefix: only a long LITERAL assigned to
          # the variable counts (process.env.NAME and "${NAME}" do not match)
          scan "hardcoded NEXTAUTH_SECRET, INTERNAL_API_KEY, OPENROUTER_API_KEY or dLocal credential" \
            "(NEXTAUTH_SECRET|INTERNAL_API_KEY|OPENROUTER_API_KEY|DLOCAL_[A-Z_]*(KEY|SECRET|TOKEN|LOGIN))${Q}?\]?[[:space:]]*[:=][[:space:]]*${Q}[A-Za-z0-9_+/=.-]{16,}${Q}" \
            "${TEST_PATHS[@]}"

          # user:password@host with a real-looking domain. Hosts without a
          # dot (localhost, a compose service name) and bare IPs are test and
          # local setups, not matched on purpose.
          scan "database or queue URL with embedded credentials" \
            "(postgres(ql)?|mysql|mongodb(\+srv)?|rediss?|amqps?)://[A-Za-z0-9._~%-]+:[A-Za-z0-9._~%!*+=-]{6,}@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}"

          if [ $FOUND -eq 0 ]; then
            echo "✅ No hardcoded secrets detected"
          else
            echo "❌ Potential secrets found - please review"
            exit 1
          fi

  security-headers-check:
    name: Security Headers Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate security headers in config
        run: |
          echo "🔍 Checking security headers configuration..."

          # Check for required headers in next.config.js
          MISSING=0

          if ! grep -q "Strict-Transport-Security" next.config.js; then
            echo "❌ Missing HSTS header"
            MISSING=1
          fi

          if ! grep -q "Content-Security-Policy" next.config.js; then
            echo "❌ Missing CSP header"
            MISSING=1
          fi

          if ! grep -q "X-Frame-Options" next.config.js; then
            echo "❌ Missing X-Frame-Options header"
            MISSING=1
          fi

          if ! grep -q "X-Content-Type-Options" next.config.js; then
            echo "❌ Missing X-Content-Type-Options header"
            MISSING=1
          fi

          if [ $MISSING -eq 0 ]; then
            echo "✅ All required security headers configured"
          else
            echo "❌ Some security headers missing"
            exit 1
          fi

  summary:
    name: Security Check Summary
    runs-on: ubuntu-latest
    needs: [type-check, lint, secrets-scan, security-headers-check]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "🔐 Security Check Summary"
          echo "========================="
          echo ""

          if [ "${{ needs.type-check.result }}" == "success" ]; then
            echo "✅ Type check: PASSED"
          else
            echo "❌ Type check: FAILED"
          fi

          if [ "${{ needs.lint.result }}" == "success" ]; then
            echo "✅ Linting: PASSED"
          else
            echo "❌ Linting: FAILED"
          fi

          if [ "${{ needs.secrets-scan.result }}" == "success" ]; then
            echo "✅ Secrets scan: PASSED"
          else
            echo "❌ Secrets scan: FAILED"
          fi

          if [ "${{ needs.security-headers-check.result }}" == "success" ]; then
            echo "✅ Security headers: PASSED"
          else
            echo "❌ Security headers: FAILED"
          fi

          echo ""
          echo "ℹ️  Dependency audit runs separately in the 'Dependencies Security Scan' workflow"
          echo ""

          if [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.secrets-scan.result }}" != "success" ] || \
             [ "${{ needs.security-headers-check.result }}" != "success" ]; then
            echo "❌ Some security checks failed"
            exit 1
          fi

          echo "✅ All security checks passed!"
