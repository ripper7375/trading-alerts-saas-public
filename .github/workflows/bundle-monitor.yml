name: Bundle Size Monitor

on:
  pull_request:
  push:
    branches: [main, develop, claude/**]

# Permissions needed for PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  monitor-bundle:
    name: Monitor Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Clean previous build artifacts
        run: rm -rf .next tsconfig.tsbuildinfo

      - name: Build Next.js
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Check bundle size
        id: bundle-check
        run: |
          # Verify .next directory exists
          if [ ! -d ".next" ]; then
            echo "❌ ERROR: .next directory not found!"
            exit 1
          fi

          # The monitored figure is the shipped build output: .next WITHOUT .next/cache.
          # .next/cache is Turbopack's build cache (written by default since Next.js 16.3, never
          # read on a fresh CI runner, not part of a deployment). It moved by about 100 MB with a
          # Next.js upgrade alone, so it says nothing about what ships. It is printed below.
          # The pattern is anchored (.next/cache) so a route folder named "cache" still counts.
          # Keep these thresholds in step with the Production Build Check job in tests.yml.
          BUNDLE_SIZE=$(du -sm --exclude=.next/cache .next/ | cut -f1)
          TOTAL_SIZE=$(du -sm .next/ | cut -f1)
          CACHE_SIZE=$(du -sm .next/cache 2>/dev/null | cut -f1)
          CACHE_SIZE=${CACHE_SIZE:-0}
          echo "📊 Current bundle size (without .next/cache): ${BUNDLE_SIZE}MB"
          echo "ℹ️ .next/cache (build cache, not shipped): ${CACHE_SIZE}MB; whole .next: ${TOTAL_SIZE}MB"
          echo "bundle_size=${BUNDLE_SIZE}" >> $GITHUB_OUTPUT
          echo "cache_size=${CACHE_SIZE}" >> $GITHUB_OUTPUT
          echo "total_size=${TOTAL_SIZE}" >> $GITHUB_OUTPUT

          # Debug: Show .next contents breakdown
          echo "📁 .next directory breakdown:"
          du -sh .next/*/ 2>/dev/null || echo "Could not list subdirectories"

          # Set status based on thresholds (MB, .next without .next/cache)
          if [ $BUNDLE_SIZE -lt 200 ]; then
            echo "status=good" >> $GITHUB_OUTPUT
            echo "status_emoji=✅" >> $GITHUB_OUTPUT
            echo "status_message=Good! Shipped build output is within target limits (under 200MB)" >> $GITHUB_OUTPUT
          elif [ $BUNDLE_SIZE -lt 250 ]; then
            echo "status=acceptable" >> $GITHUB_OUTPUT
            echo "status_emoji=ℹ️" >> $GITHUB_OUTPUT
            echo "status_message=Acceptable: Shipped build output under 250MB" >> $GITHUB_OUTPUT
          elif [ $BUNDLE_SIZE -lt 275 ]; then
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "status_emoji=⚠️" >> $GITHUB_OUTPUT
            echo "status_message=Warning: Shipped build output approaching the limit (300MB)" >> $GITHUB_OUTPUT
          elif [ $BUNDLE_SIZE -le 300 ]; then
            echo "status=critical" >> $GITHUB_OUTPUT
            echo "status_emoji=🚨" >> $GITHUB_OUTPUT
            echo "status_message=Critical: Shipped build output nearing the panic threshold (300MB)" >> $GITHUB_OUTPUT
          else
            echo "status=panic" >> $GITHUB_OUTPUT
            echo "status_emoji=❌" >> $GITHUB_OUTPUT
            echo "status_message=PANIC: Shipped build output exceeded 300MB - immediate action required!" >> $GITHUB_OUTPUT
          fi

          # Hard fail above 300MB (panic threshold)
          if [ $BUNDLE_SIZE -gt 300 ]; then
            echo "❌ CRITICAL: Bundle size exceeded panic threshold (300MB)"
            exit 1
          fi

          echo "✅ Bundle size check passed"

      - name: Generate bundle report
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Current Size:** ${{ steps.bundle-check.outputs.bundle_size }}MB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Measured on .next without .next/cache. The Turbopack build cache (.next/cache, not shipped) is ${{ steps.bundle-check.outputs.cache_size }}MB; the whole .next is ${{ steps.bundle-check.outputs.total_size }}MB." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.bundle-check.outputs.status_emoji }} ${{ steps.bundle-check.outputs.status_message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Thresholds" >> $GITHUB_STEP_SUMMARY
          echo "| Level | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Target | <200MB | Target operation |" >> $GITHUB_STEP_SUMMARY
          echo "| ℹ️ Acceptable | <250MB | Normal growth |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Warning | <275MB | Approaching threshold |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚨 Critical | <=300MB | Nearing limit |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Panic | >300MB | Build fails |" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true # Don't fail workflow if commenting fails
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const bundleSize = '${{ steps.bundle-check.outputs.bundle_size }}';
            const cacheSize = '${{ steps.bundle-check.outputs.cache_size }}';
            const totalSize = '${{ steps.bundle-check.outputs.total_size }}';
            const status = '${{ steps.bundle-check.outputs.status }}';
            const statusEmoji = '${{ steps.bundle-check.outputs.status_emoji }}';
            const statusMessage = '${{ steps.bundle-check.outputs.status_message }}';

            const body = `## 📦 Bundle Size Report

            **Current Size:** ${bundleSize}MB

            Measured on \`.next\` without \`.next/cache\` (the Turbopack build cache, ${cacheSize}MB, not shipped; whole \`.next\`: ${totalSize}MB).

            ${statusEmoji} ${statusMessage}

            | Threshold | Size | Status |
            |-----------|------|--------|
            | 🎯 Target | <200MB | ${parseInt(bundleSize) < 200 ? '✅' : '❌'} |
            | ℹ️ Acceptable | <250MB | ${parseInt(bundleSize) < 250 ? '✅' : '❌'} |
            | ⚠️ Warning | <275MB | ${parseInt(bundleSize) < 275 ? '✅' : '❌'} |
            | 🚨 Panic (check fails above) | <=300MB | ${parseInt(bundleSize) <= 300 ? '✅' : '❌'} |
            `;

            // Find existing bundle size comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const bundleComment = comments.find(c => c.body.includes('📦 Bundle Size Report'));

            if (bundleComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: bundleComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
