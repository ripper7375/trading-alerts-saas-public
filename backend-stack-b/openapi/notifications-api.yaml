openapi: 3.0.0
info:
  title: Backend Stack B - Notifications & Real-time API (Part 15)
  version: 1.0.0
  description: |
    Real-time notifications system with WebSocket support.
    Handles push notifications, email, SMS, and real-time updates.

servers:
  - url: https://trading-alerts-stack-b.railway.app
    description: Production (Railway Container B)
  - url: http://localhost:3002
    description: Local Development

paths:
  /notifications:
    get:
      summary: Get user notifications
      description: Retrieve notification history for authenticated user
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [read, unread, all]
            default: all
        - in: query
          name: type
          schema:
            type: string
            enum: [alert, system, subscription, affiliate, all]
            default: all
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  total:
                    type: integer
                  unreadCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{id}:
    get:
      summary: Get notification by ID
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update notification
      description: Mark notification as read/unread
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read:
                  type: boolean
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete notification
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/mark-all-read:
    post:
      summary: Mark all notifications as read
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  updated:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/preferences:
    get:
      summary: Get notification preferences
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferences retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update notification preferences
      tags:
        - Notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/push/subscribe:
    post:
      summary: Subscribe to push notifications
      description: Register device for push notifications
      tags:
        - Push Notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
                - keys
              properties:
                endpoint:
                  type: string
                  description: Push service endpoint URL
                keys:
                  type: object
                  required:
                    - p256dh
                    - auth
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
                deviceType:
                  type: string
                  enum: [web, ios, android]
                  default: web
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/push/unsubscribe:
    post:
      summary: Unsubscribe from push notifications
      tags:
        - Push Notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
      responses:
        '200':
          description: Subscription removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /realtime/connection:
    get:
      summary: Get WebSocket connection info
      description: Get WebSocket URL and connection token for real-time updates
      tags:
        - Real-time
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connection info retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  wsUrl:
                    type: string
                    example: wss://trading-alerts-stack-b.railway.app/ws
                  token:
                    type: string
                    description: One-time token for WebSocket authentication
                  expiresIn:
                    type: integer
                    description: Token expiration in seconds
        '401':
          $ref: '#/components/responses/Unauthorized'

  /realtime/status:
    get:
      summary: Check real-time service status
      tags:
        - Real-time
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [operational, degraded, down]
                  connectedClients:
                    type: integer
                  uptime:
                    type: integer
                    description: Uptime in seconds

components:
  schemas:
    Notification:
      type: object
      required:
        - id
        - userId
        - type
        - title
        - message
        - read
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        type:
          type: string
          enum: [alert, system, subscription, affiliate, watchlist]
          description: Notification category
        title:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 1000
        data:
          type: object
          description: Additional context data
          additionalProperties: true
        read:
          type: boolean
          default: false
        readAt:
          type: string
          format: date-time
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        actionUrl:
          type: string
          nullable: true
          description: URL to navigate when notification is clicked
        imageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    NotificationPreferences:
      type: object
      properties:
        email:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
            alerts:
              type: boolean
              default: true
            subscription:
              type: boolean
              default: true
            affiliate:
              type: boolean
              default: true
            marketing:
              type: boolean
              default: false
        push:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
            alerts:
              type: boolean
              default: true
            subscription:
              type: boolean
              default: true
            affiliate:
              type: boolean
              default: true
        sms:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
            alerts:
              type: boolean
              default: false
            phone:
              type: string
              nullable: true
        quietHours:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
            startTime:
              type: string
              pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
              example: '22:00'
            endTime:
              type: string
              pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
              example: '08:00'
            timezone:
              type: string
              example: 'America/New_York'

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
