# Single-service deployment, same rationale as railway-gateway's own
# railway.toml (docs/railway-gateway-reference-notes.md §8): one Nest
# process handles everything this service does today. Revisit only if real
# load justifies a split.
#
# A dedicated Redis is provisioned alongside it (own instance, not shared
# with railway-gateway's) — needed for the Redis-backed ThrottlerGuard from
# the start (this service runs replicas, plan §5.2) and is the "Railway
# Redis attached" entry criterion 4B-2-alert-engine.migration-order.md
# already lists as depending on this session's output.
#
# Deployed 2026-07-21 into trading-alerts/production (Davin's call at
# CONFIRM: no dedicated staging stack exists yet, CC-A gap; additive-only,
# same discipline as every other service in this environment). The Redis
# service was created via `railway add --database redis` and is named
# plainly "Redis" (the template's own name, not the `--service` flag's
# requested "operation-service-redis" — Railway's redis template doesn't
# take the custom name for `--database` mode).

[build]
builder = "nixpacks"

[[services]]
name = "operation-service"
command = "npm run start:prod"

[services.environment]
NODE_ENV = "production"
PORT = "3001"

[[services]]
name = "Redis"
type = "redis"
plan = "hobby"
