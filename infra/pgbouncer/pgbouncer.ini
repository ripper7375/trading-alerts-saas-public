; PgBouncer config for Session 1-3b (Plan §3 Stage A).
;
; Per-role pass-through auth: no fixed user=/password= on the [databases] line,
; so PgBouncer forwards each client's own authenticated role to the backend
; unchanged — this is what preserves money_svc/core_app's grants (Session 1-3)
; once traffic goes through the pooler instead of connecting directly.
;
; auth_file is written by entrypoint.sh at container start from the
; PGBOUNCER_USERLIST_B64 Railway variable (base64 of SCRAM verifiers pulled
; read-only from pg_authid — never a plaintext password).

[databases]
* = host=postgres.railway.internal port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
admin_users =
stats_users =
server_tls_sslmode = require
