# Host Nginx reverse proxy for the Contabo chat stack.
# Frozen at Session 14-0 §"Technical Specifications & Frozen Contracts" §3.
# Deploy target on the VPS: /etc/nginx/sites-available/chat-api
# (symlinked into /etc/nginx/sites-enabled/chat-api).
#
# SSL block is generated/managed by certbot --nginx (Session 14-1 Step 4) — the
# ssl_certificate/ssl_certificate_key paths below are certbot's default layout and
# will be inserted automatically the first time certbot runs against this file.

server {
    server_name chat-api.davintrade.app;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/chat-api.davintrade.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-api.davintrade.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Socket.IO and REST endpoint reverse proxy
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name chat-api.davintrade.app;
    return 301 https://$host$request_uri;
}
