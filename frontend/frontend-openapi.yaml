            schema:
              type: object
              required: [country, currency, paymentMethod, planType]
              properties:
                country:
                  type: string
                  pattern: '^[A-Z]{2}$'
                  example: BR
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                  example: BRL
                paymentMethod:
                  type: string
                  example: pix
