components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth.js session cookie

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: clh123abc456def
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          nullable: true
          example: John Doe
        image:
          type: string
          format: uri
          nullable: true
          example: https://example.com/avatar.jpg
        tier:
          type: string
          enum: [FREE, PRO]
          example: FREE
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER
        emailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-16T14:20:00Z'

    UserPreferences:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark, system]
          default: system
        notifications:
          type: object
          properties:
            email:
              type: boolean
              default: true
            push:
              type: boolean
              default: true
            alerts:
              type: boolean
              default: true
        defaultTimeframe:
          type: string
          default: H1
        defaultSymbol:
          type: string
          default: EURUSD
        language:
          type: string
          default: en

    Alert:
      type: object
      properties:
        id:
          type: string
          example: alert_123abc
        name:
          type: string
          nullable: true
          example: EURUSD H1 Alert
        symbol:
          type: string
          example: EURUSD
        timeframe:
          type: string
          example: H1
        condition:
          type: string
          description: JSON-encoded condition
          example: '{"type":"price_above","targetValue":1.1000}'
        alertType:
          type: string
          example: PRICE_ALERT
        isActive:
          type: boolean
          example: true
        lastTriggered:
          type: string
          format: date-time
          nullable: true
        triggerCount:
          type: integer
          example: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Watchlist:
      type: object
      properties:
        id:
          type: string
          example: watchlist_456def
        name:
          type: string
          example: My Watchlist
        items:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistItem'

    WatchlistItem:
      type: object
      properties:
        id:
          type: string
          example: item_789ghi
        symbol:
          type: string
          example: EURUSD
        timeframe:
          type: string
          example: H1
        order:
          type: integer
          example: 0
        createdAt:
          type: string
          format: date-time

    SubscriptionResponse:
      type: object
      properties:
        tier:
          type: string
          enum: [FREE, PRO]
        status:
          type: string
          enum: [none, active, cancelled, past_due, trialing]
        subscription:
          type: object
          nullable: true
          properties:
            id:
              type: string
            status:
              type: string
            provider:
              type: string
              enum: [STRIPE, DLOCAL]
              nullable: true
            planType:
              type: string
              enum: [MONTHLY, THREE_DAY]
              nullable: true
            currentPeriodEnd:
              type: string
              format: date-time
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true
            cancelAtPeriodEnd:
              type: boolean
            trialEnd:
              type: string
              format: date-time
              nullable: true
            paymentMethod:
              type: object
              nullable: true
              properties:
                brand:
                  type: string
                  example: visa
                last4:
                  type: string
                  example: '4242'
                expiryMonth:
                  type: integer
                  example: 12
                expiryYear:
                  type: integer
                  example: 2025
            dLocalPaymentMethod:
              type: string
              nullable: true
            dLocalCountry:
              type: string
              nullable: true

    Invoice:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          type: string
          enum: [paid, pending, failed]
        createdAt:
          type: string
          format: date-time
        pdfUrl:
          type: string
          format: uri
          nullable: true

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [ALERT, SUBSCRIPTION, SYSTEM]
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LoginEvent:
      type: object
      properties:
        id:
          type: string
        deviceInfo:
          type: string
        ipAddress:
          type: string
        location:
          type: string
          nullable: true
