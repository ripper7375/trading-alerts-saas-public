                discountCode:
                  type: string
                  description: Optional promotional code
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Stripe checkout URL
                  sessionId:
                    type: string
