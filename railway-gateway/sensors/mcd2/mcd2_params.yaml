# MCD2 parameters (standard Appendix C.3). Changing a value is a version change (standard section 14).
# Every threshold in mcd2.md section 6 appears here once.
mcd_id: MCD2
evaluator_version: 2.0.1
parameters:
  sideways_angle_deg:
    value: 5.0
    unit: degrees
    boundary: 'abs(angle) <= value is SIDEWAYS; angle > value is UP; angle < -value is DOWN'
    why: '±5° trend band used by MCD1 to MCD3; architecture 2.6 keeps it'
  min_containment_rate:
    value: 50.0
    unit: percent
    boundary: '>= value passes tier 4; below value is INVALID + CONTAINMENT_LOW'
    why: 'Channel counted as intact at 50% containment (architecture 2.4)'
  min_window_bars:
    value: 48
    unit: closed M5 bars
    boundary: 'A minimum, not a window length: a channel with N_window = min(T_EDT - t_edt_open_bar_rows, max_window_bars) below value is INVALID + INSUFFICIENT_BARS'
    why: '4 hours of M5 (pre-retrofit floor); from 2.0.1 it no longer lengthens a short window past the channel (task P7)'
  max_window_bars:
    value: 288
    unit: closed M5 bars
    boundary: 'N_window is never above value; also the N_window used when containment_n, visual_window_bars and window_bars are all null'
    why: '24 hours of M5 (architecture 2.5: statistics over min(T_EDT, 288))'
  t_edt_open_bar_rows:
    value: 1
    unit: rows
    boundary: 'N_window = min(T_EDT - value, max_window_bars) closed M5 bars; with no T_EDT it is not subtracted'
    why: 'T_EDT counts the rows on which the channel exists, and the last of them is the still-open bar (7 of 7 real channels), so on closed bars the channel has T_EDT - 1 rows; same name and value as MCD3 (task P7, 2026-10-01). Whether the fit window includes the open bar is open (waiting-on)'
  max_abs_regression_angle_deg:
    value: 90.0
    unit: degrees
    boundary: 'abs(angle) <= value passes tier 3; above value is INVALID + SANITY_FAILED'
    why: 'A regression angle beyond +-90 degrees is not possible (named in the pre-retrofit plan, not in its code; spec question Q5)'
  channel_position_decimals:
    value: 4
    unit: decimals
    boundary: 'Output rounding only; the state is decided on the unrounded prices'
    why: 'Pre-retrofit output precision (0.7959 in the certified example)'
