openapi: 3.1.0
info:
  title: Part 04 - Tier System API
  version: 2.0.0
  description: |
    **Part 04: Tier System & Constants**

    **Last Updated:** 2026-08-04 — verified against `lib/tier-config.ts` (single source of truth for V8 tier rules).

    **Superseded architecture notice:** the previous version of this spec (v1.0.0)
    documented a pre-V8, 15-symbol / 9-timeframe, catalog-differentiated tier model
    (FREE: 5 symbols/3 timeframes vs. PRO: 15/9). That model no longer exists in the
    live codebase. See `docs/migration-orders/DECISION-LOG.md` (F1) and the Session
    0-2 order's Deviations section for the full finding.

    ## V8 single-symbol architecture

    Both tiers get **identical** market-data access: one symbol (XAUUSD), two
    timeframes (M5, M15), all 79 `market_data_v6` columns. Tier differentiation moved
    from *catalog size* to *feature gates*:

    | Feature                              | FREE | PRO |
    | ------------------------------------ | ---- | --- |
    | Symbols                              | 1 (XAUUSD) | 1 (XAUUSD) |
    | Timeframes                           | 2 (M5, M15) | 2 (M5, M15) |
    | Chart combinations                   | 2   | 2   |
    | Market data columns                  | all 79 | all 79 |
    | Max price alerts                     | 0 (feature disabled) | 100 |
    | Drawing-engine line alerts           | no  | yes |
    | Multi-timeframe channel visualization | no  | yes |
    | Max drawings                         | 10  | 200 |
    | API rate limit                       | 60/hour | 300/hour |
    | Price                                | $0/month | configurable, default $29/month |
    | Trial                                | n/a | 7-day free trial, full PRO access |

    Watchlists have been removed from the product entirely (no `/api/watchlist*`
    routes exist).

    ## Implementation files
    - `lib/tier-config.ts` — canonical tier constants (`SYMBOLS`, `TIMEFRAMES`,
      `FREE_TIER_CONFIG`, `PRO_TIER_CONFIG`)
    - `lib/tier-validation.ts` — access validation functions used by drawings/alerts

    ## API routes (this spec)
    - `GET /api/tier/check/{symbol}` — check symbol access
    - `GET /api/tier/combinations` — get supported symbol×timeframe combinations
    - `GET /api/tier/symbols` — get the platform's symbol list

  contact:
    name: Trading Alerts SaaS Support
    email: support@tradingalerts.com

servers:
  - url: https://api.tradingalerts.com
    description: Production server
  - url: https://staging-api.tradingalerts.com
    description: Staging server
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Tier Access Control
    description: Check tier access permissions for symbols
  - name: Tier Information
    description: Get tier configuration and available resources

paths:
  /api/tier/check/{symbol}:
    get:
      summary: Check Symbol Access
      description: |
        V8: access is **tier-independent** — XAUUSD is allowed for every
        authenticated user regardless of tier; every other symbol is rejected as
        not a valid platform symbol (not as a tier upsell).

        **Implementation:** `app/api/tier/check/[symbol]/route.ts` (GET)
      operationId: checkSymbolAccess
      tags: [Tier Access Control]
      security:
        - sessionAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          description: Symbol to check (case-insensitive; compared uppercased)
          schema:
            type: string
          example: XAUUSD
      responses:
        '200':
          description: Access check completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolAccessCheckResponse'
              examples:
                allowed:
                  summary: XAUUSD — always allowed
                  value:
                    success: true
                    symbol: XAUUSD
                    allowed: true
                    tier: FREE
                denied:
                  summary: Any other symbol — not a platform symbol
                  value:
                    success: true
                    symbol: EURUSD
                    allowed: false
                    tier: PRO
                    reason: 'Symbol EURUSD is not supported. This platform provides XAUUSD data only.'
                    accessibleSymbols: [XAUUSD]
        '401':
          description: Unauthorized - not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tier/combinations:
    get:
      summary: Get Tier Combinations
      description: |
        V8: returns the two supported combinations (XAUUSD × M5/M15), identical
        for both tiers. No upgrade prompt — chart access is no longer a tier
        differentiator.

        **Implementation:** `app/api/tier/combinations/route.ts` (GET)
      operationId: getTierCombinations
      tags: [Tier Information]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Combinations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierCombinationsResponse'
              example:
                success: true
                tier: FREE
                combinations:
                  - symbol: XAUUSD
                    timeframe: M5
                  - symbol: XAUUSD
                    timeframe: M15
                count: 2
                totalPossible: 2
                symbols: [XAUUSD]
                timeframes:
                  - value: M5
                    label: 5 Minutes
                    proOnly: false
                  - value: M15
                    label: 15 Minutes
                    proOnly: false
                limits:
                  symbolCount: 1
                  timeframeCount: 2
                  totalCombinations: 2
        '401':
          description: Unauthorized - not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tier/symbols:
    get:
      summary: Get Accessible Symbols
      description: |
        V8: hardcoded to XAUUSD — both tiers have identical symbol access.

        **Implementation:** `app/api/tier/symbols/route.ts` (GET)
      operationId: getAccessibleSymbols
      tags: [Tier Information]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Symbols retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolsResponse'
              example:
                success: true
                tier: FREE
                symbols: [XAUUSD]
                symbolsInfo:
                  - symbol: XAUUSD
                    name: Gold/US Dollar
                    category: commodity
                    proOnly: false
                count: 1
                totalAvailable: 1
        '401':
          description: Unauthorized - not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth.js session cookie for authentication

  schemas:
    Tier:
      type: string
      enum: [FREE, PRO]
      description: User subscription tier
      example: FREE

    Symbol:
      type: string
      enum: [XAUUSD]
      description: Trading symbol (V8 single-symbol architecture)
      example: XAUUSD

    Timeframe:
      type: string
      enum: [M5, M15]
      description: Chart timeframe (V8 architecture)
      example: M5

    SymbolCategory:
      type: string
      enum: [commodity]
      description: Symbol asset category
      example: commodity

    SymbolAccessCheckResponse:
      type: object
      required: [success, symbol, allowed, tier]
      properties:
        success:
          type: boolean
          example: true
        symbol:
          type: string
          description: Uppercased symbol from the path param (not restricted to the Symbol enum — any string can be checked)
          example: XAUUSD
        allowed:
          type: boolean
          example: true
        tier:
          $ref: '#/components/schemas/Tier'
        reason:
          type: string
          description: Present only when allowed is false
          example: 'Symbol EURUSD is not supported. This platform provides XAUUSD data only.'
        accessibleSymbols:
          type: array
          description: Present only when allowed is false
          items:
            $ref: '#/components/schemas/Symbol'

    TierCombinationsResponse:
      type: object
      required:
        [
          success,
          tier,
          combinations,
          count,
          totalPossible,
          symbols,
          timeframes,
          limits,
        ]
      properties:
        success:
          type: boolean
          example: true
        tier:
          $ref: '#/components/schemas/Tier'
        combinations:
          type: array
          items:
            type: object
            required: [symbol, timeframe]
            properties:
              symbol:
                $ref: '#/components/schemas/Symbol'
              timeframe:
                $ref: '#/components/schemas/Timeframe'
        count:
          type: integer
          example: 2
        totalPossible:
          type: integer
          example: 2
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/Symbol'
        timeframes:
          type: array
          items:
            $ref: '#/components/schemas/TimeframeInfo'
        limits:
          $ref: '#/components/schemas/TierLimits'

    SymbolsResponse:
      type: object
      required: [success, tier, symbols, symbolsInfo, count, totalAvailable]
      properties:
        success:
          type: boolean
          example: true
        tier:
          $ref: '#/components/schemas/Tier'
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/Symbol'
        symbolsInfo:
          type: array
          items:
            $ref: '#/components/schemas/SymbolInfo'
        count:
          type: integer
          example: 1
        totalAvailable:
          type: integer
          example: 1

    SymbolInfo:
      type: object
      required: [symbol, name, category, proOnly]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        name:
          type: string
          example: Gold/US Dollar
        category:
          $ref: '#/components/schemas/SymbolCategory'
        proOnly:
          type: boolean
          description: Always false in V8 — no PRO-only symbols
          example: false

    TimeframeInfo:
      type: object
      required: [value, label, proOnly]
      properties:
        value:
          $ref: '#/components/schemas/Timeframe'
        label:
          type: string
          example: 5 Minutes
        proOnly:
          type: boolean
          description: Always false in V8 — no PRO-only timeframes
          example: false

    TierLimits:
      type: object
      required: [symbolCount, timeframeCount, totalCombinations]
      properties:
        symbolCount:
          type: integer
          example: 1
        timeframeCount:
          type: integer
          example: 2
        totalCombinations:
          type: integer
          example: 2

    TierConfig:
      type: object
      description: Complete tier configuration (`lib/tier-config.ts`)
      required:
        [
          name,
          price,
          symbols,
          timeframes,
          chartCombinations,
          maxAlerts,
          rateLimit,
        ]
      properties:
        name:
          type: string
          enum: [FREE, PRO]
        price:
          type: integer
          description: Monthly price in USD (PRO price configurable via env, default 29)
        symbols:
          type: integer
          example: 1
        timeframes:
          type: integer
          example: 2
        chartCombinations:
          type: integer
          example: 2
        maxAlerts:
          type: integer
          description: FREE is 0 — alerts are a PRO-exclusive feature (see Part 11)
          example: 100
        rateLimit:
          type: integer
          description: API requests per hour
          example: 60

    ErrorResponse:
      type: object
      required: [success, error, message]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: You must be logged in to check symbol access
