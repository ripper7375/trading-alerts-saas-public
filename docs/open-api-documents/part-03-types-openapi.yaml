            hrma:
              type: number
              nullable: true
            smma:
              type: number
              nullable: true
            body_size:
              type: number
              nullable: true
            body_direction:
              type: number
              nullable: true
            ha_open:
              type: number
              nullable: true
            ha_high:
              type: number
              nullable: true
            ha_low:
              type: number
              nullable: true
            ha_close:
              type: number
              nullable: true
            ha_color:
              type: number
              nullable: true
            ha_trend:
              type: number
              nullable: true
            ha_strength:
              type: number
              nullable: true
            kc_upper:
              type: number
              nullable: true
            kc_middle:
              type: number
              nullable: true
            kc_lower:
              type: number
              nullable: true
            kc_upper_ema:
              type: number
              nullable: true
            kc_middle_ema:
              type: number
              nullable: true
            kc_lower_ema:
              type: number
              nullable: true
            kc_squeeze:
              type: number
              nullable: true
            kc_squeeze_pro:
              type: number
              nullable: true
            kc_width:
              type: number
              nullable: true
            kc_width_ema:
              type: number
              nullable: true
            sr_1:
              type: number
              nullable: true
            sr_2:
              type: number
              nullable: true
            sr_3:
              type: number
              nullable: true
            sr_4:
              type: number
              nullable: true
            sr_5:
              type: number
              nullable: true
            sr_6:
              type: number
              nullable: true
            sr_7:
              type: number
              nullable: true
            sr_8:
              type: number
              nullable: true
            zigzag_high:
              type: number
              nullable: true
            zigzag_low:
              type: number
              nullable: true
            ema:
              type: number
              nullable: true
              description: Exponential Moving Average (renamed from ema_26 in v3.0)
            dual_tema_high:
              type: number
              nullable: true
            dual_tema_low:
              type: number
              nullable: true
            pinbar:
              type: number
              nullable: true
      description: |
        PRO tier complete market data (61 columns):
        - 9 system columns
        - 16 FREE tier indicator columns
        - 36 PRO tier indicator columns

    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # API TYPES (types/api.ts)
    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ApiResponse:
      type: object
      properties:
        data:
          type: object
          description: Response data (type varies)
        error:
          $ref: '#/components/schemas/ApiError'
        message:
          type: string
          example: Operation successful
      description: Standard API response wrapper

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input data
        details:
          type: object
          additionalProperties: true
        field:
          type: string
          description: Field that caused the error (for validation errors)
          example: email

    PaginationParams:
      type: object
      required: [page, limit]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        sortBy:
          type: string
          example: createdAt
        sortOrder:
          type: string
          enum: [asc, desc]
          example: desc

    PaginatedResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          required:
            - page
            - limit
            - total
            - totalPages
            - hasNext
            - hasPrevious
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              description: Total number of items
              example: 100
            totalPages:
              type: integer
              example: 5
            hasNext:
              type: boolean
              example: true
            hasPrevious:
              type: boolean
              example: false

    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Invalid email format
        value:
          description: Invalid value submitted

    ErrorResponse:
      type: object
      required: [error, message, statusCode, timestamp]
      properties:
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        statusCode:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /api/alerts
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          description: Optional response data

    MarketDataResponse:
      type: object
      required: [symbol, timeframe, tier, data, metadata]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        timeframe:
          $ref: '#/components/schemas/Timeframe'
        tier:
          $ref: '#/components/schemas/Tier'
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CompleteMarketData'
              - $ref: '#/components/schemas/FreeMarketData'
          description: Market data (filtered by user tier)
        filteredColumns:
          type: array
          items:
            type: string
          description: Columns removed for FREE tier users
        metadata:
          type: object
          required: [total, returned, columnCount]
          properties:
            total:
              type: integer
              description: Total records available
              example: 1000
            returned:
              type: integer
              description: Number of records returned
              example: 100
            columnCount:
              type: integer
              description: Number of columns (25 for FREE, 61 for PRO)
              example: 25

    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # PAYMENT TYPES (types/dlocal.ts)
    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    PaymentProvider:
      type: string
      enum: [DLOCAL, STRIPE]
      description: Payment provider identifier
      example: STRIPE

    PaymentStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, CANCELLED, REFUNDED]
      description: Payment status
      example: COMPLETED

    PlanType:
      type: string
      enum: [THREE_DAY, MONTHLY]
      description: Subscription plan type
      example: MONTHLY

    DLocalCountry:
      type: string
      enum: [IN, NG, PK, VN, ID, TH, ZA, TR]
      description: Supported dLocal countries (8 total)
      example: IN

    DLocalCurrency:
      type: string
      enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
      description: Corresponding currencies for dLocal countries
      example: INR

    DLocalPaymentRequest:
      type: object
      required: [userId, amount, currency, country, paymentMethod, planType]
      properties:
        userId:
          type: string
          format: uuid
        amount:
          type: number
          description: USD amount
          example: 29
        currency:
          $ref: '#/components/schemas/DLocalCurrency'
        country:
          $ref: '#/components/schemas/DLocalCountry'
        paymentMethod:
          type: string
          example: card
        planType:
          $ref: '#/components/schemas/PlanType'
        discountCode:
          type: string
          example: SAVE10
        email:
          type: string
          format: email
        name:
          type: string

    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # DISBURSEMENT TYPES (types/disbursement.ts)
    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    DisbursementProvider:
      type: string
      enum: [RISE, MOCK]
      description: Disbursement provider
      example: RISE

    PaymentBatchStatus:
      type: string
      enum: [PENDING, QUEUED, PROCESSING, COMPLETED, FAILED, CANCELLED]
      description: Payment batch status
      example: COMPLETED

    DisbursementTransactionStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED]
      description: Disbursement transaction status
      example: COMPLETED

    RiseWorksKycStatus:
      type: string
      enum: [PENDING, SUBMITTED, APPROVED, REJECTED, EXPIRED]
      description: RiseWorks KYC status
      example: APPROVED

    PayableAffiliate:
      type: object
      required:
        - id
        - fullName
        - email
        - country
        - pendingAmount
        - paidAmount
        - pendingCommissionCount
        - readyForPayout
        - riseAccount
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
        country:
          type: string
          example: US
        pendingAmount:
          type: number
          example: 150.50
        paidAmount:
          type: number
          example: 500.00
        pendingCommissionCount:
          type: integer
          example: 5
        oldestPendingDate:
          type: string
          format: date-time
          nullable: true
        readyForPayout:
          type: boolean
          example: true
        riseAccount:
          type: object
          required: [hasAccount, kycStatus, canReceivePayments]
          properties:
            hasAccount:
              type: boolean
              example: true
            riseId:
              type: string
              example: rise_1234567890
            kycStatus:
              oneOf:
                - $ref: '#/components/schemas/RiseWorksKycStatus'
                - type: string
                  enum: [none]
            canReceivePayments:
              type: boolean
              example: true

    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # WATCHLIST TYPES (types/watchlist.ts)
    #━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    WatchlistItem:
      type: object
      required:
        - id
        - watchlistId
        - userId
        - symbol
        - timeframe
        - order
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        watchlistId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        symbol:
          $ref: '#/components/schemas/Symbol'
        timeframe:
          $ref: '#/components/schemas/Timeframe'
        order:
          type: integer
          description: Display order in watchlist
          example: 1
        createdAt:
          type: string
          format: date-time

    CreateWatchlistRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: My Forex Watchlist
        items:
          type: array
          items:
            type: object
            required: [symbol, timeframe]
            properties:
              symbol:
                $ref: '#/components/schemas/Symbol'
              timeframe:
                $ref: '#/components/schemas/Timeframe'

    UpdateWatchlistRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Watchlist Name
        order:
          type: integer
          example: 2

    AddWatchlistItemRequest:
      type: object
      required: [symbol, timeframe]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        timeframe:
          $ref: '#/components/schemas/Timeframe'

    WatchlistWithItems:
      allOf:
        - $ref: '#/components/schemas/Watchlist'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WatchlistItem'

paths: {}
