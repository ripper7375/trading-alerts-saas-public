        - $ref: '#/components/schemas/FractalHorizontalData'
      description: |
        FREE tier market data (24 columns):
        - 8 system columns
        - 8 fractal diagonal columns
        - 8 fractal horizontal columns

    CompleteMarketData:
      allOf:
        - $ref: '#/components/schemas/FreeMarketData'
