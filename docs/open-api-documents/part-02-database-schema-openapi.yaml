        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

      description: |
        Market data with 60-column flat schema (v2.0 — EA v2.26+).

        **Structure:**
        - 8 system columns (OHLCV + metadata)
        - 16 FREE tier indicator columns (2 groups)
        - 36 PRO tier indicator columns (10 groups total, 8 unchanged + 2 new)

        **Total:** 60 columns

        **Tier Access:**
        - FREE tier: 24 columns (8 system + 16 FREE indicators) — unchanged
        - PRO tier: 60 columns (8 system + 16 FREE + 36 PRO indicators) — was 57

        **PRO Indicator Groups:**
        1. fractal_diagonal (8 cols — FREE)
        2. fractal_horizontal (8 cols — FREE)
        3. moving_averages (3 cols — PRO)
        4. body_momentum (2 cols — PRO)
        5. heiken_ashi (7 cols — PRO)
        6. keltner_channels (10 cols — PRO)
        7. support_resistance (8 cols — PRO)
        8. zigzag (3 cols — PRO)
        9. dual_tema_hl (2 cols — PRO, NEW v2.0)
        10. pinbar_detection (1 col — PRO, NEW v2.0)

        **New in v2.0 (EA v2.26):** `dual_tema_high`, `dual_tema_low`, `pinbar`
        Pre-v2.26 rows retain NULL for these three columns.

        **Indexes:**
        - symbol + timeframe + timestamp (unique)
        - symbol
        - timeframe
        - timestamp

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ALERT & WATCHLIST MODELS
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Alert:
      type: object
      required:
        - id
        - userId
        - symbol
        - timeframe
        - condition
        - alertType
      properties:
        id:
          type: string
          format: cuid
        userId:
          type: string
          format: cuid

        # Alert configuration
        name:
          type: string
          nullable: true
        symbol:
          type: string
        timeframe:
          type: string
        condition:
          type: string
          description: JSON string for complex conditions
        alertType:
          type: string
          default: PRICE_TOUCH_LINE

        # Alert state
        isActive:
          type: boolean
          default: true
        lastTriggered:
          type: string
          format: date-time
          nullable: true
        triggerCount:
          type: integer
          default: 0

        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

      description: |
        User-configured price and indicator alerts.

        **Indexes:**
        - userId
        - symbol + timeframe
        - isActive

    Watchlist:
      type: object
      required:
        - id
        - userId
        - name
      properties:
        id:
          type: string
          format: cuid
        userId:
          type: string
          format: cuid
        name:
          type: string
        order:
          type: integer
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

      description: |
        User watchlist container.

        **Indexes:**
        - userId
        - userId + name (unique)

    WatchlistItem:
      type: object
      required:
        - id
        - watchlistId
        - userId
        - symbol
        - timeframe
      properties:
        id:
          type: string
          format: cuid
        watchlistId:
          type: string
          format: cuid
        userId:
          type: string
          format: cuid
        symbol:
          type: string
        timeframe:
          type: string
        order:
          type: integer
          default: 0
        createdAt:
          type: string
          format: date-time

      description: |
        Individual watchlist item (symbol + timeframe).

        **Indexes:**
        - watchlistId
        - userId
        - userId + symbol + timeframe (unique)

    Notification:
      type: object
      required:
        - id
        - userId
        - type
        - title
        - body
      properties:
        id:
          type: string
          format: cuid
        userId:
          type: string
          format: cuid
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        body:
          type: string
        priority:
          $ref: '#/components/schemas/NotificationPriority'
        read:
          type: boolean
          default: false
        readAt:
          type: string
          format: date-time
          nullable: true
        link:
          type: string
          nullable: true
          description: Optional link to related resource
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

      description: |
        User notifications.

        **Indexes:**
        - userId
        - userId + read
        - createdAt

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # SYSTEM CONFIGURATION MODELS
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    SystemConfig:
      type: object
      required:
        - id
        - key
        - value
        - category
      properties:
        id:
          type: string
          format: cuid
        key:
          type: string
          description: Unique setting identifier (e.g., affiliate_discount_percent)
        value:
          type: string
          description: Value stored as string (parsed based on valueType)
        valueType:
          type: string
          default: string
          description: number, string, boolean, json
        description:
          type: string
          nullable: true
          description: Human-readable description
        category:
          type: string
          description: Setting category (affiliate, payment, system)
        updatedBy:
          type: string
          nullable: true
          description: Admin user ID or email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

      description: |
        System-wide configuration settings that can be changed by admin
        without code deployment.

        **Indexes:**
        - key (unique)
        - category

    SystemConfigHistory:
      type: object
      required:
        - id
        - configKey
        - oldValue
        - newValue
        - changedBy
      properties:
        id:
          type: string
          format: cuid
        configKey:
          type: string
          description: The config key that was changed
        oldValue:
          type: string
          description: Previous value
        newValue:
          type: string
          description: New value
        changedBy:
          type: string
          description: Admin user ID or email
        reason:
          type: string
          nullable: true
          description: Optional reason for change
        changedAt:
          type: string
          format: date-time

      description: |
        Audit trail for SystemConfig changes.

        **Indexes:**
        - configKey
        - changedBy
        - changedAt

