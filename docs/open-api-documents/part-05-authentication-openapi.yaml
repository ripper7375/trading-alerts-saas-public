openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Authentication System API
  version: 1.1.0
  description: |
    Authentication system API for Trading Alerts SaaS platform (Part 05).

    **Last Updated:** 2026-08-04 — verified against all live authentication route handlers (`app/api/auth/**`).

    This API provides comprehensive authentication capabilities including:
    - User registration with email verification
    - Email and OAuth authentication (Google, Twitter/X, LinkedIn)
    - Password reset functionality
    - Session management
    - Tier-based access control
    - Admin and affiliate authentication

    ## Authentication Flow

    1. **Registration**: POST /api/auth/register → Email verification
    2. **Verification**: GET /api/auth/verify-email?token={token}
    3. **Login**: POST /api/auth/signin (NextAuth)
    4. **Access**: Use session cookie for authenticated requests

    ## Security

    - Passwords are hashed using bcrypt (10 rounds)
    - Email verification required before login
    - Password reset tokens expire after 1 hour
    - Session-based authentication via NextAuth
    - Tier-based access control (FREE, PRO)
    - CSRF protection on all mutating endpoints
    - Strong password requirements (uppercase, lowercase, number, special char)

  contact:
    name: API Support
    email: support@tradingalerts.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.tradingalerts.example.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication endpoints (registration, login, logout)
  - name: Email Verification
    description: Email verification and confirmation
  - name: Password Management
    description: Password reset and recovery
  - name: Session
    description: Session management via NextAuth

paths:
  # /api/auth/register removed (Session 7-1, 2026-08-12): the route was deleted at Session
  # 4B-21 when credentials auth cut over to the bridge (`app/api/auth/register/route.ts` no
  # longer exists on disk — only an empty leftover directory remains). Registration now goes
  # through /api/auth/token-register (operation-service bridge). See
  # OPENAPI-DRIFT-REPORT-pre-phase-7.md §3.
  /api/auth/verify-email:
    get:
      tags:
        - Email Verification
      summary: Verify user email address
      description: |
        Verifies a user's email address using a verification token.

        **Process:**
        1. User clicks verification link in email
        2. Token is validated
        3. Email is marked as verified
        4. User can now sign in

        **Token Security:**
        - Single-use tokens
        - Stored in database
        - Cleared after verification

        **Gmail-preview defeat:** a token must be at least 5 seconds old before
        it can be consumed, since some email clients pre-fetch links (added
        2026-07-17, Session 0-2 — this 429 path was undocumented in the
        previous version of this spec). Also sends a welcome email on success
        (best-effort; failure doesn't fail the request).
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          description: Email verification token sent to user's email
          schema:
            type: string
            minLength: 1
          example: abc123xyz456def789
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
              example:
                success: true
                message: Email verified successfully. You can now sign in.
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Token not provided
                  value:
                    error: Verification token is required
                invalidToken:
                  summary: Invalid token
                  value:
                    error: Invalid or expired verification token
        '429':
          description: Token used too soon after creation (Gmail-preview defeat delay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'
              example:
                error: Please wait 3 more seconds, then refresh this page.
                retryAfter: 3
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal server error

  /api/auth/track-login:
    post:
      tags:
        - Authentication
      summary: Record a successful login
      description: |
        Called client-side immediately after NextAuth redirects to the
        dashboard. Records the attempt in login history and, if this is a new
        device/location, sends a new-device security alert email.

        **Added to this spec 2026-07-17 (Session 0-2)** — it had zero coverage
        in the previous version.

        **Implementation:** `app/api/auth/track-login/route.ts` (POST)
      operationId: trackLogin
      security:
        - sessionAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  default: credentials
                  example: credentials
      responses:
        '200':
          description: Login recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, isNewDevice, deviceType, location]
                properties:
                  success:
                    type: boolean
                    example: true
                  isNewDevice:
                    type: boolean
                  deviceType:
                    type: string
                  location:
                    type: string
                    example: 'San Francisco, US'
        '401':
          description: Unauthorized - no session (this endpoint expects one to already exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/forgot-password:
    post:
      tags:
        - Password Management
      summary: Request password reset
      description: |
        Initiates password reset process by sending a reset link to user's email.

        **Features:**
        - Generates secure reset token (32 bytes hex)
        - Token expires after 1 hour
        - Does not reveal if email exists (security)
        - Sends email with reset link

        **Security:**
        - Always returns success (prevents email enumeration)
        - Token is single-use
        - 1-hour expiration
        - CSRF protection via Origin header validation
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: Password reset email sent (or would be sent if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
              example:
                success: true
                message: If an account exists with this email, you will receive a password reset link.
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid email format
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid request origin
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal server error

  /api/auth/reset-password:
    post:
      tags:
        - Password Management
      summary: Reset password with token
      description: |
        Resets user password using a valid reset token.

        **Process:**
        1. User clicks reset link from email
        2. Provides new password
        3. Token is validated and checked for expiration
        4. Password is updated and hashed
        5. Reset token is cleared

        **Validation:**
        - Token must be valid
        - Token must not be expired (1 hour limit)
        - New password must meet requirements (min 8 chars)
        - CSRF protection via Origin header validation
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: abc123xyz456def789ghi012jkl345
              password: NewSecurePass123
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
              example:
                success: true
                message: Password reset successfully. You can now sign in with your new password.
        '400':
          description: Invalid request or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  summary: Invalid or expired token
                  value:
                    error: Invalid or expired reset token
                expiredToken:
                  summary: Token has expired
                  value:
                    error: Reset token has expired
                shortPassword:
                  summary: Password too short
                  value:
                    error: Password must be at least 8 characters
                missingToken:
                  summary: Token not provided
                  value:
                    error: Reset token is required
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid request origin
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal server error

  /api/auth/resend-verification:
    post:
      tags:
        - Email Verification
      summary: Resend verification email
      description: |
        Resends the verification email to a user who hasn't verified their email yet.

        **Features:**
        - Generates new verification token
        - Sends verification email
        - Rate limited (60 seconds between requests)
        - Does not reveal if email exists (security)

        **Security:**
        - Always returns success (prevents email enumeration)
        - Rate limited to prevent abuse
        - CSRF protection via Origin header validation
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: Verification email sent (or would be sent if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
              examples:
                success:
                  summary: Email sent successfully
                  value:
                    success: true
                    message: Verification email sent. Please check your inbox.
                generic:
                  summary: Generic response (security)
                  value:
                    success: true
                    message: If your email is registered, you will receive a verification email.
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid email format
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid request origin
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'
              example:
                error: Please wait 45 seconds before requesting another verification email.
                retryAfter: 45
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to resend verification email. Please try again.

  /api/auth/signin:
    post:
      tags:
        - Authentication
      summary: Sign in user (NextAuth)
      description: |
        Authenticates user with email/password or OAuth provider.

        **Supported Methods:**
        - Credentials (email + password)
        - Google OAuth
        - Twitter/X OAuth
        - LinkedIn OAuth

        **Process:**
        1. Submit credentials or OAuth
        2. Validate credentials
        3. Check email verification
        4. Create session
        5. Return session cookie

        **Note:** This endpoint is handled by NextAuth.js
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CredentialsSignInRequest'
                - $ref: '#/components/schemas/OAuthSignInRequest'
            examples:
              credentials:
                summary: Email/Password sign in
                value:
                  email: user@example.com
                  password: SecurePass123
              oauth:
                summary: OAuth sign in
                value:
                  provider: google
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
                example: next-auth.session-token=eyJhbGciOiJIUzI1NiJ9...; Path=/; HttpOnly; Secure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
              example:
                user:
                  id: cm4f8j0nh0001i7jqe2rm3y6p
                  email: user@example.com
                  name: John Doe
                  tier: FREE
                  role: USER
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  summary: Wrong email or password
                  value:
                    error: Invalid email or password
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Please verify your email address before signing in

  /api/auth/signout:
    post:
      tags:
        - Authentication
      summary: Sign out user (NextAuth)
      description: |
        Signs out the current user and destroys their session.

        **Process:**
        1. Validate session
        2. Destroy session
        3. Clear cookies

        **Note:** This endpoint is handled by NextAuth.js
      operationId: signOut
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Sign out successful
          headers:
            Set-Cookie:
              description: Clears session cookie
              schema:
                type: string
                example: next-auth.session-token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Not authenticated

  /api/auth/session:
    get:
      tags:
        - Session
      summary: Get current session (NextAuth)
      description: |
        Retrieves the current user's session information.

        **Returns:**
        - User details (id, email, name, tier, role)
        - Session expiration
        - null if not authenticated

        **Note:** This endpoint is handled by NextAuth.js
      operationId: getSession
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Session information
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - type: object
                    nullable: true
              examples:
                authenticated:
                  summary: Authenticated user
                  value:
                    user:
                      id: cm4f8j0nh0001i7jqe2rm3y6p
                      email: user@example.com
                      name: John Doe
                      tier: FREE
                      role: USER
                      isAffiliate: false
                    expires: '2025-01-25T12:00:00.000Z'
                notAuthenticated:
                  summary: No session
                  value: null

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  schemas:
    # Request Schemas
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address (must be unique)
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: User's password (minimum 8 characters)
          example: SecurePass123
        name:
          type: string
          description: User's display name (optional)
          example: John Doe

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address to send password reset link
          example: user@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          description: Password reset token from email
          example: abc123xyz456def789ghi012jkl345
        password:
          type: string
          format: password
          minLength: 8
          description: |
            New password (minimum 8 characters). Field name is `password`, not
            `newPassword` — corrected 2026-07-17 (Session 0-2) after diffing
            against the live handler (`app/api/auth/reset-password/route.ts:9-12`);
            the previous version of this spec had the wrong field name here.
          example: NewSecurePass123

    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address to resend verification to
          example: user@example.com

    CredentialsSignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          description: User's password
          example: SecurePass123

    OAuthSignInRequest:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [google, twitter, linkedin]
          description: OAuth provider to use
          example: google

    # Response Schemas
    RegisterResponse:
      type: object
      required:
        - success
        - userId
        - message
      properties:
        success:
          type: boolean
          description: Indicates successful registration
          example: true
        userId:
          type: string
          description: Newly created user's ID
          example: cm4f8j0nh0001i7jqe2rm3y6p
        message:
          type: string
          description: Success message with next steps
          example: Registration successful. Please check your email to verify your account.

    VerifyEmailResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Indicates successful verification
          example: true
        message:
          type: string
          description: Success message
          example: Email verified successfully. You can now sign in.

    ForgotPasswordResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Always true (for security)
          example: true
        message:
          type: string
          description: Generic success message
          example: If an account exists with this email, you will receive a password reset link.

    ResetPasswordResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Indicates successful password reset
          example: true
        message:
          type: string
          description: Success message with next steps
          example: Password reset successfully. You can now sign in with your new password.

    ResendVerificationResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Always true for security (prevents email enumeration)
          example: true
        message:
          type: string
          description: Success message
          example: Verification email sent. Please check your inbox.

    RateLimitErrorResponse:
      type: object
      required:
        - error
        - retryAfter
      properties:
        error:
          type: string
          description: Rate limit error message
          example: Please wait 45 seconds before requesting another verification email.
        retryAfter:
          type: integer
          description: Seconds to wait before retrying
          example: 45

    SignInResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

    SessionResponse:
      type: object
      required:
        - user
        - expires
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires:
          type: string
          format: date-time
          description: Session expiration timestamp
          example: '2025-01-25T12:00:00.000Z'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: Invalid email or password
        code:
          type: string
          description: Error code for programmatic handling
          enum:
            - AUTH_ERROR
            - INVALID_CREDENTIALS
            - EMAIL_NOT_VERIFIED
            - ACCOUNT_EXISTS
            - OAUTH_ERROR
            - OAUTH_PROVIDER_ERROR
            - OAUTH_CALLBACK_ERROR
            - OAUTH_ACCOUNT_LINKING_ERROR
            - TOKEN_ERROR
            - INVALID_TOKEN
            - EXPIRED_TOKEN
            - MISSING_TOKEN
            - PASSWORD_ERROR
            - WEAK_PASSWORD
            - PASSWORD_MISMATCH
            - SESSION_ERROR
            - SESSION_EXPIRED
            - SESSION_INVALID
            - TIER_ACCESS_DENIED
            - INSUFFICIENT_TIER
            - AFFILIATE_ERROR
            - NOT_AFFILIATE
            - AFFILIATE_SUSPENDED
            - AFFILIATE_NOT_VERIFIED
            - ADMIN_ERROR
            - NOT_ADMIN
            - RATE_LIMIT_EXCEEDED
            - CSRF_ERROR
            - ACCOUNT_ERROR
            - ACCOUNT_INACTIVE
            - ACCOUNT_BLOCKED
            - AUTH_CONFIG_ERROR
          example: INVALID_CREDENTIALS

    # Entity Schemas
    User:
      type: object
      required:
        - id
        - email
        - tier
        - role
      properties:
        id:
          type: string
          description: Unique user identifier
          example: cm4f8j0nh0001i7jqe2rm3y6p
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        name:
          type: string
          nullable: true
          description: User's display name
          example: John Doe
        tier:
          type: string
          enum: [FREE, PRO]
          description: User's subscription tier
          example: FREE
        role:
          type: string
          enum: [USER, ADMIN]
          description: User's role
          example: USER
        isAffiliate:
          type: boolean
          description: Whether user is an affiliate
          example: false
        emailVerified:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when email was verified
          example: '2025-12-20T10:30:00.000Z'
        image:
          type: string
          format: uri
          nullable: true
          description: User's profile image URL (from OAuth)
          example: https://lh3.googleusercontent.com/a/example

    AuthError:
      type: object
      required:
        - name
        - message
        - code
        - statusCode
      properties:
        name:
          type: string
          description: Error class name
          example: InvalidCredentialsError
        message:
          type: string
          description: Human-readable error message
          example: Invalid email or password
        code:
          type: string
          description: Machine-readable error code
          example: INVALID_CREDENTIALS
        statusCode:
          type: integer
          description: HTTP status code
          example: 401
        provider:
          type: string
          description: OAuth provider (for OAuth errors)
          example: google
        requiredTier:
          type: string
          enum: [FREE, PRO]
          description: Required tier (for tier access errors)
          example: PRO
        currentTier:
          type: string
          enum: [FREE, PRO]
          description: User's current tier (for tier access errors)
          example: FREE
        retryAfter:
          type: integer
          description: Seconds to wait before retry (for rate limit errors)
          example: 60

  examples:
    RegisterSuccess:
      summary: Successful registration
      value:
        success: true
        userId: cm4f8j0nh0001i7jqe2rm3y6p
        message: Registration successful. Please check your email to verify your account.

    RegisterEmailExists:
      summary: Email already exists
      value:
        error: User with this email already exists

    VerifyEmailSuccess:
      summary: Email verified successfully
      value:
        success: true
        message: Email verified successfully. You can now sign in.

    VerifyEmailInvalidToken:
      summary: Invalid verification token
      value:
        error: Invalid or expired verification token

    ForgotPasswordSuccess:
      summary: Password reset email sent
      value:
        success: true
        message: If an account exists with this email, you will receive a password reset link.

    ResetPasswordSuccess:
      summary: Password reset successful
      value:
        success: true
        message: Password reset successfully. You can now sign in with your new password.

    ResetPasswordExpiredToken:
      summary: Reset token expired
      value:
        error: Reset token has expired

    SignInSuccess:
      summary: Sign in successful
      value:
        user:
          id: cm4f8j0nh0001i7jqe2rm3y6p
          email: user@example.com
          name: John Doe
          tier: FREE
          role: USER
          isAffiliate: false

    SignInInvalidCredentials:
      summary: Invalid credentials
      value:
        error: Invalid email or password

    SignInEmailNotVerified:
      summary: Email not verified
      value:
        error: Please verify your email address before signing in

    SessionAuthenticated:
      summary: Active session
      value:
        user:
          id: cm4f8j0nh0001i7jqe2rm3y6p
          email: user@example.com
          name: John Doe
          tier: PRO
          role: USER
          isAffiliate: true
        expires: '2025-01-25T12:00:00.000Z'

    SessionNotAuthenticated:
      summary: No active session
      value: null

    ResendVerificationSuccess:
      summary: Verification email sent
      value:
        success: true
        message: Verification email sent. Please check your inbox.

    ResendVerificationGeneric:
      summary: Generic response (security)
      value:
        success: true
        message: If your email is registered, you will receive a verification email.

    ResendVerificationRateLimited:
      summary: Rate limit exceeded
      value:
        error: Please wait 45 seconds before requesting another verification email.
