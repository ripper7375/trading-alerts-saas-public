paths: {}

components:
  schemas:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # UI COMPONENT DOCUMENTATION
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    UIComponentReference:
      type: object
      description: |
        Part 09 contains UI components only (no API endpoints).
        Chart data is fetched from \`/api/indicators/{symbol}/{timeframe}\`.
      properties:
        componentCount:
          type: integer
          example: 10
          description: Total number of files in Part 09
        pageComponents:
          type: array
          items:
            type: string
          example:
            - 'app/(dashboard)/charts/page.tsx'
            - 'app/(dashboard)/charts/[symbol]/[timeframe]/page.tsx'
            - 'app/(dashboard)/charts/[symbol]/[timeframe]/trading-chart-client.tsx'
        chartComponents:
          type: array
          items:
            type: string
          example:
            - 'components/charts/trading-chart.tsx'
            - 'components/charts/pro-indicator-overlay.tsx'
            - 'components/charts/indicator-toggles.tsx'
            - 'components/charts/chart-controls.tsx'
            - 'components/charts/timeframe-selector.tsx'
        hooks:
          type: array
          items:
            type: string
          example:
            - 'hooks/use-indicators.ts'
            - 'hooks/use-auth.ts'

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # INDICATOR TYPES (NEW 57-COLUMN SCHEMA)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    IndicatorId:
      type: string
      description: Indicator group identifier (8 total groups)
      enum:
        # FREE Tier (2 groups)
        - fractal_diagonal
        - fractal_horizontal
        # PRO Tier (6 groups)
        - moving_averages
        - body_momentum
        - heiken_ashi
        - keltner_channels
        - support_resistance
        - zigzag

    IndicatorCategory:
      type: string
      description: Indicator category for grouping
      enum:
        - trendlines
        - support_resistance
        - trend
        - momentum
        - candlesticks
        - volatility

    IndicatorMetadata:
      type: object
      description: Complete indicator metadata with column mappings
      required:
        - id
        - label
        - description
        - category
        - tier
        - columns
        - colors
        - dataPattern
      properties:
        id:
          $ref: '#/components/schemas/IndicatorId'
        label:
          type: string
          example: 'Keltner Channels'
        description:
          type: string
          example: '10-band volatility channel system'
        category:
          $ref: '#/components/schemas/IndicatorCategory'
        tier:
          type: string
          enum: [FREE, PRO]
          description: Minimum tier required to access this indicator
        columns:
          type: array
          items:
            type: string
          description: Database column names for this indicator
          example: ['kc_ultra_extreme_upper', 'kc_extreme_upper', 'kc_uppermost']
        colors:
          type: object
          additionalProperties:
            type: string
          description: Color scheme for visualization (hex codes)
          example:
            ultra_extreme: '#9c27b0'
            extreme: '#ff5722'
            uppermost: '#ff9800'
        dataPattern:
          type: string
          enum: [sparse, continuous]
          description: Data density pattern (sparse = 5-30% of bars, continuous = every bar)

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # DATABASE SCHEMA TYPES (57-COLUMN FLAT SCHEMA)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    SystemColumns:
      type: object
      description: System columns - accessible by FREE + PRO (8 columns)
      required:
        - timestamp
        - open
        - high
        - low
        - close
      properties:
        timestamp:
          type: integer
          description: Unix timestamp in seconds
          example: 1704067200
        open:
          type: number
          format: double
          example: 2045.50
        high:
          type: number
          format: double
          example: 2050.25
        low:
          type: number
          format: double
          example: 2042.00
        close:
          type: number
          format: double
          example: 2048.75
        volume:
          type: number
          format: double
          nullable: true
          example: 12500.0
        timeframe:
          type: string
          example: 'H1'
        collected_at:
          type: integer
          nullable: true
          description: Collection timestamp
          example: 1704067260

    FractalDiagonalData:
      type: object
      description: FREE tier indicator - Fractal Diagonal Lines (8 columns)
      properties:
        diag_asc_line_1:
          type: number
          nullable: true
        diag_asc_line_2:
          type: number
          nullable: true
        diag_asc_line_3:
          type: number
          nullable: true
        diag_desc_line_1:
          type: number
          nullable: true
        diag_desc_line_2:
          type: number
          nullable: true
        diag_desc_line_3:
          type: number
          nullable: true
        diag_high_map:
          type: number
          nullable: true
        diag_low_map:
          type: number
          nullable: true

    FractalHorizontalData:
      type: object
      description: FREE tier indicator - Fractal Horizontal Lines (8 columns)
      properties:
        horiz_peak_line_1:
          type: number
          nullable: true
        horiz_peak_line_2:
          type: number
          nullable: true
        horiz_peak_line_3:
          type: number
          nullable: true
        horiz_bottom_line_1:
          type: number
          nullable: true
        horiz_bottom_line_2:
          type: number
          nullable: true
        horiz_bottom_line_3:
          type: number
          nullable: true
        horiz_high_map:
          type: number
          nullable: true
        horiz_low_map:
          type: number
          nullable: true

    MovingAveragesColumns:
      type: object
      description: PRO tier indicator - Moving Averages (3 columns)
      properties:
        tema:
          type: number
          nullable: true
          description: Triple Exponential Moving Average
        hrma:
          type: number
          nullable: true
          description: Hull-like Responsive Moving Average
        smma:
          type: number
          nullable: true
          description: Smoothed Moving Average

    BodyMomentumData:
      type: object
      description: PRO tier indicator - Body Size Momentum (2 columns)
      properties:
        z_score_of_body_size:
          type: number
          nullable: true
          description: Z-score of candle body size
        candle_classification:
          type: integer
          nullable: true
          description: 0=UP_NORMAL, 1=UP_LARGE, 2=UP_EXTREME, 3=DOWN_NORMAL, 4=DOWN_LARGE, 5=DOWN_EXTREME
          enum: [0, 1, 2, 3, 4, 5]

    HeikenAshiData:
      type: object
      description: PRO tier indicator - Heiken Ashi (7 columns)
      properties:
        ha_open:
          type: number
          nullable: true
        ha_high:
          type: number
          nullable: true
        ha_low:
          type: number
          nullable: true
        ha_close:
          type: number
          nullable: true
        ha_classification:
          type: integer
          nullable: true
        ha_body_size:
          type: number
          nullable: true
        ha_body_zscore:
          type: number
          nullable: true

    KeltnerChannelsData:
      type: object
      description: PRO tier indicator - Keltner Channels (10 columns)
      properties:
        kc_ultra_extreme_upper:
          type: number
          nullable: true
        kc_extreme_upper:
          type: number
          nullable: true
        kc_uppermost:
          type: number
          nullable: true
        kc_upper:
          type: number
          nullable: true
        kc_upper_middle:
          type: number
          nullable: true
        kc_lower_middle:
          type: number
          nullable: true
        kc_lower:
          type: number
          nullable: true
        kc_lowermost:
          type: number
          nullable: true
        kc_extreme_lower:
          type: number
          nullable: true
        kc_ultra_extreme_lower:
          type: number
          nullable: true

    SupportResistanceData:
      type: object
      description: PRO tier indicator - Support & Resistance (8 columns)
      properties:
        sr_support_1:
          type: number
          nullable: true
        sr_support_2:
          type: number
          nullable: true
        sr_support_3:
          type: number
          nullable: true
        sr_support_4:
          type: number
          nullable: true
        sr_resistance_1:
          type: number
          nullable: true
        sr_resistance_2:
          type: number
          nullable: true
        sr_resistance_3:
          type: number
          nullable: true
        sr_resistance_4:
          type: number
          nullable: true

    ZigZagColumns:
      type: object
      description: PRO tier indicator - ZigZag + EMA (3 columns)
      properties:
        zigzag_peak:
          type: number
          nullable: true
          description: Peak price level (sparse data)
        zigzag_bottom:
          type: number
          nullable: true
          description: Bottom price level (sparse data)
        ema_26:
          type: number
          nullable: true
          description: 26-period EMA (continuous data)

    FreeMarketData:
      allOf:
        - $ref: '#/components/schemas/SystemColumns'
        - $ref: '#/components/schemas/FractalDiagonalData'
        - $ref: '#/components/schemas/FractalHorizontalData'
      description: FREE tier market data (24 columns total)

    CompleteMarketData:
      allOf:
        - $ref: '#/components/schemas/SystemColumns'
        - $ref: '#/components/schemas/FractalDiagonalData'
        - $ref: '#/components/schemas/FractalHorizontalData'
        - $ref: '#/components/schemas/MovingAveragesColumns'
        - $ref: '#/components/schemas/BodyMomentumData'
        - $ref: '#/components/schemas/HeikenAshiData'
        - $ref: '#/components/schemas/KeltnerChannelsData'
        - $ref: '#/components/schemas/SupportResistanceData'
        - $ref: '#/components/schemas/ZigZagColumns'
      description: PRO tier market data (57 columns total)

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # TIER CONFIGURATION
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    TierConfig:
      type: object
      description: Tier-based access configuration for charts
      required:
        - tier
        - symbols
        - timeframes
        - refreshInterval
        - indicators
        - databaseColumns
      properties:
        tier:
          type: string
          enum: [FREE, PRO]
        symbols:
          type: array
          items:
            type: string
          description: Available trading symbols
        timeframes:
          type: array
          items:
            type: string
          description: Available timeframes
        refreshInterval:
          type: integer
          description: Data refresh interval in milliseconds
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorId'
          description: Available indicator groups
        databaseColumns:
          type: integer
          description: Total accessible database columns
          example: 24

    FreeTierConfig:
      allOf:
        - $ref: '#/components/schemas/TierConfig'
        - type: object
          properties:
            tier:
              example: 'FREE'
            symbols:
              example: ['BTCUSD', 'EURUSD', 'USDJPY', 'US30', 'XAUUSD']
            timeframes:
              example: ['H1', 'H4', 'D1']
            refreshInterval:
              example: 60000
            indicators:
              example: ['fractal_diagonal', 'fractal_horizontal']
            databaseColumns:
              example: 24

    ProTierConfig:
      allOf:
        - $ref: '#/components/schemas/TierConfig'
        - type: object
          properties:
            tier:
              example: 'PRO'
            symbols:
              example:
                [
