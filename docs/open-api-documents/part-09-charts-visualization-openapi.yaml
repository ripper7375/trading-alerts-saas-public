openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Charts & Visualization Components (Part 09)
  version: 3.0.0
  description: |
    Part 09: Charts & Visualization Components

    **Note:** This part consists entirely of UI components and has no backend API endpoints.
    Chart data is fetched from `/api/indicators/{symbol}/{timeframe}` which proxies to the Flask MT5 API (Part 06).

    ## Components Included (10 total):

    ### Page Components (3 files):
    1. **Charts Listing Page** (`app/(dashboard)/charts/page.tsx`)
       - Symbol/timeframe grid selectors
       - Tier-based filtering (FREE: 5 symbols × 3 timeframes = 15 combinations; PRO: 15 symbols × 9 timeframes = 135 combinations)
       - Tier statistics dashboard showing available symbols, timeframes, and chart combinations
       - Quick access links to popular charts (XAUUSD/H1, BTCUSD/H4, EURUSD/D1, US30/H1)
       - Upgrade prompts for FREE users
       - Server-side rendered with session-based tier validation

    2. **Individual Chart Page** (`app/(dashboard)/charts/[symbol]/[timeframe]/page.tsx`)
       - Dynamic routing for symbol/timeframe combinations (e.g., `/charts/XAUUSD/H1`)
       - Server-side tier access validation with 404 for invalid combinations
       - Access denied UI with upgrade prompt for locked charts
       - Renders ChartControls and TradingChartClient components
       - Pre-generates static pages for FREE tier combinations (15 pages)

    3. **Trading Chart Client Wrapper** (`app/(dashboard)/charts/[symbol]/[timeframe]/trading-chart-client.tsx`)
       - Client component wrapper for dynamic import of TradingChart
       - Reduces initial bundle size (~200KB for lightweight-charts)
       - Loading state with spinner
       - Server-side rendering disabled (ssr: false) for canvas-based chart

    ### Chart Components (5 files):
    4. **TradingChart** (`components/charts/trading-chart.tsx`)
       - Lightweight Charts integration for candlestick display
       - Dark TradingView-style theme (#1e222d background)
       - Auto-refresh based on tier (FREE: 60s, PRO: 30s)
       - Fetches OHLCV data from `/api/indicators/{symbol}/{timeframe}`
       - Responsive design with window resize handling
       - **Current Implementation:** Displays OHLCV candlesticks only (fractals and trendlines NOT rendered due to calculation issues)
       - Error handling with user-friendly messages
       - Loading states and last updated timestamp

    5. **ProIndicatorOverlay** (`components/charts/pro-indicator-overlay.tsx`)
       - Renders PRO-only indicators on the chart as line series
       - **Keltner Channels:** 10-band ATR channel system (purple gradient)
       - **Moving Averages:** TEMA (gray), HRMA (cyan), SMMA (blue)
       - **ZigZag:** Peak/bottom structure detection with connecting line (orange)
       - Uses lightweight-charts ISeriesApi for overlay management
       - Handles undefined/null values in data arrays
       - Auto-cleanup on unmount to prevent memory leaks
       - **Note:** Momentum candles handled separately by candle color modification

    6. **IndicatorToggles** (`components/charts/indicator-toggles.tsx`)
       - Checkbox UI for toggling chart indicators
       - Collapsible sections for Basic and PRO indicators
       - Lock icons (lucide-react) for tier-gated indicators
       - Upgrade prompt for FREE users with feature list
       - Uses session data from NextAuth for tier detection
       - Color-coded indicators with metadata from lib/tier/constants

    7. **ChartControls** (`components/charts/chart-controls.tsx`)
       - Symbol dropdown with category grouping (Commodity, Forex, Crypto, Index)
       - Timeframe selector integration
       - PRO badges on locked options
       - Upgrade modal for tier-restricted access
       - Navigation via Next.js router to `/charts/{symbol}/{timeframe}`
       - Symbol metadata with display names (e.g., XAUUSD → "Gold")

    8. **TimeframeSelector** (`components/charts/timeframe-selector.tsx`)
       - Timeframe button grid (3×3 grid for 9 timeframes)
       - PRO badges and lock icons for restricted timeframes
       - Timeframe display info (M5 → "5 Minutes - Scalping")
       - Upgrade prompt for FREE users
       - Controlled component with callback-based selection

    ### Hooks (2 files):
    9. **useIndicators** (`hooks/use-indicators.ts`)
       - Custom React hook for fetching indicator data
       - Fetches from `/api/indicators/{symbol}/{timeframe}`
       - Auto-refresh based on tier (FREE: 60s, PRO: 30s)
       - Error handling with retry capability
       - Returns: data, isLoading, error, refetch, lastUpdated
       - Helper functions: hasValidOHLC, getLatestPrice, getPriceChange, formatTimeSince

    10. **useAuth** (`hooks/use-auth.ts`)
        - Custom React hook for authentication and tier management
        - Built on NextAuth useSession
        - Provides tier-based access helpers: canAccessSymbol, canAccessTimeframe, canAccessChart
        - Returns: session, tier, userId, userEmail, isAuthenticated, logout
        - Additional hooks: useRequireAuth (redirect if not authenticated), useRequireTier (tier validation)

    ## Database Schema: 57-Column Flat Schema

    The system uses a NEW 57-column flat database schema (replacing the old 14-column JSON structure):

    ### System Columns (8 - accessible to all tiers):
    - `timestamp`, `open`, `high`, `low`, `close`, `volume`, `timeframe`, `collected_at`

    ### FREE Tier Indicators (16 columns - 2 groups):
    1. **Fractal Diagonal Lines (8 columns):**
       - `diag_asc_line_1`, `diag_asc_line_2`, `diag_asc_line_3`
       - `diag_desc_line_1`, `diag_desc_line_2`, `diag_desc_line_3`
       - `diag_high_map`, `diag_low_map`
       - Colors: ascending (#00c853), descending (#f23645)
       - Data Pattern: sparse (5-15% of bars)

    2. **Fractal Horizontal Lines (8 columns):**
       - `horiz_peak_line_1`, `horiz_peak_line_2`, `horiz_peak_line_3`
       - `horiz_bottom_line_1`, `horiz_bottom_line_2`, `horiz_bottom_line_3`
       - `horiz_high_map`, `horiz_low_map`
       - Colors: peaks (#f23645), bottoms (#00c853)
       - Data Pattern: sparse (5-15% of bars)

    ### PRO Tier Indicators (33 columns - 6 groups):
    3. **Moving Averages (3 columns):**
       - `tema`, `hrma`, `smma`
       - Colors: TEMA (#808080), HRMA (#00CED1), SMMA (#0000FF)
       - Data Pattern: continuous (every bar)

    4. **Body Size Momentum (2 columns):**
       - `z_score_of_body_size`, `candle_classification`
       - Classification: 0=UP_NORMAL, 1=UP_LARGE, 2=UP_EXTREME, 3=DOWN_NORMAL, 4=DOWN_LARGE, 5=DOWN_EXTREME
       - Colors: 6 different colors based on classification
       - Data Pattern: continuous (every bar)

    5. **Heiken Ashi (7 columns):**
       - `ha_open`, `ha_high`, `ha_low`, `ha_close`
       - `ha_classification`, `ha_body_size`, `ha_body_zscore`
       - Colors: bullish (#00c853), bearish (#f23645)
       - Data Pattern: continuous (every bar)

    6. **Keltner Channels (10 columns):**
       - `kc_ultra_extreme_upper`, `kc_extreme_upper`, `kc_uppermost`, `kc_upper`, `kc_upper_middle`
       - `kc_lower_middle`, `kc_lower`, `kc_lowermost`, `kc_extreme_lower`, `kc_ultra_extreme_lower`
       - Colors: Purple gradient (#9C27B0 to #CE93D8) with orange middle bands
       - Data Pattern: continuous (every bar)

    7. **Support & Resistance (8 columns):**
       - `sr_support_1`, `sr_support_2`, `sr_support_3`, `sr_support_4`
       - `sr_resistance_1`, `sr_resistance_2`, `sr_resistance_3`, `sr_resistance_4`
       - Colors: support (#00c853), resistance (#f23645)
       - Data Pattern: sparse (10-30% of bars)

    8. **ZigZag + EMA (3 columns):**
       - `zigzag_peak`, `zigzag_bottom`, `ema_26`
       - Colors: peaks (#f23645), bottoms (#00c853), EMA (#ffa726)
       - Data Pattern: peaks/bottoms sparse (2-5%), EMA continuous

    **Total Columns:**
    - FREE Tier: 8 system + 16 indicator = **24 columns**
    - PRO Tier: 8 system + 49 indicator = **57 columns**

    ## Indicator Groups (lib/tier/constants.ts):

    ### FREE Tier Indicators (2 groups):
    - `fractal_diagonal` - Dynamic trendlines based on fractal analysis
    - `fractal_horizontal` - Horizontal support/resistance levels from fractals

    ### PRO-Only Indicators (6 groups):
    - `moving_averages` - TEMA, HRMA, SMMA trend indicators
    - `body_momentum` - Candle body size Z-score classification
    - `heiken_ashi` - Smoothed candlesticks with classification
    - `keltner_channels` - 10-band volatility channel system
    - `support_resistance` - Fractal-based S/R levels
    - `zigzag` - Market structure with EMA trend

    ## Tier-Based Features:

    ### FREE Tier:
    - **Symbols:** 5 (BTCUSD, EURUSD, USDJPY, US30, XAUUSD)
    - **Timeframes:** 3 (H1, H4, D1)
    - **Chart Combinations:** 15 (5 × 3)
    - **Refresh Rate:** 60 seconds
    - **Indicators:** 2 groups (fractal_diagonal, fractal_horizontal)
    - **Database Access:** 24 columns

    ### PRO Tier:
    - **Symbols:** 15 (adds AUDJPY, AUDUSD, ETHUSD, GBPJPY, GBPUSD, NDX100, NZDUSD, USDCAD, USDCHF, XAGUSD)
    - **Timeframes:** 9 (adds M5, M15, M30, H2, H8, H12)
    - **Chart Combinations:** 135 (15 × 9)
    - **Refresh Rate:** 30 seconds
    - **Indicators:** 8 groups (all FREE + 6 PRO groups)
    - **Database Access:** 57 columns

    ## Data Flow:
    1. User navigates to `/charts` or `/charts/{symbol}/{timeframe}`
    2. Server-side page validates tier access via getSession()
    3. Client component (TradingChart) fetches data from `/api/indicators/{symbol}/{timeframe}`
    4. API endpoint proxies request to Flask MT5 service (Part 06)
    5. Response includes OHLCV data and indicators based on tier
    6. TradingChart renders candlesticks using Lightweight Charts
    7. ProIndicatorOverlay adds indicator lines (if PRO tier and selected)
    8. Auto-refresh triggers new fetch based on tier interval

    ## Technical Stack:
    - **Chart Library:** lightweight-charts v4.x (TradingView)
    - **State Management:** React hooks (useState, useEffect, useCallback)
    - **Data Fetching:** fetch API with auto-retry
    - **Authentication:** NextAuth with getServerSession (server) and useSession (client)
    - **Routing:** Next.js App Router with dynamic routes
    - **Styling:** Tailwind CSS with cn() utility
    - **Icons:** lucide-react (Lock, ChevronDown, ChevronUp)

    ## Implementation Notes:
    1. **IMPORTANT:** The current TradingChart implementation displays OHLCV candlesticks only. Fractal plots and trendlines are NOT rendered because they were calculated incorrectly from OHLCV data. The database columns exist and data is fetched, but rendering is disabled.

    2. All components follow React best practices:
       - TypeScript strict mode with proper type annotations
       - No `any` types used
       - Proper error boundaries and loading states
       - Cleanup functions in useEffect hooks
       - Memoized callbacks to prevent unnecessary re-renders

    3. Tier validation happens at multiple levels:
       - Server-side: Route validation in page components
       - Client-side: useAuth hook helpers
       - Component-level: Disabled states and lock icons
       - API-level: Backend validates tier before returning data

    4. The system uses the NEW 57-column flat schema (introduced in recent migration):
       - Replaces old 14-column JSON structure
       - All indicator data stored as individual columns (no JSON parsing)
       - Better query performance with column-specific indexes
       - Sparse data (nulls) for indicators that don't apply to every bar

