openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Watchlist System API (Part 10)
  version: 2.0.0
  description: |
    Watchlist System API for Trading Alerts SaaS platform (Part 10).

    This API provides comprehensive watchlist management capabilities for tracking symbol+timeframe combinations with tier-based access control.

    ## Features
    - Create and manage watchlist items
    - Tier-based limits (FREE: 5 items, PRO: 50 items)
    - Symbol and timeframe access validation
    - Drag-and-drop reordering support
    - Duplicate prevention
    - Auto-creation of default watchlist
    - Optimistic UI updates with rollback
    - Undo functionality (5-second window)
    - Search functionality for symbols

    ## Tier-Based Access

    **FREE Tier:**
    - Max 5 watchlist items
    - 5 symbols (BTCUSD, EURUSD, USDJPY, US30, XAUUSD)
    - 3 timeframes (H1, H4, D1)

    **PRO Tier:**
    - Max 50 watchlist items
    - 15 symbols (BTCUSD, EURUSD, USDJPY, US30, XAUUSD, AUDJPY, AUDUSD, ETHUSD, GBPJPY, GBPUSD, NDX100, NZDUSD, USDCAD, USDCHF, XAGUSD)
    - 9 timeframes (M5, M15, M30, H1, H2, H4, H8, H12, D1)

    ## Database Schema

    The watchlist system uses a relational database with the following models:

    **Watchlist:**
    - `id` (string): Unique identifier
    - `userId` (string): Owner's user ID
    - `name` (string): Watchlist name (default: "My Watchlist")
    - `order` (int): Display order
    - `createdAt` (datetime): Creation timestamp
    - `updatedAt` (datetime): Last update timestamp

    **WatchlistItem:**
    - `id` (string): Unique identifier
    - `watchlistId` (string): Parent watchlist ID
    - `userId` (string): Owner's user ID
    - `symbol` (string): Trading symbol
    - `timeframe` (string): Chart timeframe
    - `order` (int): Display order within watchlist
    - `createdAt` (datetime): Creation timestamp

    **Constraints:**
    - Unique constraint on `[userId, symbol, timeframe]` prevents duplicates
    - Cascade delete: Removing watchlist removes all items
    - Indexes on `userId`, `watchlistId` for performance

    ## Frontend Features

    **Components:**
    - Symbol selector with search functionality
    - Timeframe grid with visual selection
    - Watchlist item cards with actions
    - Upgrade prompts for locked features
    - Undo banner for removed items

    **User Experience:**
    - Optimistic updates for instant feedback
    - Error rollback on API failures
    - 5-second undo window for deletions
    - Tier limit warnings and upgrade CTAs
    - Loading states for all operations

  contact:
    name: API Support
    email: support@tradingalerts.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.tradingalerts.example.com
    description: Production server

security:
  - sessionAuth: []

tags:
  - name: Watchlist
    description: Watchlist management endpoints
  - name: Watchlist Items
    description: Individual watchlist item operations

paths:
  /api/watchlist:
    get:
      tags:
        - Watchlist
      summary: Get user's watchlist
      description: |
        Retrieves the user's watchlist with all items ordered by their position.

        **Features:**
        - Returns all watchlist items
        - Items sorted by order field (ascending)
        - Auto-creates default watchlist if doesn't exist
        - Includes watchlist metadata (id, name)

        **Frontend Integration:**
        - Server component fetches initial data
        - Client component manages interactive UI
        - Supports optimistic updates
      operationId: getWatchlist
      responses:
        '200':
          description: Watchlist retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
              example:
                success: true
                watchlist:
                  id: 'wl_abc123'
                  name: 'My Watchlist'
                  items:
                    - id: 'wi_001'
                      symbol: 'BTCUSD'
                      timeframe: 'H1'
                      order: 0
                      createdAt: '2025-12-20T10:00:00Z'
                    - id: 'wi_002'
                      symbol: 'ETHUSD'
                      timeframe: 'D1'
                      order: 1
                      createdAt: '2025-12-20T11:00:00Z'
                items:
                  - id: 'wi_001'
                    symbol: 'BTCUSD'
                    timeframe: 'H1'
                    order: 0
                    createdAt: '2025-12-20T10:00:00Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Unauthorized'
                message: 'You must be logged in to view your watchlist'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Failed to fetch watchlist'
                message: 'An error occurred while fetching your watchlist. Please try again.'

    post:
      tags:
        - Watchlist
      summary: Add item to watchlist
      description: |
        Creates a new watchlist item with symbol+timeframe combination.

        **Validation Steps:**
        1. Authentication check (401 if not logged in)
        2. Input validation (symbol and timeframe required)
        3. Symbol access check (403 if not allowed for tier)
        4. Timeframe access check (403 if not allowed for tier)
        5. Watchlist creation (auto-creates if doesn't exist)
        6. Tier limit check (403 if limit reached)
        7. Duplicate check (409 if combination exists)
        8. Item creation with auto-incremented order

        **Frontend Behavior:**
        - Optimistic UI: Item appears immediately
        - Rollback on error: Item removed if API fails
        - Temporary ID replaced with server ID on success

        **Tier Limits:**
        - FREE: Maximum 5 watchlist items
        - PRO: Maximum 50 watchlist items
      operationId: createWatchlistItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchlistItemRequest'
            examples:
              basic:
                summary: Add BTCUSD H1 to watchlist
                value:
                  symbol: 'BTCUSD'
                  timeframe: 'H1'
              withWatchlistId:
                summary: Add to specific watchlist
                value:
                  watchlistId: 'wl_abc123'
                  symbol: 'ETHUSD'
                  timeframe: 'D1'
      responses:
        '201':
          description: Watchlist item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItemResponse'
              example:
                success: true
                item:
                  id: 'wi_003'
                  symbol: 'GBPUSD'
                  timeframe: 'H4'
                  order: 2
                  createdAt: '2025-12-20T12:00:00Z'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSymbol:
                  summary: Symbol not provided
                  value:
                    success: false
                    error: 'Invalid input'
                    message: 'Symbol is required'
                missingTimeframe:
                  summary: Timeframe not provided
                  value:
                    success: false
                    error: 'Invalid input'
                    message: 'Timeframe is required'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Unauthorized'
                message: 'You must be logged in to add watchlist items'
        '403':
          description: Forbidden - tier limit or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                limitReached:
                  summary: Watchlist limit reached
                  value:
                    success: false
                    error: 'Watchlist limit reached'
                    message: 'FREE tier allows maximum 5 watchlist items. Upgrade to PRO for 50 items.'
                symbolDenied:
                  summary: Symbol not allowed
                  value:
                    success: false
                    error: 'Symbol access denied'
                    message: 'Symbol XAUUSD is not available in your FREE tier. Upgrade to PRO for access to all 15 symbols.'
                timeframeDenied:
                  summary: Timeframe not allowed
                  value:
                    success: false
                    error: 'Timeframe access denied'
                    message: 'Timeframe M5 requires PRO tier.'
        '409':
          description: Duplicate combination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Duplicate combination'
                message: 'This symbol+timeframe combination already exists in your watchlist.'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/watchlist/{id}:
    get:
      tags:
        - Watchlist Items
      summary: Get single watchlist item
      description: |
        Retrieves a specific watchlist item by ID with ownership validation.
      operationId: getWatchlistItem
      parameters:
        - name: id
          in: path
          required: true
          description: Watchlist item ID
          schema:
            type: string
          example: 'wi_001'
      responses:
        '200':
          description: Watchlist item retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
              example:
                success: true
                item:
                  id: 'wi_001'
                  symbol: 'BTCUSD'
                  timeframe: 'H1'
                  order: 0
                  createdAt: '2025-12-20T10:00:00Z'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Invalid request'
                message: 'Item ID is required'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Forbidden'
                message: 'You do not have permission to view this item'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Not found'
                message: 'Watchlist item not found'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Watchlist Items
      summary: Update watchlist item
      description: |
        Updates a watchlist item's order position with ownership validation.

        **Note:** Currently only the 'order' field can be updated.
        For changing symbol/timeframe, delete and create a new item.
      operationId: updateWatchlistItem
      parameters:
        - name: id
          in: path
          required: true
          description: Watchlist item ID
          schema:
            type: string
          example: 'wi_001'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWatchlistItemRequest'
            example:
              order: 3
      responses:
        '200':
          description: Watchlist item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
              example:
                success: true
                item:
                  id: 'wi_001'
                  symbol: 'BTCUSD'
                  timeframe: 'H1'
                  order: 3
                  createdAt: '2025-12-20T10:00:00Z'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Watchlist Items
      summary: Delete watchlist item
      description: |
        Deletes a watchlist item with ownership validation.

        **Frontend Behavior:**
        - Optimistic deletion: Item removed from UI immediately
        - Undo banner displayed for 5 seconds
        - User can restore item within undo window
        - Rollback on API error
        - Permanent deletion after undo timeout

        **Undo Functionality:**
        - Client maintains removed item state
        - Re-POST to `/api/watchlist` to restore
        - Original order position preserved
      operationId: deleteWatchlistItem
      parameters:
        - name: id
          in: path
          required: true
          description: Watchlist item ID
          schema:
            type: string
          example: 'wi_001'
      responses:
        '200':
          description: Watchlist item deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                success: true
                message: 'Watchlist item deleted successfully'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/watchlist/reorder:
    post:
      tags:
        - Watchlist
      summary: Reorder watchlist items
      description: |
        Updates the order of multiple watchlist items in bulk.

        **Process:**
        1. Accepts array of item IDs in desired order
        2. Index in array becomes the new order value (0-based)
        3. Fetches all items to validate existence
        4. Validates ownership of all items
        5. Updates all items using Promise.all() for parallelism
        6. Returns success with updated count

        **Frontend Integration:**
        - Optimistic update: Items reordered immediately in UI
        - Rollback: Refetch on error to restore correct order
        - Used for drag-and-drop reordering
        - Can reorder partial or all items

        **Validation:**
        - All item IDs must exist (400 if not found)
        - All items must be owned by user (403 if not)
        - Empty array rejected (400 if no items)

        **Performance:**
        - Parallel updates for speed
        - Single database transaction
        - Typically completes in <100ms
      operationId: reorderWatchlistItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderWatchlistRequest'
            example:
              itemIds:
                - 'wi_003'
                - 'wi_001'
                - 'wi_002'
      responses:
        '200':
          description: Watchlist items reordered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderResponse'
              example:
                success: true
                message: 'Watchlist items reordered successfully'
                updatedCount: 3
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyArray:
                  summary: No item IDs provided
                  value:
                    success: false
                    error: 'Invalid input'
                    message: 'At least one item ID is required'
                itemsNotFound:
                  summary: Some items not found
                  value:
                    success: false
                    error: 'Invalid items'
                    message: 'One or more watchlist items were not found'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - items not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Forbidden'
                message: 'You do not have permission to reorder some of these items'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  schemas:
    CreateWatchlistItemRequest:
      type: object
      required:
        - symbol
        - timeframe
      properties:
        watchlistId:
          type: string
          description: Optional watchlist ID (auto-created if not provided)
          example: 'wl_abc123'
        symbol:
          type: string
          minLength: 1
          description: |
            Trading symbol (must be allowed for user's tier)

            **FREE Tier Symbols:**
            - BTCUSD (Bitcoin)
            - EURUSD (Euro / US Dollar)
            - USDJPY (US Dollar / Japanese Yen)
            - US30 (Dow Jones)
            - XAUUSD (Gold)

            **PRO Tier Additional Symbols:**
            - AUDJPY (Australian Dollar / Yen)
            - AUDUSD (Australian Dollar / USD)
            - ETHUSD (Ethereum)
            - GBPJPY (British Pound / Yen)
            - GBPUSD (British Pound / USD)
            - NDX100 (Nasdaq 100)
            - NZDUSD (New Zealand Dollar / USD)
            - USDCAD (USD / Canadian Dollar)
            - USDCHF (USD / Swiss Franc)
            - XAGUSD (Silver)
          example: 'XAUUSD'
          enum:
            - BTCUSD
            - EURUSD
            - USDJPY
            - US30
            - XAUUSD
            - AUDJPY
            - AUDUSD
            - ETHUSD
            - GBPJPY
            - GBPUSD
            - NDX100
            - NZDUSD
            - USDCAD
            - USDCHF
            - XAGUSD
        timeframe:
          type: string
          minLength: 1
          description: |
            Chart timeframe (must be allowed for user's tier)

            **FREE Tier Timeframes:**
            - H1 (1 Hour)
            - H4 (4 Hours)
            - D1 (1 Day)

            **PRO Tier Additional Timeframes:**
            - M5 (5 Minutes)
            - M15 (15 Minutes)
            - M30 (30 Minutes)
            - H2 (2 Hours)
            - H8 (8 Hours)
            - H12 (12 Hours)
          example: 'H1'
          enum:
            - M5
            - M15
            - M30
            - H1
            - H2
            - H4
            - H8
            - H12
            - D1

    UpdateWatchlistItemRequest:
      type: object
      properties:
        order:
          type: integer
          minimum: 0
          description: New order position
          example: 3

    ReorderWatchlistRequest:
      type: object
      required:
        - itemIds
      properties:
        itemIds:
          type: array
          items:
            type: string
          minItems: 1
          description: Array of item IDs in desired order
          example: ['wi_003', 'wi_001', 'wi_002']

    WatchlistItem:
      type: object
      required:
        - id
        - symbol
        - timeframe
        - order
        - createdAt
      properties:
        id:
          type: string
          description: Unique item identifier
          example: 'wi_001'
        symbol:
          type: string
          description: Trading symbol
          example: 'BTCUSD'
        timeframe:
          type: string
          description: Chart timeframe
          example: 'H1'
        order:
          type: integer
          description: Display order position
          example: 0
        createdAt:
          type: string
          format: date-time
          description: Item creation timestamp
          example: '2025-12-20T10:00:00Z'

    Watchlist:
      type: object
      required:
        - id
        - name
        - items
      properties:
        id:
          type: string
          description: Unique watchlist identifier
          example: 'wl_abc123'
        name:
          type: string
          description: Watchlist name
          example: 'My Watchlist'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistItem'

    WatchlistResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        watchlist:
          $ref: '#/components/schemas/Watchlist'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistItem'
        error:
          type: string
        message:
          type: string

    ItemResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        item:
          $ref: '#/components/schemas/WatchlistItem'
        error:
          type: string
        message:
          type: string

    CreateItemResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        item:
          $ref: '#/components/schemas/WatchlistItem'
        error:
          type: string
        message:
          type: string

    DeleteResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Watchlist item deleted successfully'
        error:
          type: string

    ReorderResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Watchlist items reordered successfully'
        updatedCount:
          type: integer
          description: Number of items reordered
          example: 3
        error:
          type: string

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error type
          example: 'Unauthorized'
        message:
          type: string
          description: Human-readable error message
          example: 'You must be logged in to view your watchlist'

x-frontend-components:
  WatchlistPage:
    file: app/(dashboard)/watchlist/page.tsx
    type: Server Component
    description: |
      Entry point for the watchlist page. Handles authentication, fetches initial data,
      and renders the client component.
    features:
      - Session validation and redirect
      - Fetches user's watchlist from database
      - Auto-creates default watchlist if needed
      - Calculates tier-based limits
      - Passes initial data to client component

  WatchlistClient:
    file: app/(dashboard)/watchlist/watchlist-client.tsx
    type: Client Component
    description: |
      Main interactive watchlist management interface with full CRUD operations.
    features:
      - Add/remove watchlist items
      - Symbol selector with tier filtering
      - Timeframe grid selection
      - Optimistic UI updates
      - 5-second undo functionality
      - Duplicate prevention
      - Tier limit enforcement
      - Empty state messaging
      - Upgrade prompts
    state:
      - items: Current watchlist items
      - selectedSymbol: Symbol selection state
      - selectedTimeframe: Timeframe selection state
      - showAddForm: Add form visibility
      - isAdding: Loading state for add operation
      - isRemoving: Loading state for remove operation
      - error: Error message state
      - removedItem: Stored for undo functionality
      - showUndo: Undo banner visibility
      - pendingAddId: Temporary ID for optimistic add

  SymbolSelector:
    file: components/watchlist/symbol-selector.tsx
    type: Client Component (Reusable)
    description: |
      Dropdown component for selecting trading symbols with search functionality.
    features:
      - 15 total symbols (5 FREE, 10 PRO-only)
      - Search by symbol ID or description
      - Lock icons for PRO-only symbols
      - Symbol descriptions and emojis
      - Tier-based filtering
      - Disabled state support
    props:
      userTier: User's subscription tier (FREE or PRO)
      selectedSymbol: Currently selected symbol
      onSymbolChange: Callback when selection changes
      disabled: Whether selector is disabled

  TimeframeGrid:
    file: components/watchlist/timeframe-grid.tsx
    type: Client Component (Reusable)
    description: |
      Grid of selectable timeframe buttons with tier-based access control.
    features:
      - 9 timeframes (3 FREE, 6 PRO-only)
      - Visual selection state
      - Lock icons for PRO-only timeframes
      - Upgrade dialog component
      - Tier info message
      - Disabled state support
    props:
      userTier: User's subscription tier
      selectedTimeframe: Currently selected timeframe
      onTimeframeChange: Callback when selection changes
      showUpgradePrompt: Whether to show upgrade dialog
      disabled: Whether grid is disabled

  WatchlistItem:
    file: components/watchlist/watchlist-item.tsx
    type: Client Component (Reusable)
    description: |
      Card component for displaying individual watchlist items.
    features:
      - Symbol and timeframe display
      - Optional price data (not yet implemented)
      - Status badges (support/resistance/normal)
      - Action dropdown menu
      - Delete confirmation dialog
      - Loading states
      - Link to chart view
    props:
      id: Item identifier
      symbol: Trading symbol
      timeframe: Chart timeframe
      currentPrice: Current price (optional)
      priceChange: Price change amount (optional)
      priceChangePercent: Price change percentage (optional)
      status: Status indicator (support/resistance/normal)
      lastUpdated: Last update timestamp (optional)
      onRemove: Callback when remove is clicked
      isRemoving: Loading state for remove operation

  useWatchlist:
    file: hooks/use-watchlist.ts
    type: React Hook
    description: |
      Custom React hook for watchlist data management and operations.
    features:
      - Fetch watchlist data
      - Add/remove items
      - Reorder items
      - Tier limit calculations
      - Error state management
      - Loading states
      - Duplicate checking
    returns:
      items: Array of watchlist items
      watchlist: Watchlist metadata
      isLoading: Loading state
      error: Error message
      currentCount: Number of items
      limit: Maximum items allowed
      canAdd: Whether user can add more
      slotsRemaining: Available slots
      fetchWatchlist: Function to fetch data
      addItem: Function to add item
      removeItem: Function to remove item
      reorderItems: Function to reorder items
      hasCombo: Function to check if combination exists

x-implementation-notes:
  authentication:
    method: NextAuth session
    check: getServerSession() in all API routes
    redirect: Unauthenticated users redirected to /login

  database:
    orm: Prisma
    models:
      - Watchlist (parent container)
      - WatchlistItem (individual items)
    indexes:
      - userId for fast user lookups
      - watchlistId for item queries
      - symbol+timeframe for duplicate prevention
    constraints:
      - Unique on [userId, name] for watchlists
      - Unique on [userId, symbol, timeframe] for items

  tier-validation:
    location: lib/tier-validation.ts
    functions:
      - canAccessSymbol(tier, symbol): boolean
      - validateTimeframeAccess(tier, timeframe):
          { allowed: boolean, reason?: string }
    config: lib/tier-config.ts
    constants:
      - FREE_SYMBOLS: readonly array of 5 symbols
      - PRO_SYMBOLS: readonly array of 15 symbols
      - FREE_TIMEFRAMES: readonly array of 3 timeframes
      - PRO_TIMEFRAMES: readonly array of 9 timeframes
      - FREE_TIER_CONFIG.maxWatchlistItems: 5
      - PRO_TIER_CONFIG.maxWatchlistItems: 50

  optimistic-updates:
    strategy: Update UI immediately, rollback on error
    implementation:
      - Store previous state before update
      - Apply optimistic update to local state
      - Make API call
      - On success: Replace temp data with server data
      - On error: Rollback to previous state and show error

  undo-functionality:
    duration: 5000ms (5 seconds)
    implementation:
      - Store removed item in state
      - Show undo banner with countdown
      - Clear banner after timeout
      - On undo: Re-POST item to server
      - Preserve original order position

  error-handling:
    client:
      - Display error messages in banner
      - Auto-clear after user action
      - Rollback optimistic updates
    server:
      - Comprehensive error logging
      - User-friendly error messages
      - Appropriate HTTP status codes
      - Validation error details

x-migration-notes:
  database-schema:
    version: 2.0
    changes:
      - MarketData migrated to flat 57-column schema
      - WatchlistItem model unchanged (compatible)
      - Added unique constraint on [userId, name] for Watchlist
    compatibility: Fully backward compatible with existing watchlist data
