  # ============================================================
  # PART 19C: CONFIGURATION APIs
  # ============================================================
  /api/disbursement/config:
    get:
      tags:
        - Configuration
      summary: Get disbursement configuration
      description: |
        Returns current disbursement system configuration. Configuration is
        entirely environment-variable-derived today — there is no database-backed
        config table yet.

        **Corrected this session — the previous `DisbursementConfig` schema was
        substantially wrong.** `provider` is an **object**
        (`{ default, available, riseEnabled }`), not a bare `DisbursementProvider`
        string enum. The retry-policy key is `retry`, not `retryPolicy`. There is
        a `features` object (`webhooksEnabled`/`cronEnabled`/`quickPayEnabled`)
        that was entirely undocumented.

        **Auth note:** inline `getServerSession` + role-check pattern — returns
        only 401 for any authorization failure, never 403.

        **Implementation:** `app/api/disbursement/config/route.ts` (GET).
      operationId: getDisbursementConfig
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/DisbursementConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Configuration
      summary: Update disbursement configuration (no-op placeholder)
      description: |
        **This endpoint does not actually persist any change.** It validates
        `minimumPayout` (must be a number ≥ 0) and `batchSize` (must be a number
        in 1–500) if present in the body, logs the requested changes server-side,
        and returns them back unapplied. Configuration remains
        environment-variable-derived; to actually change it, update env vars and
        redeploy. This matches the handler's own docstring
        ("placeholder for future database-backed configuration").

        **Corrected this session:** response is `{ message, requestedChanges,
        note }` — **not** `{ message, config }` as the previous spec claimed;
        `requestedChanges` simply echoes back the request body verbatim, whatever
        its shape. `minimumPayout`'s minimum is **0**, not 1 as the previous spec
        stated (the live handler only rejects values `< 0`).

        **Auth note:** inline `getServerSession` + role-check pattern — returns
        only 401 for any authorization failure, never 403.

        **Implementation:** `app/api/disbursement/config/route.ts` (PATCH).
      operationId: updateDisbursementConfig
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of these fields; only minimumPayout and batchSize are validated (and neither is actually persisted)
              properties:
                provider:
                  $ref: '#/components/schemas/DisbursementProvider'
                enabled:
                  type: boolean
                minimumPayout:
                  type: number
                  format: double
                  minimum: 0
                  example: 50.00
                batchSize:
                  type: integer
                  minimum: 1
                  maximum: 500
                  example: 100
      responses:
        '200':
          description: Requested changes accepted and logged (not persisted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Configuration update noted. Environment-based configuration is currently in use.
                  requestedChanges:
                    type: object
                    additionalProperties: true
                    description: Echo of the raw request body
                  note:
                    type: string
                    example: 'To change configuration, update environment variables and restart the application.'
        '400':
          description: Invalid minimumPayout or batchSize value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badMinimumPayout:
                  value:
                    error: Invalid minimumPayout value
                badBatchSize:
                  value:
                    error: Invalid batchSize value (must be 1-500)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

