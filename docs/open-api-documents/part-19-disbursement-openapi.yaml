openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Disbursement & RiseWorks Payment System API (Part 19)
  description: |
    **Part 19: RiseWorks Disbursement & Payment System**

    **Generated 2026-07-17, Session 0-3 — field-level accuracy pass against live
    handlers, confirmed sole ownership of all 19 disbursement/riseworks/cron routes.**
    This file is the SOLE authoritative spec for these 19 routes; no other
    `part-XX` file documents any of these paths. `GET /api/disbursement/reports/affiliate/{affiliateId}`
    was previously duplicated in `part-17-affiliate-openapi.yaml`; that copy is being
    removed in the same session, pointing here as sole owner.

    This session corrected numerous field-name and response-shape mismatches left by
    the previous version of this spec (which had the right paths but several wrong
    field names / stale shapes — see inline notes on individual operations for what
    changed). Two previously-undocumented `GET` operations were added
    (`/api/cron/process-pending-disbursements` and `/api/cron/sync-riseworks-accounts`
    both implement an unauthenticated `GET` status/info handler alongside their
    `CRON_SECRET`-gated `POST` handler — the original spec only documented `POST`).

    This API provides comprehensive affiliate commission disbursement functionality including:
    - **Part 19A (Foundation)**: Database schema, types, payment providers, commission services
    - **Part 19B (Execution)**: Batch management, payment orchestration, admin APIs
    - **Part 19C (Automation)**: Webhooks, reports, audit logs, cron jobs
    - **Part 19D (Frontend)**: Admin dashboard UI for disbursement management

    ## Key Features
    - Automated commission aggregation and payout
    - Multi-provider support (Mock for testing, RiseWorks for production)
    - Batch payment processing with transaction tracking
    - Webhook event handling (idempotent)
    - Comprehensive reporting and audit trails
    - Automated cron jobs for disbursements and account sync

    ## Authentication (verified per-route against live handlers)
    - Admin APIs require a NextAuth session with `role: ADMIN`. Two different code
      paths implement this and behave slightly differently:
      - Routes calling `requireAdmin()` (`lib/auth/session.ts`) throw a typed
        `AuthError`, which can surface as **either 401** (not authenticated) **or
        403** (authenticated, non-admin role).
      - Routes using an inline `getServerSession(authOptions)` + `role !== 'ADMIN'`
        check collapse both cases into a single **401** response — they never
        return 403. See each operation's `responses` for which pattern applies.
    - `GET /api/disbursement/health` has **no authentication at all** — genuinely
      public, for uptime monitoring.
    - `POST /api/webhooks/riseworks` is verified via an `x-rise-signature` header
      (HMAC-SHA256 over the raw body, `RISE_WEBHOOK_SECRET`), not a session.
    - `POST /api/cron/process-pending-disbursements` and
      `POST /api/cron/sync-riseworks-accounts` are verified via an
      `Authorization: Bearer <CRON_SECRET>` header, not a session. The paired `GET`
      on each of those two paths requires no authentication at all.

    ## Payment Flow
    1. Commissions accumulate (from Part 17 Affiliate system)
    2. Admin views payable affiliates meeting $50 minimum threshold
    3. Admin creates payment batch for eligible affiliates
    4. Batch executes payments via payment provider (MOCK or RISE)
    5. Webhooks confirm payment status (for RiseWorks)
    6. Audit logs track all operations

    ## Database Schema
    Uses normalized relational structure with proper foreign key relationships:
    - AffiliateRiseAccount ↔ AffiliateProfile (Part 17)
    - DisbursementTransaction ↔ Commission (Part 17)
    - PaymentBatch → DisbursementTransaction[]

  version: 2.1.0
  contact:
    name: Trading Alerts SaaS Team
    email: support@tradingalerts.example.com
  license:
    name: Proprietary

servers:
  - url: https://api.tradingalerts.example.com
    description: Production server
  - url: https://staging.tradingalerts.example.com
    description: Staging server
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Affiliates
    description: Payable affiliate management
  - name: RiseWorks Accounts
    description: RiseWorks blockchain account management
  - name: Batches
    description: Payment batch operations
  - name: Payments
    description: Quick payment operations
  - name: Reports
    description: Disbursement reports and summaries
  - name: Transactions
    description: Transaction history
  - name: Audit
    description: Audit logs
  - name: Configuration
    description: System configuration
  - name: Health
    description: System health checks
  - name: Webhooks
    description: RiseWorks webhook handlers (internal, non-session auth)
  - name: Cron Jobs
    description: Automated background jobs (internal, CRON_SECRET auth on POST; unauthenticated GET status)

paths:
  # ============================================================
  # PART 19B: AFFILIATES APIs
  # ============================================================
  /api/disbursement/affiliates/payable:
    get:
      tags:
        - Affiliates
      summary: Get payable affiliates
      description: |
        Returns all affiliates who have approved commissions ready for payout.
        Includes affiliate details, pending amounts, RiseWorks account status,
        and payout eligibility based on $50 minimum threshold and KYC approval.

        **Implementation:** `app/api/disbursement/affiliates/payable/route.ts` (GET).
        Admin-gated via `requireAdmin()`.
      operationId: getPayableAffiliates
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  affiliates:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayableAffiliate'
                  summary:
                    type: object
                    properties:
                      totalAffiliates:
                        type: integer
                        description: Total number of affiliates with pending commissions
                        example: 15
                      totalPendingAmount:
                        type: number
                        format: double
                        description: Sum of all pending commission amounts
                        example: 5250.00
                      readyForPayout:
                        type: integer
                        description: Affiliates meeting threshold AND with approved KYC
                        example: 12
                      meetsThreshold:
                        type: integer
                        description: Affiliates meeting $50 minimum threshold
                        example: 14
                      withRiseAccount:
                        type: integer
                        description: Affiliates with RiseWorks account linked
                        example: 13
                      withApprovedKyc:
                        type: integer
                        description: Affiliates with KYC approved
                        example: 12
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/affiliates/{affiliateId}:
    get:
      tags:
        - Affiliates
      summary: Get affiliate details
      description: |
        Returns detailed information about a specific affiliate including RiseWorks
        account and pending commissions.

        **Corrected this session:** the response is a flat object with sibling
        `affiliate` / `riseAccount` / `pendingCommissions` / `recentTransactions` /
        `readyForPayout` keys — the previous spec incorrectly nested everything
        under a single `affiliate` object using a schema (`AffiliateDetails`) that
        didn't match the live handler's field names at all.

        **Implementation:** `app/api/disbursement/affiliates/[affiliateId]/route.ts` (GET).
        Admin-gated via `requireAdmin()`.
      operationId: getAffiliateDetails
      security:
        - AdminAuth: []
      parameters:
        - name: affiliateId
          in: path
          required: true
          description: Affiliate Profile ID
          schema:
            type: string
            example: clp123abc456def
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  affiliate:
                    $ref: '#/components/schemas/AffiliateDisbursementProfile'
                  riseAccount:
                    allOf:
                      - $ref: '#/components/schemas/AffiliateRiseAccountDetail'
                    nullable: true
                    description: 'null if the affiliate has no linked RiseWorks account'
                  pendingCommissions:
                    $ref: '#/components/schemas/PendingCommissionsSummary'
                  recentTransactions:
                    type: array
                    description: Most recent 10 disbursement transactions for this affiliate
                    items:
                      $ref: '#/components/schemas/RecentDisbursementTransaction'
                  readyForPayout:
                    type: boolean
                    description: True if pending commissions meet threshold AND KYC is approved
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/affiliates/{affiliateId}/commissions:
    get:
      tags:
        - Affiliates
      summary: Get affiliate pending commissions
      description: |
        Returns all approved commissions for an affiliate that haven't been paid
        (linked to a disbursement transaction) yet.

        **Corrected this session:** response now includes the top-level
        `affiliateId` / `affiliateName` fields the handler actually returns, and
        each commission item includes `code`, `commissionPercent`, and `earnedAt`
        (from the joined `AffiliateCode`) instead of the generic Commission model
        shape the previous spec used. The `summary` object also has more fields
        than previously documented (`totalGrossRevenue`, `totalDiscount`,
        `averageCommission`, `oldestCommission`, `newestCommission`) and the
        previous `totalAmount` field is still present. 404 (affiliate not found)
        was undocumented previously despite the handler explicitly returning it.

        **Implementation:** `app/api/disbursement/affiliates/[affiliateId]/commissions/route.ts` (GET).
        Admin-gated via `requireAdmin()`.
      operationId: getAffiliatePendingCommissions
      security:
        - AdminAuth: []
      parameters:
        - name: affiliateId
          in: path
          required: true
          description: Affiliate Profile ID
          schema:
            type: string
            example: clp123abc456def
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  affiliateId:
                    type: string
                  affiliateName:
                    type: string
                  commissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AffiliateCommissionItem'
                  summary:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 8
                      totalAmount:
                        type: number
                        format: double
                        example: 250.00
                      totalGrossRevenue:
                        type: number
                        format: double
                      totalDiscount:
                        type: number
                        format: double
                      averageCommission:
                        type: number
                        format: double
                      oldestCommission:
                        type: string
                        format: date-time
                        nullable: true
                      newestCommission:
                        type: string
                        format: date-time
                        nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19B: RISEWORKS ACCOUNTS APIs
  # ============================================================
  /api/disbursement/riseworks/accounts:
    get:
      tags:
        - RiseWorks Accounts
      summary: Get all RiseWorks accounts
      description: |
        Returns all registered RiseWorks accounts with affiliate details and KYC status.

        **Corrected this session:** account items are enriched with
        `affiliateName`/`affiliateEmail`/`affiliateCountry`/`affiliateStatus`
        (joined from `AffiliateProfile`), `transactionCount`, and a derived
        `canReceivePayments` boolean — none of which were in the previous spec's
        generic `AffiliateRiseAccount` schema. A `summary` object (KYC status
        breakdown) is also returned and was previously undocumented.

        **Implementation:** `app/api/disbursement/riseworks/accounts/route.ts` (GET).
        Admin-gated via `requireAdmin()`.
      operationId: getRiseWorksAccounts
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AffiliateRiseAccountListItem'
                  summary:
                    $ref: '#/components/schemas/RiseWorksAccountsSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - RiseWorks Accounts
      summary: Create RiseWorks account
      description: |
        Creates a new RiseWorks account for an affiliate by linking their blockchain
        wallet address.

        **Corrected this session:** success response is `{ message, account }`
        where `account` has only `id`, `affiliateProfileId`, `affiliateName`,
        `riseId`, `email`, `kycStatus`, `createdAt` — not the full
        `AffiliateRiseAccount` shape the previous spec referenced. 404 (affiliate
        profile not found) and 409 (duplicate account — either the affiliate
        already has one, or the `riseId` is already in use by another affiliate)
        were both undocumented previously despite the handler explicitly
        returning them.

        **Implementation:** `app/api/disbursement/riseworks/accounts/route.ts` (POST).
        Admin-gated via `requireAdmin()`.
      operationId: createRiseWorksAccount
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - affiliateProfileId
                - riseId
                - email
              properties:
                affiliateProfileId:
                  type: string
                  description: Affiliate Profile ID to link
                  example: clp123abc456def
                riseId:
                  type: string
                  description: Blockchain wallet address (Ethereum format)
                  example: '0xA35b2F326F07a7C92BedB0D318C237F30948E425'
                email:
                  type: string
                  format: email
                  description: Email for RiseWorks account
                  example: affiliate@example.com
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: RiseWorks account created successfully
                  account:
                    $ref: '#/components/schemas/CreatedRiseAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Affiliate profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Affiliate profile not found
        '409':
          description: RiseWorks account already exists for this affiliate, or the riseId is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                affiliateAlreadyLinked:
                  value:
                    error: RiseWorks account already exists for this affiliate
                riseIdInUse:
                  value:
                    error: RiseWorks ID already in use
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/riseworks/sync:
    post:
      tags:
        - RiseWorks Accounts
      summary: Sync RiseWorks accounts
      description: |
        Synchronizes all RiseWorks accounts. **Currently a stub**: it does not call
        the real RiseWorks API yet (see commented-out placeholder in the handler) —
        it only updates `lastSyncAt` on every account and logs the operation to the
        audit trail. `kycStatus` is not actually changed by this endpoint today.

        **Corrected this session:** result field names are `synced` and `errors`
        (counts), not `updated`/`failed` as the previous spec claimed, and there is
        a `statusChanges` array (always empty today, since KYC status isn't
        actually updated yet, but present in the response shape for when the real
        RiseWorks API call is wired up).

        **Implementation:** `app/api/disbursement/riseworks/sync/route.ts` (POST).
        Admin-gated via `requireAdmin()`.
      operationId: syncRiseWorksAccounts
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Sync completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if zero accounts errored during sync
                    example: true
                  message:
                    type: string
                    example: Synced 15 of 15 accounts
                  syncedAt:
                    type: string
                    format: date-time
                  results:
                    $ref: '#/components/schemas/RiseWorksSyncResults'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19B: BATCHES APIs
  # ============================================================
  /api/disbursement/batches:
    get:
      tags:
        - Batches
      summary: Get payment batches
      description: |
        Returns list of payment batches with optional status filter, per-batch
        transaction counts, and overall statistics.

        **Corrected this session:** `transactionCounts` keys are lowercase
        (`pending`/`processing`/`completed`/`failed`/`cancelled`, always all five,
        defaulting to 0) — the previous spec used uppercase enum-style keys, which
        do not match what `TransactionService.getTransactionCountsByStatus()`
        actually returns. `statistics` also had a `successRate` field that does
        not exist on `BatchManager.getBatchStatistics()`'s return type, and was
        missing the real `totalPayments` field.

        **Implementation:** `app/api/disbursement/batches/route.ts` (GET).
        Admin-gated via `requireAdmin()`.
      operationId: getPaymentBatches
      security:
        - AdminAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by batch status
          schema:
            $ref: '#/components/schemas/PaymentBatchStatus'
        - name: limit
          in: query
          description: Maximum number of batches to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  batches:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentBatchWithCounts'
                  statistics:
                    $ref: '#/components/schemas/BatchStatistics'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Batches
      summary: Create payment batch
      description: |
        Creates a new payment batch for specified affiliates or all payable affiliates.
        Only includes affiliates meeting the $50 minimum payout threshold.

        **Implementation:** `app/api/disbursement/batches/route.ts` (POST).
        Admin-gated via `requireAdmin()`.
      operationId: createPaymentBatch
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                affiliateIds:
                  type: array
                  description: Optional list of affiliate IDs. If empty/omitted, creates batch for all payable affiliates
                  items:
                    type: string
                  example: ['clp123abc', 'clp456def']
                provider:
                  allOf:
                    - $ref: '#/components/schemas/DisbursementProvider'
                  default: MOCK
      responses:
        '201':
          description: Batch created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Payment batch created successfully
                  batch:
                    type: object
                    properties:
                      id:
                        type: string
                      batchNumber:
                        type: string
                      provider:
                        $ref: '#/components/schemas/DisbursementProvider'
                      status:
                        $ref: '#/components/schemas/PaymentBatchStatus'
                      paymentCount:
                        type: integer
                      totalAmount:
                        type: number
                        format: double
                      currency:
                        type: string
                      affiliateCount:
                        type: integer
                      transactionCount:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Invalid request or no payable affiliates found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No payable affiliates found
                  details:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/batches/preview:
    post:
      tags:
        - Batches
      summary: Preview payment batch
      description: |
        Previews what would be included in a batch without creating it. Useful for
        dry-run validation.

        **Corrected this session — this operation was substantially wrong in the
        previous spec.** The request body also accepts an optional `feePercentage`
        (not previously documented). The response is `{ preview, eligible,
        ineligible, summary, canCreate }`, not `{ preview, summary }`: `preview`
        items have completely different fields (`affiliateEmail`, `country`,
        `grossAmount`, `feeAmount`, `netAmount`, `status` enum, `statusReason`,
        `riseAccount`) than the previous spec's `{ affiliateId, affiliateName,
        commissionCount, totalAmount, eligible, reason }` shape, and `summary` has
        `totalGrossAmount`/`totalFeeAmount`/`totalNetAmount`/`eligibleNetAmount`/
        `feePercentage`/`minimumThreshold` instead of the previous
        `totalAmount`/`ineligibleReasons` fields, which don't exist on the live
        handler's response.

        **Implementation:** `app/api/disbursement/batches/preview/route.ts` (POST).
        Admin-gated via `requireAdmin()`.
      operationId: previewPaymentBatch
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                affiliateIds:
                  type: array
                  description: Optional list of affiliate IDs. If empty/omitted, previews all payable affiliates
                  items:
                    type: string
                  example: ['clp123abc', 'clp456def']
                feePercentage:
                  type: number
                  minimum: 0
                  maximum: 100
                  default: 0
                  description: Fee percentage deducted from each affiliate's gross amount to compute netAmount
      responses:
        '200':
          description: Preview generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview:
                    type: array
                    description: All affiliates considered, eligible and ineligible
                    items:
                      $ref: '#/components/schemas/BatchPreviewItem'
                  eligible:
                    type: array
                    description: Subset of `preview` where `eligible` is true
                    items:
                      $ref: '#/components/schemas/BatchPreviewItem'
                  ineligible:
                    type: array
                    description: Subset of `preview` where `eligible` is false
                    items:
                      $ref: '#/components/schemas/BatchPreviewItem'
                  summary:
                    $ref: '#/components/schemas/BatchPreviewSummary'
                  canCreate:
                    type: boolean
                    description: True if at least one eligible affiliate was found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/batches/{batchId}:
    get:
      tags:
        - Batches
      summary: Get batch details
      description: |
        Returns detailed information about a payment batch including all
        transactions and audit logs.

        **Corrected this session — this operation was substantially wrong in the
        previous spec.** `transactions` and `auditLogs` are top-level siblings of
        `batch` in the response, **not** nested inside `batch` as the previous
        `PaymentBatchDetailed` (`allOf` PaymentBatch) schema claimed. The `batch`
        object itself also has `paidAmount` (computed: sum of COMPLETED
        transaction amounts) and `metadata` fields not in the base `PaymentBatch`
        schema. There is also a top-level `transactionCounts` field (same
        lowercase-keyed shape as the batches-list endpoint). Transaction items use
        a distinct shape — `affiliateProfileId`/`affiliateRiseId` (not
        `affiliateRiseAccountId`/`payeeRiseId`), and `amountRiseUnits` is
        serialized as a **string** (`BigInt.toString()`), not a JSON integer, to
        avoid precision loss. Audit log items here are a **subset** of the full
        audit log entry — no `ipAddress`, `userAgent`, `transactionId`, or
        `batchId` fields (unlike `GET /api/disbursement/audit-logs`).

        **Implementation:** `app/api/disbursement/batches/[batchId]/route.ts` (GET).
        Admin-gated via `requireAdmin()`.
      operationId: getBatchDetails
      security:
        - AdminAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: Payment Batch ID
          schema:
            type: string
            example: clp123batch456
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: '#/components/schemas/BatchDetail'
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchTransactionDetail'
                  transactionCounts:
                    $ref: '#/components/schemas/BatchTransactionCounts'
                  auditLogs:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchAuditLogEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Batches
      summary: Delete payment batch
      description: |
        Deletes a payment batch (and its transactions/audit logs). Only allowed
        for batches **not** in PROCESSING or COMPLETED status (i.e. PENDING,
        QUEUED, FAILED, or CANCELLED can be deleted).

        **Corrected this session:** success response is `{ message, deletedBatch }`
        — there is no top-level `success` boolean, which the previous spec
        claimed.

        **Implementation:** `app/api/disbursement/batches/[batchId]/route.ts` (DELETE).
        Admin-gated via `requireAdmin()`.
      operationId: deletePaymentBatch
      security:
        - AdminAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: Payment Batch ID
          schema:
            type: string
            example: clp123batch456
      responses:
        '200':
          description: Batch deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Batch deleted successfully
                  deletedBatch:
                    type: object
                    properties:
                      id:
                        type: string
                      batchNumber:
                        type: string
                      status:
                        $ref: '#/components/schemas/PaymentBatchStatus'
                      transactionCount:
                        type: integer
        '400':
          description: Cannot delete batch in current state (PROCESSING or COMPLETED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Cannot delete batch that is processing or completed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/batches/{batchId}/execute:
    post:
      tags:
        - Batches
      summary: Execute payment batch
      description: |
        Executes all payments in a batch via the configured payment provider.
        Only allowed for batches in PENDING or QUEUED status.
        Updates batch status to PROCESSING, then COMPLETED or FAILED.

        **Corrected this session:** response is `{ success, result, batch,
        message }`. `result` does **not** include a `status` field (the
        `ExecutionResult` TypeScript type it's built from has no such field —
        batch status is only available via the sibling `batch.status`), which the
        previous spec incorrectly included on its `ExecutionResult` schema.

        **Implementation:** `app/api/disbursement/batches/[batchId]/execute/route.ts` (POST).
        Admin-gated via `requireAdmin()`.
      operationId: executePaymentBatch
      security:
        - AdminAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: Payment Batch ID
          schema:
            type: string
            example: clp123batch456
      responses:
        '200':
          description: Batch execution completed (success reflects whether all payments succeeded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    type: object
                    properties:
                      batchId:
                        type: string
                      batchNumber:
                        type: string
                      totalAmount:
                        type: number
                        format: double
                      successCount:
                        type: integer
                      failedCount:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: string
                  batch:
                    nullable: true
                    type: object
                    description: Updated batch state after execution (null if it could not be re-fetched)
                    properties:
                      id:
                        type: string
                      batchNumber:
                        type: string
                      status:
                        $ref: '#/components/schemas/PaymentBatchStatus'
                      executedAt:
                        type: string
                        format: date-time
                        nullable: true
                      completedAt:
                        type: string
                        format: date-time
                        nullable: true
                      failedAt:
                        type: string
                        format: date-time
                        nullable: true
                      errorMessage:
                        type: string
                        nullable: true
                  message:
                    type: string
                    example: 'Batch executed successfully: 15 payments completed'
        '400':
          description: Batch cannot be executed in current state, or provider unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Cannot execute batch with status COMPLETED
                  details:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Server error, including payment provider initialization failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # PART 19C: QUICK PAYMENT API
  # ============================================================
  /api/disbursement/pay:
    post:
      tags:
        - Payments
      summary: Quick single payment
      description: |
        Creates and immediately executes a payment batch for a single affiliate.
        Useful for ad-hoc payments or urgent disbursements.
        Affiliate must meet minimum payout threshold, and (for the RISE provider
        only) have an approved KYC RiseWorks account.

        **Corrected this session:** the response is a **flat** object —
        `success`/`batchId`/`batchNumber`/`totalAmount`/`successCount`/
        `failedCount`/`errors` are all top-level, plus an `affiliate: { id, name }`
        object — not wrapped in a `result` object as the previous spec claimed.
        404 (affiliate not found) was undocumented previously despite the handler
        explicitly returning it.

        **Auth note:** this route uses the inline `getServerSession` + role-check
        pattern (not `requireAdmin()`), so it returns only 401 for any
        authorization failure — it never returns 403.

        **Implementation:** `app/api/disbursement/pay/route.ts` (POST).
      operationId: quickPayAffiliate
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - affiliateId
              properties:
                affiliateId:
                  type: string
                  description: Affiliate Profile ID to pay
                  example: clp123abc456def
                provider:
                  allOf:
                    - $ref: '#/components/schemas/DisbursementProvider'
                  default: MOCK
      responses:
        '200':
          description: Payment executed (success reflects whether the payment succeeded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  batchId:
                    type: string
                  batchNumber:
                    type: string
                  totalAmount:
                    type: number
                    format: double
                  successCount:
                    type: integer
                  failedCount:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
                  affiliate:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
        '400':
          description: Affiliate not ready for payout, invalid provider, or missing/unverified RiseWorks account for RISE provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: object
                    additionalProperties: true
                  kycStatus:
                    type: string
                    description: Present only for the "RiseWorks account is not fully verified" error
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Affiliate not found
        '500':
          $ref: '#/components/responses/InternalServerError'

