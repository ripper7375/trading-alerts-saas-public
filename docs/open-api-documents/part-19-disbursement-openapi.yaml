  # ============================================================
  # PART 19C: WEBHOOKS
  # ============================================================
  /api/webhooks/riseworks:
    post:
      tags:
        - Webhooks
      summary: RiseWorks webhook handler
      description: |
        Receives and processes webhooks from RiseWorks payment provider.
        Webhooks are idempotent - safe to call multiple times with same event.

        **Not session-authenticated — internal-only, triggered externally by
        RiseWorks.** Auth is via HMAC-SHA256 signature verification
        (`WebhookVerifier`, `lib/disbursement/providers/rise/webhook-verifier.ts`):
        the raw request body is signed with `RISE_WEBHOOK_SECRET` and compared
        (timing-safe) against the `x-rise-signature` header. Missing signature or
        signature mismatch -> 401. `security: []` below reflects this; there is no
        `AdminAuth` requirement on this route. If `RISE_WEBHOOK_SECRET` is unset
        server-side, requests are accepted unverified in `development`, but
        rejected with 500 in any other `NODE_ENV`.

        Every webhook attempt is stored in `RiseWorksWebhookEvent` — including
        ones missing/failing signature verification — for audit purposes.

        **Only 3 of the 5 documented event types are actually processed** by
        `WebhookEventProcessor`: `payment.completed`, `payment.failed`,
        `invite.accepted`. `fund.received` and `account.duplication_detected` are
        accepted, stored, and acknowledged with 200, but fall through to a
        default "unhandled event type" branch (`processed: false` in the
        response) — no business logic currently runs for them.

        **Implementation:** `app/api/webhooks/riseworks/route.ts` (POST).
      operationId: handleRiseWorksWebhook
      security: []
      parameters:
        - name: x-rise-signature
          in: header
          required: true
          description: HMAC-SHA256 signature of the raw request body, hex-encoded
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - data
              properties:
                event:
                  type: string
                  description: Event type. Only the first 3 are actually processed today (see description above).
                  enum:
                    - payment.completed
                    - payment.failed
                    - invite.accepted
                    - fund.received
                    - account.duplication_detected
                  example: payment.completed
                teamId:
                  type: string
                  description: RiseWorks team ID
                timestamp:
                  type: string
                  format: date-time
                data:
                  type: object
                  description: Event payload (varies by event type)
                  additionalProperties: true
                  example:
                    providerTxId: rise-txn-123456
                    amount: 50000000
                    payeeRiseId: '0xA35b2F326F07a7C92BedB0D318C237F30948E425'
      responses:
        '200':
          description: Webhook received and processed (or acknowledged as unhandled for event types without a handler)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  eventId:
                    type: string
                    description: Internal `RiseWorksWebhookEvent` record ID
                  processed:
                    type: boolean
                    description: False for event types with no handler (e.g. fund.received), or if processing failed idempotently
                  message:
                    type: string
                    example: Payment marked as completed
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid JSON
        '401':
          description: Missing or invalid x-rise-signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    error: Missing signature
                invalid:
                  value:
                    error: Invalid signature
        '500':
          description: Webhook processing failed, or RISE_WEBHOOK_SECRET not configured (non-development environment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # PART 19C: CRON JOBS
  # ============================================================
  /api/cron/process-pending-disbursements:
    post:
      tags:
        - Cron Jobs
      summary: 'Cron: process pending disbursements'
      description: |
        Automated cron job that processes pending disbursements.
        Should be scheduled to run daily (e.g., 2 AM UTC).

        **Process (verified against `DisbursementProcessor.processAutomatedDisbursements()`,
        `lib/disbursement/cron/disbursement-processor.ts`):**
        1. Auto-approve PENDING commissions whose refund window has passed
           (`SystemConfig` key `affiliate_commission_approval_days`, default 14 days)
        2. Find all affiliates with pending commissions meeting the $50 threshold
        3. Create a single payment batch for all of them (not batched by 100 —
           `BatchManager.createBatch()` is called once with every payable
           aggregate; there is no chunking to `MAX_BATCH_SIZE` in this code path)
        4. Execute the batch via the default configured provider
        5. Log results to the audit trail

        **Idempotent:** Safe to run multiple times.

        **Not session-authenticated — internal-only, triggered by Vercel Cron,**
        reachable by anyone who has `CRON_SECRET`. Auth is
        `Authorization: Bearer <CRON_SECRET>`, compared by exact string match;
        missing/wrong header -> 401. `security: []` below reflects this; there is
        no `AdminAuth` requirement on this route. If the `CRON_SECRET` env var
        itself is unset server-side, returns 500 before checking the header.

        **Corrected this session:** result fields are `batchesCreated`,
        `batchesExecuted`, `affiliatesProcessed`, `totalAmount`, `durationMs`,
        `errors` — the previous spec's `successfulPayments`/`failedPayments`
        fields do not exist on `AutoDisbursementResult`. The error-path (500)
        response is `{ success: false, timestamp, error }`, a different shape
        than the generic `Error` schema (`{ error, details }`) used elsewhere.

        **Implementation:** `app/api/cron/process-pending-disbursements/route.ts` (POST).
      operationId: processPendingDisbursements
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <CRON_SECRET>'
          schema:
            type: string
            example: 'Bearer <CRON_SECRET>'
      responses:
        '200':
          description: Cron job completed (success reflects whether zero errors occurred)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronDisbursementResponse'
        '401':
          description: Missing or incorrect Authorization bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
        '500':
          description: CRON_SECRET not configured server-side, or an unhandled processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronErrorResponse'
              examples:
                notConfigured:
                  value:
                    error: Cron job not configured
                processingError:
                  value:
                    success: false
                    timestamp: '2026-07-17T02:00:03.120Z'
                    error: Batch execution failed

    get:
      tags:
        - Cron Jobs
      summary: 'Cron status info (unauthenticated)'
      description: |
        **Previously undocumented.** Returns static, hard-coded metadata about
        this cron endpoint (schedule, auth type, etc.) for monitoring/discovery
        purposes. Unlike the `POST` operation on this same path, this `GET` has
        **no authentication whatsoever** — no `CRON_SECRET` check at all.

        **Implementation:** `app/api/cron/process-pending-disbursements/route.ts` (GET).
      operationId: getProcessPendingDisbursementsCronInfo
      security: []
      responses:
        '200':
          description: Static endpoint metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronStatusInfo'
              example:
                endpoint: /api/cron/process-pending-disbursements
                method: POST
                status: configured
                description: Automated disbursement processing cron job
                schedule: 0 2 * * * (daily at 2:00 AM UTC)
                requiresAuth: true
                authType: Bearer token (CRON_SECRET)

  /api/cron/sync-riseworks-accounts:
    post:
      tags:
        - Cron Jobs
      summary: 'Cron: sync RiseWorks accounts'
      description: |
        Automated cron job that syncs RiseWorks account statuses.
        Should be scheduled to run daily (e.g., 3 AM UTC).

        **Process (verified against `DisbursementProcessor.syncRiseWorksAccounts()`,
        `lib/disbursement/cron/disbursement-processor.ts`):** currently the same
        stub as `POST /api/disbursement/riseworks/sync` — iterates every
        `AffiliateRiseAccount` and updates `lastSyncAt`. Does not yet call the
        real RiseWorks API or change `kycStatus`.

        **Idempotent:** Safe to run multiple times.

        **Not session-authenticated — internal-only, triggered by Vercel Cron,**
        reachable by anyone who has `CRON_SECRET`. Auth is
        `Authorization: Bearer <CRON_SECRET>`, compared by exact string match;
        missing/wrong header -> 401. `security: []` below reflects this; there is
        no `AdminAuth` requirement on this route. If the `CRON_SECRET` env var
        itself is unset server-side, returns 500 before checking the header.

        **Corrected this session:** result fields are `accountsSynced`,
        `accountsUpdated`, `durationMs`, `errors` — the previous spec's
        `accountsTotal` field does not exist on `AccountSyncResult`
        (`accountsSynced` doubles as the total, since every account found is
        counted as synced up front). The error-path (500) response is
        `{ success: false, timestamp, error }`, a different shape than the
        generic `Error` schema used elsewhere.

        **Implementation:** `app/api/cron/sync-riseworks-accounts/route.ts` (POST).
      operationId: syncRiseWorksAccountsCron
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <CRON_SECRET>'
          schema:
            type: string
            example: 'Bearer <CRON_SECRET>'
      responses:
        '200':
          description: Cron job completed (success reflects whether zero errors occurred)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronSyncResponse'
        '401':
          description: Missing or incorrect Authorization bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
        '500':
          description: CRON_SECRET not configured server-side, or an unhandled processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronErrorResponse'
              examples:
                notConfigured:
                  value:
                    error: Cron job not configured
                processingError:
                  value:
                    success: false
                    timestamp: '2026-07-17T03:00:01.045Z'
                    error: Unknown error

    get:
      tags:
        - Cron Jobs
      summary: 'Cron status info (unauthenticated)'
      description: |
        **Previously undocumented.** Returns static, hard-coded metadata about
        this cron endpoint (schedule, auth type, etc.) for monitoring/discovery
        purposes. Unlike the `POST` operation on this same path, this `GET` has
        **no authentication whatsoever** — no `CRON_SECRET` check at all.

        **Implementation:** `app/api/cron/sync-riseworks-accounts/route.ts` (GET).
      operationId: getSyncRiseWorksAccountsCronInfo
      security: []
      responses:
        '200':
          description: Static endpoint metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronStatusInfo'
              example:
                endpoint: /api/cron/sync-riseworks-accounts
                method: POST
                status: configured
                description: RiseWorks account sync cron job
                schedule: 0 3 * * * (daily at 3:00 AM UTC)
                requiresAuth: true
                authType: Bearer token (CRON_SECRET)

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    AdminAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth session cookie with `role: ADMIN` required. Verified either via
        `requireAdmin()` (can respond 401 or 403) or an inline
        `getServerSession` + role check (responds 401 only) depending on the
        route — see each operation's description for which applies.

  schemas:
    # ============================================================
    # ENUMS
    # ============================================================
    DisbursementProvider:
      type: string
      enum:
        - MOCK
        - RISE
      default: MOCK
      description: |
        Payment provider:
        - MOCK: Test provider for development (simulates success/failure)
        - RISE: Production RiseWorks blockchain provider (USDC on Base)

    PaymentBatchStatus:
      type: string
      enum:
        - PENDING
        - QUEUED
        - PROCESSING
        - COMPLETED
        - FAILED
        - CANCELLED
      description: |
        Batch lifecycle status:
        - PENDING: Created, awaiting execution
        - QUEUED: Scheduled for execution
        - PROCESSING: Currently executing payments
        - COMPLETED: All payments successful
        - FAILED: One or more payments failed
        - CANCELLED: Batch cancelled by admin

    DisbursementTransactionStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - CANCELLED

    RiseWorksKycStatus:
      type: string
      enum:
        - PENDING
        - SUBMITTED
        - APPROVED
        - REJECTED
        - EXPIRED
      description: |
        KYC verification status:
        - PENDING: Not started
        - SUBMITTED: Documents submitted, under review
        - APPROVED: KYC verified, can receive payments
        - REJECTED: KYC failed, cannot receive payments
        - EXPIRED: KYC expired, needs re-verification

    AuditLogStatus:
      type: string
      enum:
        - SUCCESS
        - FAILURE
        - WARNING
        - INFO

    # ============================================================
    # AFFILIATE SCHEMAS
    # ============================================================
    PayableAffiliate:
      type: object
      properties:
        id:
          type: string
          example: clp123abc456def
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        country:
          type: string
          example: US
        pendingAmount:
          type: number
          format: double
          description: Total pending commission amount (USD)
          example: 250.00
        paidAmount:
          type: number
          format: double
          description: Historical total paid (USD)
          example: 1500.00
        pendingCommissionCount:
          type: integer
          description: Number of pending commissions
          example: 5
        oldestPendingDate:
          type: string
          format: date-time
          nullable: true
          description: Date of oldest pending commission
        readyForPayout:
          type: boolean
          description: True if meets threshold AND has approved KYC
          example: true
        meetsThreshold:
          type: boolean
          description: True if pending amount >= $50
          example: true
        riseAccount:
          type: object
          properties:
            hasAccount:
              type: boolean
            riseId:
              type: string
              nullable: true
              example: '0xA35b2F326F07a7C92BedB0D318C237F30948E425'
            kycStatus:
              $ref: '#/components/schemas/RiseWorksKycStatus'
            canReceivePayments:
              type: boolean
              description: True if KYC is APPROVED

    AffiliateDisbursementProfile:
      type: object
      description: The `affiliate` object returned by GET /api/disbursement/affiliates/{affiliateId}
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        country:
          type: string
        status:
          type: string
          description: AffiliateStatus enum value (e.g. PENDING_VERIFICATION, APPROVED, SUSPENDED)
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        stats:
          type: object
          properties:
            totalPending:
              type: number
              format: double
            totalPaid:
              type: number
              format: double
            totalEarnings:
              type: number
              format: double
            codesDistributed:
              type: integer
            codesUsed:
              type: integer
        paymentInfo:
          type: object
          properties:
            paymentMethod:
              type: string
              description: 'e.g. BANK_TRANSFER, CRYPTO_USDT, PAYPAL, LOCAL_WALLET'
            paymentDetails:
              type: object
              additionalProperties: true
              description: Flexible JSON field for payment info; shape varies by paymentMethod

    AffiliateRiseAccountDetail:
      type: object
      description: The `riseAccount` object returned by GET /api/disbursement/affiliates/{affiliateId} (distinct from AffiliateRiseAccountListItem)
      properties:
        id:
          type: string
        riseId:
          type: string
        email:
          type: string
          format: email
        kycStatus:
          $ref: '#/components/schemas/RiseWorksKycStatus'
        kycCompletedAt:
          type: string
          format: date-time
          nullable: true
        invitationSentAt:
          type: string
          format: date-time
          nullable: true
        invitationAcceptedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        canReceivePayments:
          type: boolean
          description: True if kycStatus is APPROVED

    PendingCommissionsSummary:
      type: object
      properties:
        count:
          type: integer
        totalAmount:
          type: number
          format: double
        oldestDate:
          type: string
          format: date-time
        meetsThreshold:
          type: boolean
          description: True if totalAmount >= $50
        commissionIds:
          type: array
          description: IDs only, not full Commission objects
          items:
            type: string

    RecentDisbursementTransaction:
      type: object
      description: Item shape for GET /api/disbursement/affiliates/{affiliateId} `recentTransactions` (distinct from other transaction list shapes in this API)
      properties:
        id:
          type: string
        transactionId:
          type: string
        amount:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/DisbursementTransactionStatus'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        batchNumber:
          type: string
          nullable: true
        batchStatus:
          $ref: '#/components/schemas/PaymentBatchStatus'

    AffiliateCommissionItem:
      type: object
      description: Commission item shape for GET /api/disbursement/affiliates/{affiliateId}/commissions
      properties:
        id:
          type: string
        affiliateCodeId:
          type: string
        code:
          type: string
          nullable: true
          description: The affiliate code string, joined from AffiliateCode
        userId:
          type: string
        subscriptionId:
          type: string
          nullable: true
        grossRevenue:
          type: number
          format: double
        discountAmount:
          type: number
          format: double
        netRevenue:
          type: number
          format: double
        commissionAmount:
          type: number
          format: double
        commissionPercent:
          type: number
          nullable: true
          description: Joined from AffiliateCode
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - PAID
            - CANCELLED
        earnedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ============================================================
    # RISEWORKS ACCOUNT SCHEMAS
    # ============================================================
    AffiliateRiseAccountListItem:
      type: object
      description: Item shape for GET /api/disbursement/riseworks/accounts
      properties:
        id:
          type: string
        affiliateProfileId:
          type: string
        affiliateName:
          type: string
          nullable: true
        affiliateEmail:
          type: string
          format: email
          nullable: true
        affiliateCountry:
          type: string
          nullable: true
        affiliateStatus:
          type: string
          nullable: true
        riseId:
          type: string
        email:
          type: string
          format: email
        kycStatus:
          $ref: '#/components/schemas/RiseWorksKycStatus'
        kycCompletedAt:
          type: string
          format: date-time
          nullable: true
        invitationSentAt:
          type: string
          format: date-time
          nullable: true
        invitationAcceptedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        transactionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        canReceivePayments:
          type: boolean
          description: True if kycStatus is APPROVED

    RiseWorksAccountsSummary:
      type: object
      properties:
        total:
          type: integer
        byKycStatus:
          type: object
          properties:
            pending:
              type: integer
            submitted:
              type: integer
            approved:
              type: integer
            rejected:
              type: integer
            expired:
              type: integer
        canReceivePayments:
          type: integer
          description: Count of accounts with kycStatus APPROVED

    CreatedRiseAccount:
      type: object
      description: The `account` object returned by POST /api/disbursement/riseworks/accounts (only these 6 fields - not the full account record)
      properties:
        id:
          type: string
        affiliateProfileId:
          type: string
        affiliateName:
          type: string
          nullable: true
        riseId:
          type: string
        email:
          type: string
          format: email
        kycStatus:
          $ref: '#/components/schemas/RiseWorksKycStatus'
        createdAt:
          type: string
          format: date-time

    RiseWorksSyncResults:
      type: object
      properties:
        total:
          type: integer
        synced:
          type: integer
          description: Count of accounts successfully updated (lastSyncAt bump)
        errors:
          type: integer
          description: Count of accounts that errored during sync
        statusChanges:
          type: array
          description: Always empty today - kycStatus is not yet actually updated by this stub implementation
          items:
            type: object
            properties:
              riseId:
                type: string
              oldStatus:
                type: string
              newStatus:
                type: string

    # ============================================================
    # BATCH SCHEMAS
    # ============================================================
    PaymentBatch:
      type: object
      properties:
        id:
          type: string
        batchNumber:
          type: string
          example: BATCH-2024-ABC123
        paymentCount:
          type: integer
          example: 15
        totalAmount:
          type: number
          format: double
          example: 5250.00
        currency:
          type: string
          default: USD
        provider:
          $ref: '#/components/schemas/DisbursementProvider'
        status:
          $ref: '#/components/schemas/PaymentBatchStatus'
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        executedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BatchTransactionCounts:
      type: object
      description: |
        Per-batch transaction counts keyed by lowercase status name, from
        TransactionService.getTransactionCountsByStatus(). Always all 5 keys,
        defaulting to 0 - NOT the uppercase PaymentBatchStatus/
        DisbursementTransactionStatus enum casing used elsewhere in this API.
      properties:
        pending:
          type: integer
        processing:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer

    PaymentBatchWithCounts:
      allOf:
        - $ref: '#/components/schemas/PaymentBatch'
        - type: object
          properties:
            transactionCounts:
              $ref: '#/components/schemas/BatchTransactionCounts'

    BatchStatistics:
      type: object
      description: Return shape of BatchManager.getBatchStatistics() - has no successRate field
      properties:
        total:
          type: integer
        byStatus:
          type: object
          description: Only statuses with at least one batch appear as keys (uppercase PaymentBatchStatus values)
          additionalProperties:
            type: integer
          example:
            PENDING: 3
            COMPLETED: 40
            FAILED: 2
        totalAmount:
          type: number
          format: double
        totalPayments:
          type: integer
          description: Sum of paymentCount across all batches

    BatchDetail:
      type: object
      description: The `batch` object returned by GET /api/disbursement/batches/{batchId} - distinct from the base PaymentBatch schema (adds paidAmount/metadata, omits provider)
      properties:
        id:
          type: string
        batchNumber:
          type: string
        provider:
          $ref: '#/components/schemas/DisbursementProvider'
        status:
          $ref: '#/components/schemas/PaymentBatchStatus'
        paymentCount:
          type: integer
        totalAmount:
          type: number
          format: double
        paidAmount:
          type: number
          format: double
          description: Computed sum of COMPLETED transaction amounts (not a stored column)
        currency:
          type: string
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        executedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BatchTransactionDetail:
      type: object
      description: Transaction item shape for GET /api/disbursement/batches/{batchId} - distinct from TransactionListItem and AffiliatePaymentHistoryItem
      properties:
        id:
          type: string
        transactionId:
          type: string
        providerTxId:
          type: string
          nullable: true
        commissionId:
          type: string
        affiliateProfileId:
          type: string
          nullable: true
        affiliateRiseId:
          type: string
          nullable: true
          description: Blockchain address, joined via affiliateRiseAccount relation
        amount:
          type: number
          format: double
        amountRiseUnits:
          type: string
          nullable: true
          description: Serialized as a string (BigInt.toString()) to avoid JSON precision loss - NOT a JSON integer
          example: '50000000'
        currency:
          type: string
        status:
          $ref: '#/components/schemas/DisbursementTransactionStatus'
        retryCount:
          type: integer
        lastRetryAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true

    BatchAuditLogEntry:
      type: object
      description: Audit log item shape nested under GET /api/disbursement/batches/{batchId} - a SUBSET of AuditLogEntry (no ipAddress/userAgent/transactionId/batchId)
      properties:
        id:
          type: string
        action:
          type: string
        status:
          $ref: '#/components/schemas/AuditLogStatus'
        actor:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ============================================================
    # BATCH PREVIEW SCHEMAS
    # ============================================================
    BatchPreviewItem:
      type: object
      properties:
        affiliateId:
          type: string
        affiliateName:
          type: string
        affiliateEmail:
          type: string
          format: email
        country:
          type: string
        commissionCount:
          type: integer
        grossAmount:
          type: number
          format: double
        feeAmount:
          type: number
          format: double
        netAmount:
          type: number
          format: double
        eligible:
          type: boolean
          description: calculation.eligible AND canReceivePayments (has account + KYC approved)
        status:
          type: string
          enum:
            - ready
            - below_threshold
            - no_rise_account
            - kyc_pending
        statusReason:
          type: string
          example: 'Below minimum of $50'
        riseAccount:
          type: object
          properties:
            hasAccount:
              type: boolean
            riseId:
              type: string
              nullable: true
            kycStatus:
              $ref: '#/components/schemas/RiseWorksKycStatus'

    BatchPreviewSummary:
      type: object
      properties:
        totalAffiliates:
          type: integer
        eligibleAffiliates:
          type: integer
        ineligibleAffiliates:
          type: integer
        totalGrossAmount:
          type: number
          format: double
        totalFeeAmount:
          type: number
          format: double
        totalNetAmount:
          type: number
          format: double
        eligibleNetAmount:
          type: number
          format: double
          description: Sum of netAmount across eligible items only
        feePercentage:
          type: number
          description: Echoes the feePercentage from the request (0 if omitted)
        minimumThreshold:
          type: number
          format: double
          example: 50.00

    # ============================================================
    # TRANSACTION SCHEMAS
    # ============================================================
    TransactionListItem:
      type: object
      description: Item shape for GET /api/disbursement/transactions - distinct from BatchTransactionDetail and AffiliatePaymentHistoryItem
      properties:
        id:
          type: string
        transactionId:
          type: string
        providerTxId:
          type: string
          nullable: true
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          $ref: '#/components/schemas/DisbursementTransactionStatus'
        provider:
          $ref: '#/components/schemas/DisbursementProvider'
        retryCount:
          type: integer
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        batch:
          type: object
          properties:
            id:
              type: string
            batchNumber:
              type: string
            status:
              $ref: '#/components/schemas/PaymentBatchStatus'
        commission:
          type: object
          properties:
            id:
              type: string
            commissionAmount:
              type: number
              format: double
            affiliateProfileId:
              type: string

    Pagination:
      type: object
      description: Shared pagination shape used by GET /transactions and GET /audit-logs
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    # ============================================================
    # AUDIT & REPORTING SCHEMAS
    # ============================================================
    AuditLogEntry:
      type: object
      description: Full audit log item shape for GET /api/disbursement/audit-logs (distinct from the batch-nested BatchAuditLogEntry subset)
      properties:
        id:
          type: string
        action:
          type: string
          description: |
            Action types include:
            - batch.created, batch.executed, batch.completed, batch.failed, batch.cancelled
            - riseworks.sync
            - cron.disbursement_start, cron.disbursement_complete, cron.disbursement_error,
              cron.batch_execution_failed, cron.commissions_auto_approved
            - cron.account_sync_start, cron.account_sync_complete, cron.account_sync_error
          example: batch.created
        status:
          $ref: '#/components/schemas/AuditLogStatus'
        actor:
          type: string
          nullable: true
          description: User ID (or 'CRON_JOB' for automated cron-created batches) who performed the action
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Additional context as JSON
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        transaction:
          type: object
          nullable: true
          description: null if this log entry is not linked to a transaction
          properties:
            transactionId:
              type: string
            amount:
              type: number
              format: double
            status:
              $ref: '#/components/schemas/DisbursementTransactionStatus'
        batch:
          type: object
          nullable: true
          description: null if this log entry is not linked to a batch
          properties:
            batchNumber:
              type: string
            status:
              $ref: '#/components/schemas/PaymentBatchStatus'

    AffiliatePaymentHistoryItem:
      type: object
      description: History item shape for GET /api/disbursement/reports/affiliate/{affiliateId} - distinct from TransactionListItem and BatchTransactionDetail
      properties:
        id:
          type: string
        transactionId:
          type: string
        amount:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/DisbursementTransactionStatus'
        provider:
          $ref: '#/components/schemas/DisbursementProvider'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        batch:
          type: object
          properties:
            batchNumber:
              type: string
            status:
              $ref: '#/components/schemas/PaymentBatchStatus'
        commission:
          type: object
          properties:
            id:
              type: string
            commissionAmount:
              type: number
              format: double
            status:
              type: string

    AffiliateHistorySummary:
      type: object
      properties:
        totalTransactions:
          type: integer
        totalPaid:
          type: number
          format: double
        totalFailed:
          type: number
          format: double
        totalPending:
          type: number
          format: double
        successRate:
          type: number
          format: double
          description: Percentage (0-100)

    DisbursementSummary:
      type: object
      properties:
        batches:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            pending:
              type: integer
              description: Sum of PENDING + QUEUED + PROCESSING batches
            failed:
              type: integer
            successRate:
              type: number
              format: double
              description: Percentage (0-100)
        transactions:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            pending:
              type: integer
            successRate:
              type: number
              format: double
        amounts:
          type: object
          properties:
            totalPaid:
              type: number
              format: double
              description: Total successfully disbursed (USD)
            totalPending:
              type: number
              format: double
              description: Total pending approved-but-undisbursed commissions (USD) - not affected by startDate/endDate filter
            totalFailed:
              type: number
              format: double
              description: Total from failed transactions (USD)
        period:
          type: object
          description: Only present in the response if both startDate and endDate query params were supplied
          properties:
            startDate:
              type: string
            endDate:
              type: string

    # ============================================================
    # CONFIGURATION SCHEMAS
    # ============================================================
    DisbursementConfig:
      type: object
      description: Fully environment-derived; there is no database-backed config table
      properties:
        provider:
          type: object
          description: An object, not a bare DisbursementProvider string
          properties:
            default:
              $ref: '#/components/schemas/DisbursementProvider'
            available:
              type: array
              items:
                $ref: '#/components/schemas/DisbursementProvider'
              description: '["MOCK"], plus "RISE" if isProviderAvailable("RISE")'
            riseEnabled:
              type: boolean
        enabled:
          type: boolean
          description: 'process.env.DISBURSEMENT_ENABLED !== "false"'
        minimumPayout:
          type: number
          format: double
          description: MINIMUM_PAYOUT_USD constant
          example: 50.00
        batchSize:
          type: integer
          description: MAX_BATCH_SIZE constant
          example: 100
        retry:
          type: object
          description: Key is `retry`, not `retryPolicy`
          properties:
            maxAttempts:
              type: integer
              example: 3
            initialDelay:
              type: integer
              description: Initial delay in milliseconds
              example: 1000
            maxDelay:
              type: integer
              description: Maximum delay in milliseconds
              example: 30000
            backoffMultiplier:
              type: number
              example: 2
        environment:
          type: string
          description: 'process.env.RISE_ENVIRONMENT, default "staging" (not a validated enum at runtime)'
          example: staging
        features:
          type: object
          properties:
            webhooksEnabled:
              type: boolean
              description: 'true if RISE_WEBHOOK_SECRET env var is set'
            cronEnabled:
              type: boolean
              description: 'true if CRON_SECRET env var is set'
            quickPayEnabled:
              type: boolean
              description: Always true today (hard-coded)

    HealthStatus:
      type: object
      properties:
        healthy:
          type: boolean
          description: 'True only if checks.database && checks.provider'
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: boolean
              description: Database connectivity
            provider:
              type: boolean
              description: Payment provider connectivity
            pendingBatches:
              type: integer
              description: Count of PENDING/QUEUED/PROCESSING batches
            failedTransactions:
              type: integer
              description: Failed transactions in last 24h
            lastWebhookReceived:
              type: string
              format: date-time
              nullable: true
            lastBatchCompleted:
              type: string
              format: date-time
              nullable: true
        warnings:
          type: array
          items:
            type: string
          description: Warning messages for degraded conditions
        provider:
          type: string
          description: Default configured provider name (getDefaultProvider())
        uptime:
          type: integer
          nullable: true
          description: Server uptime in seconds since module load; omitted/absent on the top-level catch error path

    # ============================================================
    # CRON SCHEMAS
    # ============================================================
    CronDisbursementResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True if zero errors occurred during processing
        timestamp:
          type: string
          format: date-time
        result:
          type: object
          properties:
            batchesCreated:
              type: integer
            batchesExecuted:
              type: integer
            affiliatesProcessed:
              type: integer
            totalAmount:
              type: number
              format: double
            durationMs:
              type: integer
            errors:
              type: array
              items:
                type: string

    CronSyncResponse:
      type: object
      properties:
        success:
          type: boolean
          description: True if zero errors occurred during sync
        timestamp:
          type: string
          format: date-time
        result:
          type: object
          properties:
            accountsSynced:
              type: integer
              description: Total accounts found (every account found is counted as synced up front)
            accountsUpdated:
              type: integer
              description: Accounts whose lastSyncAt update succeeded
            durationMs:
              type: integer
            errors:
              type: array
              items:
                type: string

    CronErrorResponse:
      type: object
      description: |
        Used by both cron POST endpoints on their catch-all error path. Distinct
        from the generic Error schema ({ error, details }) used elsewhere in this API.
      properties:
        success:
          type: boolean
          enum: [false]
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Absent on the "CRON_SECRET not configured" 500, present on the processing-error 500
        error:
          type: string

    CronStatusInfo:
      type: object
      description: Static response body for the unauthenticated GET operation on both cron paths
      properties:
        endpoint:
          type: string
        method:
          type: string
          example: POST
        status:
          type: string
          example: configured
        description:
          type: string
        schedule:
          type: string
          example: 0 2 * * * (daily at 2:00 AM UTC)
        requiresAuth:
          type: boolean
          example: true
        authType:
          type: string
          example: Bearer token (CRON_SECRET)

    # ============================================================
    # ERROR SCHEMAS
    # ============================================================
    Error:
      type: object
      properties:
        error:
          type: string
          example: Error message
        details:
          type: string
          nullable: true
          description: Additional error details

  responses:
    UnauthorizedError:
      description: Unauthorized - Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized

    ForbiddenError:
      description: |
        Forbidden - authenticated but not an admin. Only returned by routes using
        requireAdmin() (see each operation's Auth note); routes using the inline
        session-check pattern collapse this case into 401 instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: You must be an administrator to access this resource

    BadRequestError:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid request parameters

    NotFoundError:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Resource not found

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error
