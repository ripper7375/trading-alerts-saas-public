          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: batchId
          in: query
          description: Filter by specific batch
          schema:
            type: string
        - name: transactionId
          in: query
