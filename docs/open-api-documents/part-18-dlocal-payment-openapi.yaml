openapi: 3.0.3
info:
  title: Trading Alerts SaaS - dLocal Payment Integration API (Part 18)
  version: 2.0.0
  description: |
    dLocal Payment Integration API for Trading Alerts SaaS platform (Part 18).

    This API provides alternative payment processing for users in specific regions through dLocal,
    supporting local payment methods and currencies.

    ## Overview
    Part 18 is split into three vertical slices:
    - **Part 18A**: Payment Creation Flow (core infrastructure)
    - **Part 18B**: Subscription Lifecycle Management
    - **Part 18C**: User Experience & Admin Dashboard

    ## Supported Regions (8 Countries)
    | Country       | Code | Currency | Payment Methods                     |
    | ------------- | ---- | -------- | ----------------------------------- |
    | India         | IN   | INR      | UPI, Paytm, PhonePe, Net Banking    |
    | Nigeria       | NG   | NGN      | Bank Transfer, USSD, Paystack       |
    | Pakistan      | PK   | PKR      | JazzCash, Easypaisa                 |
    | Vietnam       | VN   | VND      | VNPay, MoMo, ZaloPay                |
    | Indonesia     | ID   | IDR      | GoPay, OVO, Dana, ShopeePay         |
    | Thailand      | TH   | THB      | TrueMoney, Rabbit LINE Pay, Thai QR |
    | South Africa  | ZA   | ZAR      | Instant EFT, EFT                    |
    | Turkey        | TR   | TRY      | Bank Transfer, Local Cards          |

    ## Payment Plans
    - **3-Day Plan**: $1.99 USD (one-time, lifetime limit per account)
    - **Monthly Plan**: $29.00 USD (recurring via manual renewal)

    ## Features
    - Multi-currency support with real-time conversion
    - 30+ local payment method integrations
    - Anti-abuse validation for 3-day plans (one per account)
    - Subscription lifecycle management
    - Automated expiry and renewal reminders
    - Fraud detection and monitoring dashboard
    - Discount code support (monthly plan only)
    - HMAC-SHA256 webhook signature verification

  contact:
    name: API Support
    email: support@tradingalerts.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.tradingalerts.example.com
    description: Production server

security:
  - sessionAuth: []

tags:
  - name: Payment Methods
    description: Available payment methods by country
  - name: Currency
    description: Currency conversion and exchange rates
  - name: Payments
    description: Payment creation and status
  - name: Webhooks
    description: dLocal webhook handlers
  - name: Discount
    description: Discount code validation
  - name: Eligibility
    description: Plan eligibility checks
  - name: Cron Jobs
    description: Automated subscription management
  - name: Admin - Fraud
    description: Fraud alert management (Admin only)

paths:
  /api/payments/dlocal/methods:
    get:
      tags:
        - Payment Methods
      summary: Get available payment methods
      description: |
        Returns available dLocal payment methods for a specific country.

        **Supports:**
        - Simple list of payment method IDs
        - Detailed information with names and icons (detailed=true)

        **Payment Methods by Country:**
        - India: UPI, Paytm, PhonePe, Net Banking
        - Nigeria: Bank Transfer, USSD, Paystack
        - Pakistan: JazzCash, Easypaisa
        - Vietnam: VNPay, MoMo, ZaloPay
        - Indonesia: GoPay, OVO, Dana, ShopeePay
        - Thailand: TrueMoney, Rabbit LINE Pay, Thai QR
        - South Africa: Instant EFT, EFT
        - Turkey: Bank Transfer, Local Cards
      operationId: getPaymentMethods
      parameters:
        - name: country
          in: query
          required: true
          description: ISO 2-letter country code
          schema:
            type: string
            enum: [IN, NG, PK, VN, ID, TH, ZA, TR]
          example: IN
        - name: detailed
          in: query
          required: false
          description: Return detailed method information
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: Payment methods retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodsResponse'
              examples:
                simple:
                  summary: Simple list
                  value:
                    country: 'IN'
                    methods:
                      - 'UPI'
                      - 'Paytm'
                      - 'PhonePe'
                      - 'Net Banking'
                detailed:
                  summary: Detailed information
                  value:
                    country: 'IN'
                    methods:
                      - id: 'UPI'
                        name: 'UPI'
                        type: 'bank'
                        logo: 'upi-icon.svg'
                      - id: 'Paytm'
                        name: 'Paytm Wallet'
                        type: 'wallet'
                        logo: 'paytm-icon.svg'
        '400':
          description: Invalid or unsupported country
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Invalid or unsupported country'
                supportedCountries:
                  ['IN', 'NG', 'PK', 'VN', 'ID', 'TH', 'ZA', 'TR']
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/dlocal/exchange-rate:
    get:
      tags:
        - Currency
      summary: Get USD exchange rate
      description: |
        Returns the current USD to local currency exchange rate.

        **Rate Source:** exchangerate-api.com with caching
        **Cache Duration:** 1 hour
        **Fallback:** Static rates for offline mode
      operationId: getExchangeRate
      parameters:
        - name: currency
          in: query
          required: true
          description: Target currency code
          schema:
            type: string
            enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: INR
      responses:
        '200':
          description: Exchange rate retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
              example:
                from: 'USD'
                to: 'INR'
                rate: 83.25
                timestamp: '2026-01-24T10:00:00.000Z'
        '400':
          description: Invalid currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/dlocal/convert:
    get:
      tags:
        - Currency
      summary: Convert USD to local currency
      description: |
        Converts a USD amount to local currency using current exchange rate.

        **Use Case:** Display pricing in local currency on checkout page
      operationId: convertCurrency
      parameters:
        - name: amount
          in: query
          required: true
          description: Amount in USD
          schema:
            type: number
            minimum: 0
          example: 29
        - name: currency
          in: query
          required: true
          description: Target currency
          schema:
            type: string
            enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: INR
      responses:
        '200':
          description: Conversion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
              example:
                amountUSD: 29
                currency: 'INR'
                convertedAmount: 2414.25
                exchangeRate: 83.25
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/dlocal/create:
    post:
      tags:
        - Payments
      summary: Create dLocal payment
      description: |
        Creates a new dLocal payment for subscription.

        **Validations:**
        - User must be authenticated
        - User must not have active PRO subscription
        - Payment method must be valid for country
        - 3-day plan: Anti-abuse checks (max 1 per user lifetime)
        - Discount code: Only valid for monthly plan

        **Process:**
        1. Validate user and input
        2. Check 3-day plan eligibility (if applicable)
        3. Apply discount code (if provided for monthly)
        4. Calculate amount in local currency
        5. Create payment record in database
        6. Call dLocal API with HMAC-SHA256 signature
        7. Return redirect URL for user to complete payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              threeDayPlan:
                summary: 3-day plan (India)
                value:
                  country: 'IN'
                  paymentMethod: 'UPI'
                  planType: 'THREE_DAY'
                  currency: 'INR'
              monthlyPlanWithDiscount:
                summary: Monthly plan with discount
                value:
                  country: 'NG'
                  paymentMethod: 'Bank Transfer'
                  planType: 'MONTHLY'
                  currency: 'NGN'
                  discountCode: 'SAVE20'
      responses:
        '200':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
              example:
                paymentId: 'dlp_abc123xyz456'
                redirectUrl: 'https://pay.dlocal.com/checkout/dlp_abc123xyz456'
                amount: 166
                currency: 'INR'
                expiresAt: '2026-01-24T11:00:00.000Z'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                invalidPaymentMethod:
                  summary: Invalid payment method
                  value:
                    error: 'Invalid payment method for this country'
                    country: 'IN'
                    paymentMethod: 'INVALID_METHOD'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - already subscribed or not eligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadySubscribed:
                  summary: Already has subscription
                  value:
                    error: 'You already have an active subscription'
                threeDayNotEligible:
                  summary: Not eligible for 3-day plan
                  value:
                    error: 'You have already used the 3-day promotional plan'
                    reason: 'ALREADY_USED'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/dlocal/{paymentId}:
    get:
      tags:
        - Payments
      summary: Get payment status
      description: |
        Returns the current status of a dLocal payment.

        **Status Values:**
        - PENDING: Payment initiated, awaiting completion
        - COMPLETED: Payment successful
        - FAILED: Payment failed
        - CANCELLED: Payment cancelled
        - REFUNDED: Payment refunded
      operationId: getPaymentStatus
      parameters:
        - name: paymentId
          in: path
          required: true
          description: dLocal payment ID
          schema:
            type: string
          example: 'dlp_abc123xyz456'
      responses:
        '200':
          description: Payment status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
              example:
                id: 'clp_internal_id'
                paymentId: 'dlp_abc123xyz456'
                orderId: 'ord_xyz789'
                status: 'COMPLETED'
                amount: '166.00'
                currency: 'INR'
                planType: 'THREE_DAY'
                createdAt: '2026-01-24T10:00:00.000Z'
                dLocalStatus:
                  id: 'dlp_abc123xyz456'
                  status: 'PAID'
                  amount: 166
                  currency: 'INR'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied - payment belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/dlocal/check-three-day-eligibility:
    get:
      tags:
        - Eligibility
      summary: Check 3-day plan eligibility
      description: |
        Checks if the authenticated user is eligible for the 3-day promotional plan.

        **Anti-Abuse Rules:**
        - Max 1 three-day subscription per user (lifetime limit)
        - Checks payment history for previous 3-day purchases
        - Checks subscription history
        - Verifies no active PRO subscription
      operationId: checkThreeDayEligibility
      responses:
        '200':
          description: Eligibility check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDayEligibilityResponse'
              examples:
                eligible:
                  summary: User is eligible
                  value:
                    eligible: true
                    reason: null
                alreadyUsed:
                  summary: Already used 3-day plan
                  value:
                    eligible: false
                    reason: 'ALREADY_USED'
                activeSubscription:
                  summary: Has active subscription
                  value:
                    eligible: false
                    reason: 'ACTIVE_SUBSCRIPTION'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/dlocal/validate-discount:
    post:
      tags:
        - Discount
      summary: Validate discount code
      description: |
        Validates a discount code for monthly plan.

        **Rules:**
        - Only valid for MONTHLY plan (not 3-day)
        - Checks if code exists and is active
        - Checks if code has not expired
        - Checks usage limits
        - Returns discount type (PERCENTAGE or FIXED)
        - Calculates final price after discount
      operationId: validateDiscountCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDiscountRequest'
            example:
              code: 'SAVE20'
              planType: 'MONTHLY'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDiscountResponse'
              examples:
                validPercentage:
                  summary: Valid percentage discount
                  value:
                    valid: true
                    code: 'SAVE20'
                    discountType: 'PERCENTAGE'
                    discountValue: 20
                    finalPrice: 23.20
                validFixed:
                  summary: Valid fixed discount
                  value:
                    valid: true
                    code: 'FLAT5'
                    discountType: 'FIXED'
                    discountValue: 5
                    finalPrice: 24.00
                invalidCode:
                  summary: Invalid code
                  value:
                    valid: false
                    error: 'Code not found or expired'
                wrongPlan:
                  summary: Code not valid for plan type
                  value:
                    valid: false
                    error: 'Discount codes are only valid for monthly plan'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webhooks/dlocal:
    post:
      tags:
        - Webhooks
      summary: dLocal webhook handler
      description: |
        Handles webhook events from dLocal for payment status updates.

        **Events Handled:**
        - payment.paid: Payment successful → Create subscription, upgrade to PRO
        - payment.rejected: Payment failed → Update status, send failure email
        - payment.cancelled: Payment cancelled → Update status

        **Process (payment.paid):**
        1. Verify webhook signature (HMAC-SHA256)
        2. Find payment in database by order_id
        3. Update payment status to COMPLETED
        4. Create/update subscription with correct duration (3 or 30 days)
        5. Upgrade user tier to PRO
        6. Mark 3-day plan as used (if applicable, anti-abuse)
        7. Send confirmation email

        **Security:**
        - HMAC-SHA256 signature validation
        - Rejects invalid signatures with 400 error
        - Idempotent processing (prevents duplicate subscriptions)
      operationId: handleDLocalWebhook
      security: []
      parameters:
        - name: x-dlocal-signature
          in: header
          required: true
          description: dLocal webhook HMAC-SHA256 signature
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DLocalWebhookPayload'
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        '400':
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Webhook processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cron/check-expiring-subscriptions:
    get:
      tags:
        - Cron Jobs
      summary: Check expiring subscriptions
      description: |
        Cron job that checks for subscriptions expiring soon and sends renewal reminders.

        **Schedule:** Daily at 00:00 UTC (Vercel Cron)

        **Process:**
        1. Find dLocal subscriptions expiring in 3 days
        2. Send renewal reminder emails with local currency pricing
        3. Log processing results

        **Authentication:** Cron secret header required
      operationId: checkExpiringSubscriptions
      security: []
      parameters:
        - name: authorization
          in: header
          required: true
          description: Cron secret for authentication
          schema:
            type: string
      responses:
        '200':
          description: Cron job executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronJobResponse'
              example:
                success: true
                emailsSent: 15
                processed: 15
        '401':
          description: Unauthorized - invalid cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Cron job error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cron/downgrade-expired-subscriptions:
    get:
      tags:
        - Cron Jobs
      summary: Downgrade expired subscriptions
      description: |
        Cron job that downgrades users with expired subscriptions to FREE tier.

        **Schedule:** Daily at 01:00 UTC (Vercel Cron)

        **Process:**
        1. Find expired subscriptions (past expiresAt date)
        2. Update subscription status to EXPIRED
        3. Downgrade user tier from PRO to FREE
        4. Send expiry notification email
        5. Log processing results

        **Authentication:** Cron secret header required
      operationId: downgradeExpiredSubscriptions
      security: []
      parameters:
        - name: authorization
          in: header
          required: true
          description: Cron secret for authentication
          schema:
            type: string
      responses:
        '200':
          description: Cron job executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronJobResponse'
              example:
                success: true
                downgraded: 8
                processed: 8
        '401':
          description: Unauthorized - invalid cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Cron job error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/fraud-alerts:
    get:
      tags:
        - Admin - Fraud
      summary: List fraud alerts
      description: |
        Returns paginated list of fraud alerts with optional filters.

        **Requires:** Admin role
      operationId: listFraudAlerts
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by alert status
          schema:
            type: string
            enum: [NEW, INVESTIGATING, RESOLVED, DISMISSED]
        - name: severity
          in: query
          required: false
          description: Filter by severity level
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: pattern
          in: query
          required: false
          description: Filter by fraud pattern type
          schema:
            type: string
            enum: [MULTIPLE_3DAY_ATTEMPTS, RAPID_FAILURES, COUNTRY_HOPPING, UNUSUAL_METHODS]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Fraud alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlertsListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Admin - Fraud
      summary: Create fraud alert
      description: |
        Creates a new fraud alert manually.

        **Requires:** Admin role
      operationId: createFraudAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFraudAlertRequest'
      responses:
        '201':
          description: Fraud alert created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlert'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/fraud-alerts/{id}:
    get:
      tags:
        - Admin - Fraud
      summary: Get fraud alert details
      description: |
        Returns detailed information about a specific fraud alert.

        **Requires:** Admin role
      operationId: getFraudAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fraud alert details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlertDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fraud alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Admin - Fraud
      summary: Update fraud alert
      description: |
        Updates fraud alert status or adds investigation notes.

        **Requires:** Admin role
      operationId: updateFraudAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFraudAlertRequest'
      responses:
        '200':
          description: Fraud alert updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlert'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fraud alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  schemas:
    PaymentMethodsResponse:
      type: object
      required:
        - country
        - methods
      properties:
        country:
          type: string
          enum: [IN, NG, PK, VN, ID, TH, ZA, TR]
          example: 'IN'
        methods:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/PaymentMethodDetail'
          example: ['UPI', 'Paytm', 'PhonePe', 'Net Banking']

    PaymentMethodDetail:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          example: 'UPI'
        name:
          type: string
          example: 'UPI'
        type:
          type: string
          enum: [bank, wallet, qr, card]
          example: 'bank'
        logo:
          type: string
          example: 'upi-icon.svg'

    ExchangeRateResponse:
      type: object
      required:
        - from
        - to
        - rate
        - timestamp
      properties:
        from:
          type: string
          example: 'USD'
        to:
          type: string
          example: 'INR'
        rate:
          type: number
          format: float
          example: 83.25
        timestamp:
          type: string
          format: date-time
          example: '2026-01-24T10:00:00.000Z'

    ConvertResponse:
      type: object
      required:
        - amountUSD
        - currency
        - convertedAmount
        - exchangeRate
      properties:
        amountUSD:
          type: number
          example: 29
        currency:
          type: string
          example: 'INR'
        convertedAmount:
          type: number
          format: float
          example: 2414.25
        exchangeRate:
          type: number
          format: float
          example: 83.25

    CreatePaymentRequest:
      type: object
      required:
        - country
        - paymentMethod
        - planType
        - currency
      properties:
        country:
          type: string
          enum: [IN, NG, PK, VN, ID, TH, ZA, TR]
          example: 'IN'
        paymentMethod:
          type: string
          description: Payment method ID (must be valid for selected country)
          example: 'UPI'
        planType:
          type: string
          enum: [THREE_DAY, MONTHLY]
          example: 'THREE_DAY'
        currency:
          type: string
          enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: 'INR'
        discountCode:
          type: string
          description: Optional discount code (MONTHLY plan only)
          example: 'SAVE20'

    CreatePaymentResponse:
      type: object
      required:
        - paymentId
        - redirectUrl
        - amount
        - currency
        - expiresAt
      properties:
        paymentId:
          type: string
          description: dLocal payment ID
          example: 'dlp_abc123xyz456'
        redirectUrl:
          type: string
          format: uri
          description: URL to redirect user for payment completion
          example: 'https://pay.dlocal.com/checkout/dlp_abc123xyz456'
        amount:
          type: number
          description: Amount in local currency
          example: 166
        currency:
          type: string
          example: 'INR'
        expiresAt:
          type: string
          format: date-time
          description: Payment link expiration
          example: '2026-01-24T11:00:00.000Z'

    PaymentStatusResponse:
      type: object
      required:
        - id
        - paymentId
        - orderId
        - status
        - amount
        - currency
        - planType
        - createdAt
      properties:
        id:
          type: string
          description: Internal payment record ID
          example: 'clp_internal_id'
        paymentId:
          type: string
          description: dLocal payment ID
          example: 'dlp_abc123xyz456'
        orderId:
          type: string
          description: Internal order ID
          example: 'ord_xyz789'
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          example: 'COMPLETED'
        amount:
          type: string
          description: Amount in local currency (string for precision)
          example: '166.00'
        currency:
          type: string
          example: 'INR'
        planType:
          type: string
          enum: [THREE_DAY, MONTHLY]
          example: 'THREE_DAY'
        createdAt:
          type: string
          format: date-time
          example: '2026-01-24T10:00:00.000Z'
        dLocalStatus:
          type: object
          description: Status from dLocal API (if available)
          properties:
            id:
              type: string
            status:
              type: string
            amount:
              type: number
            currency:
              type: string

    ValidateDiscountRequest:
      type: object
      required:
        - code
        - planType
      properties:
        code:
          type: string
          example: 'SAVE20'
        planType:
          type: string
          enum: [MONTHLY]
          description: Discount codes only valid for MONTHLY plan
          example: 'MONTHLY'

    ValidateDiscountResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          example: true
        code:
          type: string
          example: 'SAVE20'
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED]
          example: 'PERCENTAGE'
        discountValue:
          type: number
          description: Percentage (1-100) or fixed USD amount
          example: 20
        finalPrice:
          type: number
          description: Price after discount (USD)
          example: 23.20
        error:
          type: string
          description: Error message if invalid
          example: 'Code not found or expired'

    ThreeDayEligibilityResponse:
      type: object
      required:
        - eligible
      properties:
        eligible:
          type: boolean
          example: true
        reason:
          type: string
          nullable: true
          enum: [ALREADY_USED, ACTIVE_SUBSCRIPTION]
          description: Reason if not eligible
          example: null

    DLocalWebhookPayload:
      type: object
      description: dLocal webhook payload structure
      properties:
        id:
          type: string
          description: dLocal payment ID
        status:
          type: string
          description: Payment status from dLocal
        amount:
          type: number
        currency:
          type: string
        order_id:
          type: string
          description: Our internal order ID
        payment_method_id:
          type: string
        created_date:
          type: string
          format: date-time
        approved_date:
          type: string
          format: date-time
        failure_reason:
          type: string
        payer:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            document:
              type: string

    CronJobResponse:
      type: object
      required:
        - success
        - processed
      properties:
        success:
          type: boolean
          example: true
        processed:
          type: integer
          description: Number of records processed
          example: 15
        emailsSent:
          type: integer
          description: Number of emails sent (for reminder cron)
          example: 15
        downgraded:
          type: integer
          description: Number of users downgraded (for downgrade cron)
          example: 8

    FraudAlert:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [NEW, INVESTIGATING, RESOLVED, DISMISSED]
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        pattern:
          type: string
          enum: [MULTIPLE_3DAY_ATTEMPTS, RAPID_FAILURES, COUNTRY_HOPPING, UNUSUAL_METHODS]
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FraudAlertDetail:
      allOf:
        - $ref: '#/components/schemas/FraudAlert'
        - type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                email:
                  type: string
                name:
                  type: string
                createdAt:
                  type: string
                  format: date-time
            paymentHistory:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  amount:
                    type: number
                  currency:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
            investigationNotes:
              type: array
              items:
                type: object
                properties:
                  note:
                    type: string
                  createdBy:
                    type: string
                  createdAt:
                    type: string
                    format: date-time

    FraudAlertsListResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/FraudAlert'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    CreateFraudAlertRequest:
      type: object
      required:
        - userId
        - severity
        - pattern
        - description
      properties:
        userId:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        pattern:
          type: string
          enum: [MULTIPLE_3DAY_ATTEMPTS, RAPID_FAILURES, COUNTRY_HOPPING, UNUSUAL_METHODS]
        description:
          type: string

    UpdateFraudAlertRequest:
      type: object
      properties:
        status:
          type: string
          enum: [NEW, INVESTIGATING, RESOLVED, DISMISSED]
        note:
          type: string
          description: Investigation note to add

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: 'Unauthorized'
        message:
          type: string
          example: 'Additional error details'
        supportedCountries:
          type: array
          items:
            type: string
          example: ['IN', 'NG', 'PK', 'VN', 'ID', 'TH', 'ZA', 'TR']

    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: 'Validation error'
        details:
          type: object
          description: Field-level validation errors
          example:
            country: ['Invalid country code']
            paymentMethod: ['Payment method is required']
