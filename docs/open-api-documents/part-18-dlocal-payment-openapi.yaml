openapi: 3.0.3
info:
  title: Trading Alerts SaaS - dLocal Payment Integration API (Part 18)
  version: 3.0.0
  description: |
    dLocal Payment Integration API for Trading Alerts SaaS platform (Part 18).

    This API provides alternative payment processing for users in specific regions
    through dLocal, supporting local payment methods and currencies.

    **Generated:** 2026-07-17, Session 0-3, regenerated from live handlers —
    consolidated to remove duplicate coverage with part-12 and part-14.

    admin/fraud-alerts routes now solely documented in
    `part-14-admin-dashboard-openapi.yaml`; subscription cron jobs now solely in
    `part-12-ecommerce-billing-openapi.yaml` (Session 0-3 consolidation). This file
    now covers exactly the 8 `/api/payments/dlocal/*` and `/api/webhooks/dlocal`
    routes and is their sole authoritative spec.

    ## Corrections vs. the prior (2.0.0) version of this file
    The prior spec was written without re-reading the live handlers and had drifted
    significantly. Every path below was re-verified line-by-line against source.
    Notable fixes:
    - `create`: response uses `paymentUrl` (not `redirectUrl`); amount is a nested
      `{ local, usd, currency }` object (not a flat `amount`/`currency` pair); no
      `expiresAt` field exists in the live response; a `404 User not found` path was
      undocumented; `planDuration` (days) is returned alongside `planType`.
    - `{paymentId}`: `amount.local`/`amount.usd` are **strings** (Prisma Decimal
      `.toString()`), not numbers; field is `duration` (days), not `planDuration`;
      response includes `providerStatus` (live dLocal status) distinct from `status`
      (internal). The old spec's `orderId`/`dLocalStatus` nested object do not exist
      in the live response.
    - `exchange-rate`: real shape is `{ currency, rate, baseCurrency: "USD",
      timestamp }`, not `{ from, to, rate, timestamp }`.
    - `convert`: real shape is `{ localAmount, currency, exchangeRate, usdAmount,
      timestamp }`, not `{ amountUSD, currency, convertedAmount, exchangeRate }`.
    - `methods` (detailed=true): `PaymentMethodDetail` items are actually only
      `{ id, name, type }` — the live service never populates `logo` despite the
      shared `PaymentMethodInfo` type declaring it optional.
    - `check-three-day-eligibility`: **method is GET**, not POST (this route has no
      request body and reads only the session cookie — see below for a routing
      inconsistency finding). On internal error the handler still returns **200**
      `{ eligible: false, reason: "Unable to verify eligibility..." }` (fail-closed),
      not a 500.
    - `validate-discount`: real shape is `{ valid, discountPercent?, message? }` —
      the prior spec's `discountType`/`discountValue`/`finalPrice`/`code` fields do
      not exist anywhere in the live handler. Most validation failures return **200**
      with `valid: false` (not 400); only malformed body (`code`/`planType`
      missing/invalid) returns 400. A `429` rate-limit path (10/min per user,
      anti-enumeration) was previously undocumented.
    - `webhooks/dlocal`: the signature header is **`x-signature`**, not
      `x-dlocal-signature` as the prior spec claimed — verified against
      `verifyWebhookSignature()` in `lib/dlocal/dlocal-payment.service.ts`, which is
      the only place the header name is read (`request.headers.get('x-signature')`).

    ## Supported Regions (8 Countries)
    | Country       | Code | Currency | Payment Methods                     |
    | ------------- | ---- | -------- | ----------------------------------- |
    | India         | IN   | INR      | UPI, Paytm, PhonePe, Net Banking    |
    | Nigeria       | NG   | NGN      | Bank Transfer, USSD, Paystack       |
    | Pakistan      | PK   | PKR      | JazzCash, Easypaisa                 |
    | Vietnam       | VN   | VND      | VNPay, MoMo, ZaloPay                |
    | Indonesia     | ID   | IDR      | GoPay, OVO, Dana, ShopeePay         |
    | Thailand      | TH   | THB      | TrueMoney, Rabbit LINE Pay, Thai QR |
    | South Africa  | ZA   | ZAR      | Instant EFT, EFT                    |
    | Turkey        | TR   | TRY      | Bank Transfer, Local Cards          |

    ## Payment Plans
    - **3-Day Plan**: $1.99 USD default (`PRICING.THREE_DAY_USD`, may be overridden by
      SystemConfig elsewhere), one-time, lifetime limit of 1 per account
    - **Monthly Plan**: $29.00 USD default (`PRICING.MONTHLY_USD`), discount codes
      allowed

    ## Authentication model (mixed — read each path's `security` carefully)
    - **Session-gated** (`sessionAuth`, via the `next-auth.session-token` cookie):
      `POST /api/payments/dlocal/create`, `GET /api/payments/dlocal/{paymentId}`,
      `GET /api/payments/dlocal/check-three-day-eligibility`,
      `POST /api/payments/dlocal/validate-discount`.
    - **Fully unauthenticated** (`security: []`, no session/CSRF check of any kind —
      genuinely public): `GET /api/payments/dlocal/methods`,
      `GET /api/payments/dlocal/exchange-rate`, `GET /api/payments/dlocal/convert`.
    - **Signature-verified, not session-based** (`security: []`, externally triggered
      by dLocal): `POST /api/webhooks/dlocal`. Authenticity comes from an HMAC-SHA256
      signature in the `x-signature` header, not a session or API key — see that
      path's description.

    ## Finding: inconsistent `getServerSession()` usage
    `GET /api/payments/dlocal/check-three-day-eligibility` calls
    `getServerSession()` **with no `authOptions` argument**, unlike every other
    session-gated route in this file (`create`, `{paymentId}`, `validate-discount`),
    which all call `getServerSession(authOptions)`. This is a live inconsistency in
    `app/api/payments/dlocal/check-three-day-eligibility/route.ts` — flagged here,
    not fixed (out of scope for a documentation session).

  contact:
    name: API Support
    email: support@tradingalerts.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.tradingalerts.example.com
    description: Production server

tags:
  - name: Payments
    description: Payment creation and status
  - name: Payment Methods
    description: Available payment methods by country
  - name: Currency
    description: Currency conversion and exchange rates
  - name: Eligibility
    description: 3-day plan eligibility checks
  - name: Discount
    description: Discount code validation
  - name: Webhooks
    description: dLocal webhook handler

paths:
  /api/payments/dlocal/create:
    post:
      tags: [Payments]
      summary: Create a dLocal payment for a subscription plan
      description: |
        Creates a payment record, then calls dLocal to create the actual payment and
        returns a redirect URL for the user to complete checkout.

        **Process (matches `app/api/payments/dlocal/create/route.ts` exactly):**
        1. Require an authenticated session (`getServerSession(authOptions)`).
        2. Validate body against the zod schema (`createPaymentSchema`).
        3. Validate `paymentMethod` is valid for `country` (`isValidPaymentMethod`).
        4. Load the user; 404 if missing.
        5. 403 if user is already `tier: 'PRO'` with an `ACTIVE` subscription.
        6. 403 if `planType: 'THREE_DAY'` and `user.hasUsedThreeDayPlan`.
        7. 400 if a `discountCode` is supplied with `planType: 'THREE_DAY'`
           (discounts are MONTHLY-only).
        8. If `discountCode` + `MONTHLY`: look up an `ACTIVE`, unexpired
           `AffiliateCode` with an `ACTIVE` affiliate profile; 400
           `'Invalid or expired discount code'` if not found/inactive.
        9. Compute `chargeUsd` (gross minus discount), convert to local currency via
           `convertUSDToLocal`, create the `Payment` row (status `PENDING`), call
           dLocal's `createPayment`, then update the row with the returned
           `providerPaymentId`.

        **Implementation:** `app/api/payments/dlocal/create/route.ts` (POST)
      operationId: createDLocalPayment
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              threeDayPlan:
                summary: 3-day plan (India)
                value:
                  country: IN
                  paymentMethod: UPI
                  planType: THREE_DAY
                  currency: INR
              monthlyPlanWithDiscount:
                summary: Monthly plan with discount code
                value:
                  country: NG
                  paymentMethod: Bank Transfer
                  planType: MONTHLY
                  currency: NGN
                  discountCode: SAVE20
      responses:
        '200':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
              example:
                paymentId: mock-payment-1737100800000
                orderId: order-usr_abc123-1737100800000
                paymentUrl: https://sandbox.dlocal.com/pay/mock-1737100800000
                status: PENDING
                amount:
                  local: 166.24
                  usd: 1.99
                  currency: INR
                exchangeRate: 83.54
                planType: THREE_DAY
                planDuration: 3
        '400':
          description: Validation error, invalid payment method, invalid discount, or discount used with a 3-day plan
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                zodValidation:
                  summary: Zod schema validation failure
                  value:
                    error: Validation error
                    details:
                      country:
                        [
                          "Invalid enum value. Expected 'IN' | 'NG' | 'PK' | 'VN' | 'ID' | 'TH' | 'ZA' | 'TR'",
                        ]
                invalidPaymentMethod:
                  summary: Payment method not valid for country
                  value:
                    error: Invalid payment method for this country
                    country: IN
                    paymentMethod: INVALID_METHOD
                discountOnThreeDay:
                  summary: Discount code supplied for THREE_DAY plan
                  value:
                    error: Discount codes are only valid for monthly plans
                invalidDiscountCode:
                  summary: Discount code not found, expired, or affiliate inactive
                  value:
                    error: Invalid or expired discount code
        '401':
          description: Unauthorized - no session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '403':
          description: Forbidden - already subscribed, or 3-day plan already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadySubscribed:
                  summary: Already has an active PRO subscription
                  value:
                    error: You already have an active subscription
                threeDayAlreadyUsed:
                  summary: 3-day plan already used (lifetime limit)
                  value:
                    error: You have already used the 3-day plan. Please choose the monthly plan.
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: User not found
        '500':
          description: Internal server error (payment creation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to create payment

  /api/payments/dlocal/{paymentId}:
    get:
      tags: [Payments]
      summary: Get the status of a dLocal payment
      description: |
        Looks up a payment by `providerPaymentId` (scoped to `provider: 'DLOCAL'`),
        verifies the requesting user owns it, then attempts a live status lookup
        against dLocal (falling back to the stored `providerStatus` if that call
        throws).

        **Implementation:** `app/api/payments/dlocal/[paymentId]/route.ts` (GET)
      operationId: getDLocalPaymentStatus
      security:
        - sessionAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          description: dLocal provider payment ID (`Payment.providerPaymentId`)
          schema:
            type: string
          example: mock-payment-1737100800000
      responses:
        '200':
          description: Payment status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
              example:
                id: clx_internal_payment_id
                paymentId: mock-payment-1737100800000
                status: COMPLETED
                providerStatus: PAID
                amount:
                  local: '166.24'
                  usd: '1.99'
                  currency: INR
                country: IN
                paymentMethod: UPI
                planType: THREE_DAY
                duration: 3
                createdAt: '2026-07-17T10:00:00.000Z'
                updatedAt: '2026-07-17T10:05:00.000Z'
        '400':
          description: Payment ID missing (unreachable via the dynamic route segment in practice, but coded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Payment ID is required
        '401':
          description: Unauthorized - no session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '403':
          description: Access denied - payment belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Access denied
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Payment not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to get payment status

  /api/payments/dlocal/methods:
    get:
      tags: [Payment Methods]
      summary: Get available dLocal payment methods for a country
      description: |
        **Fully unauthenticated** — no session, cookie, or CSRF check at all
        (confirmed: the handler never calls `getServerSession`). Public by design so
        the pricing/checkout page can render methods before login.

        Returns a simple string list by default, or an array of
        `{ id, name, type }` objects when `detailed=true`.

        **Implementation:** `app/api/payments/dlocal/methods/route.ts` (GET)
      operationId: getDLocalPaymentMethods
      security: []
      parameters:
        - name: country
          in: query
          required: true
          description: ISO 2-letter country code, validated via `isDLocalCountry`
          schema:
            type: string
            enum: [IN, NG, PK, VN, ID, TH, ZA, TR]
          example: IN
        - name: detailed
          in: query
          required: false
          description: 'When exactly the string `"true"`, returns detailed method objects instead of plain strings'
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: Payment methods retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodsResponse'
              examples:
                simple:
                  summary: Simple list (default)
                  value:
                    country: IN
                    methods: [UPI, Paytm, PhonePe, Net Banking]
                detailed:
                  summary: 'detailed=true'
                  value:
                    country: IN
                    methods:
                      - id: upi
                        name: UPI
                        type: wallet
                      - id: paytm
                        name: Paytm
                        type: wallet
                      - id: phonepe
                        name: PhonePe
                        type: wallet
                      - id: net_banking
                        name: Net Banking
                        type: bank
        '400':
          description: Country parameter missing or unsupported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: country not provided
                  value:
                    error: Country parameter is required
                unsupported:
                  summary: country not in the supported list
                  value:
                    error: Invalid or unsupported country
                    supportedCountries: [IN, NG, PK, VN, ID, TH, ZA, TR]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to get payment methods

  /api/payments/dlocal/exchange-rate:
    get:
      tags: [Currency]
      summary: Get the current USD to local-currency exchange rate
      description: |
        **Fully unauthenticated** — no session/CSRF check at all (confirmed: the
        handler never calls `getServerSession`). Genuinely public.

        Rate source: `exchangerate-api.com`, cached in-process for 1 hour with a
        static per-currency fallback table if the upstream call fails
        (`lib/dlocal/currency-converter.service.ts`).

        **Implementation:** `app/api/payments/dlocal/exchange-rate/route.ts` (GET)
      operationId: getDLocalExchangeRate
      security: []
      parameters:
        - name: currency
          in: query
          required: true
          description: Target 3-letter currency code
          schema:
            type: string
            enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: INR
      responses:
        '200':
          description: Exchange rate retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
              example:
                currency: INR
                rate: 83.54
                baseCurrency: USD
                timestamp: '2026-07-17T10:00:00.000Z'
        '400':
          description: Currency parameter missing or unsupported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  summary: currency not provided
                  value:
                    error: Currency parameter is required
                unsupported:
                  summary: currency not in the supported list
                  value:
                    error: Invalid or unsupported currency
                    supportedCurrencies:
                      [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to get exchange rate

  /api/payments/dlocal/convert:
    get:
      tags: [Currency]
      summary: Convert a USD amount to local currency
      description: |
        **Fully unauthenticated** — no session/CSRF check at all (confirmed: the
        handler never calls `getServerSession`). Genuinely public; used to render
        local-currency pricing on the checkout page before login.

        **Implementation:** `app/api/payments/dlocal/convert/route.ts` (GET)
      operationId: convertDLocalCurrency
      security: []
      parameters:
        - name: amount
          in: query
          required: true
          description: USD amount to convert; must parse to a positive number (`parseFloat`)
          schema:
            type: number
            exclusiveMinimum: 0
          example: 29
        - name: currency
          in: query
          required: true
          description: Target 3-letter currency code
          schema:
            type: string
            enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: INR
      responses:
        '200':
          description: Conversion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
              example:
                localAmount: 2422.66
                currency: INR
                exchangeRate: 83.54
                usdAmount: 29
                timestamp: '2026-07-17T10:00:00.000Z'
        '400':
          description: Missing or invalid amount/currency parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingAmount:
                  summary: amount not provided
                  value:
                    error: Amount parameter is required
                invalidAmount:
                  summary: amount is not a positive number
                  value:
                    error: Amount must be a positive number
                missingCurrency:
                  summary: currency not provided
                  value:
                    error: Currency parameter is required
                unsupportedCurrency:
                  summary: currency not in the supported list
                  value:
                    error: Invalid or unsupported currency
                    supportedCurrencies:
                      [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to convert currency

  /api/payments/dlocal/check-three-day-eligibility:
    get:
      tags: [Eligibility]
      summary: Check whether the current user can purchase the 3-day plan
      description: |
        **Method correction:** this is a **GET** request (no body) — a prior draft
        of this order's task list referred to it as POST, but the live handler only
        exports `GET`.

        **Auth inconsistency finding:** unlike every other session-gated route in
        this file, this handler calls `getServerSession()` **without the
        `authOptions` argument** (`app/api/payments/dlocal/check-three-day-eligibility/route.ts`,
        line ~27). `create`, `{paymentId}`, and `validate-discount` all pass
        `getServerSession(authOptions)`. Documented here as-is per instructions, not
        fixed.

        Delegates to `canPurchaseThreeDayPlan()`
        (`lib/dlocal/three-day-validator.service.ts`), which checks (1) the user
        hasn't already used the 3-day plan (lifetime) and (2) has no active
        subscription. **Fail-closed on error:** if the eligibility check throws, the
        handler still responds **200** with `eligible: false` and a generic reason
        (never a 500).

        **Implementation:** `app/api/payments/dlocal/check-three-day-eligibility/route.ts` (GET)
      operationId: checkThreeDayEligibility
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Eligibility check result (also returned on internal error, fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDayEligibilityResponse'
              examples:
                eligible:
                  summary: User is eligible
                  value:
                    eligible: true
                    details:
                      hasUsedThreeDayPlan: false
                      hasActiveSubscription: false
                alreadyUsed:
                  summary: Already used the 3-day plan
                  value:
                    eligible: false
                    reason: You have already used the 3-day plan. This offer is available only once per account.
                    details:
                      hasUsedThreeDayPlan: true
                      hasActiveSubscription: false
                activeSubscription:
                  summary: Has an active subscription already
                  value:
                    eligible: false
                    reason: You already have an active subscription. The 3-day plan is only available for users without an active subscription.
                    details:
                      hasUsedThreeDayPlan: false
                      hasActiveSubscription: true
                errorFailedClosed:
                  summary: Internal error - fails closed with 200, not 500
                  value:
                    eligible: false
                    reason: Unable to verify eligibility. Please try again.
        '401':
          description: Authentication required - no session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required

  /api/payments/dlocal/validate-discount:
    post:
      tags: [Discount]
      summary: Validate a discount code for the monthly plan
      description: |
        Looks up an `ACTIVE` `AffiliateCode` by normalized (uppercased, trimmed)
        code and requires its linked affiliate profile to also be `ACTIVE`. 3-day
        plans never support discounts.

        **Rate limited:** 10 attempts/minute per authenticated user
        (`ratelimit:discount-validate` prefix) to deter code enumeration; exceeding
        it returns `429`.

        Most validation outcomes (code not found, affiliate inactive, wrong plan
        type) are returned as **200** with `valid: false` — only a structurally
        malformed body (`code` missing/non-string, or `planType` missing/invalid)
        returns `400`.

        **Implementation:** `app/api/payments/dlocal/validate-discount/route.ts` (POST)
      operationId: validateDLocalDiscountCode
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDiscountRequest'
            example:
              code: SAVE20
              planType: MONTHLY
      responses:
        '200':
          description: Validation result (valid or invalid — see description)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDiscountResponse'
              examples:
                valid:
                  summary: Valid, active discount code
                  value:
                    valid: true
                    discountPercent: 20
                    message: 20% discount will be applied
                notFound:
                  summary: Code not found or inactive
                  value:
                    valid: false
                    message: Invalid or expired discount code
                affiliateInactive:
                  summary: Code exists but its affiliate is no longer active
                  value:
                    valid: false
                    message: This discount code is no longer valid
                threeDayPlan:
                  summary: Discounts are not available for the 3-day plan
                  value:
                    valid: false
                    message: Discount codes are not available for the 3-day plan
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDiscountResponse'
              examples:
                missingCode:
                  summary: code missing or not a string
                  value:
                    valid: false
                    message: Discount code is required
                invalidPlanType:
                  summary: planType missing or not THREE_DAY/MONTHLY
                  value:
                    valid: false
                    message: Invalid plan type
        '401':
          description: Authentication required - no session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Authentication required
        '429':
          description: Rate limited - too many validation attempts (10/min per user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDiscountResponse'
              example:
                valid: false
                message: Too many attempts. Please try again later.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDiscountResponse'
              example:
                valid: false
                message: Failed to validate discount code

  /api/webhooks/dlocal:
    post:
      tags: [Webhooks]
      summary: dLocal payment webhook (payment lifecycle events)
      description: |
        **Not session-based — internal-only, externally triggered by dLocal.**
        Authenticity is established purely by an HMAC-SHA256 signature over the
        *raw* request body, compared against `x-signature` (verified in
        `verifyWebhookSignature()`, `lib/dlocal/dlocal-payment.service.ts`):
        `hex(HMAC-SHA256(rawBody, DLOCAL_WEBHOOK_SECRET)) === headers['x-signature']`.
        There is no session cookie or CSRF check, and none is applicable — this
        endpoint is not called by the browser.

        **Status mapping** (`mapDLocalStatus()`):
        | dLocal status | Internal status |
        | ------------- | ---------------- |
        | PENDING       | PENDING          |
        | AUTHORIZED    | PENDING          |
        | VERIFIED      | PENDING          |
        | PAID          | COMPLETED        |
        | COMPLETED     | COMPLETED        |
        | REJECTED      | FAILED           |
        | EXPIRED       | FAILED           |
        | CANCELLED     | CANCELLED        |
        | REFUNDED      | REFUNDED         |
        | *(unknown)*   | PENDING (default) |

        **On `COMPLETED`:** in a single transaction, marks the `Payment` row
        `COMPLETED`, upgrades the user to `tier: 'PRO'`, creates/updates the
        `Subscription` (status `ACTIVE`, `expiresAt` = now + 3 days for `THREE_DAY`
        or + 30 days for `MONTHLY`), links the payment to the subscription; then
        (outside the transaction) marks the 3-day plan used if applicable, processes
        an affiliate commission via `processAffiliateConversion` if a
        `discountCode` was used on a `MONTHLY` plan (best-effort — failures here
        never fail the webhook), and creates a `SUBSCRIPTION`-type notification.

        **On `FAILED`:** marks the payment `FAILED` with `failureReason`, creates a
        `PAYMENT`-type notification.

        **On `CANCELLED`:** marks the payment `CANCELLED`, creates a `PAYMENT`-type
        notification.

        If no matching `Payment` row is found for the webhook's `id`
        (`providerPaymentId`), the handler still returns **200** (with a `warning`
        field) specifically to prevent dLocal from retrying a webhook it can never
        resolve.

        **Implementation:** `app/api/webhooks/dlocal/route.ts` (POST)
      operationId: handleDLocalWebhook
      security: []
      parameters:
        - name: x-signature
          in: header
          required: true
          description: HMAC-SHA256 signature of the raw request body, hex-encoded, keyed with `DLOCAL_WEBHOOK_SECRET`
          schema:
            type: string
          example: 5f4dcc3b5aa765d61d8327deb882cf99...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DLocalWebhookPayload'
            example:
              id: mock-payment-1737100800000
              status: PAID
              amount: 1.99
              currency: INR
              order_id: order-usr_abc123-1737100800000
              payment_method_id: UPI
              created_date: '2026-07-17T10:00:00.000Z'
              approved_date: '2026-07-17T10:04:00.000Z'
              payer:
                name: Jane Doe
                email: jane@example.com
      responses:
        '200':
          description: Webhook processed (also returned when the payment record is unknown, to stop dLocal retries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
              examples:
                processed:
                  summary: Payment record found and processed
                  value:
                    received: true
                unknownPayment:
                  summary: No matching Payment row - still 200 so dLocal stops retrying
                  value:
                    received: true
                    warning: Payment not found
        '400':
          description: Invalid signature or unparseable JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badSignature:
                  summary: Signature does not match computed HMAC
                  value:
                    error: Invalid signature
                badJson:
                  summary: Body is not valid JSON
                  value:
                    error: Invalid JSON payload
        '500':
          description: Webhook processing error - dLocal will retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Webhook processing failed

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth.js session cookie. Only required on `create`, `{paymentId}`,
        `check-three-day-eligibility`, and `validate-discount` — see the
        authentication-model note in this file's top-level description for the
        routes that are genuinely unauthenticated or signature-verified instead.

  schemas:
    CreatePaymentRequest:
      type: object
      required: [country, paymentMethod, planType, currency]
      description: Matches `createPaymentSchema` (zod) in `app/api/payments/dlocal/create/route.ts` exactly.
      properties:
        country:
          type: string
          enum: [IN, NG, PK, VN, ID, TH, ZA, TR]
          example: IN
        paymentMethod:
          type: string
          minLength: 1
          description: Must be valid for the given country (`isValidPaymentMethod`)
          example: UPI
        planType:
          type: string
          enum: [THREE_DAY, MONTHLY]
          example: THREE_DAY
        currency:
          type: string
          enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: INR
        discountCode:
          type: string
          description: Optional; only honored when `planType` is `MONTHLY` (400 if combined with `THREE_DAY`)
          example: SAVE20

    CreatePaymentResponse:
      type: object
      required:
        [
          paymentId,
          orderId,
          paymentUrl,
          status,
          amount,
          exchangeRate,
          planType,
          planDuration,
        ]
      properties:
        paymentId:
          type: string
          description: dLocal-side payment ID (`DLocalPaymentResponse.paymentId`)
          example: mock-payment-1737100800000
        orderId:
          type: string
          description: 'Internal order ID, format `order-{userId}-{timestamp}`'
          example: order-usr_abc123-1737100800000
        paymentUrl:
          type: string
          format: uri
          description: URL to redirect the user to complete payment
          example: https://sandbox.dlocal.com/pay/mock-1737100800000
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          description: Always `PENDING` at creation time in the current implementation
          example: PENDING
        amount:
          type: object
          required: [local, usd, currency]
          properties:
            local:
              type: number
              description: Amount in local currency, after any discount
              example: 166.24
            usd:
              type: number
              description: Gross USD list price for the plan (before discount)
              example: 1.99
            currency:
              type: string
              example: INR
        exchangeRate:
          type: number
          example: 83.54
        planType:
          type: string
          enum: [THREE_DAY, MONTHLY]
          example: THREE_DAY
        planDuration:
          type: integer
          description: Plan duration in days (3 or 30)
          example: 3

    PaymentStatusResponse:
      type: object
      required:
        [
          id,
          paymentId,
          status,
          providerStatus,
          amount,
          country,
          paymentMethod,
          planType,
          duration,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          description: Internal `Payment.id`
          example: clx_internal_payment_id
        paymentId:
          type: string
          description: '`Payment.providerPaymentId`'
          example: mock-payment-1737100800000
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, CANCELLED, REFUNDED]
          description: Internal status stored on the `Payment` row
          example: COMPLETED
        providerStatus:
          type: string
          description: Live status string from dLocal (falls back to the stored `providerStatus` if the live call throws)
          example: PAID
        amount:
          type: object
          required: [local, usd, currency]
          description: Amounts are strings (Prisma `Decimal.toString()`), not numbers
          properties:
            local:
              type: string
              example: '166.24'
            usd:
              type: string
              example: '1.99'
            currency:
              type: string
              example: INR
        country:
          type: string
          nullable: true
          example: IN
        paymentMethod:
          type: string
          nullable: true
          example: UPI
        planType:
          type: string
          nullable: true
          enum: [THREE_DAY, MONTHLY]
          example: THREE_DAY
        duration:
          type: integer
          description: Plan duration in days, as stored on the payment record
          example: 3
        createdAt:
          type: string
          format: date-time
          example: '2026-07-17T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-17T10:05:00.000Z'

    PaymentMethodsResponse:
      type: object
      required: [country, methods]
      properties:
        country:
          type: string
          enum: [IN, NG, PK, VN, ID, TH, ZA, TR]
          example: IN
        methods:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/PaymentMethodDetail'
          description: Array of plain strings by default, or `PaymentMethodDetail` objects when `?detailed=true`
          example: [UPI, Paytm, PhonePe, Net Banking]

    PaymentMethodDetail:
      type: object
      required: [id, name, type]
      description: Returned only when `?detailed=true`. `logo` is declared on the shared `PaymentMethodInfo` type but never populated by the live service - omitted here.
      properties:
        id:
          type: string
          description: 'Slugified method name (`method.toLowerCase().replace(/\s+/g, "_")`)'
          example: net_banking
        name:
          type: string
          description: Original method label
          example: Net Banking
        type:
          type: string
          enum: [bank, wallet, qr, card, other]
          example: bank

    ExchangeRateResponse:
      type: object
      required: [currency, rate, baseCurrency, timestamp]
      properties:
        currency:
          type: string
          enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: INR
        rate:
          type: number
          description: Units of `currency` per 1 unit of `baseCurrency`
          example: 83.54
        baseCurrency:
          type: string
          enum: [USD]
          example: USD
        timestamp:
          type: string
          format: date-time
          description: Response generation time (not the rate's fetch time)
          example: '2026-07-17T10:00:00.000Z'

    ConvertResponse:
      type: object
      required: [localAmount, currency, exchangeRate, usdAmount, timestamp]
      properties:
        localAmount:
          type: number
          example: 2422.66
        currency:
          type: string
          enum: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
          example: INR
        exchangeRate:
          type: number
          example: 83.54
        usdAmount:
          type: number
          example: 29
        timestamp:
          type: string
          format: date-time
          example: '2026-07-17T10:00:00.000Z'

    ThreeDayEligibilityResponse:
      type: object
      required: [eligible]
      properties:
        eligible:
          type: boolean
          example: true
        reason:
          type: string
          description: Present only when `eligible` is `false` (key is omitted entirely, not null, when eligible)
          example: You have already used the 3-day plan. This offer is available only once per account.
        details:
          type: object
          description: Omitted on the "user not found" and fail-closed error paths
          properties:
            hasUsedThreeDayPlan:
              type: boolean
            hasActiveSubscription:
              type: boolean

    ValidateDiscountRequest:
      type: object
      required: [code, planType]
      properties:
        code:
          type: string
          example: SAVE20
        planType:
          type: string
          enum: [THREE_DAY, MONTHLY]
          description: Discounts are only ever applied for MONTHLY; THREE_DAY always returns `valid:false`
          example: MONTHLY

    ValidateDiscountResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          example: true
        discountPercent:
          type: number
          description: Present only on a successful validation; snapshotted percent from `AffiliateCode.discountPercent`
          example: 20
        message:
          type: string
          description: Human-readable outcome message, present on nearly every response variant
          example: 20% discount will be applied

    DLocalWebhookPayload:
      type: object
      required:
        [
          id,
          status,
          amount,
          currency,
          order_id,
          payment_method_id,
          created_date,
        ]
      description: 'Shape of `types/dlocal.ts` `DLocalWebhookPayload`, as sent by dLocal'
      properties:
        id:
          type: string
          description: dLocal payment ID, matched against `Payment.providerPaymentId`
          example: mock-payment-1737100800000
        status:
          type: string
          description: "Raw dLocal status string - see the status-mapping table in this path's description"
          example: PAID
        amount:
          type: number
          example: 1.99
        currency:
          type: string
          example: INR
        order_id:
          type: string
          example: order-usr_abc123-1737100800000
        payment_method_id:
          type: string
          example: UPI
        created_date:
          type: string
          format: date-time
          example: '2026-07-17T10:00:00.000Z'
        approved_date:
          type: string
          format: date-time
          example: '2026-07-17T10:04:00.000Z'
        failure_reason:
          type: string
          example: Insufficient funds
        payer:
          type: object
          properties:
            name:
              type: string
              example: Jane Doe
            email:
              type: string
              example: jane@example.com
            document:
              type: string
              example: '123456789'

    WebhookResponse:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          example: true
        warning:
          type: string
          description: Present only when no matching `Payment` record was found
          example: Payment not found

    ErrorResponse:
      type: object
      required: [error]
      description: Generic error shape. Some routes attach extra context fields alongside `error` - see per-path examples.
      properties:
        error:
          type: string
          example: Unauthorized
        supportedCountries:
          type: array
          items:
            type: string
          example: [IN, NG, PK, VN, ID, TH, ZA, TR]
        supportedCurrencies:
          type: array
          items:
            type: string
          example: [INR, NGN, PKR, VND, IDR, THB, ZAR, TRY]
        country:
          type: string
          description: Echoed back on the "invalid payment method for country" error
        paymentMethod:
          type: string
          description: Echoed back on the "invalid payment method for country" error

    ValidationErrorResponse:
      type: object
      required: [error, details]
      properties:
        error:
          type: string
          example: Validation error
        details:
          type: object
          description: 'zod `.flatten().fieldErrors` - keys are the offending field names, values are arrays of messages'
          additionalProperties:
            type: array
            items:
              type: string
          example:
            country:
              [
                "Invalid enum value. Expected 'IN' | 'NG' | 'PK' | 'VN' | 'ID' | 'TH' | 'ZA' | 'TR'",
              ]
