  # ============================================
  # METADATA ENDPOINTS
  # ============================================
  /api/symbols:
    get:
      tags:
        - Metadata
      summary: Get accessible symbols by tier
      description: |
        Returns list of symbols accessible by the requesting tier.
        Tier is determined from X-User-Tier header.
      parameters:
        - $ref: '#/components/parameters/UserTierHeader'
      responses:
        '200':
          description: List of accessible symbols
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolsResponse'
              examples:
                free_tier:
                  summary: FREE tier response
                  value:
                    success: true
                    tier: FREE
                    symbols:
                      - BTCUSD
                      - EURUSD
                      - USDJPY
                      - US30
                      - XAUUSD
                pro_tier:
                  summary: PRO tier response
                  value:
                    success: true
                    tier: PRO
                    symbols:
                      - AUDJPY
                      - AUDUSD
                      - BTCUSD
                      - ETHUSD
                      - EURUSD
                      - GBPJPY
                      - GBPUSD
                      - NDX100
                      - NZDUSD
                      - US30
                      - USDCAD
                      - USDCHF
                      - USDJPY
                      - XAGUSD
                      - XAUUSD
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/timeframes:
    get:
      tags:
        - Metadata
      summary: Get available timeframes
      description: Returns list of all supported timeframes (V7 - 9 timeframes)
      parameters:
        - $ref: '#/components/parameters/UserTierHeader'
      responses:
        '200':
          description: List of timeframes (tier-filtered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeframesResponse'
              examples:
                free_tier:
                  summary: FREE tier timeframes
                  value:
                    success: true
                    tier: FREE
                    timeframes:
                      - H1
                      - H4
                      - D1
                pro_tier:
                  summary: PRO tier timeframes
                  value:
                    success: true
                    tier: PRO
                    timeframes:
                      - M5
                      - M15
                      - M30
                      - H1
                      - H2
                      - H4
                      - H8
                      - H12
                      - D1
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # OHLCV DATA ENDPOINT (MAIN)
  # ============================================
  /api/indicators/{symbol}/{timeframe}:
    get:
      tags:
        - Data
      summary: Get OHLCV data from MT5
      description: |
        Retrieves raw OHLCV (Open, High, Low, Close, Volume) candlestick data from MT5 terminal.

        **IMPORTANT: OHLCV Data Only**
        - This endpoint ONLY returns raw candlestick data
        - NO custom indicators (fractals, trendlines, moving averages, etc.)
        - MT5 Python API's `iCustom()` is unreliable and not used
        - For indicators, use Part 20 (SQLite-Sync Script) which processes MQL5 EA exports

        **Access Control:**
        - Validates tier access to BOTH symbol AND timeframe before reading data
        - FREE tier: 5 symbols (BTCUSD, EURUSD, USDJPY, US30, XAUUSD) × 3 timeframes (H1, H4, D1)
        - PRO tier: 15 symbols × 9 timeframes (M5, M15, M30, H1, H2, H4, H8, H12, D1)
        - Timeframe restrictions: M5, H8, and H12 are PRO-only

        **Data Source:**
        - OHLCV: Direct from MT5 terminal via `mt5.copy_rates_from_pos()`
        - Symbol resolver handles broker-specific naming (e.g., Eightcap .i suffix)

        **Requirements:**
        - MT5 terminal must be running
        - Symbol must be available on broker
        - Terminal must be connected
      parameters:
        - $ref: '#/components/parameters/SymbolPath'
        - $ref: '#/components/parameters/TimeframePath'
        - $ref: '#/components/parameters/BarsQuery'
        - $ref: '#/components/parameters/UserTierHeader'
      responses:
        '200':
          description: OHLCV data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OHLCVDataResponse'
              example:
                success: true
                data:
                  symbol: XAUUSD
                  timeframe: H1
                  bars: 1000
                  ohlcv:
                    - time: 1699632000
                      open: 1985.50
                      high: 1987.25
                      low: 1984.75
                      close: 1986.00
                      volume: 1234
                    - time: 1699628400
                      open: 1984.25
                      high: 1986.00
                      low: 1983.50
                      close: 1985.50
                      volume: 1156
                  metadata:
                    timestamp: 1699632000
                    bars_requested: 1000
                    bars_received: 1000
                    tier: PRO
                    terminal_id: MT5_15
        '400':
          description: Invalid symbol or timeframe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Invalid timeframe M1. Valid options M5, M15, M30, H1, H2, H4, H8, H12, D1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Symbol or timeframe not accessible for tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedResponse'
              examples:
                free_tier_symbol_denied:
                  summary: FREE tier accessing PRO-only symbol
                  value:
                    success: false
                    error: FREE tier cannot access AUDJPY
                    tier: FREE
                    accessible_symbols:
                      - BTCUSD
                      - EURUSD
                      - USDJPY
                      - US30
                      - XAUUSD
                    upgrade_required: true
                free_tier_timeframe_denied:
                  summary: FREE tier accessing PRO-only timeframe
                  value:
                    success: false
                    error: FREE tier cannot access M5 timeframe
                    tier: FREE
                    accessible_timeframes:
                      - H1
                      - H4
                      - D1
                    upgrade_required: true
        '500':
          description: MT5 error or data retrieval failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                symbol_not_available:
                  summary: Symbol not available on broker
                  value:
                    success: false
                    error: Failed to fetch OHLCV data for BTCUSD H1. Check that symbol exists in MT5 terminal.
        '503':
          description: MT5 terminal disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: MT5 terminal for XAUUSD is disconnected

  # ============================================
  # ADMIN ENDPOINTS (Terminal Management)
  # ============================================
  /api/admin/terminals/health:
    get:
      tags:
        - Admin
      summary: Get health status of all MT5 terminals (Admin only)
      description: |
        Retrieve detailed health status for all 15 MT5 terminals.
        Includes admin-specific metrics like uptime percentage, reconnect counts, and error history.

        **Authentication:** Requires admin API key via X-Admin-API-Key header
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Terminal health data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthResponse'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/terminals/{terminal_id}/restart:
    post:
      tags:
        - Admin
      summary: Restart a specific MT5 terminal (Admin only)
      description: |
        Restart/reconnect a specific MT5 terminal by its ID.
        Use this when a terminal is experiencing connection issues.

        **Authentication:** Requires admin API key
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: terminal_id
          in: path
          required: true
          schema:
            type: string
            example: MT5_15
          description: Terminal ID (MT5_01 through MT5_15)
      responses:
        '200':
          description: Terminal restarted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalRestartResponse'
        '404':
          description: Terminal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin access required

  /api/admin/terminals/restart-all:
    post:
      tags:
        - Admin
      summary: Restart ALL MT5 terminals (Admin only - Use with caution)
      description: |
        Restart/reconnect ALL 15 MT5 terminals simultaneously.

        **WARNING:** This will temporarily interrupt service for all users.
        Only use during maintenance windows or critical outages.

        **Authentication:** Requires admin API key
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Terminals restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartAllResponse'
        '403':
          description: Admin access required

  /api/admin/terminals/{terminal_id}/logs:
    get:
      tags:
        - Admin
      summary: Get recent logs for a specific terminal (Admin only)
      description: |
        Retrieve recent log entries for a specific MT5 terminal.
        Useful for debugging connection issues.

        **Authentication:** Requires admin API key
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: terminal_id
          in: path
          required: true
          schema:
            type: string
            example: MT5_15
          description: Terminal ID (MT5_01 through MT5_15)
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Number of log lines to return
      responses:
        '200':
          description: Log entries retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalLogsResponse'
        '404':
          description: Terminal not found
        '403':
          description: Admin access required

  /api/admin/terminals/stats:
    get:
      tags:
        - Admin
      summary: Get aggregate statistics for all terminals (Admin only)
      description: |
        Retrieve aggregate statistics across all MT5 terminals.
        Includes overall uptime, reconnect counts, and most problematic terminals.

        **Authentication:** Requires admin API key
      security:
        - AdminApiKeyAuth: []
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalStatsResponse'
        '403':
          description: Admin access required

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authenticating requests from Next.js backend.
        This service should NOT be exposed publicly - only accessed by Next.js API routes.

    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: |
        Admin API key for authenticating administrative requests.
        Used for MT5 terminal management endpoints.
        Separate from regular API key for enhanced security.

  parameters:
    SymbolPath:
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Symbol'
      description: Trading symbol
      example: XAUUSD

    TimeframePath:
      name: timeframe
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Timeframe'
      description: Chart timeframe
      example: H1

    BarsQuery:
      name: bars
      in: query
      required: false
      schema:
        type: integer
        minimum: 100
        maximum: 5000
        default: 1000
      description: Number of historical bars to retrieve
      example: 1000

    UserTierHeader:
      name: X-User-Tier
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/UserTier'
      description: |
        User tier from Next.js session. Used for access control validation.
        Defaults to FREE if not provided.
      example: PRO

  schemas:
    # ============================================
    # ENUMS
    # ============================================
    UserTier:
      type: string
      enum:
        - FREE
        - PRO
      description: |
        User subscription tier for access control:
        - FREE: 5 symbols (BTCUSD, EURUSD, USDJPY, US30, XAUUSD) × 3 timeframes (H1, H4, D1)
        - PRO: 15 symbols × 9 timeframes (M5, M15, M30, H1, H2, H4, H8, H12, D1)

    Symbol:
      type: string
      enum:
        - AUDJPY # Forex
        - AUDUSD
        - BTCUSD
        - ETHUSD
        - EURUSD
        - GBPJPY # Forex
        - GBPUSD
        - NDX100
        - NZDUSD # Forex
        - US30
        - USDCAD # Forex
        - USDCHF # Forex
        - USDJPY
        - XAGUSD
        - XAUUSD
      description: |
        Trading symbols available on platform (15 total).
        Access is tier-based:
        - FREE: BTCUSD, EURUSD, USDJPY, US30, XAUUSD (5 symbols)
        - PRO: All 15 symbols

    Timeframe:
      type: string
      enum:
        - M5 # PRO only (scalping)
        - M15
        - M30
        - H1
        - H2
        - H4
        - H8 # PRO only
        - H12 # PRO only (swing trading)
        - D1
      description: |
        Chart timeframes (V7 - 9 timeframes).
        FREE tier: H1, H4, D1 (3 timeframes)
        PRO tier: All 9 timeframes (M5, M15, M30, H1, H2, H4, H8, H12, D1)

    # ============================================
    # RESPONSE SCHEMAS
    # ============================================
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - error
          description: |
            Overall service status:
            - ok: All terminals connected
            - degraded: Some terminals disconnected
            - error: All terminals disconnected
        version:
          type: string
          description: Service version identifier
          example: v6.0.0
        total_terminals:
          type: integer
          description: Total number of MT5 terminals configured
          example: 15
        connected_terminals:
          type: integer
          description: Number of terminals currently connected
          example: 15
        terminals:
          type: object
          description: Per-symbol terminal connection status
          additionalProperties:
            $ref: '#/components/schemas/TerminalStatus'
          example:
            XAUUSD:
              connected: true
              terminal_id: MT5_15
              last_check: '2025-11-17T10:30:00Z'
            BTCUSD:
              connected: false
              terminal_id: MT5_03
              last_check: '2025-11-17T10:30:00Z'
              error: 'Connection timeout'
      required:
        - status
        - version
        - total_terminals
        - connected_terminals
        - terminals

    TerminalStatus:
      type: object
      description: Status of a single MT5 terminal connection
      properties:
        connected:
          type: boolean
          description: Whether terminal is currently connected
          example: true
        terminal_id:
          type: string
          description: Terminal identifier (MT5_01 through MT5_15)
          example: MT5_01
        last_check:
          type: string
          format: date-time
          description: Timestamp of last health check
          example: '2025-11-17T10:30:00Z'
        error:
          type: string
          description: Error message if connection failed (only present when connected=false)
          example: 'Connection timeout'
      required:
        - connected
        - terminal_id
        - last_check

    SymbolsResponse:
      type: object
      properties:
        success:
          type: boolean
        tier:
          $ref: '#/components/schemas/UserTier'
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/Symbol'
          description: List of symbols accessible by tier
      required:
        - success
        - tier
        - symbols

    TimeframesResponse:
      type: object
      properties:
        success:
          type: boolean
        tier:
          $ref: '#/components/schemas/UserTier'
        timeframes:
          type: array
          items:
            $ref: '#/components/schemas/Timeframe'
          description: List of all supported timeframes
      required:
        - success
        - tier
        - timeframes

    OHLCVDataResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/OHLCVData'
      required:
        - success
        - data

    OHLCVData:
      type: object
      description: |
        Complete OHLCV data package from MT5.

        NOTE: This service ONLY provides raw candlestick data.
        For indicators and technical analysis, use Part 20 (SQLite-Sync Script).
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        timeframe:
          $ref: '#/components/schemas/Timeframe'
        bars:
          type: integer
          description: Number of bars returned
          example: 1000
        ohlcv:
          type: array
          items:
            $ref: '#/components/schemas/OHLCVBar'
          description: Array of OHLCV candlestick data
        metadata:
          $ref: '#/components/schemas/OHLCVMetadata'
      required:
        - symbol
        - timeframe
        - bars
        - ohlcv
        - metadata

    OHLCVBar:
      type: object
      description: Single candlestick bar
      properties:
        time:
          type: integer
          description: Unix timestamp
          example: 1699632000
        open:
          type: number
          format: double
          description: Opening price
          example: 1985.50
        high:
          type: number
          format: double
          description: Highest price
          example: 1987.25
        low:
          type: number
          format: double
          description: Lowest price
          example: 1984.75
        close:
          type: number
          format: double
          description: Closing price
          example: 1986.00
        volume:
          type: integer
          description: Tick volume
          example: 1234
      required:
        - time
        - open
        - high
        - low
        - close
        - volume

    OHLCVMetadata:
      type: object
      description: Metadata about the OHLCV data
      properties:
        timestamp:
          type: integer
          description: Unix timestamp of most recent bar
          example: 1699632000
        bars_requested:
          type: integer
          description: Number of bars requested
          example: 1000
        bars_received:
          type: integer
          description: Actual number of bars received
          example: 1000
        tier:
          $ref: '#/components/schemas/UserTier'
        terminal_id:
          type: string
          description: MT5 terminal ID that handled this request (MT5_01 through MT5_15)
          example: MT5_15
      required:
        - timestamp
        - bars_requested
        - bars_received
        - tier
        - terminal_id

    # ============================================
    # ERROR SCHEMAS
    # ============================================
    AccessDeniedResponse:
      type: object
      description: Returned when tier cannot access requested symbol or timeframe
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable error message
          example: FREE tier cannot access AUDJPY
        tier:
          $ref: '#/components/schemas/UserTier'
        accessible_symbols:
          type: array
          items:
            type: string
          description: List of symbols accessible by this tier (present if symbol denied)
        accessible_timeframes:
          type: array
          items:
            type: string
          description: List of timeframes accessible by this tier (present if timeframe denied)
        upgrade_required:
          type: boolean
          description: Whether upgrade to PRO is needed
      required:
        - success
        - error
        - tier
        - upgrade_required

    ErrorResponse:
      type: object
      description: Generic error response
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
          example: Failed to retrieve OHLCV data
      required:
        - success
        - error

    # ============================================
    # ADMIN RESPONSE SCHEMAS
    # ============================================
    AdminHealthResponse:
      type: object
      description: Admin health response with additional metrics
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        version:
          type: string
        total_terminals:
          type: integer
        connected_terminals:
          type: integer
        terminals:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AdminTerminalStatus'
      required:
        - status
        - version
        - total_terminals
        - connected_terminals
        - terminals

    AdminTerminalStatus:
      type: object
      description: Admin view of terminal status with additional metrics
      properties:
        connected:
          type: boolean
        terminal_id:
          type: string
        last_check:
          type: string
          format: date-time
        error:
          type: string
        uptime_percentage:
          type: number
          description: Uptime percentage (0-100)
        reconnect_count:
          type: integer
          description: Number of reconnections
        last_error:
          type: string
          description: Last error message (if any)
      required:
        - connected
        - terminal_id
        - last_check

    TerminalRestartResponse:
      type: object
      description: Response from terminal restart operation
      properties:
        success:
          type: boolean
        message:
          type: string
        terminal_id:
          type: string
        symbol:
          type: string
        connected:
          type: boolean
        last_error:
          type: string
      required:
        - success
        - terminal_id
        - symbol

    RestartAllResponse:
      type: object
      description: Response from restart all terminals operation
      properties:
        success:
          type: boolean
        message:
          type: string
        total_terminals:
          type: integer
        successful_restarts:
          type: integer
        failed_restarts:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              terminal_id:
                type: string
              symbol:
                type: string
              success:
                type: boolean
              error:
                type: string
      required:
        - success
        - total_terminals
        - successful_restarts
        - failed_restarts
        - results

    TerminalLogsResponse:
      type: object
      description: Terminal log entries
      properties:
        success:
          type: boolean
        terminal_id:
          type: string
        symbol:
          type: string
        logs:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              level:
                type: string
                enum: [INFO, WARNING, ERROR, DEBUG]
              message:
                type: string
      required:
        - success
        - terminal_id
        - symbol
        - logs

    TerminalStatsResponse:
      type: object
      description: Aggregate statistics for all terminals
      properties:
        success:
          type: boolean
        stats:
          type: object
          properties:
            total_uptime_percentage:
              type: number
            total_reconnects_24h:
              type: integer
            avg_response_time_ms:
              type: number
            terminals_by_status:
              type: object
              properties:
                connected:
                  type: integer
                disconnected:
                  type: integer
                reconnecting:
                  type: integer
            most_problematic_terminals:
              type: array
              items:
                type: object
                properties:
                  terminal_id:
                    type: string
                  symbol:
                    type: string
                  reconnect_count:
                    type: integer
                  uptime:
                    type: number
      required:
        - success
        - stats

  responses:
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Unauthorized
