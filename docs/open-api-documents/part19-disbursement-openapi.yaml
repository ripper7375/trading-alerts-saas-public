openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Part 19 Disbursement System API
  description: |
    **Part 19: RiseWorks Disbursement & Payment System**

    This API provides comprehensive affiliate commission disbursement functionality including:
    - **Part 19A (Foundation)**: Database schema, types, payment providers, commission services
    - **Part 19B (Execution)**: Batch management, payment orchestration, admin APIs
    - **Part 19C (Automation)**: Webhooks, reports, audit logs, cron jobs
    - **Part 19D (Frontend)**: Admin dashboard UI for disbursement management

    ## Key Features
    - Automated commission aggregation and payout
    - Multi-provider support (Mock for testing, RiseWorks for production)
    - Batch payment processing with transaction tracking
    - Webhook event handling (idempotent)
    - Comprehensive reporting and audit trails
    - Automated cron jobs for disbursements and account sync

    ## Authentication
    - Admin APIs require NextAuth session with ADMIN role
    - Webhook endpoints verify HMAC SHA256 signatures
    - Cron endpoints require Bearer token authentication

    ## Payment Flow
    1. Commissions accumulate (from Part 17 Affiliate system)
    2. Admin views payable affiliates meeting $50 minimum threshold
    3. Admin creates payment batch for eligible affiliates
    4. Batch executes payments via payment provider (MOCK or RISE)
    5. Webhooks confirm payment status (for RiseWorks)
    6. Audit logs track all operations

    ## Database Schema
    Uses normalized relational structure with proper foreign key relationships:
    - AffiliateRiseAccount ↔ AffiliateProfile (Part 17)
    - DisbursementTransaction ↔ Commission (Part 17)
    - PaymentBatch → DisbursementTransaction[]

  version: 2.0.0
  contact:
    name: Trading Alerts SaaS Team
    email: support@tradingalerts.example.com
  license:
    name: Proprietary

servers:
  - url: https://api.tradingalerts.example.com
    description: Production server
  - url: https://staging.tradingalerts.example.com
    description: Staging server
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Affiliates
    description: Payable affiliate management
  - name: RiseWorks Accounts
    description: RiseWorks blockchain account management
  - name: Batches
    description: Payment batch operations
  - name: Payments
    description: Quick payment operations
  - name: Reports
    description: Disbursement reports and summaries
  - name: Transactions
    description: Transaction history
  - name: Audit
    description: Audit logs
  - name: Configuration
    description: System configuration
  - name: Health
    description: System health checks
  - name: Webhooks
    description: RiseWorks webhook handlers
  - name: Cron Jobs
    description: Automated background jobs

paths:
  # ============================================================
  # PART 19B: AFFILIATES APIs
  # ============================================================
  /api/disbursement/affiliates/payable:
    get:
      tags:
        - Affiliates
      summary: Get payable affiliates
      description: |
        Returns all affiliates who have approved commissions ready for payout.
        Includes affiliate details, pending amounts, RiseWorks account status,
        and payout eligibility based on $50 minimum threshold and KYC approval.
      operationId: getPayableAffiliates
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  affiliates:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayableAffiliate'
                  summary:
                    type: object
                    properties:
                      totalAffiliates:
                        type: integer
                        description: Total number of affiliates with pending commissions
                        example: 15
                      totalPendingAmount:
                        type: number
                        format: double
                        description: Sum of all pending commission amounts
                        example: 5250.00
                      readyForPayout:
                        type: integer
                        description: Affiliates meeting threshold AND with approved KYC
                        example: 12
                      meetsThreshold:
                        type: integer
                        description: Affiliates meeting $50 minimum threshold
                        example: 14
                      withRiseAccount:
                        type: integer
                        description: Affiliates with RiseWorks account linked
                        example: 13
                      withApprovedKyc:
                        type: integer
                        description: Affiliates with KYC approved
                        example: 12
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/affiliates/{affiliateId}:
    get:
      tags:
        - Affiliates
      summary: Get affiliate details
      description: Returns detailed information about a specific affiliate including RiseWorks account and pending commissions
      operationId: getAffiliateDetails
      security:
        - AdminAuth: []
      parameters:
        - name: affiliateId
          in: path
          required: true
          description: Affiliate Profile ID
          schema:
            type: string
            example: clp123abc456def
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  affiliate:
                    $ref: '#/components/schemas/AffiliateDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/affiliates/{affiliateId}/commissions:
    get:
      tags:
        - Affiliates
      summary: Get affiliate pending commissions
      description: Returns all approved commissions for an affiliate that haven't been paid yet
      operationId: getAffiliatePendingCommissions
      security:
        - AdminAuth: []
      parameters:
        - name: affiliateId
          in: path
          required: true
          description: Affiliate Profile ID
          schema:
            type: string
            example: clp123abc456def
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  commissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commission'
                  summary:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 8
                      totalAmount:
                        type: number
                        format: double
                        example: 250.00
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19B: RISEWORKS ACCOUNTS APIs
  # ============================================================
  /api/disbursement/riseworks/accounts:
    get:
      tags:
        - RiseWorks Accounts
      summary: Get all RiseWorks accounts
      description: Returns all registered RiseWorks accounts with affiliate details and KYC status
      operationId: getRiseWorksAccounts
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AffiliateRiseAccount'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - RiseWorks Accounts
      summary: Create RiseWorks account
      description: Creates a new RiseWorks account for an affiliate by linking their blockchain wallet address
      operationId: createRiseWorksAccount
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - affiliateProfileId
                - riseId
                - email
              properties:
                affiliateProfileId:
                  type: string
                  description: Affiliate Profile ID to link
                  example: clp123abc456def
                riseId:
                  type: string
                  description: Blockchain wallet address (Ethereum format)
                  example: '0xA35b2F326F07a7C92BedB0D318C237F30948E425'
                email:
                  type: string
                  format: email
                  description: Email for RiseWorks account
                  example: affiliate@example.com
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/AffiliateRiseAccount'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/riseworks/sync:
    post:
      tags:
        - RiseWorks Accounts
      summary: Sync RiseWorks accounts
      description: Synchronizes all RiseWorks accounts with the external RiseWorks API to update KYC status and account details
      operationId: syncRiseWorksAccounts
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Sync completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Synced 15 accounts
                  syncedAt:
                    type: string
                    format: date-time
                  results:
                    type: object
                    properties:
                      total:
                        type: integer
                      updated:
                        type: integer
                      failed:
                        type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19B: BATCHES APIs
  # ============================================================
  /api/disbursement/batches:
    get:
      tags:
        - Batches
      summary: Get payment batches
      description: Returns list of payment batches with optional status filter and statistics
      operationId: getPaymentBatches
      security:
        - AdminAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by batch status
          schema:
            $ref: '#/components/schemas/PaymentBatchStatus'
        - name: limit
          in: query
          description: Maximum number of batches to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  batches:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentBatchWithCounts'
                  statistics:
                    $ref: '#/components/schemas/BatchStatistics'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Batches
      summary: Create payment batch
      description: |
        Creates a new payment batch for specified affiliates or all payable affiliates.
        Only includes affiliates meeting the $50 minimum payout threshold.
      operationId: createPaymentBatch
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                affiliateIds:
                  type: array
                  description: Optional list of affiliate IDs. If empty, creates batch for all payable affiliates
                  items:
                    type: string
                  example: ['clp123abc', 'clp456def']
                provider:
                  $ref: '#/components/schemas/DisbursementProvider'
      responses:
        '201':
          description: Batch created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Payment batch created successfully
                  batch:
                    type: object
                    properties:
                      id:
                        type: string
                      batchNumber:
                        type: string
                      provider:
                        $ref: '#/components/schemas/DisbursementProvider'
                      status:
                        $ref: '#/components/schemas/PaymentBatchStatus'
                      paymentCount:
                        type: integer
                      totalAmount:
                        type: number
                        format: double
                      currency:
                        type: string
                      affiliateCount:
                        type: integer
                      transactionCount:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Invalid request or no payable affiliates found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No payable affiliates found
                  details:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/batches/preview:
    post:
      tags:
        - Batches
      summary: Preview payment batch
      description: Previews what would be included in a batch without creating it. Useful for dry-run validation.
      operationId: previewPaymentBatch
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                affiliateIds:
                  type: array
                  description: Optional list of affiliate IDs
                  items:
                    type: string
                  example: ['clp123abc', 'clp456def']
      responses:
        '200':
          description: Preview generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview:
                    type: array
                    items:
                      type: object
                      properties:
                        affiliateId:
                          type: string
                        affiliateName:
                          type: string
                        commissionCount:
                          type: integer
                        totalAmount:
                          type: number
                          format: double
                        eligible:
                          type: boolean
                        reason:
                          type: string
                          description: Reason if not eligible
                  summary:
                    type: object
                    properties:
                      totalAffiliates:
                        type: integer
                      eligibleAffiliates:
                        type: integer
                      totalAmount:
                        type: number
                        format: double
                      ineligibleReasons:
                        type: object
                        additionalProperties:
                          type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/batches/{batchId}:
    get:
      tags:
        - Batches
      summary: Get batch details
      description: Returns detailed information about a payment batch including all transactions and audit logs
      operationId: getBatchDetails
      security:
        - AdminAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: Payment Batch ID
          schema:
            type: string
            example: clp123batch456
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    $ref: '#/components/schemas/PaymentBatchDetailed'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Batches
      summary: Delete payment batch
      description: Deletes a payment batch. Only allowed for PENDING or CANCELLED batches.
      operationId: deletePaymentBatch
      security:
        - AdminAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: Payment Batch ID
          schema:
            type: string
            example: clp123batch456
      responses:
        '200':
          description: Batch deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Batch deleted successfully
        '400':
          description: Cannot delete batch in current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Cannot delete batch with status PROCESSING
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/batches/{batchId}/execute:
    post:
      tags:
        - Batches
      summary: Execute payment batch
      description: |
        Executes all payments in a batch via the configured payment provider.
        Only allowed for batches in PENDING status.
        Updates batch status to PROCESSING, then COMPLETED or FAILED.
      operationId: executePaymentBatch
      security:
        - AdminAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: Payment Batch ID
          schema:
            type: string
            example: clp123batch456
      responses:
        '200':
          description: Batch execution completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/ExecutionResult'
        '400':
          description: Batch cannot be executed in current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Batch must be in PENDING status to execute
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19C: QUICK PAYMENT API
  # ============================================================
  /api/disbursement/pay:
    post:
      tags:
        - Payments
      summary: Quick single payment
      description: |
        Creates and immediately executes a payment batch for a single affiliate.
        Useful for ad-hoc payments or urgent disbursements.
        Affiliate must meet minimum payout threshold and have approved KYC.
      operationId: quickPayAffiliate
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - affiliateId
              properties:
                affiliateId:
                  type: string
                  description: Affiliate Profile ID to pay
                  example: clp123abc456def
                provider:
                  $ref: '#/components/schemas/DisbursementProvider'
      responses:
        '200':
          description: Payment executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/ExecutionResult'
        '400':
          description: Affiliate not ready for payout
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19C: REPORTS APIs
  # ============================================================
  /api/disbursement/reports/summary:
    get:
      tags:
        - Reports
      summary: Get disbursement summary
      description: Returns overall disbursement statistics including batches, transactions, and amounts
      operationId: getDisbursementSummary
      security:
        - AdminAuth: []
      parameters:
        - name: startDate
          in: query
          description: Filter start date (ISO 8601)
          schema:
            type: string
            format: date-time
            example: '2024-01-01T00:00:00Z'
        - name: endDate
          in: query
          description: Filter end date (ISO 8601)
          schema:
            type: string
            format: date-time
            example: '2024-12-31T23:59:59Z'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: '#/components/schemas/DisbursementSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/reports/affiliate/{affiliateId}:
    get:
      tags:
        - Reports
      summary: Get affiliate payment history
      description: Returns complete payment history for an affiliate including all transactions
      operationId: getAffiliatePaymentHistory
      security:
        - AdminAuth: []
      parameters:
        - name: affiliateId
          in: path
          required: true
          description: Affiliate Profile ID
          schema:
            type: string
            example: clp123abc456def
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisbursementTransaction'
                  summary:
                    type: object
                    properties:
                      totalTransactions:
                        type: integer
                      totalPaid:
                        type: number
                        format: double
                      totalFailed:
                        type: number
                        format: double
                      successRate:
                        type: number
                        format: double
                        description: Percentage (0-100)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/transactions:
    get:
      tags:
        - Transactions
      summary: Get disbursement transactions
      description: Returns paginated list of disbursement transactions with optional status filter
      operationId: getDisbursementTransactions
      security:
        - AdminAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by transaction status
          schema:
            $ref: '#/components/schemas/DisbursementTransactionStatus'
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisbursementTransaction'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      hasMore:
                        type: boolean
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/disbursement/audit-logs:
    get:
      tags:
        - Audit
      summary: Get audit logs
      description: Returns audit logs for disbursement operations with optional action filtering
      operationId: getAuditLogs
      security:
        - AdminAuth: []
      parameters:
        - name: action
          in: query
          description: Filter by action type (e.g., batch.created, payment.completed)
          schema:
            type: string
            example: batch.created
        - name: limit
          in: query
          description: Number of results
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: batchId
          in: query
          description: Filter by specific batch
          schema:
            type: string
        - name: transactionId
          in: query
          description: Filter by specific transaction
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisbursementAuditLog'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19C: CONFIGURATION APIs
  # ============================================================
  /api/disbursement/config:
    get:
      tags:
        - Configuration
      summary: Get disbursement configuration
      description: Returns current disbursement system configuration
      operationId: getDisbursementConfig
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    $ref: '#/components/schemas/DisbursementConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Configuration
      summary: Update disbursement configuration
      description: Updates disbursement system configuration. Only specified fields are updated.
      operationId: updateDisbursementConfig
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  $ref: '#/components/schemas/DisbursementProvider'
                enabled:
                  type: boolean
                minimumPayout:
                  type: number
                  format: double
                  minimum: 1
                  example: 50.00
                batchSize:
                  type: integer
                  minimum: 1
                  maximum: 500
                  example: 100
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Configuration updated
                  config:
                    $ref: '#/components/schemas/DisbursementConfig'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # PART 19C: HEALTH CHECK
  # ============================================================
  /api/disbursement/health:
    get:
      tags:
        - Health
      summary: Health check
      description: |
        Returns disbursement system health status.
        Public endpoint for monitoring - no authentication required.
        Returns 200 if healthy, 503 if unhealthy.
      operationId: getDisbursementHealth
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ============================================================
  # PART 19C: WEBHOOKS
  # ============================================================
  /api/webhooks/riseworks:
    post:
      tags:
        - Webhooks
      summary: RiseWorks webhook handler
      description: |
        Receives and processes webhooks from RiseWorks payment provider.
        Webhooks are idempotent - safe to call multiple times with same event.

        **Signature Verification:**
        - Webhooks must include `x-rise-signature` header
        - Signature verified using HMAC SHA256
        - Unsigned or invalid webhooks are rejected with 401

        **Supported Events:**
        - payment.completed - Payment successfully processed
        - payment.failed - Payment failed
        - invite.accepted - Affiliate accepted RiseWorks invite
        - fund.received - Funds received to wallet
        - account.duplication_detected - Duplicate account detected
      operationId: handleRiseWorksWebhook
      security:
        - WebhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - data
              properties:
                event:
                  type: string
                  description: Event type
                  enum:
                    - payment.completed
                    - payment.failed
                    - invite.accepted
                    - fund.received
                    - account.duplication_detected
                  example: payment.completed
                teamId:
                  type: string
                  description: RiseWorks team ID
                timestamp:
                  type: string
                  format: date-time
                data:
                  type: object
                  description: Event payload (varies by event type)
                  additionalProperties: true
                  example:
                    providerTxId: rise-txn-123456
                    amount: 50000000
                    payeeRiseId: '0xA35b2F326F07a7C92BedB0D318C237F30948E425'
      responses:
        '200':
          description: Webhook received and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
                  eventId:
                    type: string
                    description: Internal event ID for tracking
        '401':
          description: Missing or invalid signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Webhook processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # PART 19C: CRON JOBS
  # ============================================================
  /api/cron/process-pending-disbursements:
    post:
      tags:
        - Cron Jobs
      summary: Process pending disbursements (Cron)
      description: |
        Automated cron job that processes pending disbursements.
        Should be scheduled to run daily (e.g., 2 AM UTC).

        **Process:**
        1. Find all affiliates with pending commissions ≥ $50
        2. Create payment batches (max 100 affiliates per batch)
        3. Execute batches via configured provider
        4. Log results to audit trail

        **Idempotent:** Safe to run multiple times.
      operationId: processPendingDisbursements
      security:
        - CronSecret: []
      responses:
        '200':
          description: Cron job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time
                  result:
                    type: object
                    properties:
                      affiliatesProcessed:
                        type: integer
                      batchesCreated:
                        type: integer
                      batchesExecuted:
                        type: integer
                      totalAmount:
                        type: number
                        format: double
                      successfulPayments:
                        type: integer
                      failedPayments:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/cron/sync-riseworks-accounts:
    post:
      tags:
        - Cron Jobs
      summary: Sync RiseWorks accounts (Cron)
      description: |
        Automated cron job that syncs RiseWorks account statuses.
        Should be scheduled to run daily (e.g., 3 AM UTC).

        **Process:**
        1. Query all AffiliateRiseAccount records
        2. Fetch current status from RiseWorks API
        3. Update KYC status and timestamps
        4. Log sync results

        **Idempotent:** Safe to run multiple times.
      operationId: syncRiseWorksAccountsCron
      security:
        - CronSecret: []
      responses:
        '200':
          description: Cron job completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time
                  result:
                    type: object
                    properties:
                      accountsTotal:
                        type: integer
                      accountsSynced:
                        type: integer
                      accountsUpdated:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    AdminAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie with ADMIN role required

    WebhookSignature:
      type: apiKey
      in: header
      name: x-rise-signature
      description: HMAC SHA256 signature of webhook payload

    CronSecret:
      type: http
      scheme: bearer
      description: Bearer token for cron job authentication (CRON_SECRET env var)

  schemas:
    # ============================================================
    # ENUMS
    # ============================================================
    DisbursementProvider:
      type: string
      enum:
        - MOCK
        - RISE
      default: MOCK
      description: |
        Payment provider:
        - MOCK: Test provider for development (simulates success/failure)
        - RISE: Production RiseWorks blockchain provider (USDC on Base)

    PaymentBatchStatus:
      type: string
      enum:
        - PENDING
        - QUEUED
        - PROCESSING
        - COMPLETED
        - FAILED
        - CANCELLED
      description: |
        Batch lifecycle status:
        - PENDING: Created, awaiting execution
        - QUEUED: Scheduled for execution
        - PROCESSING: Currently executing payments
        - COMPLETED: All payments successful
        - FAILED: One or more payments failed
        - CANCELLED: Batch cancelled by admin

    DisbursementTransactionStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - CANCELLED

    RiseWorksKycStatus:
      type: string
      enum:
        - PENDING
        - SUBMITTED
        - APPROVED
        - REJECTED
        - EXPIRED
      description: |
        KYC verification status:
        - PENDING: Not started
        - SUBMITTED: Documents submitted, under review
        - APPROVED: KYC verified, can receive payments
        - REJECTED: KYC failed, cannot receive payments
        - EXPIRED: KYC expired, needs re-verification

    AuditLogStatus:
      type: string
      enum:
        - SUCCESS
        - FAILURE
        - WARNING
        - INFO

    # ============================================================
    # AFFILIATE SCHEMAS
    # ============================================================
    PayableAffiliate:
      type: object
      properties:
        id:
          type: string
          example: clp123abc456def
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        country:
          type: string
          example: US
        pendingAmount:
          type: number
          format: double
          description: Total pending commission amount (USD)
          example: 250.00
        paidAmount:
          type: number
          format: double
          description: Historical total paid (USD)
          example: 1500.00
        pendingCommissionCount:
          type: integer
          description: Number of pending commissions
          example: 5
        oldestPendingDate:
          type: string
          format: date-time
          nullable: true
          description: Date of oldest pending commission
        readyForPayout:
          type: boolean
          description: True if meets threshold AND has approved KYC
          example: true
        meetsThreshold:
          type: boolean
          description: True if pending amount >= $50
          example: true
        riseAccount:
          type: object
          properties:
            hasAccount:
              type: boolean
            riseId:
              type: string
              example: '0xA35b2F326F07a7C92BedB0D318C237F30948E425'
            kycStatus:
              $ref: '#/components/schemas/RiseWorksKycStatus'
            canReceivePayments:
              type: boolean
              description: True if KYC is APPROVED

    AffiliateDetails:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        country:
          type: string
        totalPending:
          type: number
          format: double
        totalPaid:
          type: number
          format: double
        riseAccount:
          $ref: '#/components/schemas/AffiliateRiseAccount'
        pendingCommissions:
          type: array
          items:
            $ref: '#/components/schemas/Commission'

    AffiliateRiseAccount:
      type: object
      properties:
        id:
          type: string
        affiliateProfileId:
          type: string
        riseId:
          type: string
          description: Blockchain wallet address (Ethereum format)
        email:
          type: string
          format: email
        kycStatus:
          $ref: '#/components/schemas/RiseWorksKycStatus'
        kycCompletedAt:
          type: string
          format: date-time
          nullable: true
        invitationSentAt:
          type: string
          format: date-time
          nullable: true
        invitationAcceptedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Commission:
      type: object
      properties:
        id:
          type: string
        affiliateProfileId:
          type: string
        affiliateCodeId:
          type: string
        userId:
          type: string
        subscriptionId:
          type: string
          nullable: true
        grossRevenue:
          type: number
          format: double
        discountAmount:
          type: number
          format: double
        netRevenue:
          type: number
          format: double
        commissionAmount:
          type: number
          format: double
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - PAID
            - CANCELLED
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true

    # ============================================================
    # BATCH SCHEMAS
    # ============================================================
    PaymentBatch:
      type: object
      properties:
        id:
          type: string
        batchNumber:
          type: string
          example: BATCH-2024-ABC123
        paymentCount:
          type: integer
          example: 15
        totalAmount:
          type: number
          format: double
          example: 5250.00
        currency:
          type: string
          default: USD
        provider:
          $ref: '#/components/schemas/DisbursementProvider'
        status:
          $ref: '#/components/schemas/PaymentBatchStatus'
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        executedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentBatchWithCounts:
      allOf:
        - $ref: '#/components/schemas/PaymentBatch'
        - type: object
          properties:
            transactionCounts:
              type: object
              description: Transaction counts by status
              properties:
                PENDING:
                  type: integer
                PROCESSING:
                  type: integer
                COMPLETED:
                  type: integer
                FAILED:
                  type: integer
                CANCELLED:
                  type: integer

    PaymentBatchDetailed:
      allOf:
        - $ref: '#/components/schemas/PaymentBatch'
        - type: object
          properties:
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/DisbursementTransaction'
            auditLogs:
              type: array
              items:
                $ref: '#/components/schemas/DisbursementAuditLog'

    BatchStatistics:
      type: object
      description: Overall batch statistics
      properties:
        total:
          type: integer
        byStatus:
          type: object
          properties:
            PENDING:
              type: integer
            QUEUED:
              type: integer
            PROCESSING:
              type: integer
            COMPLETED:
              type: integer
            FAILED:
              type: integer
            CANCELLED:
              type: integer
        totalAmount:
          type: number
          format: double
        successRate:
          type: number
          format: double
          description: Percentage of completed batches

    # ============================================================
    # TRANSACTION SCHEMAS
    # ============================================================
    DisbursementTransaction:
      type: object
      properties:
        id:
          type: string
        batchId:
          type: string
        commissionId:
          type: string
        transactionId:
          type: string
          description: Internal transaction ID
          example: TXN-1234567890-ABC123
        providerTxId:
          type: string
          nullable: true
          description: External provider transaction ID
          example: rise-txn-123456
        provider:
          $ref: '#/components/schemas/DisbursementProvider'
        affiliateRiseAccountId:
          type: string
          nullable: true
        payeeRiseId:
          type: string
          nullable: true
          description: Recipient blockchain address
          example: '0xA35b2F326F07a7C92BedB0D318C237F30948E425'
        amount:
          type: number
          format: double
          description: Amount in USD
          example: 50.00
        amountRiseUnits:
          type: integer
          format: int64
          nullable: true
          description: Amount in RiseWorks units (1e6 = $1 USD for USDC)
          example: 50000000
        currency:
          type: string
          default: USD
        status:
          $ref: '#/components/schemas/DisbursementTransactionStatus'
        retryCount:
          type: integer
          default: 0
          description: Number of retry attempts
        lastRetryAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
          description: Error message if failed
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true

    ExecutionResult:
      type: object
      properties:
        success:
          type: boolean
          description: True if all payments succeeded
        batchId:
          type: string
        batchNumber:
          type: string
        totalAmount:
          type: number
          format: double
        successCount:
          type: integer
          description: Number of successful payments
        failedCount:
          type: integer
          description: Number of failed payments
        status:
          $ref: '#/components/schemas/PaymentBatchStatus'
        errors:
          type: array
          items:
            type: string
          description: Error messages for failed payments

    # ============================================================
    # AUDIT & REPORTING SCHEMAS
    # ============================================================
    DisbursementAuditLog:
      type: object
      properties:
        id:
          type: string
        transactionId:
          type: string
          nullable: true
        batchId:
          type: string
          nullable: true
        action:
          type: string
          description: |
            Action types:
            - batch.created, batch.executed, batch.completed, batch.failed, batch.cancelled
            - payment.initiated, payment.completed, payment.failed
            - webhook.received, webhook.processed
            - config.updated
          example: batch.created
        actor:
          type: string
          nullable: true
          description: User ID who performed the action
        status:
          $ref: '#/components/schemas/AuditLogStatus'
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Additional context as JSON
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DisbursementSummary:
      type: object
      properties:
        batches:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            pending:
              type: integer
            failed:
              type: integer
            successRate:
              type: number
              format: double
              description: Percentage (0-100)
        transactions:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            successRate:
              type: number
              format: double
        amounts:
          type: object
          properties:
            totalPaid:
              type: number
              format: double
              description: Total successfully disbursed (USD)
            totalPending:
              type: number
              format: double
              description: Total pending commissions (USD)
            totalFailed:
              type: number
              format: double
              description: Total from failed transactions (USD)
        period:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time

    # ============================================================
    # CONFIGURATION SCHEMAS
    # ============================================================
    DisbursementConfig:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/DisbursementProvider'
        enabled:
          type: boolean
          description: Whether disbursement system is enabled
        minimumPayout:
          type: number
          format: double
          description: Minimum payout threshold (USD)
          example: 50.00
        batchSize:
          type: integer
          description: Maximum affiliates per batch
          example: 100
        environment:
          type: string
          enum:
            - production
            - staging
            - development
          example: staging
        retryPolicy:
          type: object
          properties:
            maxAttempts:
              type: integer
              example: 3
            initialDelay:
              type: integer
              description: Initial delay in milliseconds
              example: 1000
            maxDelay:
              type: integer
              description: Maximum delay in milliseconds
              example: 16000
            backoffMultiplier:
              type: number
              example: 2

    HealthStatus:
      type: object
      properties:
        healthy:
          type: boolean
          description: Overall health status
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: boolean
              description: Database connectivity
            provider:
              type: boolean
              description: Payment provider connectivity
            pendingBatches:
              type: integer
              description: Count of pending/processing batches
            failedTransactions:
              type: integer
              description: Failed transactions in last 24h
            lastWebhookReceived:
              type: string
              format: date-time
              nullable: true
            lastBatchCompleted:
              type: string
              format: date-time
              nullable: true
        warnings:
          type: array
          items:
            type: string
          description: Warning messages for degraded conditions
        provider:
          type: string
          description: Current provider name
        uptime:
          type: integer
          description: Server uptime in seconds

    # ============================================================
    # ERROR SCHEMAS
    # ============================================================
    Error:
      type: object
      properties:
        error:
          type: string
          example: Error message
        details:
          type: string
          nullable: true
          description: Additional error details

  responses:
    UnauthorizedError:
      description: Unauthorized - Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized

    ForbiddenError:
      description: Forbidden - Insufficient permissions (admin role required)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden - Admin access required

    BadRequestError:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid request parameters

    NotFoundError:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Resource not found

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error
