openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Alerts System API (Part 11)
  version: 3.0.0
  description: |
    Alerts System API for Trading Alerts SaaS platform (Part 11).

    **Last Updated:** 2026-08-04 — verified against live handlers for price alerts and drawing-engine line alerts.

    **Superseded architecture notice:** the previous version of this spec (v2.0.0)
    documented a pre-V8 model where FREE users could hold up to 5 alerts across 5
    symbols/3 timeframes. That model no longer exists, and the previous spec never
    covered the `alerts/line` (drawing-engine line-touch alert) routes at all. See
    `docs/migration-orders/DECISION-LOG.md` (F1) and the Session 0-2 order's
    Deviations section.

    ## V8 model
    - **Price alerts are PRO-exclusive.** FREE users get 403 `PRO_FEATURE` on both
      create (`POST /api/alerts`) and modify (`PATCH /api/alerts/{id}`) — they may
      still `DELETE` leftover alerts from before a downgrade.
    - **Line-touch alerts** (`/api/alerts/line*`) attach an alert to a chart drawing's
      geometry (see Part 21) instead of a flat target price. Also PRO-exclusive for
      create/update; DELETE remains available for cleanup after downgrade.
    - Both alert kinds share one PRO quota: **100 alerts total** (symbol/timeframe
      locked to XAUUSD × M5/M15 — see Part 04).
    - Updating/deleting either kind publishes an `alerts:changed` event for the
      Phase 4 background worker.

    ## Database Schema (Alert model, 10 columns, flat structure — unchanged from v2.0.0)
    - `id`, `userId`, `name` (nullable), `symbol`, `timeframe`, `condition` (JSON
      string), `alertType`, `isActive`, `lastTriggered` (nullable), `triggerCount`,
      `createdAt`, `updatedAt`
    - Line-touch alerts additionally have a `DrawingAlert` row
      (`drawingId`, `alertId`, `targetLevel`, `direction`, `tolerance`,
      `cooldownSec`, `oneShot`) linking the `Alert` to its source `Drawing`.

  contact:
    name: API Support
    email: support@tradingalerts.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.tradingalerts.example.com
    description: Production server

security:
  - sessionAuth: []

tags:
  - name: Alerts
    description: Flat price-target alerts (list, create)
  - name: Alert Details
    description: Individual price alert operations (get, update, delete)
  - name: Line Alerts
    description: Alerts attached to chart drawings (list, create, update, delete)

paths:
  /api/alerts:
    get:
      tags: [Alerts]
      summary: List user's price alerts
      description: |
        **Query Parameters:** `status` (active/paused/triggered), `symbol`.
        Sorted by `createdAt` descending.

        **Implementation:** `app/api/alerts/route.ts` (GET)
      operationId: getAlerts
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, paused, triggered]
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          example: XAUUSD
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Alerts]
      summary: Create a price alert
      description: |
        **PRO-exclusive** — FREE users get 403 `PRO_FEATURE` unconditionally, before
        any other validation runs. PRO users are capped at 100 total alerts
        (shared with line alerts). `symbol`/`timeframe` are validated against the
        platform's single-symbol enum (XAUUSD / M5,M15 — see Part 04), not a
        per-tier catalog.

        **Implementation:** `app/api/alerts/route.ts` (POST)
      operationId: createAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
            example:
              symbol: XAUUSD
              timeframe: M5
              conditionType: price_above
              targetValue: 2000.5
              name: Gold Above 2000
      responses:
        '201':
          description: Alert created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAlertResponse'
        '400':
          description: Invalid input - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FREE tier (feature not available), or PRO alert limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierErrorResponse'
              examples:
                freeTierBlocked:
                  summary: FREE tier — feature not available
                  value:
                    error: Alerts are a PRO feature
                    message: 'Price alerts are exclusive to the PRO tier. Upgrade to create up to 100 alerts on XAUUSD M5/M15, plus drawing-engine line alerts and multi-timeframe visualization.'
                    code: PRO_FEATURE
                    upgradeUrl: /pricing
                limitReached:
                  summary: PRO — 100-alert limit reached
                  value:
                    error: Alert limit exceeded
                    message: 'You have reached your PRO tier limit of 100 alerts'
                    code: ALERT_LIMIT_EXCEEDED
                    currentCount: 100
                    limit: 100
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/alerts/{id}:
    get:
      tags: [Alert Details]
      summary: Get a single price alert by ID
      description: |
        Ownership-checked (403 if the alert belongs to another user).

        **Implementation:** `app/api/alerts/[id]/route.ts` (GET)
      operationId: getAlert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1k
      responses:
        '200':
          description: Alert retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '403':
          description: Forbidden - user does not own this alert
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '404':
          description: Alert not found
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '500':
          description: Internal server error
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }

    patch:
      tags: [Alert Details]
      summary: Update a price alert
      description: |
        **PRO-exclusive** — FREE users get 403 `PRO_FEATURE` even for their own
        alerts (e.g. leftover alerts from before a downgrade); they may only
        `DELETE` such alerts, not modify or re-enable them. Updatable fields:
        `isActive`, `name`, `targetValue` (preserves the existing condition type).
        `symbol`/`timeframe`/`conditionType` cannot be changed — delete and
        recreate instead.

        **Implementation:** `app/api/alerts/[id]/route.ts` (PATCH)
      operationId: updateAlert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRequest'
      responses:
        '200':
          description: Alert updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAlertResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              {
                schema:
                  { $ref: '#/components/schemas/ValidationErrorResponse' },
              }
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '403':
          description: FREE tier (feature not available), or not the alert's owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierErrorResponse'
              example:
                error: Alerts are a PRO feature
                message: 'Your plan cannot modify alerts. Upgrade to PRO to manage alerts, or delete this alert.'
                code: PRO_FEATURE
                upgradeUrl: /pricing
        '404':
          description: Alert not found
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '500':
          description: Internal server error
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }

    delete:
      tags: [Alert Details]
      summary: Delete a price alert
      description: |
        Hard delete, available regardless of tier (this is how FREE users clean up
        leftover alerts after a downgrade).

        **Implementation:** `app/api/alerts/[id]/route.ts` (DELETE)
      operationId: deleteAlert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Alert deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '403':
          description: Forbidden - user does not own this alert
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '404':
          description: Alert not found
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '500':
          description: Internal server error
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }

  /api/alerts/line:
    get:
      tags: [Line Alerts]
      summary: List the user's line-touch alerts
      description: |
        Optionally filtered by `symbol`/`timeframe` (filters the parent drawing,
        not the alert itself). Each item includes both the `alert` and its
        source `drawing`.

        **Implementation:** `app/api/alerts/line/route.ts` (GET)
      operationId: listLineAlerts
      parameters:
        - name: symbol
          in: query
          required: false
          schema: { type: string }
        - name: timeframe
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Line alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineAlertListResponse'
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '500':
          description: Internal server error
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }

    post:
      tags: [Line Alerts]
      summary: Attach an alert to a drawn line
      description: |
        **PRO-exclusive.** `targetLevel` must be one of the drawing's available
        alert levels (from the shared geometry helper `levelsForMark` — TEXT
        drawings expose none and are rejected). Creates an `Alert` +
        `DrawingAlert` atomically and publishes `alerts:changed`. Shares the
        same 100-alert quota as flat price alerts.

        **Implementation:** `app/api/alerts/line/route.ts` (POST)
      operationId: createLineAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAttachRequest'
      responses:
        '201':
          description: Line alert created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineAlertResponse'
        '400':
          description: Invalid input, drawing type not alertable, or invalid target level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAlertable:
                  value:
                    success: false
                    error: Not alertable
                    message: Drawings of type TEXT cannot have alerts.
                badLevel:
                  value:
                    success: false
                    error: Invalid target level
                    message: 'targetLevel must be one of: high, low'
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '403':
          description: FREE tier, drawing not owned by user, or 100-alert limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                freeTierBlocked:
                  value:
                    success: false
                    error: Line alerts are a PRO feature
                    message: Drawing-engine line alerts are exclusive to the PRO tier. Upgrade to attach alerts to your chart drawings.
                limitReached:
                  value:
                    success: false
                    error: Alert limit reached
                    message: 'PRO tier allows 100 alerts. Delete or pause existing alerts to create new ones.'
        '404':
          description: Drawing not found
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '500':
          description: Internal server error
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }

  /api/alerts/line/{id}:
    patch:
      tags: [Line Alerts]
      summary: Update a line alert's rule, or pause/resume it
      description: |
        `{id}` is the `DrawingAlert` id. Ownership is checked via the parent
        drawing's `userId`. **PRO-exclusive** (FREE may only DELETE). Updates
        `direction`/`tolerance`/`cooldownSec`/`oneShot` on the `DrawingAlert`
        and/or `name`/`isActive` on the underlying `Alert`.

        **Implementation:** `app/api/alerts/line/[id]/route.ts` (PATCH)
      operationId: updateLineAlert
      parameters:
        - name: id
          in: path
          required: true
          description: DrawingAlert ID
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdateRequest'
      responses:
        '200':
          description: Line alert updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineAlertResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '403':
          description: FREE tier, or not the drawing's owner
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '404':
          description: Line alert not found
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '500':
          description: Internal server error
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }

    delete:
      tags: [Line Alerts]
      summary: Remove a line alert
      description: |
        Deletes the underlying `Alert` (cascades to its `DrawingAlert`).
        Available regardless of tier.

        **Implementation:** `app/api/alerts/line/[id]/route.ts` (DELETE)
      operationId: deleteLineAlert
      parameters:
        - name: id
          in: path
          required: true
          description: DrawingAlert ID
          schema: { type: string }
      responses:
        '200':
          description: Line alert deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized - session required
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '403':
          description: Forbidden - not the drawing's owner
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '404':
          description: Line alert not found
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }
        '500':
          description: Internal server error
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/ErrorResponse' } }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  schemas:
    CreateAlertRequest:
      type: object
      required: [symbol, timeframe, conditionType, targetValue]
      properties:
        symbol:
          type: string
          enum: [XAUUSD]
          example: XAUUSD
        timeframe:
          type: string
          enum: [M5, M15]
          example: M5
        conditionType:
          type: string
          enum: [price_above, price_below, price_equals]
          example: price_above
        targetValue:
          type: number
          exclusiveMinimum: 0
          example: 2000.5
        name:
          type: string
          maxLength: 100
          example: Gold Above 2000

    UpdateAlertRequest:
      type: object
      properties:
        isActive: { type: boolean }
        name: { type: string, maxLength: 100 }
        targetValue: { type: number, exclusiveMinimum: 0 }

    Alert:
      type: object
      required:
        [
          id,
          symbol,
          timeframe,
          condition,
          alertType,
          isActive,
          triggerCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, example: clx1a2b3c4d5e6f7g8h9i0j1k }
        name: { type: string, nullable: true }
        symbol: { type: string, example: XAUUSD }
        timeframe: { type: string, example: M5 }
        condition:
          type: string
          description: 'JSON-encoded, e.g. {"type":"price_above","targetValue":2000.50}'
        alertType: { type: string, enum: [PRICE_ALERT, PRICE_TOUCH_LINE] }
        isActive: { type: boolean }
        lastTriggered: { type: string, format: date-time, nullable: true }
        triggerCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AlertListResponse:
      type: object
      required: [alerts]
      properties:
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }

    AlertResponse:
      type: object
      required: [alert]
      properties:
        alert: { $ref: '#/components/schemas/Alert' }

    CreateAlertResponse:
      type: object
      required: [alert, message]
      properties:
        alert: { $ref: '#/components/schemas/Alert' }
        message: { type: string }

    UpdateAlertResponse:
      type: object
      required: [alert, message]
      properties:
        alert: { $ref: '#/components/schemas/Alert' }
        message: { type: string }

    DeleteResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }

    AlertAttachRequest:
      type: object
      required: [drawingId, targetLevel]
      properties:
        drawingId: { type: string, description: CUID of the source drawing }
        targetLevel:
          {
            type: string,
            description: 'Must be one of the levels levelsForMark() exposes for the drawing',
          }
        direction:
          type: string
          enum: [cross_up, cross_down, either]
          default: either
        tolerance: { type: number, minimum: 0, default: 0 }
        cooldownSec: { type: integer, minimum: 0, maximum: 86400, default: 60 }
        oneShot: { type: boolean, default: false }
        name: { type: string, maxLength: 120 }

    AlertUpdateRequest:
      type: object
      description: At least one field required
      properties:
        direction: { type: string, enum: [cross_up, cross_down, either] }
        tolerance: { type: number, minimum: 0 }
        cooldownSec: { type: integer, minimum: 0, maximum: 86400 }
        oneShot: { type: boolean }
        name: { type: string, maxLength: 120 }
        isActive: { type: boolean }

    LineAlert:
      type: object
      description: A DrawingAlert row joined with its Alert and source Drawing
      properties:
        id: { type: string, description: DrawingAlert ID }
        drawingId: { type: string }
        alertId: { type: string }
        targetLevel: { type: string }
        direction: { type: string, enum: [cross_up, cross_down, either] }
        tolerance: { type: number }
        cooldownSec: { type: integer }
        oneShot: { type: boolean }
        alert: { $ref: '#/components/schemas/Alert' }
        drawing:
          type: object
          additionalProperties: true
          description: See Part 21 (Drawings) for the full Drawing schema

    LineAlertListResponse:
      type: object
      required: [success, alerts]
      properties:
        success: { type: boolean, example: true }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/LineAlert' }

    LineAlertResponse:
      type: object
      required: [success, alert]
      properties:
        success: { type: boolean, example: true }
        alert: { $ref: '#/components/schemas/LineAlert' }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Unauthorized }
        code: { type: string, example: UNAUTHORIZED }
        message: { type: string }
        success:
          {
            type: boolean,
            description: Present on alerts/line/* responses,
            absent on flat alerts/* responses,
          }

    ValidationErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string, example: Invalid input }
        code: { type: string, example: VALIDATION_ERROR }
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: array, items: { type: string } }
              message: { type: string }

    TierErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string, example: Alerts are a PRO feature }
        message: { type: string }
        code:
          type: string
          enum: [PRO_FEATURE, ALERT_LIMIT_EXCEEDED]
        upgradeUrl: { type: string, example: /pricing }
        currentCount: { type: integer, description: For ALERT_LIMIT_EXCEEDED }
        limit:
          { type: integer, description: For ALERT_LIMIT_EXCEEDED, example: 100 }
