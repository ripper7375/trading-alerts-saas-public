openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Tier Routes API (Part 07)
  version: 2.0.0
  description: |
    Tier Routes API for Trading Alerts SaaS platform (Part 07).

    This API provides tier-based access control for trading symbols and timeframes.

    ⚠️ **IMPORTANT ARCHITECTURAL CHANGE (v2.0.0):**
    - All custom indicator endpoints have been REMOVED from Part 07
    - Part 07 now contains ONLY tier-based access control routes
    - OHLCV (candlestick) data is fetched from Part 20 (SQLite-Sync) via `/api/candles/{symbol}`
    - Custom indicators are NOT supported due to MT5 Python API limitations with iCustom()
    - All indicator data (if needed in future) will be handled by Part 20 (SQLite-Sync)

    ## Features
    - Tier-based symbol access control
    - Tier-based timeframe access control
    - Symbol+timeframe combination management
    - Symbol access validation

    ## Tier-Based Access

    **FREE Tier:**
    - 5 symbols: BTCUSD, EURUSD, USDJPY, US30, XAUUSD
    - 3 timeframes: H1, H4, D1
    - 15 total combinations (5 × 3)

    **PRO Tier:**
    - 15 symbols: All major forex pairs, crypto, indices, commodities
    - 9 timeframes: M5, M15, M30, H1, H2, H4, H8, H12, D1
    - 135 total combinations (15 × 9)

  contact:
    name: API Support
    email: support@tradingalerts.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.tradingalerts.example.com
    description: Production server

security:
  - sessionAuth: []

tags:
  - name: Tier
    description: Tier-based access control endpoints

paths:
  /api/tier/symbols:
    get:
      tags:
        - Tier
      summary: Get accessible symbols for user's tier
      description: |
        Returns list of trading symbols accessible by the authenticated user's tier.
        Includes symbol metadata like display names and categories.

        **Categories:**
        - forex: Currency pairs (EURUSD, GBPUSD, etc.)
        - crypto: Cryptocurrencies (BTCUSD, ETHUSD)
        - index: Market indices (US30, NDX100)
        - commodity: Precious metals (XAUUSD, XAGUSD)
      operationId: getTierSymbols
      responses:
        '200':
          description: Symbols retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolsResponse'
              example:
                success: true
                tier: 'FREE'
                symbols:
                  - 'BTCUSD'
                  - 'EURUSD'
                  - 'USDJPY'
                  - 'US30'
                  - 'XAUUSD'
                symbolsInfo:
                  - symbol: 'BTCUSD'
                    name: 'Bitcoin/US Dollar'
                    category: 'crypto'
                    proOnly: false
                  - symbol: 'EURUSD'
                    name: 'Euro/US Dollar'
                    category: 'forex'
                    proOnly: false
                  - symbol: 'USDJPY'
                    name: 'US Dollar/Japanese Yen'
                    category: 'forex'
                    proOnly: false
                  - symbol: 'US30'
                    name: 'Dow Jones Industrial Average'
                    category: 'index'
                    proOnly: false
                  - symbol: 'XAUUSD'
                    name: 'Gold/US Dollar'
                    category: 'commodity'
                    proOnly: false
                count: 5
                totalAvailable: 15
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Unauthorized'
                message: 'You must be logged in to view available symbols'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Failed to fetch symbols'
                message: 'An error occurred while fetching available symbols. Please try again.'

  /api/tier/check/{symbol}:
    get:
      tags:
        - Tier
      summary: Check symbol access for user's tier
      description: |
        Check if the authenticated user's tier can access a specific trading symbol.
        Returns access status and upgrade information if access is denied.
      operationId: checkSymbolAccess
      parameters:
        - name: symbol
          in: path
          required: true
          description: Trading symbol to check (case-insensitive)
          schema:
            type: string
          example: 'XAUUSD'
      responses:
        '200':
          description: Access check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheckResponse'
              examples:
                allowed:
                  summary: Symbol access allowed
                  value:
                    success: true
                    symbol: 'XAUUSD'
                    allowed: true
                    tier: 'FREE'
                denied:
                  summary: Symbol access denied
                  value:
                    success: true
                    symbol: 'AUDJPY'
                    allowed: false
                    tier: 'FREE'
                    reason: 'FREE tier cannot access AUDJPY. Upgrade to PRO for access to all 15 symbols.'
                    upgradeRequired: true
                    accessibleSymbols:
                      - 'BTCUSD'
                      - 'EURUSD'
                      - 'USDJPY'
                      - 'US30'
                      - 'XAUUSD'
        '400':
          description: Invalid symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Invalid symbol'
                message: 'Symbol INVALID is not a valid trading symbol. Available symbols: AUDJPY, AUDUSD, BTCUSD, ETHUSD, EURUSD, GBPJPY, GBPUSD, NDX100, NZDUSD, US30, USDCAD, USDCHF, USDJPY, XAGUSD, XAUUSD'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Unauthorized'
                message: 'You must be logged in to check symbol access'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Failed to check symbol access'
                message: 'An error occurred while checking symbol access. Please try again.'

  /api/tier/combinations:
    get:
      tags:
        - Tier
      summary: Get allowed symbol+timeframe combinations
      description: |
        Returns all allowed symbol+timeframe combinations for the authenticated user's tier.
        Used by frontend to populate dropdowns and validate selections.

        **Timeframe Labels:**
        - M5: 5 Minutes
        - M15: 15 Minutes
        - M30: 30 Minutes
        - H1: 1 Hour
        - H2: 2 Hours
        - H4: 4 Hours
        - H8: 8 Hours
        - H12: 12 Hours
        - D1: 1 Day
      operationId: getTierCombinations
      responses:
        '200':
          description: Combinations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinationsResponse'
              example:
                success: true
                tier: 'FREE'
                combinations:
                  - symbol: 'BTCUSD'
                    timeframe: 'H1'
                  - symbol: 'BTCUSD'
                    timeframe: 'H4'
                  - symbol: 'BTCUSD'
                    timeframe: 'D1'
                  - symbol: 'EURUSD'
                    timeframe: 'H1'
                count: 15
                totalPossible: 135
                symbols:
                  - 'BTCUSD'
                  - 'EURUSD'
                  - 'USDJPY'
                  - 'US30'
                  - 'XAUUSD'
                timeframes:
                  - value: 'H1'
                    label: '1 Hour'
                    proOnly: false
                  - value: 'H4'
                    label: '4 Hours'
                    proOnly: false
                  - value: 'D1'
                    label: '1 Day'
                    proOnly: false
                limits:
                  symbolCount: 5
                  timeframeCount: 3
                  totalCombinations: 15
                upgrade:
                  additionalSymbols: 10
                  additionalTimeframes: 6
                  additionalCombinations: 120
                  message: 'Upgrade to PRO for 10 more symbols, 6 more timeframes, and 120 more chart combinations.'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Unauthorized'
                message: 'You must be logged in to view available combinations'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Failed to fetch combinations'
                message: 'An error occurred while fetching available combinations. Please try again.'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  schemas:
    # Enums
    Tier:
      type: string
      enum:
        - FREE
        - PRO
      description: User subscription tier
      example: 'FREE'

    SymbolCategory:
      type: string
      enum:
        - forex
        - crypto
        - index
        - commodity
      description: Trading symbol category
      example: 'forex'

    # Tier Schemas
    SymbolInfo:
      type: object
      required:
        - symbol
        - name
        - category
        - proOnly
      properties:
        symbol:
          type: string
          description: Trading symbol code
          example: 'XAUUSD'
        name:
          type: string
          description: Human-readable symbol name
          example: 'Gold/US Dollar'
        category:
          $ref: '#/components/schemas/SymbolCategory'
        proOnly:
          type: boolean
          description: Whether this symbol requires PRO tier
          example: false

    TimeframeInfo:
      type: object
      required:
        - value
        - label
        - proOnly
      properties:
        value:
          type: string
          description: Timeframe code
          example: 'H1'
        label:
          type: string
          description: Human-readable timeframe label
          example: '1 Hour'
        proOnly:
          type: boolean
          description: Whether this timeframe requires PRO tier
          example: false

    Combination:
      type: object
      required:
        - symbol
        - timeframe
      properties:
        symbol:
          type: string
          description: Trading symbol
          example: 'BTCUSD'
        timeframe:
          type: string
          description: Chart timeframe
          example: 'H1'

    SymbolsResponse:
      type: object
      required:
        - success
        - tier
        - symbols
        - symbolsInfo
        - count
        - totalAvailable
      properties:
        success:
          type: boolean
          example: true
        tier:
          $ref: '#/components/schemas/Tier'
        symbols:
          type: array
          items:
            type: string
          description: List of accessible symbol codes
          example: ['BTCUSD', 'EURUSD', 'USDJPY', 'US30', 'XAUUSD']
        symbolsInfo:
          type: array
          items:
            $ref: '#/components/schemas/SymbolInfo'
        count:
          type: integer
          description: Number of accessible symbols
          example: 5
        totalAvailable:
          type: integer
          description: Total symbols available with PRO tier
          example: 15

    AccessCheckResponse:
      type: object
      required:
        - success
        - symbol
        - allowed
        - tier
      properties:
        success:
          type: boolean
          example: true
        symbol:
          type: string
          description: Symbol that was checked
          example: 'XAUUSD'
        allowed:
          type: boolean
          description: Whether access is allowed
          example: true
        tier:
          $ref: '#/components/schemas/Tier'
        reason:
          type: string
          description: Reason for denial (only if denied)
          example: 'FREE tier cannot access AUDJPY. Upgrade to PRO for access.'
        upgradeRequired:
          type: boolean
          description: Whether upgrade is needed for access
          example: true
        accessibleSymbols:
          type: array
          items:
            type: string
          description: Symbols accessible by current tier
          example: ['BTCUSD', 'EURUSD', 'USDJPY', 'US30', 'XAUUSD']

    CombinationsResponse:
      type: object
      required:
        - success
        - tier
        - combinations
        - count
        - totalPossible
        - symbols
        - timeframes
        - limits
      properties:
        success:
          type: boolean
          example: true
        tier:
          $ref: '#/components/schemas/Tier'
        combinations:
          type: array
          items:
            $ref: '#/components/schemas/Combination'
        count:
          type: integer
          description: Number of accessible combinations
          example: 15
        totalPossible:
          type: integer
          description: Total combinations with PRO tier
          example: 135
        symbols:
          type: array
          items:
            type: string
          description: Accessible symbol codes
        timeframes:
          type: array
          items:
            $ref: '#/components/schemas/TimeframeInfo'
        limits:
          type: object
          required:
            - symbolCount
            - timeframeCount
            - totalCombinations
          properties:
            symbolCount:
              type: integer
              example: 5
            timeframeCount:
              type: integer
              example: 3
            totalCombinations:
              type: integer
              example: 15
        upgrade:
          type: object
          description: Upgrade information (only for FREE tier)
          properties:
            additionalSymbols:
              type: integer
              example: 10
            additionalTimeframes:
              type: integer
              example: 6
            additionalCombinations:
              type: integer
              example: 120
            message:
              type: string
              example: 'Upgrade to PRO for 10 more symbols, 6 more timeframes, and 120 more chart combinations.'

    # Error Schemas
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error type
          example: 'Unauthorized'
        message:
          type: string
          description: Human-readable error message
          example: 'You must be logged in'
