openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Affiliate Marketing Platform API (Part 17)
  version: 3.0.0
  description: |
    Affiliate portal + cron automation API for Trading Alerts SaaS platform (Part 17).

    **Generated:** 2026-07-17, Session 0-3 — regenerated with corrected `/api` path
    prefixes (every path in the prior version of this file was missing the `/api`
    prefix, e.g. `/checkout` instead of `/api/checkout` — that bug is fixed here, all
    12 paths below start with `/api/`), and consolidated to remove duplicate coverage
    with part-12/14/19. Grounded directly in the live route handlers under
    `app/api/config/affiliate`, `app/api/affiliate/**`, and `app/api/cron/**`
    (12 routes total), plus their backing modules in `lib/affiliate/*` and
    `lib/cron/*`.

    **Consolidation note:** `admin/affiliates/*` (list, detail, suspend, reactivate,
    distribute-codes, and the 4 BI report sub-paths), `checkout/*`
    (`/checkout`, `/checkout/validate-code`), and `disbursement/reports/affiliate/*`
    — formerly duplicated in this file — are now solely documented in part-14
    (admin dashboard), part-12 (ecommerce/billing), and part19 (disbursement)
    respectively (Session 0-3 consolidation, which also fixed a repo-wide
    missing-`/api`-prefix bug in this file's paths). This file no longer contains
    those path blocks.

    ## Sub-domains
    - **Public Config** (`/api/config/affiliate`): public, cached discount/commission
      config, no authentication.
    - **Affiliate Auth** (`/api/affiliate/auth/*`): register the current logged-in
      user as an affiliate; verify affiliate email via mailed token.
    - **Affiliate Dashboard** (`/api/affiliate/dashboard/*`): stats, paginated codes
      list, code inventory report, commission report. All gated by
      `requireAffiliate()` + `getAffiliateProfile()` from `lib/auth/session.ts`.
    - **Affiliate Profile** (`/api/affiliate/profile*`): get/update profile,
      update payment method. Same `requireAffiliate()` gating.
    - **Cron Jobs** (`/api/cron/*`): internal-only, `CRON_SECRET` bearer-token gated,
      invoked by Vercel Cron (via GET, which each handler delegates to its own POST
      implementation) or manually (via POST).

    ## Authentication reality (important nuance)
    - `requireAffiliate()` and `getAffiliateProfile()` (used by every Affiliate
      Dashboard and Affiliate Profile route) are a **different helper pair** than
      the plain `getServerSession(authOptions)` pattern used elsewhere in the app —
      but under the hood they call the exact same NextAuth session (`lib/auth/session.ts`
      `getSession()` → `getServerSession(authOptions)`), then additionally assert
      `session.user.isAffiliate === true`. It is still ordinary cookie-based NextAuth
      session auth, just a distinct wrapper scoped to the affiliate-portal actor.
      Modeled here as `sessionAuth` (same scheme as `POST /api/affiliate/auth/register`,
      which only requires a **regular** logged-in session via `requireAuth()` — no
      `isAffiliate` check, since the whole point of that endpoint is to grant
      affiliate status to an already-logged-in user).
    - `GET /api/config/affiliate` and `POST /api/affiliate/auth/verify-email` are
      genuinely public — no session of any kind is checked.
    - All 3 cron routes are internal-only: gated by a raw `Authorization: Bearer
      <CRON_SECRET>` header check against `process.env.CRON_SECRET`, not a NextAuth
      session. Documented with `security: []` per path plus an explicit note and
      header parameter, since OpenAPI's session/cookie security modeling doesn't fit
      a static bearer secret used only by Vercel's cron scheduler / ops.

    ## Known implementation quirks (documented, not fixed — read-only session)
    - `POST /api/affiliate/auth/verify-email` does not actually match the submitted
      `token` against a stored per-profile token; `verifyAffiliateEmail()` in
      `lib/affiliate/registration.ts` just finds the first `AffiliateProfile` with
      `status: 'PENDING_VERIFICATION'`. Documented request/response shape is accurate;
      this is a note on server-side matching logic, not a contract change.
    - `codesDistributed` in the verify-email response and the codes-per-affiliate
      count used by `POST /api/cron/distribute-codes` both come from the hardcoded
      `AFFILIATE_CONFIG.CODES_PER_MONTH` constant (15), **not** the dynamic
      `affiliate_codes_per_month` SystemConfig value that `GET /api/config/affiliate`
      and the admin settings endpoint (part-14) read/write. The two numbers can drift
      out of sync in practice.
    - `POST /api/cron/distribute-codes`'s `emailsSent` counter and
      `POST /api/cron/send-monthly-reports`'s report generation do not actually send
      email yet — both have `// TODO: Send email` / `// TODO: Send notification email`
      in the implementation and currently just count successful in-memory operations.

    ## Cron / Vercel schedule discrepancy (finding, documented at
    `GET|POST /api/cron/expire-codes` below)
    `app/api/cron/daily-maintenance/route.ts` (documented separately in
    part-12-ecommerce-billing-openapi.yaml) claims in its own docstring to be a
    "consolidated" job that also performs affiliate code expiry, "reducing Vercel
    cron count from 4 to 2." In reality, `vercel.json` at the repo root still
    independently schedules **both** `/api/cron/expire-codes` (`59 23 28-31 * *`)
    **and** `/api/cron/daily-maintenance` (`0 4 * * *`), unchanged — plus 4 other
    unrelated cron entries (8 total, not 2). The consolidation claim does not match
    the deployed cron configuration. Not fixed here — documentation only.

  contact:
    name: API Support
    email: support@tradingalerts.example.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.tradingalerts.example.com
    description: Production server

tags:
  - name: Public Config
    description: Public, unauthenticated affiliate configuration
  - name: Affiliate Auth
    description: Affiliate registration and email verification
  - name: Affiliate Dashboard
    description: Affiliate dashboard statistics and reports (requireAffiliate-gated)
  - name: Affiliate Profile
    description: Affiliate profile and payment method management (requireAffiliate-gated)
  - name: Cron Jobs
    description: Internal-only scheduled automation jobs (CRON_SECRET-gated)

paths:
  # ============================================
  # PUBLIC CONFIGURATION
  # ============================================
  /api/config/affiliate:
    get:
      tags: [Public Config]
      summary: Get public affiliate configuration
      description: |
        Returns current affiliate discount/commission configuration read from
        `SystemConfig`, falling back to hardcoded defaults for any missing key.
        Genuinely public — the handler's own docstring says "Public endpoint - no
        authentication required." Response carries
        `Cache-Control: public, s-maxage=300, stale-while-revalidate=60` (5 minute
        CDN cache).

        On any internal error, the handler still returns **200** with the default
        values (not a 5xx) "to prevent UI breakage" — there is no documented error
        response for this endpoint.

        **Implementation:** `app/api/config/affiliate/route.ts` (GET)
      operationId: getPublicAffiliateConfig
      security: []
      responses:
        '200':
          description: |
            Public affiliate configuration. Always 200, even when SystemConfig
            lookup fails internally (falls back to defaults).
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, s-maxage=300, stale-while-revalidate=60'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAffiliateConfig'
              example:
                discountPercent: 20.0
                commissionPercent: 20.0
                codesPerMonth: 15
                regularPrice: 29.0
                threeDayPrice: 1.99
                lastUpdated: '2026-07-01T12:00:00.000Z'

  # ============================================
  # AFFILIATE AUTH
  # ============================================
  /api/affiliate/auth/register:
    post:
      tags: [Affiliate Auth]
      summary: Register the current user as an affiliate
      description: |
        Registers the **currently authenticated (regular, non-affiliate) user** as
        an affiliate: sets `User.isAffiliate = true` and creates a `AffiliateProfile`
        with `status: 'PENDING_VERIFICATION'`. Requires only a normal logged-in
        session via `requireAuth()` — no `isAffiliate` check, since the point of this
        endpoint is to grant that status. A verification-email send is stubbed
        (`// TODO: Send verification email with token` in
        `lib/affiliate/registration.ts`) — not actually sent yet.

        **Implementation:** `app/api/affiliate/auth/register/route.ts` (POST)
      operationId: registerAffiliate
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateRegistrationRequest'
      responses:
        '201':
          description: Registration successful (profile created, pending email verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateRegistrationResponse'
              example:
                success: true
                message: 'Registration successful. Please verify your email to activate your affiliate account.'
                profileId: 'clx1a2b3c4d5e6f7g8h9i0j1'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: 'Validation failed'
                message: 'Invalid registration data'
                code: 'VALIDATION_ERROR'
                details: []
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Unauthorized'
                message: 'You must be logged in to register as an affiliate'
                code: 'UNAUTHORIZED'
        '409':
          description: User is already registered as an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Already registered'
                message: 'You are already registered as an affiliate'
                code: 'ALREADY_AFFILIATE'
        '500':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Registration failed'
                message: 'Failed to register as affiliate. Please try again.'
                code: 'REGISTRATION_ERROR'

  /api/affiliate/auth/verify-email:
    post:
      tags: [Affiliate Auth]
      summary: Verify affiliate email and activate account
      description: |
        Verifies the affiliate's email via a mailed token. On success: sets
        `AffiliateProfile.status = 'ACTIVE'`, stamps `verifiedAt`, and distributes
        `AFFILIATE_CONFIG.CODES_PER_MONTH` (hardcoded 15, **not** the dynamic
        `affiliate_codes_per_month` SystemConfig value) initial codes with
        `distributionReason: 'INITIAL'`.

        Genuinely unauthenticated — no session is checked; only the token in the
        body. Note: the current implementation does not actually match `token`
        against a stored value — it activates the first
        `AffiliateProfile` with `status: 'PENDING_VERIFICATION'` it finds
        (`lib/affiliate/registration.ts`, `verifyAffiliateEmail()`). Documented here
        for completeness; not something this docs-only session can fix.

        **Implementation:** `app/api/affiliate/auth/verify-email/route.ts` (POST)
      operationId: verifyAffiliateEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 32
                  description: Email verification token (min 32 chars per Zod schema)
                  example: 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2'
      responses:
        '200':
          description: Email verified, account activated, initial codes distributed
          content:
            application/json:
              schema:
                type: object
                required: [success, message, codesDistributed]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Email verified successfully. Your affiliate codes have been distributed.'
                  codesDistributed:
                    type: integer
                    example: 15
        '400':
          description: |
            Either a Zod validation failure (token under 32 chars — no `details`
            array on this particular error path) or no matching
            `PENDING_VERIFICATION` profile found (`code: INVALID_TOKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: Token too short
                  value:
                    error: 'Validation failed'
                    message: 'Invalid verification token'
                    code: 'VALIDATION_ERROR'
                invalidToken:
                  summary: No pending profile found
                  value:
                    error: 'Invalid token'
                    message: 'Invalid verification token'
                    code: 'INVALID_TOKEN'
        '500':
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Verification failed'
                message: 'Failed to verify email. Please try again.'
                code: 'VERIFICATION_ERROR'

  # ============================================
  # AFFILIATE DASHBOARD (requireAffiliate-gated)
  # ============================================
  /api/affiliate/dashboard/stats:
    get:
      tags: [Affiliate Dashboard]
      summary: Get affiliate dashboard statistics
      description: |
        Returns aggregate stats for the authenticated affiliate via
        `buildDashboardStats()` (`lib/affiliate/report-builder.ts`): code counts by
        status plus earnings/balances read directly off the `AffiliateProfile` row
        (not recomputed from `Commission` rows).

        **Implementation:** `app/api/affiliate/dashboard/stats/route.ts` (GET)
      operationId: getAffiliateDashboardStats
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Unauthorized'
                message: 'Authentication required'
                code: 'UNAUTHORIZED'
        '403':
          description: Authenticated but not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Forbidden'
                message: 'Affiliate access required'
                code: 'AFFILIATE_REQUIRED'
        '404':
          description: No AffiliateProfile row for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Profile not found'
                message: 'Affiliate profile not found'
                code: 'PROFILE_NOT_FOUND'
        '500':
          description: Failed to fetch stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Failed to fetch stats'
                message: 'Unable to retrieve dashboard statistics'
                code: 'STATS_ERROR'

  /api/affiliate/dashboard/codes:
    get:
      tags: [Affiliate Dashboard]
      summary: List the affiliate's codes (paginated)
      description: |
        Returns the affiliate's own `AffiliateCode` rows, newest first. Query
        params are validated by `codesListQuerySchema`
        (`lib/affiliate/validators.ts`) — note `status` has **no default** in the
        Zod schema (returns all statuses if omitted; it is not implicitly filtered
        to `ACTIVE`).

        **Implementation:** `app/api/affiliate/dashboard/codes/route.ts` (GET)
      operationId: getAffiliateCodes
      security:
        - sessionAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Optional status filter. No default — omitting it returns all statuses.
          schema:
            type: string
            enum: [ACTIVE, USED, EXPIRED, CANCELLED]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Codes list (flat pagination fields, not a nested `pagination` object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodesListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No AffiliateProfile row for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Profile not found'
                message: 'Affiliate profile not found'
                code: 'PROFILE_NOT_FOUND'
        '500':
          description: Failed to fetch codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Failed to fetch codes'
                message: 'Unable to retrieve affiliate codes'
                code: 'CODES_ERROR'

  /api/affiliate/dashboard/code-inventory:
    get:
      tags: [Affiliate Dashboard]
      summary: Get code inventory reconciliation report
      description: |
        Returns an opening-balance / additions / reductions / closing-balance
        reconciliation via `buildCodeInventoryReport()`
        (`lib/affiliate/report-builder.ts`). **Not** a `period` enum — the real
        query params are raw `startDate`/`endDate` date strings, defaulting to the
        trailing 30 days (`endDate` defaults to now, `startDate` defaults to
        `endDate - 30 days`).

        **Implementation:** `app/api/affiliate/dashboard/code-inventory/route.ts` (GET)
      operationId: getAffiliateCodeInventory
      security:
        - sessionAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: Period start (ISO 8601). Defaults to `endDate` minus 30 days.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: Period end (ISO 8601). Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Code inventory report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeInventoryReport'
        '400':
          description: Invalid date format (not a Zod ValidationError — a plain error shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Invalid dates'
                message: 'Invalid start or end date format'
                code: 'INVALID_DATES'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No AffiliateProfile row for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Failed to generate report'
                message: 'Unable to generate code inventory report'
                code: 'REPORT_ERROR'

  /api/affiliate/dashboard/commission-report:
    get:
      tags: [Affiliate Dashboard]
      summary: Get commission report with summary and paginated list
      description: |
        Returns a summary (via `buildCommissionSummary()`) plus a paginated list of
        the affiliate's `Commission` rows (each including its related
        `affiliateCode: {code, usedAt}`). Query params validated by
        `commissionReportQuerySchema`.

        **Implementation:** `app/api/affiliate/dashboard/commission-report/route.ts` (GET)
      operationId: getAffiliateCommissionReport
      security:
        - sessionAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, PAID, CANCELLED]
        - name: startDate
          in: query
          required: false
          description: Filter by `earnedAt >= startDate`
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: Filter by `earnedAt <= endDate`
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Commission report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionReportResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No AffiliateProfile row for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Failed to generate report'
                message: 'Unable to generate commission report'
                code: 'REPORT_ERROR'

  # ============================================
  # AFFILIATE PROFILE (requireAffiliate-gated)
  # ============================================
  /api/affiliate/profile:
    get:
      tags: [Affiliate Profile]
      summary: Get the authenticated affiliate's profile
      description: |
        Returns the raw `AffiliateProfile` row for the current user
        (via `getAffiliateProfile()`).

        **Implementation:** `app/api/affiliate/profile/route.ts` (GET)
      operationId: getAffiliateProfile
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Affiliate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No AffiliateProfile row for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Failed to fetch profile'
                message: 'Unable to retrieve affiliate profile'
                code: 'PROFILE_ERROR'
    put:
      tags: [Affiliate Profile]
      summary: Update the authenticated affiliate's profile
      description: |
        Updates `fullName`/`country`/social URLs on the caller's own
        `AffiliateProfile`. **Method is PUT, not PATCH** — verified against
        `app/api/affiliate/profile/route.ts` (only `GET` and `PUT` are exported;
        there is no `PATCH` handler on this route).

        **Implementation:** `app/api/affiliate/profile/route.ts` (PUT)
      operationId: updateAffiliateProfile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile (full row, same shape as GET)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateProfile'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: 'Validation failed'
                message: 'Invalid profile data'
                code: 'VALIDATION_ERROR'
                details: []
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No AffiliateProfile row for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Failed to update profile'
                message: 'Unable to update affiliate profile'
                code: 'UPDATE_ERROR'

  /api/affiliate/profile/payment:
    put:
      tags: [Affiliate Profile]
      summary: Update the affiliate's payment method
      description: |
        Updates `paymentMethod` + `paymentDetails` on the caller's own
        `AffiliateProfile`. **Only `PUT` is exported** by
        `app/api/affiliate/profile/payment/route.ts` — there is no `GET` on this
        path (use `GET /api/affiliate/profile` to read the current payment method,
        it's included in the full profile) and no `PATCH`.

        `paymentDetails` is validated at this layer only as a non-empty generic
        object (`z.record(z.unknown())`) — the method-specific shapes below
        (bank transfer / PayPal / crypto / Wise) are documented for guidance based
        on `lib/affiliate/validators.ts`'s per-method schemas, but those specific
        schemas are **not** wired into this route's actual runtime validation.

        **Implementation:** `app/api/affiliate/profile/payment/route.ts` (PUT)
      operationId: updateAffiliatePayment
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodUpdateRequest'
            examples:
              paypal:
                summary: PayPal
                value:
                  paymentMethod: PAYPAL
                  paymentDetails: { email: 'affiliate@example.com' }
              bankTransfer:
                summary: Bank transfer
                value:
                  paymentMethod: BANK_TRANSFER
                  paymentDetails:
                    accountName: 'John Doe'
                    bankName: 'Example Bank'
                    accountNumber: '1234567890'
                    swiftCode: 'EXAMPLEXXX'
              crypto:
                summary: Cryptocurrency
                value:
                  paymentMethod: CRYPTOCURRENCY
                  paymentDetails:
                    walletAddress: 'TXYZ1234567890abcdefghijklmnopqrst'
                    network: USDT_TRC20
      responses:
        '200':
          description: |
            Payment method updated. Response is a small confirmation object, **not**
            the full `AffiliateProfile`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodUpdateResponse'
              example:
                success: true
                message: 'Payment method updated successfully'
                paymentMethod: 'PAYPAL'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                error: 'Validation failed'
                message: 'Invalid payment data'
                code: 'VALIDATION_ERROR'
                details: []
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No AffiliateProfile row for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to update payment method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'Failed to update payment'
                message: 'Unable to update payment method'
                code: 'PAYMENT_UPDATE_ERROR'

  # ============================================
  # CRON JOBS (internal-only, CRON_SECRET-gated)
  # ============================================
  /api/cron/distribute-codes:
    get:
      tags: [Cron Jobs]
      summary: Monthly code distribution (Vercel Cron entry point)
      description: |
        Vercel Cron invokes cron endpoints via GET; this handler is a thin wrapper
        that delegates to the same logic as `POST` on this path.
        Scheduled in `vercel.json`: `0 0 1 * *` (00:00 UTC, 1st of month).

        **Implementation:** `app/api/cron/distribute-codes/route.ts` (GET → delegates to POST)
      operationId: cronDistributeCodesGet
      security: []
      parameters:
        - $ref: '#/components/parameters/CronAuthorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/DistributeCodesSuccess'
        '401':
          $ref: '#/components/responses/CronUnauthorized'
        '500':
          $ref: '#/components/responses/CronServerError'
    post:
      tags: [Cron Jobs]
      summary: Monthly code distribution
      description: |
        Distributes `AFFILIATE_CONFIG.CODES_PER_MONTH` (hardcoded 15) codes with
        `distributionReason: 'MONTHLY'` to every `AffiliateProfile` with
        `status: 'ACTIVE'`, via `runMonthlyDistribution()`
        (`lib/cron/monthly-distribution.ts`). Continues processing on per-affiliate
        failure (errors collected, not thrown). `emailsSent` currently just mirrors
        the count of successful distributions — actual email sending is a `// TODO`
        in the implementation, not yet wired up.

        Callable directly with a valid `CRON_SECRET` bearer token (not just by
        Vercel's scheduler).

        **Implementation:** `app/api/cron/distribute-codes/route.ts` (POST)
      operationId: cronDistributeCodesPost
      security: []
      parameters:
        - $ref: '#/components/parameters/CronAuthorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/DistributeCodesSuccess'
        '401':
          $ref: '#/components/responses/CronUnauthorized'
        '500':
          $ref: '#/components/responses/CronServerError'

  /api/cron/expire-codes:
    get:
      tags: [Cron Jobs]
      summary: Expire past-due affiliate codes (Vercel Cron entry point)
      description: |
        Vercel Cron GET entry point; delegates to the same logic as `POST` on this
        path. Scheduled in `vercel.json`: `59 23 28-31 * *` (23:59 UTC, days 28-31
        — handles variable month lengths).

        **Cron schedule discrepancy (finding, not fixed):**
        `app/api/cron/daily-maintenance/route.ts` (see part-12-ecommerce-billing-openapi.yaml)
        claims in its own docstring to be a "consolidated" job that also performs
        this exact code-expiry task, "reducing Vercel cron count from 4 to 2." In
        reality `vercel.json` still independently schedules **both** this route
        (`/api/cron/expire-codes`) **and** `/api/cron/daily-maintenance`, unchanged
        — plus 4 other separately-scheduled cron entries (8 total). The
        "consolidated"/"reduced to 2" claim in `daily-maintenance`'s docstring does
        not reflect the deployed cron configuration. Both jobs currently run
        independently and both mark past-due codes as `EXPIRED`, redundantly.
        Documented here as ground truth; out of scope to fix in this docs-only
        session.

        **Implementation:** `app/api/cron/expire-codes/route.ts` (GET → delegates to POST)
      operationId: cronExpireCodesGet
      security: []
      parameters:
        - $ref: '#/components/parameters/CronAuthorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ExpireCodesSuccess'
        '401':
          $ref: '#/components/responses/CronUnauthorized'
        '500':
          $ref: '#/components/responses/CronServerError'
    post:
      tags: [Cron Jobs]
      summary: Expire past-due affiliate codes
      description: |
        Bulk-updates every `AffiliateCode` where `status: 'ACTIVE'` and
        `expiresAt <= now` to `status: 'EXPIRED'` via a single
        `prisma.affiliateCode.updateMany`. See the GET operation on this path for
        the documented daily-maintenance schedule-overlap finding.

        **Implementation:** `app/api/cron/expire-codes/route.ts` (POST)
      operationId: cronExpireCodesPost
      security: []
      parameters:
        - $ref: '#/components/parameters/CronAuthorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/ExpireCodesSuccess'
        '401':
          $ref: '#/components/responses/CronUnauthorized'
        '500':
          $ref: '#/components/responses/CronServerError'

  /api/cron/send-monthly-reports:
    get:
      tags: [Cron Jobs]
      summary: Send monthly performance reports (Vercel Cron entry point)
      description: |
        Vercel Cron GET entry point; delegates to the same logic as `POST` on this
        path. Scheduled in `vercel.json`: `0 6 1 * *` (06:00 UTC, 1st of month).

        **Implementation:** `app/api/cron/send-monthly-reports/route.ts` (GET → delegates to POST)
      operationId: cronSendMonthlyReportsGet
      security: []
      parameters:
        - $ref: '#/components/parameters/CronAuthorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SendMonthlyReportsSuccess'
        '401':
          $ref: '#/components/responses/CronUnauthorized'
        '500':
          $ref: '#/components/responses/CronServerError'
    post:
      tags: [Cron Jobs]
      summary: Send monthly performance reports
      description: |
        Generates a previous-calendar-month performance summary (codes
        distributed/used, commissions earned, pending balance) for every
        `AffiliateProfile` with `status: 'ACTIVE'`. **Email sending is not yet
        implemented** — the handler builds each report and increments `sent`, but
        the actual send is a `// TODO: Send email with monthly-report template` in
        the route file; no email is dispatched today.

        **Implementation:** `app/api/cron/send-monthly-reports/route.ts` (POST)
      operationId: cronSendMonthlyReportsPost
      security: []
      parameters:
        - $ref: '#/components/parameters/CronAuthorizationHeader'
      responses:
        '200':
          $ref: '#/components/responses/SendMonthlyReportsSuccess'
        '401':
          $ref: '#/components/responses/CronUnauthorized'
        '500':
          $ref: '#/components/responses/CronServerError'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth.js session cookie. `POST /api/affiliate/auth/register` requires
        only a regular logged-in session (`requireAuth()`). Every Affiliate
        Dashboard and Affiliate Profile route additionally requires
        `session.user.isAffiliate === true`, enforced via the `requireAffiliate()` +
        `getAffiliateProfile()` wrapper in `lib/auth/session.ts` (a distinct helper
        pair from the plain `getServerSession(authOptions)` pattern used elsewhere
        in the app, but backed by the exact same session cookie).
    cronAuth:
      type: http
      scheme: bearer
      description: |
        Static `CRON_SECRET` environment variable, compared verbatim against the
        `Authorization: Bearer <CRON_SECRET>` request header. Not a NextAuth
        session — used only by Vercel Cron's scheduler and manual/ops invocations.
        Defined here for reference; the 3 cron paths in this document use
        `security: []` per path (a static shared-secret bearer token doesn't map
        cleanly onto OpenAPI's user-security modeling) and instead document the
        header explicitly via the `CronAuthorizationHeader` parameter.

  parameters:
    CronAuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: 'Bearer token: `Bearer <CRON_SECRET>`. Compared against `process.env.CRON_SECRET`.'
      schema:
        type: string
        example: 'Bearer <CRON_SECRET>'

  responses:
    CronUnauthorized:
      description: Missing/incorrect bearer token
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                example: 'Unauthorized'
    CronServerError:
      description: 'CRON_SECRET not configured server-side, or the job threw'
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                example: 'Server configuration error'
          examples:
            missingSecret:
              summary: CRON_SECRET env var not set
              value: { error: 'Server configuration error' }
            jobFailed:
              summary: Job threw an unhandled error
              value: { error: 'Cron job failed' }
    DistributeCodesSuccess:
      description: Distribution completed (per-affiliate failures are collected, not thrown)
      content:
        application/json:
          schema:
            type: object
            required:
              [success, message, distributed, totalAffiliates, emailsSent]
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: 'Distributed codes to 25 affiliates'
              distributed:
                type: integer
                description: Number of affiliates successfully distributed to
                example: 25
              totalAffiliates:
                type: integer
                description: Total ACTIVE affiliates processed
                example: 25
              emailsSent:
                type: integer
                description: 'Currently mirrors `distributed` (real email sending is a TODO)'
                example: 25
              errors:
                type: array
                items: { type: string }
                description: Per-affiliate error messages, only present if non-empty
                nullable: true
              duration:
                type: string
                example: '842ms'
    ExpireCodesSuccess:
      description: Expiry sweep completed
      content:
        application/json:
          schema:
            type: object
            required: [success, message, expiredCount, duration]
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: 'Expired 42 codes'
              expiredCount:
                type: integer
                example: 42
              duration:
                type: string
                example: '318ms'
    SendMonthlyReportsSuccess:
      description: |
        Report generation completed. If there are no ACTIVE affiliates, returns
        early with `sent: 0` and no `totalAffiliates`/`duration` fields.
      content:
        application/json:
          schema:
            type: object
            required: [success, message, sent]
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: 'Sent 25 monthly reports for June 2026'
              sent:
                type: integer
                example: 25
              totalAffiliates:
                type: integer
                nullable: true
                example: 25
              errors:
                type: array
                items: { type: string }
                nullable: true
              duration:
                type: string
                nullable: true
                example: '1204ms'
          examples:
            withActiveAffiliates:
              summary: Active affiliates found
              value:
                success: true
                message: 'Sent 25 monthly reports for June 2026'
                sent: 25
                totalAffiliates: 25
                duration: '1204ms'
            noActiveAffiliates:
              summary: No active affiliates (early return)
              value:
                success: true
                message: 'No active affiliates to send reports to'
                sent: 0

  schemas:
    # ============================================
    # COMMON
    # ============================================
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: 'Error message'
        message:
          type: string
          example: 'Human-readable detail'
        code:
          type: string
          example: 'SOME_ERROR_CODE'

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              type: array
              description: Zod issue list (`validation.error.errors`)
              items:
                type: object
                properties:
                  path:
                    type: array
                    items: {}
                  message:
                    type: string

    # ============================================
    # PUBLIC CONFIG
    # ============================================
    PublicAffiliateConfig:
      type: object
      description: |
        Shape returned by `GET /api/config/affiliate`. Field names verified against
        the `AffiliateConfigResponse` interface in the route file — note
        `regularPrice`, not `basePrice`.
      required:
        [
          discountPercent,
          commissionPercent,
          codesPerMonth,
          regularPrice,
          threeDayPrice,
          lastUpdated,
        ]
      properties:
        discountPercent:
          type: number
          format: double
          description: 'Customer discount %. SystemConfig key `affiliate_discount_percent`, default 20.0'
          example: 20.0
        commissionPercent:
          type: number
          format: double
          description: 'Affiliate commission %. SystemConfig key `affiliate_commission_percent`, default 20.0'
          example: 20.0
        codesPerMonth:
          type: integer
          description: 'SystemConfig key `affiliate_codes_per_month`, default 15'
          example: 15
        regularPrice:
          type: number
          format: double
          description: 'SystemConfig key `affiliate_base_price`, default 29.0'
          example: 29.0
        threeDayPrice:
          type: number
          format: double
          description: 'SystemConfig key `affiliate_three_day_price`, default 1.99 (not 1.00)'
          example: 1.99
        lastUpdated:
          type: string
          format: date-time
          description: Most recent `updatedAt` among the fetched SystemConfig rows, or "now" if none exist
          example: '2026-07-01T12:00:00.000Z'

    # ============================================
    # AFFILIATE AUTH
    # ============================================
    AffiliateRegistrationRequest:
      type: object
      description: Validated by `affiliateRegistrationSchema` in `lib/affiliate/validators.ts`
      required: [fullName, country, paymentMethod, paymentDetails, terms]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: 'John Doe'
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (uppercased by the schema)
          example: 'US'
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
          example: 'PAYPAL'
        paymentDetails:
          type: object
          description: 'Method-specific details; only validated as a non-empty object at this layer'
          example: { 'email': 'john@paypal.com' }
        terms:
          type: boolean
          description: Must be exactly `true`
          example: true
        facebookUrl:
          type: string
          format: uri
          description: 'Optional. Valid URL or empty string (`""`) — not nullable.'
          example: 'https://facebook.com/johndoe'
        instagramUrl:
          type: string
          format: uri
          example: 'https://instagram.com/johndoe'
        twitterUrl:
          type: string
          format: uri
          example: 'https://twitter.com/johndoe'
        youtubeUrl:
          type: string
          format: uri
          example: 'https://youtube.com/@johndoe'
        tiktokUrl:
          type: string
          format: uri
          example: 'https://tiktok.com/@johndoe'

    AffiliateRegistrationResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Registration successful. Please verify your email to activate your affiliate account.'
        profileId:
          type: string
          description: 'New AffiliateProfile.id (cuid)'
          example: 'clx1a2b3c4d5e6f7g8h9i0j1'

    # ============================================
    # AFFILIATE PROFILE
    # ============================================
    AffiliateProfile:
      type: object
      description: |
        Raw `AffiliateProfile` row (Prisma model, `prisma/schema.prisma`).
        `status` enum is `PENDING_VERIFICATION | ACTIVE | SUSPENDED | INACTIVE`
        (note: `INACTIVE`, not `DELETED`). There is no `websiteUrl` field on this
        model.
      properties:
        id:
          type: string
          example: 'clx1a2b3c4d5e6f7g8h9i0j1'
        userId:
          type: string
          example: 'clu9z8y7x6w5v4u3t2s1r0q9'
        fullName:
          type: string
          example: 'John Doe'
        country:
          type: string
          example: 'US'
        facebookUrl:
          type: string
          nullable: true
          example: null
        instagramUrl:
          type: string
          nullable: true
          example: null
        twitterUrl:
          type: string
          nullable: true
          example: null
        youtubeUrl:
          type: string
          nullable: true
          example: 'https://youtube.com/@johndoe'
        tiktokUrl:
          type: string
          nullable: true
          example: null
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
          example: 'PAYPAL'
        paymentDetails:
          type: object
          example: { 'email': 'john@paypal.com' }
        totalCodesDistributed:
          type: integer
          example: 45
        totalCodesUsed:
          type: integer
          example: 12
        totalEarnings:
          type: number
          format: double
          example: 198.18
        pendingCommissions:
          type: number
          format: double
          example: 55.68
        paidCommissions:
          type: number
          format: double
          example: 142.50
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, INACTIVE]
          example: 'ACTIVE'
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        suspensionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AffiliateProfileUpdateRequest:
      type: object
      description: |
        Validated by `affiliateProfileUpdateSchema`. All fields optional; social URL
        fields accept explicit `null` (`.optional().nullable()`), unlike the
        registration request's `facebookUrl`/etc. which accept empty string instead.
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        country:
          type: string
          minLength: 2
          maxLength: 2
        facebookUrl:
          type: string
          format: uri
          nullable: true
        instagramUrl:
          type: string
          format: uri
          nullable: true
        twitterUrl:
          type: string
          format: uri
          nullable: true
        youtubeUrl:
          type: string
          format: uri
          nullable: true
        tiktokUrl:
          type: string
          format: uri
          nullable: true

    PaymentMethodUpdateRequest:
      type: object
      required: [paymentMethod, paymentDetails]
      properties:
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
          example: 'WISE'
        paymentDetails:
          type: object
          description: |
            Generic object at the API-validation layer. Informal expected shapes per
            method (from `lib/affiliate/validators.ts`'s unused-by-this-route
            per-method schemas):
            BANK_TRANSFER: {accountName, bankName, accountNumber, routingNumber?, swiftCode?, iban?};
            PAYPAL: {email}; CRYPTOCURRENCY: {walletAddress, network: USDT_TRC20|USDT_ERC20|BTC|ETH};
            WISE: {email, accountId?}.
          example: { 'email': 'john@wise.com' }

    PaymentMethodUpdateResponse:
      type: object
      required: [success, message, paymentMethod]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Payment method updated successfully'
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
          example: 'WISE'

    # ============================================
    # AFFILIATE DASHBOARD
    # ============================================
    DashboardStats:
      type: object
      description: Return shape of `buildDashboardStats()` in `lib/affiliate/report-builder.ts`
      required:
        [
          activeCodes,
          usedCodes,
          expiredCodes,
          totalEarnings,
          pendingBalance,
          paidBalance,
          conversionRate,
        ]
      properties:
        activeCodes:
          type: integer
          example: 12
        usedCodes:
          type: integer
          example: 8
        expiredCodes:
          type: integer
          example: 5
        totalEarnings:
          type: number
          format: double
          description: 'AffiliateProfile.totalEarnings (not recomputed from Commission rows)'
          example: 198.18
        pendingBalance:
          type: number
          format: double
          example: 55.68
        paidBalance:
          type: number
          format: double
          example: 142.50
        conversionRate:
          type: number
          format: double
          description: 'totalCodesUsed / totalCodesDistributed * 100, rounded to 2 decimals'
          example: 26.7

    AffiliateCode:
      type: object
      description: |
        Raw `AffiliateCode` row. `discountPercent`/`commissionPercent` are `Int` in
        the Prisma schema (snapshot at creation), and the usage field is `usedBy`
        (a userId), not `usedByUserId`.
      properties:
        id:
          type: string
          example: 'clc1a2b3c4d5e6f7g8h9i0j1'
        code:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          example: 'ABCD1234'
        affiliateProfileId:
          type: string
          example: 'clx1a2b3c4d5e6f7g8h9i0j1'
        discountPercent:
          type: integer
          example: 20
        commissionPercent:
          type: integer
          example: 20
        status:
          type: string
          enum: [ACTIVE, USED, EXPIRED, CANCELLED]
        distributedAt:
          type: string
          format: date-time
        distributionReason:
          type: string
          enum: [INITIAL, MONTHLY, ADMIN_BONUS]
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        usedBy:
          type: string
          nullable: true
          description: userId that redeemed this code, if any
        subscriptionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CodesListResponse:
      type: object
      description: |
        Flat pagination shape actually returned by
        `GET /api/affiliate/dashboard/codes` — `{codes, total, page, limit}`, not a
        nested `pagination`/`totalPages`/`hasMore` object.
      required: [codes, total, page, limit]
      properties:
        codes:
          type: array
          items:
            $ref: '#/components/schemas/AffiliateCode'
        total:
          type: integer
          example: 45
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20

    CodeInventoryReport:
      type: object
      description: Return shape of `buildCodeInventoryReport()` in `lib/affiliate/report-builder.ts`
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        openingBalance:
          type: integer
          example: 10
        additions:
          type: object
          description: 'Field is `initialDistribution`, not `initial`.'
          properties:
            monthlyDistribution:
              type: integer
              example: 15
            initialDistribution:
              type: integer
              example: 0
            bonusDistribution:
              type: integer
              example: 5
            total:
              type: integer
              example: 20
        reductions:
          type: object
          properties:
            used:
              type: integer
              example: 8
            expired:
              type: integer
              example: 3
            cancelled:
              type: integer
              example: 0
            total:
              type: integer
              example: 11
        closingBalance:
          type: integer
          example: 19

    Commission:
      type: object
      description: |
        Raw `Commission` row plus a nested `affiliateCode: {code, usedAt}` selection
        added by the commission-report route's `include`.
      properties:
        id:
          type: string
          example: 'clm1a2b3c4d5e6f7g8h9i0j1'
        affiliateProfileId:
          type: string
          example: 'clx1a2b3c4d5e6f7g8h9i0j1'
        affiliateCodeId:
          type: string
          example: 'clc1a2b3c4d5e6f7g8h9i0j1'
        userId:
          type: string
          description: Customer who used the code
          example: 'clu9z8y7x6w5v4u3t2s1r0q9'
        subscriptionId:
          type: string
          nullable: true
        grossRevenue:
          type: number
          format: double
          example: 29.00
        discountAmount:
          type: number
          format: double
          example: 5.80
        netRevenue:
          type: number
          format: double
          example: 23.20
        commissionAmount:
          type: number
          format: double
          example: 4.64
        commissionPercent:
          type: number
          format: double
          example: 20.0
        status:
          type: string
          enum: [PENDING, APPROVED, PAID, CANCELLED]
        earnedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        affiliateCode:
          type: object
          description: Joined via Prisma `include` in the commission-report route only
          properties:
            code:
              type: string
              example: 'ABCD1234'
            usedAt:
              type: string
              format: date-time
              nullable: true

    CommissionReportResponse:
      type: object
      description: Return shape of `GET /api/affiliate/dashboard/commission-report`
      required: [summary, commissions, pagination]
      properties:
        summary:
          type: object
          description: Return shape of `buildCommissionSummary()`
          properties:
            totalEarned:
              type: number
              format: double
              description: pending + approved + paid
              example: 198.18
            pending:
              type: number
              format: double
              example: 55.68
            approved:
              type: number
              format: double
              example: 0
            paid:
              type: number
              format: double
              example: 142.50
            cancelled:
              type: number
              format: double
              example: 0
            thisMonth:
              type: number
              format: double
              example: 23.20
            lastMonth:
              type: number
              format: double
              example: 41.76
        commissions:
          type: array
          items:
            $ref: '#/components/schemas/Commission'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 34
            totalPages:
              type: integer
              example: 2
