openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Part 17 Affiliate Marketing Platform API
  description: |
    Complete API specification for the Affiliate Marketing Platform (Part 17).

    **Last Updated:** 2026-01-24

    ## Overview
    This document covers all API endpoints for:
    - **Part 17A**: Affiliate Portal (Registration, Dashboard, Profile, Checkout Integration)
    - **Part 17B**: Admin Portal (Management, Reports, Settings, Automation)

    ## Authentication
    - **Affiliate Routes**: Require NextAuth session with `isAffiliate: true`
    - **Admin Routes**: Require NextAuth session with `role: 'ADMIN'`
    - **Cron Routes**: Require `CRON_SECRET` bearer token
    - **Public Routes**: No authentication required (cached)

    ## Commission Model (Percentage-Based)
    - **Customer Discount**: 20% off regular price ($29.00 → $23.20) - configurable
    - **Affiliate Commission**: 20% of net revenue ($23.20 × 20% = $4.64) - configurable
    - Both percentages are dynamically configurable via **SystemConfig** database table

    ## Database Architecture
    The affiliate system uses a **normalized flat-column structure**:
    - **AffiliateProfile**: 16 columns (user info, social URLs, payment, stats, status)
    - **AffiliateCode**: 11 columns (code, config, status, dates, usage tracking)
    - **Commission**: 14 columns (amounts breakdown, status, payment tracking)
    - **SystemConfig**: Dynamic configuration storage with audit trail

    ## SystemConfig Keys
    - `affiliate_discount_percent`: Customer discount percentage (default: 20.0)
    - `affiliate_commission_percent`: Affiliate commission percentage (default: 20.0)
    - `affiliate_codes_per_month`: Monthly code distribution count (default: 15)
    - `affiliate_base_price`: Base subscription price (default: 29.0)
    - `affiliate_three_day_price`: 3-day trial price (default: 1.0)

    Configuration changes are:
    - Audited via `SystemConfigHistory` table
    - Applied in real-time (no restart required)
    - Managed via Admin Settings endpoints

  version: 2.0.0
  contact:
    name: Trading Alerts Team
  license:
    name: Proprietary

servers:
  - url: /api
    description: API base path

tags:
  - name: Affiliate Auth
    description: Affiliate registration and email verification
  - name: Affiliate Dashboard
    description: Affiliate dashboard statistics and reports
  - name: Affiliate Profile
    description: Affiliate profile management
  - name: Public Config
    description: Public configuration endpoints (no auth required)
  - name: Checkout
    description: Checkout with affiliate code support
  - name: Admin Affiliates
    description: Admin affiliate management
  - name: Admin Reports
    description: Admin BI reports (P&L, Sales, Commissions, Code Inventory)
  - name: Admin Settings
    description: Admin affiliate settings management
  - name: Cron Jobs
    description: Scheduled automation jobs
  - name: Disbursement
    description: Part 19 integration - affiliate disbursement endpoints

paths:
  # ============================================
  # PUBLIC CONFIGURATION ENDPOINTS
  # ============================================
  /config/affiliate:
    get:
      tags:
        - Public Config
      summary: Get public affiliate configuration
      description: |
        Returns public affiliate configuration values.
        No authentication required. Cached for 5 minutes.

        Use this endpoint to display discount information to potential customers.
      operationId: getPublicAffiliateConfig
      responses:
        '200':
          description: Public affiliate configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAffiliateConfig'
              example:
                discountPercent: 20.0
                commissionPercent: 20.0
                codesPerMonth: 15
                basePrice: 29.0
                threeDayPrice: 1.0

  # ============================================
  # AFFILIATE AUTH ENDPOINTS
  # ============================================
  /affiliate/auth/register:
    post:
      tags:
        - Affiliate Auth
      summary: Register as affiliate
      description: |
        Register the currently authenticated user as an affiliate.
        Creates an AffiliateProfile and sets `User.isAffiliate = true`.
        Sends verification email to the user.

        **Required fields:**
        - fullName: Legal name for payments
        - country: 2-letter ISO code
        - paymentMethod: BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, or WISE
        - paymentDetails: Method-specific details (JSON)
        - terms: Must be true

        **Optional fields:**
        - youtubeUrl, twitterUrl, instagramUrl, tiktokUrl, websiteUrl
      operationId: registerAffiliate
      security:
        - NextAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateRegistrationRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateRegistrationResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already registered as affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affiliate/auth/verify-email:
    post:
      tags:
        - Affiliate Auth
      summary: Verify affiliate email
      description: |
        Verify affiliate email using the token sent via email.
        On success:
        - Sets `AffiliateProfile.status = 'ACTIVE'`
        - Distributes initial 15 codes to affiliate (uses SystemConfig.affiliate_codes_per_month)
        - Clears verification token
        - Sends welcome email with codes
      operationId: verifyAffiliateEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Email verification token
                  example: 'abc123def456...'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Email verified. Initial codes distributed.'
                  codesDistributed:
                    type: integer
                    example: 15
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # AFFILIATE DASHBOARD ENDPOINTS
  # ============================================
  /affiliate/dashboard/stats:
    get:
      tags:
        - Affiliate Dashboard
      summary: Get affiliate dashboard statistics
      description: |
        Returns aggregate statistics for the authenticated affiliate.

        **Statistics included:**
        - activeCodes: Unused, unexpired codes
        - usedCodes: Codes redeemed by customers
        - totalEarnings: All-time commission total
        - pendingBalance: Unpaid commissions
        - paidBalance: Total commissions paid out
      operationId: getAffiliateDashboardStats
      security:
        - AffiliateAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateDashboardStats'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affiliate/dashboard/codes:
    get:
      tags:
        - Affiliate Dashboard
      summary: List affiliate codes
      description: |
        Returns paginated list of affiliate's codes with optional status filter.

        **Default behavior:**
        - Returns ACTIVE codes first
        - Sorted by distributedAt (newest first)
      operationId: getAffiliateCodes
      security:
        - AffiliateAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by code status
          schema:
            type: string
            enum: [ACTIVE, USED, EXPIRED, CANCELLED]
            default: ACTIVE
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated codes list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCodesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affiliate/dashboard/code-inventory:
    get:
      tags:
        - Affiliate Dashboard
      summary: Get code inventory report
      description: |
        Returns a detailed code inventory report showing:
        - Opening balance (start of period)
        - Additions (monthly distribution, bonus distribution)
        - Reductions (used, expired, cancelled)
        - Closing balance (current)

        **Period:** Current calendar month by default
      operationId: getAffiliateCodeInventory
      security:
        - AffiliateAuth: []
      parameters:
        - name: period
          in: query
          description: Report period
          schema:
            type: string
            enum: [current_month, last_month, last_3_months]
            default: current_month
      responses:
        '200':
          description: Code inventory report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeInventoryReport'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affiliate/dashboard/commission-report:
    get:
      tags:
        - Affiliate Dashboard
      summary: Get commission report
      description: |
        Returns paginated list of affiliate's commissions with code details.

        **Includes:**
        - Commission amount and status
        - Associated code reference
        - Earning date and payment date (if paid)
        - Summary totals
      operationId: getAffiliateCommissionReport
      security:
        - AffiliateAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by commission status
          schema:
            type: string
            enum: [PENDING, APPROVED, PAID, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated commission report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionReportResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # AFFILIATE PROFILE ENDPOINTS
  # ============================================
  /affiliate/profile:
    get:
      tags:
        - Affiliate Profile
      summary: Get affiliate profile
      description: Returns the authenticated affiliate's full profile
      operationId: getAffiliateProfile
      security:
        - AffiliateAuth: []
      responses:
        '200':
          description: Affiliate profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Affiliate Profile
      summary: Update affiliate profile
      description: |
        Updates the authenticated affiliate's profile.

        **Updatable fields:**
        - fullName
        - country
        - youtubeUrl, twitterUrl, instagramUrl, tiktokUrl, websiteUrl
      operationId: updateAffiliateProfile
      security:
        - AffiliateAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateProfileUpdate'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateProfile'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /affiliate/profile/payment:
    put:
      tags:
        - Affiliate Profile
      summary: Update payment method
      description: |
        Updates the affiliate's payment method and details.

        **Payment Methods:**
        - BANK_TRANSFER: Requires bankName, accountNumber, routingNumber, accountHolderName
        - PAYPAL: Requires email
        - CRYPTOCURRENCY: Requires walletAddress, network (ETH, BTC, USDT)
        - WISE: Requires email
      operationId: updateAffiliatePayment
      security:
        - AffiliateAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodUpdate'
      responses:
        '200':
          description: Payment method updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateProfile'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # CHECKOUT ENDPOINTS (WITH AFFILIATE SUPPORT)
  # ============================================
  /checkout/validate-code:
    post:
      tags:
        - Checkout
      summary: Validate affiliate code
      description: |
        Validates an affiliate code for use at checkout.
        Returns discount information if valid.

        **Validation checks:**
        - Code exists
        - Code status is ACTIVE
        - Code not expired
        - Affiliate is active
      operationId: validateAffiliateCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: '^[A-Z0-9]{8}$'
                  example: 'ABCD1234'
      responses:
        '200':
          description: Valid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeValidationResponse'
        '400':
          description: Code not active or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /checkout:
    post:
      tags:
        - Checkout
      summary: Create checkout session
      description: |
        Creates a Stripe checkout session.
        If an affiliate code is provided and valid:
        - Applies discount percentage to price
        - Stores affiliateCodeId in session metadata
        - Creates commission record on successful payment (via webhook)
      operationId: createCheckoutSession
      security:
        - NextAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - priceId
              properties:
                priceId:
                  type: string
                  example: 'price_pro'
                affiliateCode:
                  type: string
                  pattern: '^[A-Z0-9]{8}$'
                  description: Optional affiliate code for discount
                  example: 'ABCD1234'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    description: Stripe checkout session ID
                    example: 'cs_test_123...'
                  url:
                    type: string
                    format: uri
                    description: Redirect URL for checkout
                  discountApplied:
                    type: boolean
                    example: true
                  originalPrice:
                    type: number
                    example: 29.00
                  finalPrice:
                    type: number
                    example: 23.20
        '400':
          description: Invalid affiliate code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # ADMIN AFFILIATE MANAGEMENT ENDPOINTS
  # ============================================
  /admin/affiliates:
    get:
      tags:
        - Admin Affiliates
      summary: List all affiliates
      description: |
        Returns paginated list of all affiliates with comprehensive filters.

        **Filter options:**
        - status: Filter by account status
        - country: Filter by 2-letter country code
        - paymentMethod: Filter by payment method

        **Includes:**
        - User email and name
        - Code and commission statistics
        - Balance information
      operationId: listAffiliates
      security:
        - AdminAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PENDING_VERIFICATION, SUSPENDED, DELETED]
        - name: country
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - name: paymentMethod
          in: query
          schema:
            type: string
            enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
        - name: search
          in: query
          description: Search by name or email
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, fullName, pendingBalance, codesUsed]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated affiliates list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAffiliatesListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/affiliates/{id}:
    get:
      tags:
        - Admin Affiliates
      summary: Get affiliate details
      description: |
        Returns comprehensive information about a specific affiliate.

        **Includes:**
        - Full profile with social links
        - All codes (with status breakdown)
        - Recent commissions
        - User account details
        - Suspension history (if applicable)
      operationId: getAffiliateById
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Affiliate profile ID
      responses:
        '200':
          description: Affiliate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAffiliateDetail'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/affiliates/{id}/distribute-codes:
    post:
      tags:
        - Admin Affiliates
      summary: Distribute bonus codes
      description: |
        Distribute additional codes to an active affiliate.
        Uses the same code generation logic as monthly distribution.

        **Requirements:**
        - Affiliate must be ACTIVE
        - Count must be 1-50
        - Reason is required for audit trail

        **Actions:**
        - Creates new codes with ADMIN_BONUS distribution reason
        - Updates affiliate's codesDistributed count
        - Sends notification email
      operationId: distributeCodesByAdmin
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Affiliate profile ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
                - reason
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  example: 10
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: 'Bonus for excellent Q4 performance'
      responses:
        '200':
          description: Codes distributed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Distributed 10 codes to affiliate'
                  codesCreated:
                    type: integer
                    example: 10
                  codes:
                    type: array
                    items:
                      type: string
                    example: ['ABCD1234', 'EFGH5678']
        '400':
          description: Cannot distribute to inactive affiliate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/affiliates/{id}/suspend:
    post:
      tags:
        - Admin Affiliates
      summary: Suspend affiliate
      description: |
        Suspends an affiliate account with a reason.

        **Actions:**
        - Sets status to SUSPENDED
        - Records suspensionReason and suspendedAt
        - Deactivates all active codes
        - Sends suspension notification email

        **Note:** Pending commissions are preserved but not payable until reactivated.
      operationId: suspendAffiliate
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Affiliate profile ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: 'Violation of terms of service - spam complaints'
      responses:
        '200':
          description: Affiliate suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Affiliate suspended'
                  affiliate:
                    $ref: '#/components/schemas/AffiliateProfile'
        '400':
          description: Affiliate already suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/affiliates/{id}/reactivate:
    post:
      tags:
        - Admin Affiliates
      summary: Reactivate affiliate
      description: |
        Reactivates a previously suspended affiliate account.

        **Actions:**
        - Sets status to ACTIVE
        - Clears suspensionReason and suspendedAt
        - Sends reactivation notification email

        **Note:** Previously deactivated codes remain cancelled. New codes can be distributed.
      operationId: reactivateAffiliate
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Affiliate profile ID
      responses:
        '200':
          description: Affiliate reactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Affiliate reactivated'
                  affiliate:
                    $ref: '#/components/schemas/AffiliateProfile'
        '400':
          description: Affiliate not suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # ADMIN REPORTS ENDPOINTS
  # ============================================
  /admin/affiliates/reports/profit-loss:
    get:
      tags:
        - Admin Reports
      summary: Get P&L report
      description: |
        Returns comprehensive profit and loss report for affiliate program.

        **Includes:**
        - Gross revenue (at regular price)
        - Discounts given to customers
        - Net revenue (after discounts)
        - Commissions (paid and pending)
        - Net profit and margin percentage
        - Month-by-month breakdown
      operationId: getProfitLossReport
      security:
        - AdminAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1month, 3months, 6months, 1year, all]
            default: 3months
      responses:
        '200':
          description: P&L report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitLossReport'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/affiliates/reports/sales-performance:
    get:
      tags:
        - Admin Reports
      summary: Get sales performance report
      description: |
        Returns top performing affiliates by conversions.

        **Metrics per affiliate:**
        - Total conversions
        - Conversion rate (codes used / codes distributed)
        - Total commissions earned
        - Average commission per conversion
      operationId: getSalesPerformanceReport
      security:
        - AdminAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1month, 3months, 6months, 1year]
            default: 3months
        - name: limit
          in: query
          description: Number of top performers to return
          schema:
            type: integer
            minimum: 5
            maximum: 50
            default: 10
      responses:
        '200':
          description: Sales performance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPerformanceReport'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/affiliates/reports/commission-owings:
    get:
      tags:
        - Admin Reports
      summary: Get commission owings report
      description: |
        Returns affiliates with pending commissions >= minimum payout threshold.

        **Default minimum payout:** $50.00 (configurable via SystemConfig)

        **Includes:**
        - Affiliate details and payment method
        - Pending balance
        - Number of pending commissions
        - Last payment date (if any)
      operationId: getCommissionOwingsReport
      security:
        - AdminAuth: []
      parameters:
        - name: minBalance
          in: query
          description: Minimum balance filter (overrides default)
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Commission owings report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionOwingsReport'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/affiliates/reports/code-inventory:
    get:
      tags:
        - Admin Reports
      summary: Get global code inventory report
      description: |
        Returns global code inventory statistics across all affiliates.

        **Summary metrics:**
        - Total codes distributed (all time)
        - Currently active codes
        - Used codes (conversions)
        - Expired codes
        - Cancelled codes
        - Overall usage rate

        **Monthly breakdown:** Distribution and usage by month
      operationId: getGlobalCodeInventoryReport
      security:
        - AdminAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [3months, 6months, 1year]
            default: 6months
      responses:
        '200':
          description: Global code inventory report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalCodeInventoryReport'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # ADMIN SETTINGS ENDPOINTS
  # ============================================
  /admin/settings/affiliate:
    get:
      tags:
        - Admin Settings
      summary: Get affiliate settings
      description: |
        Returns current affiliate program configuration.

        **Settings:**
        - discountPercent: Customer discount
        - commissionPercent: Affiliate commission
        - codesPerMonth: Monthly distribution count
        - basePrice: Regular subscription price
        - threeDayPrice: Trial price
        - minimumPayout: Minimum balance for payout
      operationId: getAffiliateSettings
      security:
        - AdminAuth: []
      responses:
        '200':
          description: Current affiliate settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateSettings'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Admin Settings
      summary: Update affiliate settings
      description: |
        Updates affiliate program configuration.

        **All changes are:**
        - Validated for reasonable ranges
        - Audited in SystemConfigHistory
        - Applied immediately (no restart)

        **Validation:**
        - discountPercent: 0-50%
        - commissionPercent: 0-50%
        - codesPerMonth: 1-100
        - basePrice: > 0
      operationId: updateAffiliateSettings
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateSettingsUpdate'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  settings:
                    $ref: '#/components/schemas/AffiliateSettings'
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        previousValue:
                          type: string
                        newValue:
                          type: string
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # CRON JOB ENDPOINTS
  # ============================================
  /cron/distribute-codes:
    post:
      tags:
        - Cron Jobs
      summary: Monthly code distribution
      description: |
        Cron job that runs on the 1st of each month.
        Distributes codes to all active affiliates.

        **Schedule**: `0 0 1 * *` (00:00 UTC on 1st of month)

        **Actions:**
        - Queries all ACTIVE affiliates
        - Generates 15 unique codes per affiliate (uses SystemConfig)
        - Creates AffiliateCode records with MONTHLY distribution reason
        - Updates codesDistributed count
        - Sends notification emails

        **Idempotent:** Safe to retry if partially failed
      operationId: cronDistributeCodes
      security:
        - CronAuth: []
      responses:
        '200':
          description: Distribution completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronJobResponse'
        '401':
          description: Invalid cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cron/expire-codes:
    post:
      tags:
        - Cron Jobs
      summary: Expire old codes
      description: |
        Cron job that runs at end of each month.
        Marks all expired codes as EXPIRED.

        **Schedule**: `59 23 28-31 * *` (23:59 UTC on days 28-31)

        **Actions:**
        - Queries codes where expiresAt <= now AND status = ACTIVE
        - Updates status to EXPIRED

        **Note:** Handles variable month lengths automatically
      operationId: cronExpireCodes
      security:
        - CronAuth: []
      responses:
        '200':
          description: Expiry check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronJobResponse'
        '401':
          description: Invalid cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cron/send-monthly-reports:
    post:
      tags:
        - Cron Jobs
      summary: Send monthly reports
      description: |
        Cron job that runs on the 1st of each month.
        Sends monthly performance report emails to all active affiliates.

        **Schedule**: `0 6 1 * *` (06:00 UTC on 1st of month)

        **Report includes:**
        - Previous month's performance summary
        - Codes distributed vs used
        - Conversions and earnings
        - Comparison to previous month
      operationId: cronSendMonthlyReports
      security:
        - CronAuth: []
      responses:
        '200':
          description: Reports sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronJobResponse'
        '401':
          description: Invalid cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # DISBURSEMENT INTEGRATION (PART 19)
  # ============================================
  /disbursement/reports/affiliate/{affiliateId}:
    get:
      tags:
        - Disbursement
      summary: Get affiliate disbursement report
      description: |
        Returns disbursement history and pending payouts for a specific affiliate.

        **Part 19 Integration:** This endpoint integrates with the RiseWorks
        disbursement system for processing actual payments.

        **Includes:**
        - Pending commissions eligible for payout
        - Payment history
        - RiseWorks account status
      operationId: getAffiliateDisbursementReport
      security:
        - AdminAuth: []
      parameters:
        - name: affiliateId
          in: path
          required: true
          schema:
            type: string
          description: Affiliate profile ID
      responses:
        '200':
          description: Disbursement report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateDisbursementReport'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    NextAuth:
      type: http
      scheme: bearer
      description: NextAuth session cookie authentication
    AffiliateAuth:
      type: http
      scheme: bearer
      description: NextAuth session with isAffiliate=true
    AdminAuth:
      type: http
      scheme: bearer
      description: NextAuth session with role=ADMIN
    CronAuth:
      type: http
      scheme: bearer
      description: CRON_SECRET environment variable

  schemas:
    # ============================================
    # COMMON SCHEMAS
    # ============================================
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: 'Error message'
        code:
          type: string
          example: 'NOT_FOUND'

    ValidationError:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: 'Validation failed'
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
        hasMore:
          type: boolean
          example: true

    # ============================================
    # PUBLIC CONFIG SCHEMAS
    # ============================================
    PublicAffiliateConfig:
      type: object
      description: Public affiliate configuration (no auth required)
      properties:
        discountPercent:
          type: number
          format: double
          description: Customer discount percentage
          example: 20.0
        commissionPercent:
          type: number
          format: double
          description: Affiliate commission percentage
          example: 20.0
        codesPerMonth:
          type: integer
          description: Codes distributed monthly
          example: 15
        basePrice:
          type: number
          format: double
          description: Base subscription price
          example: 29.0
        threeDayPrice:
          type: number
          format: double
          description: 3-day trial price
          example: 1.0

    # ============================================
    # AFFILIATE SCHEMAS
    # ============================================
    AffiliateRegistrationRequest:
      type: object
      required:
        - fullName
        - country
        - paymentMethod
        - paymentDetails
        - terms
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: 'John Doe'
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code
          example: 'US'
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
          example: 'PAYPAL'
        paymentDetails:
          type: object
          description: Payment method specific details
          example: { 'email': 'john@paypal.com' }
        terms:
          type: boolean
          description: Must be true to accept terms
          example: true
        youtubeUrl:
          type: string
          format: uri
          example: 'https://youtube.com/@johndoe'
        twitterUrl:
          type: string
          format: uri
          example: 'https://twitter.com/johndoe'
        instagramUrl:
          type: string
          format: uri
          example: 'https://instagram.com/johndoe'
        tiktokUrl:
          type: string
          format: uri
          example: 'https://tiktok.com/@johndoe'
        websiteUrl:
          type: string
          format: uri
          example: 'https://johndoe.com'

    AffiliateRegistrationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Registration successful. Please verify your email.'
        affiliateId:
          type: string
          format: uuid

    AffiliateProfile:
      type: object
      description: Full affiliate profile (16 columns from flat schema)
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fullName:
          type: string
          example: 'John Doe'
        country:
          type: string
          example: 'US'
        youtubeUrl:
          type: string
          format: uri
          nullable: true
        twitterUrl:
          type: string
          format: uri
          nullable: true
        instagramUrl:
          type: string
          format: uri
          nullable: true
        tiktokUrl:
          type: string
          format: uri
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
        paymentDetails:
          type: object
        codesDistributed:
          type: integer
          description: Total codes ever distributed
          example: 45
        codesUsed:
          type: integer
          description: Total codes redeemed
          example: 12
        pendingBalance:
          type: number
          format: double
          description: Unpaid commission balance
          example: 55.68
        paidBalance:
          type: number
          format: double
          description: Total paid out
          example: 142.50
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DELETED]
        verificationToken:
          type: string
          nullable: true
        suspensionReason:
          type: string
          nullable: true
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AffiliateProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        country:
          type: string
          minLength: 2
          maxLength: 2
        youtubeUrl:
          type: string
          format: uri
          nullable: true
        twitterUrl:
          type: string
          format: uri
          nullable: true
        instagramUrl:
          type: string
          format: uri
          nullable: true
        tiktokUrl:
          type: string
          format: uri
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true

    PaymentMethodUpdate:
      type: object
      required:
        - paymentMethod
        - paymentDetails
      properties:
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
          example: 'WISE'
        paymentDetails:
          type: object
          description: Payment method specific details
          example: { 'email': 'john@wise.com' }

    AffiliateDashboardStats:
      type: object
      properties:
        activeCodes:
          type: integer
          description: Number of active (unused, unexpired) codes
          example: 12
        usedCodes:
          type: integer
          description: Number of codes used for purchases
          example: 8
        expiredCodes:
          type: integer
          description: Number of expired codes
          example: 5
        totalEarnings:
          type: number
          format: double
          description: Total commissions earned (all time)
          example: 198.18
        pendingBalance:
          type: number
          format: double
          description: Pending commissions not yet paid
          example: 55.68
        paidBalance:
          type: number
          format: double
          description: Total commissions paid out
          example: 142.50
        conversionRate:
          type: number
          format: double
          description: Percentage of distributed codes used
          example: 26.7

    AffiliateCode:
      type: object
      description: Affiliate code (11 columns from flat schema)
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          example: 'ABCD1234'
        affiliateProfileId:
          type: string
          format: uuid
        discountPercent:
          type: number
          format: double
          description: Customer discount (snapshot at creation)
          example: 20.0
        commissionPercent:
          type: number
          format: double
          description: Affiliate commission (snapshot at creation)
          example: 20.0
        status:
          type: string
          enum: [ACTIVE, USED, EXPIRED, CANCELLED]
        distributedAt:
          type: string
          format: date-time
        distributionReason:
          type: string
          enum: [INITIAL, MONTHLY, ADMIN_BONUS]
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
          nullable: true
        usedByUserId:
          type: string
          format: uuid
          nullable: true
        subscriptionId:
          type: string
          nullable: true

    AffiliateCodesResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            codes:
              type: array
              items:
                $ref: '#/components/schemas/AffiliateCode'

    CodeInventoryReport:
      type: object
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        openingBalance:
          type: integer
          example: 10
        additions:
          type: object
          properties:
            initial:
              type: integer
              example: 0
            monthlyDistribution:
              type: integer
              example: 15
            bonusDistribution:
              type: integer
              example: 5
            total:
              type: integer
              example: 20
        reductions:
          type: object
          properties:
            used:
              type: integer
              example: 8
            expired:
              type: integer
              example: 3
            cancelled:
              type: integer
              example: 0
            total:
              type: integer
              example: 11
        closingBalance:
          type: integer
          example: 19

    Commission:
      type: object
      description: Commission record (14 columns from flat schema)
      properties:
        id:
          type: string
          format: uuid
        affiliateProfileId:
          type: string
          format: uuid
        affiliateCodeId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: Customer who used the code
        grossRevenue:
          type: number
          format: double
          description: Original price before discount
          example: 29.00
        discountAmount:
          type: number
          format: double
          description: Discount given to customer
          example: 5.80
        netRevenue:
          type: number
          format: double
          description: Amount charged to customer
          example: 23.20
        commissionAmount:
          type: number
          format: double
          description: Affiliate's commission
          example: 4.64
        status:
          type: string
          enum: [PENDING, APPROVED, PAID, CANCELLED]
        earnedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        paymentReference:
          type: string
          nullable: true
          description: External payment reference (e.g., RiseWorks ID)
        affiliateCode:
          type: object
          properties:
            code:
              type: string
              example: 'ABCD1234'

    CommissionReportResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            commissions:
              type: array
              items:
                $ref: '#/components/schemas/Commission'
            summary:
              type: object
              properties:
                totalPending:
                  type: number
                  format: double
                totalPaid:
                  type: number
                  format: double
                totalCancelled:
                  type: number
                  format: double

    CodeValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        code:
          type: string
          example: 'ABCD1234'
        discountPercent:
          type: number
          format: double
          description: Discount percentage to apply
          example: 20.0
        affiliateId:
          type: string
          format: uuid
          description: ID of the affiliate profile
        expiresAt:
          type: string
          format: date-time

    # ============================================
    # ADMIN SCHEMAS
    # ============================================
    AdminAffiliateDetail:
      allOf:
        - $ref: '#/components/schemas/AffiliateProfile'
        - type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                name:
                  type: string
            codesSummary:
              type: object
              properties:
                active:
                  type: integer
                used:
                  type: integer
                expired:
                  type: integer
                cancelled:
                  type: integer
            recentCodes:
              type: array
              items:
                $ref: '#/components/schemas/AffiliateCode'
            recentCommissions:
              type: array
              items:
                $ref: '#/components/schemas/Commission'

    AdminAffiliatesListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            affiliates:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/AffiliateProfile'
                  - type: object
                    properties:
                      user:
                        type: object
                        properties:
                          email:
                            type: string
                            format: email
                          name:
                            type: string
            summary:
              type: object
              properties:
                totalActive:
                  type: integer
                totalPending:
                  type: integer
                totalSuspended:
                  type: integer
                totalPendingBalance:
                  type: number
                  format: double

    ProfitLossReport:
      type: object
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        revenue:
          type: object
          properties:
            grossRevenue:
              type: number
              format: double
              description: Total revenue at regular price
              example: 870.00
            discounts:
              type: number
              format: double
              description: Total discounts given
              example: 174.00
            netRevenue:
              type: number
              format: double
              description: Revenue after discounts
              example: 696.00
