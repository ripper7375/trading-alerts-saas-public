  - name: API Usage
    description: API usage monitoring (currently mock data)
  - name: Error Logs
    description: Error log management (currently mock data)
  - name: Affiliates
    description: Affiliate account management
  - name: Affiliate Reports
    description: Affiliate program reporting
  - name: Codes
    description: Affiliate code management
  - name: Commissions
