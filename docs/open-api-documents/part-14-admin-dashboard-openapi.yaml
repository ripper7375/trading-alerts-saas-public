  - name: Settings
    description: System configuration management
  - name: Fraud Alerts
    description: Fraud detection and alert management

paths:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # CORE ADMIN ENDPOINTS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/admin/users:
    get:
      tags:
        - Users
      summary: List all users
      description: |
        Retrieves a paginated, sortable list of users.

        **Corrected vs. prior spec**: the previous version of this file documented a
        `role` filter and a `limit` param, and a response wrapped in `{ users,
        pagination: { page, limit, total, totalPages } }` with `emailVerified` and
        `isAffiliate` fields on each user. None of that matches the live handler.
        There is **no `role` filter**, the page-size param is **`pageSize`** (not
        `limit`), the response is a **flat** object (`{ users, total, page, pageSize,
        totalPages }`, not nested under `pagination`), and each user has **`status`**
        (`'active' | 'suspended'`, derived from `isActive`) and **`alertCount`**
        instead of `emailVerified`/`isAffiliate` (neither of which exists on the
        response type). `lastLoginAt` is an *estimate* — derived from the most recent
        session's `expires` date minus the 30-day NextAuth session duration, not a
        real last-login timestamp.

        **Auth**: direct pattern (`getServerSession` + inline role check).

        **Implementation**: `app/api/admin/users/route.ts` (GET)
      operationId: getUsers
      parameters:
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: pageSize
          in: query
          required: false
          description: Users per page
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 50
          example: 50
        - name: search
          in: query
          required: false
          description: Search by name or email (case-insensitive contains)
          schema:
            type: string
          example: 'john'
        - name: tier
          in: query
          required: false
          description: Filter by subscription tier
          schema:
            type: string
            enum: [ALL, FREE, PRO]
            default: ALL
          example: PRO
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [createdAt, name, tier]
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdminAccess'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/analytics:
    get:
      tags:
        - Analytics
      summary: Get system analytics
      description: |
        Retrieves platform-wide user/revenue/growth metrics.

        **Corrected vs. prior spec**: the previous version documented `startDate`/
        `endDate` query params and a response shaped `{ users, subscriptions, alerts,
        watchlist, apiUsage }`. The live handler takes **no query parameters at all**
        (`export async function GET()` — no `NextRequest` argument) and returns a
        completely different, smaller shape: `{ overview, revenue, growth }`. There is
        no alerts/watchlist/apiUsage section — those metrics don't exist on this
        endpoint. Revenue is computed as `proUsers * 29` (hardcoded `PRO_MONTHLY_PRICE`
        constant), not read from actual subscription/payment records, and
        `churnedThisMonth` is a hardcoded `0` placeholder (subscription-history
        tracking isn't wired up yet).

        **Auth**: direct pattern (`getServerSession` + inline role check).

        **Implementation**: `app/api/admin/analytics/route.ts` (GET)
      operationId: getAnalytics
      responses:
        '200':
          description: Analytics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdminAccess'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/api-usage:
    get:
      tags:
        - API Usage
      summary: Get API usage statistics
      description: |
        Retrieves per-endpoint API usage statistics.

        **⚠️ Mock data**: the handler has a `MOCK DATA GENERATOR` section with an
        explicit `PRODUCTION TODO` comment — there is no `ApiUsageLog` table yet, so
        this always returns the same synthetic 8-endpoint dataset regardless of the
        date range given, tagged with response header `X-Data-Source: mock`.

        **Corrected vs. prior spec**: the previous version documented `endpoint` and
        `userId` query filters and a response shaped `{ summary, byEndpoint, byTier,
        timeline }`. Neither filter exists on the live `querySchema` (only `startDate`/
        `endDate` are accepted), and the real response shape is `{ endpoints, summary,
        dateRange }` — `endpoints` is a flat array (not keyed by endpoint), there's no
        `byTier` breakdown, and no `timeline` array.

        **Auth**: direct pattern (`getServerSession` + inline role check).

        **Implementation**: `app/api/admin/api-usage/route.ts` (GET)
      operationId: getApiUsage
      parameters:
        - name: startDate
          in: query
          required: false
          description: Start date (YYYY-MM-DD); defaults to 7 days ago. Accepted but does not affect the mock dataset's content.
          schema:
            type: string
          example: '2026-07-10'
        - name: endDate
          in: query
          required: false
          description: End date (YYYY-MM-DD); defaults to today. Accepted but does not affect the mock dataset's content.
          schema:
            type: string
          example: '2026-07-17'
      responses:
        '200':
          description: API usage retrieved successfully (mock data)
          headers:
            X-Data-Source:
              description: Always 'mock' — no real usage-tracking table exists yet
              schema:
                type: string
                example: mock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdminAccess'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/error-logs:
    get:
      tags:
        - Error Logs
      summary: Get error logs
      description: |
        Retrieves paginated system error logs.

        **⚠️ Mock data**: like `api-usage`, this has a `MOCK DATA GENERATOR` section
        with a `PRODUCTION TODO` comment — there is no `ErrorLog` table yet. It
        generates 100 synthetic log entries (cycling through 7 sample error templates)
        on every call, tagged with response header `X-Data-Source: mock`.

        **Corrected vs. prior spec**: the previous version documented `level`
        (error/warn/info) and `source` filters, a `limit` param, and a response with
        `{ logs, pagination }` where each log had `level`/`source`/`error`/`requestId`
        fields. None of that matches. The live filters are **`type`** (`ALL |
        API_ERROR | DATABASE_ERROR | AUTH_ERROR | PAYMENT_ERROR | MT5_ERROR`) and
        **`tier`** (`ALL | FREE | PRO`) — there is no `level` or `source` filter. The
        page-size param is **`pageSize`** (not `limit`). The response is **flat**
        (`{ logs, total, page, pageSize, totalPages }`, not nested under `pagination`),
        and each log entry has `type`/`userTier`/`metadata` fields instead of
        `level`/`source`/`error`/`requestId`. Note: `startDate`/`endDate` are accepted
        by the query schema but are **not actually applied as filters** in the mock
        generator (dead params, currently).

        **Auth**: direct pattern (`getServerSession` + inline role check).

        **Implementation**: `app/api/admin/error-logs/route.ts` (GET)
      operationId: getErrorLogs
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 50
        - name: type
          in: query
          required: false
          description: Error type filter
          schema:
            type: string
            enum:
              [
                ALL,
                API_ERROR,
                DATABASE_ERROR,
                AUTH_ERROR,
                PAYMENT_ERROR,
                MT5_ERROR,
              ]
            default: ALL
          example: API_ERROR
        - name: tier
          in: query
          required: false
          description: User tier filter
          schema:
            type: string
            enum: [ALL, FREE, PRO]
            default: ALL
        - name: startDate
          in: query
          required: false
          description: Accepted by the schema but not currently applied as a filter
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          description: Accepted by the schema but not currently applied as a filter
          schema:
            type: string
      responses:
        '200':
          description: Error logs retrieved successfully (mock data)
          headers:
            X-Data-Source:
              description: Always 'mock' — no real error-logging table exists yet
              schema:
                type: string
                example: mock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdminAccess'
        '500':
          $ref: '#/components/responses/InternalError'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AFFILIATE MANAGEMENT ENDPOINTS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/admin/affiliates:
    get:
      tags:
        - Affiliates
      summary: List all affiliates
      description: |
        Retrieves a paginated list of affiliates with filtering options.

        **Note**: only `GET` is implemented on this route — there is no `POST` handler
        in `app/api/admin/affiliates/route.ts` despite affiliate self-signup existing
        elsewhere in the app (`/api/affiliate/*`). Admins cannot create affiliate
        profiles directly through this admin route.

        **Corrected vs. prior spec**: the previous version wrapped pagination under
        `{ affiliates, pagination: { page, limit, total, totalPages } }`. The live
        handler (`getAffiliatesList` in `lib/admin/affiliate-management.ts`) returns a
        **flat** shape instead: `{ affiliates, total, page, limit, totalPages }`. Each
        affiliate item is also richer than previously documented — it's the full
        `AffiliateProfile` row (via Prisma `include`, no `select`) plus a nested
        `user: { email, name }` and `affiliateCodes` (only the affiliate's currently
        **ACTIVE** codes, each `{ id, code, status }`) — not a flattened `email` string
        and no codes array at all as the prior spec had it.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/route.ts` (GET)
      operationId: getAffiliates
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by affiliate status
          schema:
            type: string
            enum: [ACTIVE, PENDING_VERIFICATION, SUSPENDED, INACTIVE]
        - name: country
          in: query
          required: false
          description: Filter by country code
          schema:
            type: string
          example: 'US'
        - name: paymentMethod
          in: query
          required: false
          description: Filter by payment method
          schema:
            type: string
            enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 20
      responses:
        '200':
          description: Affiliates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliatesListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/affiliates/{id}:
    get:
      tags:
        - Affiliates
      summary: Get affiliate details
      description: |
        Retrieves detailed information for a specific affiliate including full
        profile data, user email, all affiliate codes (not just active ones), and the
        50 most recent commissions.

        **Note**: only `GET` is implemented — there is no `PATCH` handler on
        `app/api/admin/affiliates/[id]/route.ts`. (Field-level updates to an affiliate
        profile go through the dedicated suspend/reactivate/distribute-codes actions
        below, not a generic PATCH.)

        **Corrected vs. prior spec**: the previous version's `AffiliateCode` schema was
        missing `id`, `discountPercent`, `commissionPercent`, and `distributionReason`
        (all present on the live `getAffiliateDetails` select), and its
        `CommissionItem` schema was missing `paidAt`. The affiliate's email comes back
        nested as `user: { email, name }`, not a flat `email` string.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/[id]/route.ts` (GET)
      operationId: getAffiliateById
      parameters:
        - name: id
          in: path
          required: true
          description: Affiliate profile ID
          schema:
            type: string
      responses:
        '200':
          description: Affiliate details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/affiliates/{id}/suspend:
    post:
      tags:
        - Affiliates
      summary: Suspend affiliate account
      description: |
        Suspends an active affiliate account. Requires a non-empty `reason`.
        Suspended affiliates cannot earn commissions or use codes. Already-suspended
        affiliates get a 400.

        **Corrected vs. prior spec**: the `affiliate` field in the response is the raw
        updated `AffiliateProfile` row (from `prisma.affiliateProfile.update`, which
        returns every scalar column since no `select` is applied) — not the curated
        `AffiliateListItem` shape (with flattened `email`, etc.) the prior spec used.
        The success `message` text is exactly `'Affiliate suspended'`.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/[id]/suspend/route.ts` (POST);
        logic in `lib/admin/code-distribution.ts` (`suspendAffiliate`)
      operationId: suspendAffiliate
      parameters:
        - name: id
          in: path
          required: true
          description: Affiliate profile ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Reason for suspension
                  example: 'Violation of terms of service'
      responses:
        '200':
          description: Affiliate suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateSuspendResponse'
        '400':
          description: Invalid request (empty reason) or affiliate already suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/affiliates/{id}/reactivate:
    post:
      tags:
        - Affiliates
      summary: Reactivate suspended affiliate
      description: |
        Reactivates a suspended affiliate account (clears `suspensionReason` and
        `suspendedAt`). Only affiliates currently `SUSPENDED` can be reactivated; any
        other status gets a 400. No request body.

        **Corrected vs. prior spec**: same correction as `suspend` — `affiliate` is the
        raw updated `AffiliateProfile` row, not the curated list-item shape. The
        success `message` text is exactly `'Affiliate reactivated'`.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/[id]/reactivate/route.ts`
        (POST); logic in `lib/admin/code-distribution.ts` (`reactivateAffiliate`)
      operationId: reactivateAffiliate
      parameters:
        - name: id
          in: path
          required: true
          description: Affiliate profile ID
          schema:
            type: string
      responses:
        '200':
          description: Affiliate reactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateReactivateResponse'
        '400':
          description: Affiliate is not currently suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/affiliates/{id}/distribute-codes:
    post:
      tags:
        - Affiliates
      summary: Distribute bonus codes to affiliate
      description: |
        Distributes additional bonus codes (`distributionReason: 'ADMIN_BONUS'`) to an
        affiliate. Can distribute between 1 and 50 codes at a time. Only affiliates
        with status `ACTIVE` are eligible — others get a 400.

        **Corrected vs. prior spec**: the prior spec's `DistributeCodesResponse`
        included an optional `newCodes: string[]` array. The live handler
        (`distributeCodesAdmin` in `lib/admin/code-distribution.ts`) returns only
        `{ success, message, codesDistributed }` — it does **not** return the codes
        themselves in the response body. `message` is exactly
        `` `Successfully distributed ${count} codes to affiliate` ``. The `reason`
        field in the request body is accepted and validated (`min(1)`) but is
        currently **discarded** — `distributeCodesAdmin` receives it as `_reason` and
        never persists or uses it.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/[id]/distribute-codes/route.ts`
        (POST); logic in `lib/admin/code-distribution.ts` (`distributeCodesAdmin`)
      operationId: distributeCodes
      parameters:
        - name: id
          in: path
          required: true
          description: Affiliate profile ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
                - reason
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Number of codes to distribute
                  example: 10
                reason:
                  type: string
                  minLength: 1
                  description: Reason for distribution. Validated but currently not persisted anywhere.
                  example: 'Performance bonus for Q4'
      responses:
        '200':
          description: Codes distributed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributeCodesResponse'
        '400':
          description: Invalid request, count out of range (1-50), or affiliate not ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # AFFILIATE REPORTS ENDPOINTS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/admin/affiliates/reports/code-inventory:
    get:
      tags:
        - Affiliate Reports
      summary: Get code inventory report
      description: |
        Point-in-time census of affiliate codes: total codes (all time), a status
        breakdown (active/used/expired/cancelled), a distribution-reason breakdown
        (initial/monthly/adminBonus), the all-time conversion rate, period-scoped
        metrics (distributed/used/expired within the selected window), and alerts
        (codes expiring within 7 days, and a low-active-codes warning when active
        count drops below 50).

        Verified against the live handler field-for-field — no corrections needed
        versus the prior spec.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/reports/code-inventory/route.ts`
        (GET)
      operationId: getCodeInventoryReport
      parameters:
        - name: period
          in: query
          required: false
          description: Reporting period
          schema:
            type: string
            enum: [3months, 6months, 1year]
            default: 3months
      responses:
        '200':
          description: Code inventory report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeInventoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/affiliates/reports/code-flows:
    get:
      tags:
        - Affiliate Reports
      summary: Get global code flows (period reconciliation) report
      description: |
        **New in this session — no prior spec documented this path at all.**

        Global code inventory *flows* for an arbitrary period, across all affiliates:
        an opening balance (ACTIVE codes as of `start`, i.e. distributed before `start`
        and either still unused or used on/after `start`, excluding CANCELLED),
        additions during the period broken down by `distributionReason`
        (`monthlyDistribution`, `initialDistribution`, `bonusDistribution`, `total`),
        reductions during the period (`used`, `expired`, `cancelled`, `total`), a
        computed `closingBalance` (`opening + additions.total - reductions.total`), and
        `affiliatesWithActivity` — the count of distinct affiliates with any code
        distributed or used in the period. This complements `code-inventory` (a
        point-in-time census) with a period-over-period reconciliation view.

        The whole report is wrapped in a single `report` key.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/reports/code-flows/route.ts`
        (GET); logic in `lib/affiliate/report-builder.ts`
        (`buildGlobalCodeInventoryReport`)
      operationId: getCodeFlowsReport
      parameters:
        - name: start
          in: query
          required: false
          description: ISO 8601 datetime, inclusive. Defaults to the start of the current calendar month.
          schema:
            type: string
            format: date-time
          example: '2026-07-01T00:00:00.000Z'
        - name: end
          in: query
          required: false
          description: ISO 8601 datetime, inclusive. Defaults to now.
          schema:
            type: string
            format: date-time
          example: '2026-07-17T00:00:00.000Z'
      responses:
        '200':
          description: Global code flows report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeFlowsResponse'
        '400':
          description: Invalid query parameters, or `start` is not before `end`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                startAfterEnd:
                  value:
                    error: 'start must be before end'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/affiliates/reports/commission-owings:
    get:
      tags:
        - Affiliate Reports
      summary: Get commission owings report
      description: |
        Retrieves ACTIVE affiliates whose `pendingCommissions` balance meets or exceeds
        a minimum threshold (defaults to `AFFILIATE_CONFIG.MINIMUM_PAYOUT`, currently
        $50.00; overridable via `minBalance`), i.e. affiliates ready or nearly ready
        for payout.

        **Corrected vs. prior spec**: each affiliate item also includes a
        `paymentDetails` field (the raw JSON payment-info blob from
        `AffiliateProfile.paymentDetails`) which the prior spec's schema omitted.
        Everything else matches.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**:
        `app/api/admin/affiliates/reports/commission-owings/route.ts` (GET)
      operationId: getCommissionOwingsReport
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 20
        - name: minBalance
          in: query
          required: false
          description: Minimum pending balance filter (default uses AFFILIATE_CONFIG.MINIMUM_PAYOUT, currently 50.0)
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Commission owings report retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionOwingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/affiliates/reports/profit-loss:
    get:
      tags:
        - Affiliate Reports
      summary: Get profit & loss report
      description: |
        Generates a P&L report for the affiliate program over the selected period:
        gross/net revenue and discounts given, a commission cost breakdown
        (paid/pending/approved/total, plus the dynamic commission percent from
        `SystemConfig`), net profit and margin, and sale volume. All financial config
        (`basePriceUsd`, `discountPercent`, `commissionPercent`) is read dynamically
        via `getAffiliateConfigFromDB()`, not hardcoded.

        Verified against the live handler field-for-field — no corrections needed
        versus the prior spec.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/affiliates/reports/profit-loss/route.ts`
        (GET)
      operationId: getProfitLossReport
      parameters:
        - name: period
          in: query
