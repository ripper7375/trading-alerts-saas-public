  # CODE & COMMISSION ENDPOINTS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/admin/codes/{code}/cancel:
    post:
      tags:
        - Codes
      summary: Cancel affiliate code
      description: |
        Cancels an affiliate code. The code is normalized to uppercase before lookup.
        Only codes not already `USED` or `CANCELLED` can be cancelled (both return
        400). `reason` is optional in the request body; if omitted (or if no body is
        sent at all — the handler tolerates a missing/unparseable body), the returned
        `code.reason` defaults to the literal string `'Admin cancellation'`.

        Verified against the live handler field-for-field — no corrections needed
        versus the prior spec.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/codes/[code]/cancel/route.ts` (POST)
      operationId: cancelCode
      parameters:
        - name: code
          in: path
          required: true
          description: The affiliate code to cancel (case-insensitive; normalized to uppercase)
          schema:
            type: string
          example: 'JOHN-ABC123'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: "Optional reason for cancellation. Defaults to 'Admin cancellation' if omitted."
                  example: 'Code compromised'
      responses:
        '200':
          description: Code cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelCodeResponse'
        '400':
          description: Code already used or already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '404':
          description: Code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/commissions/pay:
    post:
      tags:
        - Commissions
      summary: Mark commissions as paid
      description: |
        Marks PENDING commissions as paid for an affiliate, in a transaction: updates
        each `Commission` row (`status: PAID`, `paidAt`, `paymentMethod`,
        `paymentReference`, `paymentBatchId`) and decrements/increments the
        affiliate's `pendingCommissions`/`paidCommissions` balances. If `commissionIds`
        is omitted, pays **all** currently-pending commissions for the affiliate. The
        total paid amount must meet `AFFILIATE_CONFIG.MINIMUM_PAYOUT` (currently
        $50.00) or the request is rejected with 400. `batchId` is generated as
        `` `PAY-${Date.now()}-${affiliateId.slice(-6)}` ``, and `paidBy` is the calling
        admin's session email.

        Verified against the live handler field-for-field — no corrections needed
        versus the prior spec.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/commissions/pay/route.ts` (POST)
      operationId: payCommissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - affiliateId
                - paymentMethod
                - paymentReference
              properties:
                affiliateId:
                  type: string
                  description: Affiliate profile ID
                  example: 'aff_123abc'
                paymentMethod:
                  type: string
                  minLength: 1
                  description: Method used for payment (free-text, not a validated enum)
                  example: 'BANK_TRANSFER'
                paymentReference:
                  type: string
                  minLength: 1
                  description: Payment transaction reference
                  example: 'TXN-2026-001234'
                commissionIds:
                  type: array
                  items:
                    type: string
                  description: Optional specific commission IDs to pay (pays all PENDING commissions for the affiliate if omitted)
      responses:
        '200':
          description: Commissions marked as paid successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCommissionsResponse'
        '400':
          description: Invalid request, no pending commissions to pay, or total below minimum payout threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                belowMinimum:
                  value:
                    error: 'Total amount ($12.50) is below minimum payout threshold ($50)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

