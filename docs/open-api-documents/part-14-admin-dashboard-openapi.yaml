  # SETTINGS ENDPOINTS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/admin/settings/affiliate:
    get:
      tags:
        - Settings
      summary: Get affiliate settings
      description: |
        Returns current affiliate system settings (backed by `SystemConfig` rows,
        keyed `affiliate_discount_percent`, `affiliate_commission_percent`,
        `affiliate_codes_per_month`, `affiliate_base_price`,
        `affiliate_three_day_price`) with metadata — who last updated each setting and
        when. Missing config rows fall back to hardcoded defaults (20%, 20%, 15,
        $29.00, $1.99 respectively) with `updatedBy: null`.

        Verified against the live handler field-for-field — no corrections needed
        versus the prior spec.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/settings/affiliate/route.ts` (GET)
      operationId: getAffiliateSettings
      responses:
        '200':
          description: Settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags:
        - Settings
      summary: Update affiliate settings
      description: |
        Updates affiliate system settings. All fields are optional — only provided
        fields are validated and updated (each is skipped, with no history entry
        created, if the new value equals the current stored value). Each update
        upserts the `SystemConfig` row and appends a `SystemConfigHistory` audit entry
        (`configKey`, `oldValue`, `newValue`, `changedBy`: admin email, `reason`).
        Validation is manual (not zod): `discountPercent`/`commissionPercent` must be
        0–100, `codesPerMonth` must be 1–100, `basePrice`/`threeDayPrice` must be
        non-negative.

        Verified against the live handler field-for-field — no corrections needed
        versus the prior spec.

        **Auth**: `requireAdmin()` pattern.

        **Implementation**: `app/api/admin/settings/affiliate/route.ts` (PATCH)
      operationId: updateAffiliateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discountPercent:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Discount percentage for customers using affiliate codes
                  example: 20
                commissionPercent:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Commission percentage for affiliates on net revenue
                  example: 20
                codesPerMonth:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Number of codes distributed to each affiliate monthly
                  example: 15
                basePrice:
                  type: number
                  minimum: 0
                  description: Base subscription price in USD
                  example: 29.0
                threeDayPrice:
                  type: number
                  minimum: 0
                  description: 3-day trial plan price in USD (dLocal only)
                  example: 1.99
                reason:
                  type: string
                  description: Reason for the change (stored on each SystemConfigHistory entry created this call)
                  example: 'Promotional rate for Q1'
      responses:
        '200':
          description: Settings updated successfully (or no-op if no fields changed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettingsResponse'
        '400':
          description: A provided value is outside its valid range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # FRAUD ALERT ENDPOINTS (absorbed from part-18-dlocal-payment-openapi.yaml)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  /api/admin/fraud-alerts:
    get:
      tags:
        - Fraud Alerts
      summary: List fraud alerts
      description: |
        Retrieves paginated fraud alerts with filtering and aggregate stats.

        **Absorbed from `part-18-dlocal-payment-openapi.yaml`** this session (that
        spec's copy is being deleted in parallel). **Corrected vs. the absorbed
        version**: `stats` was previously documented as nested breakdowns —
        `{ total, bySeverity: { LOW, MEDIUM, HIGH, CRITICAL }, byStatus: { PENDING,
        REVIEWED, DISMISSED, BLOCKED } }`. The live `getFraudAlertStats()` (in
        `lib/fraud/fraud-detection.service.ts`) does not return that shape at all — it
        returns **flat** severity counts plus a pending count:
        `{ total, critical, high, medium, low, pending }`. There is no `byStatus`
        breakdown of any kind.

        **Auth**: direct pattern (`getServerSession` + inline role check; 403 body is
        the short `{"error":"Forbidden"}`, not `"Forbidden: Admin access required"`).

        **Implementation**: `app/api/admin/fraud-alerts/route.ts` (GET)
      operationId: getFraudAlerts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 20
        - name: severity
          in: query
          required: false
          description: Filter by severity level
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: status
          in: query
          required: false
          description: Filter by alert status
          schema:
            type: string
            enum: [PENDING, REVIEWED, DISMISSED, BLOCKED]
        - name: pattern
          in: query
          required: false
          description: "Filter by fraud pattern (e.g. '3DAY_PLAN_REUSE', 'MULTIPLE_FAILED_PAYMENTS', 'VELOCITY_LIMIT', 'IP_MISMATCH')"
          schema:
            type: string
        - name: userId
          in: query
          required: false
          description: Filter by user ID
          schema:
            type: string
      responses:
        '200':
          description: Fraud alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlertsListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenShort'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/fraud-alerts/{id}:
    get:
      tags:
        - Fraud Alerts
      summary: Get fraud alert details
      description: |
        Retrieves a single fraud alert by ID, including the associated user's
        `{ id, email, name, tier, isActive, createdAt }`.

        **Absorbed from `part-18-dlocal-payment-openapi.yaml`** this session. Field
        shape verified against the live handler — matches the absorbed version well;
        the response is a spread of the raw `FraudAlert` row (so it also includes
        `deviceFingerprint` and `additionalData`, which the absorbed spec's
        `FraudAlertItem` schema didn't list) plus the nested `user` object and
        stringified `amount`/ISO-string dates.

        **Auth**: direct pattern (`getServerSession` + inline role check; 403 body is
        the short `{"error":"Forbidden"}`).

        **Implementation**: `app/api/admin/fraud-alerts/[id]/route.ts` (GET)
      operationId: getFraudAlertById
      parameters:
        - name: id
          in: path
          required: true
          description: Fraud alert ID
          schema:
            type: string
      responses:
        '200':
          description: Fraud alert retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlertDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenShort'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags:
        - Fraud Alerts
      summary: Update fraud alert status
      description: |
        Updates the status of a fraud alert. Setting `status: 'BLOCKED'` routes through
        `blockUserFromFraudAlert()` instead of the normal `updateFraudAlertStatus()` —
        this additionally blocks the associated user account. `resolution` and `notes`
        are optional in both cases. The response `message` is
        `` `Alert ${status.toLowerCase()} successfully` ``.

        **Absorbed from `part-18-dlocal-payment-openapi.yaml`** this session. The
        returned `alert` includes `updatedAt` (present on the live response; the
        absorbed spec's `FraudAlertUpdateResponse.alert` used the bare `FraudAlertItem`
        schema without it) and a smaller nested `user: { id, email, name }` (not the
        full user object returned by the GET-single endpoint).

        **Auth**: direct pattern (`getServerSession` + inline role check; 403 body is
        the short `{"error":"Forbidden"}`).

        **Implementation**: `app/api/admin/fraud-alerts/[id]/route.ts` (PATCH)
      operationId: updateFraudAlert
      parameters:
        - name: id
          in: path
          required: true
          description: Fraud alert ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, REVIEWED, DISMISSED, BLOCKED]
                  description: New status for the alert. BLOCKED also blocks the associated user account.
                resolution:
                  type: string
                  description: "Resolution type (optional, e.g. 'FALSE_POSITIVE', 'WARNING_SENT', 'BLOCKED')"
                notes:
                  type: string
                  description: Admin notes (optional)
      responses:
        '200':
          description: Fraud alert updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlertUpdateResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenShort'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# COMPONENTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie. Every route in this spec additionally requires the session user's `role` to be `ADMIN`.

  responses:
    Unauthorized:
      description: Unauthorized - Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Unauthorized'

    ForbiddenAdminAccess:
      description: Forbidden - Not admin (direct-pattern routes; users/analytics/api-usage/error-logs)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Forbidden: Admin access required'

    ForbiddenShort:
      description: Forbidden - Not admin (direct-pattern routes; fraud-alerts)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Forbidden'

    ForbiddenAdmin:
      description: Forbidden - Not admin (requireAdmin() pattern; affiliates/codes/commissions/settings routes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'You must be an administrator to access this resource'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Affiliate not found'

    BadRequest:
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Invalid query parameters'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Internal Server Error'

  schemas:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # COMMON SCHEMAS
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: 'Error message'
        message:
          type: string
          description: Some handlers use `message` instead of/alongside `error`; not universal.
        details:
          description: Present on requireAdmin()-pattern validation failures (zod .flatten() or .errors output)
          oneOf:
            - type: object
            - type: array

    ReportPeriod:
      type: object
      required:
        - start
        - end
        - name
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        name:
          type: string
          enum: [3months, 6months, 1year]

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # USER SCHEMAS (route 1: GET /api/admin/users)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    UsersListResponse:
      type: object
      description: Flat response — NOT nested under a `pagination` key.
      required:
        - users
        - total
        - page
        - pageSize
        - totalPages
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          example: 127
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 50
        totalPages:
          type: integer
          example: 3

    AdminUser:
      type: object
      required:
        - id
        - email
        - tier
        - role
        - status
        - createdAt
        - alertCount
      properties:
        id:
          type: string
          example: 'user_001'
        name:
          type: string
          nullable: true
          example: 'John Doe'
        email:
          type: string
          example: 'john@example.com'
        tier:
          type: string
          enum: [FREE, PRO]
          example: 'PRO'
        role:
          type: string
          example: 'USER'
        status:
          type: string
          enum: [active, suspended]
          description: Derived from `isActive` — not a raw DB enum
          example: 'active'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Estimated as (most recent session's expires) minus 30 days — not a real login timestamp
        alertCount:
          type: integer
          description: Count of the user's alerts (`_count.alerts`)
          example: 4

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ANALYTICS SCHEMAS (route 2: GET /api/admin/analytics)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    AnalyticsResponse:
      type: object
      required:
        - overview
        - revenue
        - growth
      properties:
        overview:
          type: object
          required:
            [totalUsers, freeUsers, proUsers, freePercentage, proPercentage]
          properties:
            totalUsers:
              type: integer
            freeUsers:
              type: integer
            proUsers:
              type: integer
            freePercentage:
              type: number
              description: Rounded to 2 decimal places
            proPercentage:
              type: number
              description: Rounded to 2 decimal places
        revenue:
          type: object
          required: [mrr, arr, conversionRate, pricePerUser]
          properties:
            mrr:
              type: number
              description: 'proUsers * pricePerUser (hardcoded $29/mo) — not derived from real subscription/payment records'
            arr:
              type: number
              description: mrr * 12
            conversionRate:
              type: number
              description: (proUsers / totalUsers) * 100, rounded to 2 decimals
            pricePerUser:
              type: number
              example: 29
        growth:
          type: object
          required: [newUsersThisMonth, churnedThisMonth]
          properties:
            newUsersThisMonth:
              type: integer
            churnedThisMonth:
              type: integer
              description: 'Hardcoded 0 — subscription-cancellation history tracking is not implemented yet'
              example: 0

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # API USAGE SCHEMAS (route 3: GET /api/admin/api-usage) — MOCK DATA
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ApiUsageEndpointStat:
      type: object
      required:
        [
          endpoint,
          method,
          callsFree,
          callsPro,
          avgResponseTime,
          errorRate,
          lastCalled,
        ]
      properties:
        endpoint:
          type: string
          example: '/api/alerts'
        method:
          type: string
          example: 'GET'
        callsFree:
          type: integer
        callsPro:
          type: integer
        avgResponseTime:
          type: integer
          description: Milliseconds
        errorRate:
          type: number
          description: Percentage
        lastCalled:
          type: string
          format: date-time
          nullable: true

    ApiUsageResponse:
      type: object
      required:
        - endpoints
        - summary
        - dateRange
      properties:
        endpoints:
          type: array
          description: Flat array of per-endpoint stats (not keyed/grouped)
          items:
            $ref: '#/components/schemas/ApiUsageEndpointStat'
        summary:
          type: object
          required:
            [
              totalCalls,
              totalCallsFree,
              totalCallsPro,
              avgResponseTime,
              overallErrorRate,
            ]
          properties:
            totalCalls:
              type: integer
            totalCallsFree:
              type: integer
            totalCallsPro:
              type: integer
            avgResponseTime:
              type: number
            overallErrorRate:
              type: number
        dateRange:
          type: object
          required: [startDate, endDate]
          properties:
            startDate:
              type: string
              example: '2026-07-10'
            endDate:
              type: string
              example: '2026-07-17'

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ERROR LOG SCHEMAS (route 4: GET /api/admin/error-logs) — MOCK DATA
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ErrorLogsResponse:
      type: object
      description: Flat response — NOT nested under a `pagination` key.
      required:
        - logs
        - total
        - page
        - pageSize
        - totalPages
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/ErrorLog'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    ErrorLog:
      type: object
      required:
        - id
        - timestamp
        - type
        - message
        - userId
        - userTier
        - endpoint
        - stackTrace
        - metadata
      properties:
        id:
          type: string
          example: 'err-1'
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum:
            [API_ERROR, DATABASE_ERROR, AUTH_ERROR, PAYMENT_ERROR, MT5_ERROR]
        message:
          type: string
        userId:
          type: string
          nullable: true
        userTier:
          type: string
          enum: [FREE, PRO]
          nullable: true
        endpoint:
          type: string
          nullable: true
        stackTrace:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # AFFILIATE SCHEMAS (routes 5-9)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    AffiliatesListResponse:
      type: object
      description: Flat response — NOT nested under a `pagination` key.
      required:
        - affiliates
        - total
        - page
        - limit
        - totalPages
      properties:
        affiliates:
          type: array
          items:
            $ref: '#/components/schemas/AdminAffiliateListItem'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    AdminAffiliateListItem:
      type: object
      description: The full AffiliateProfile row (Prisma `include`, no `select`) plus a nested `user` object and the affiliate's currently-ACTIVE codes only.
      required:
        - id
        - userId
        - fullName
        - country
        - paymentMethod
        - status
        - totalCodesDistributed
        - totalCodesUsed
        - totalEarnings
        - pendingCommissions
        - paidCommissions
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        fullName:
          type: string
        country:
          type: string
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, PAYPAL, CRYPTOCURRENCY, WISE]
        paymentDetails:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION, SUSPENDED, INACTIVE]
        totalCodesDistributed:
          type: integer
        totalCodesUsed:
          type: integer
        totalEarnings:
          type: number
        pendingCommissions:
          type: number
        paidCommissions:
          type: number
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        suspensionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            email:
              type: string
            name:
              type: string
              nullable: true
        affiliateCodes:
          type: array
          description: Only codes currently with status ACTIVE
          items:
            type: object
            properties:
              id:
                type: string
              code:
                type: string
              status:
                type: string
                enum: [ACTIVE]

    AffiliateCodeDetail:
      type: object
      required:
        - id
        - code
        - status
        - discountPercent
        - commissionPercent
        - distributedAt
        - expiresAt
        - distributionReason
      properties:
        id:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [ACTIVE, USED, EXPIRED, CANCELLED]
        discountPercent:
          type: number
        commissionPercent:
          type: number
        distributedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
          nullable: true
        distributionReason:
          type: string
          enum: [INITIAL, MONTHLY, ADMIN_BONUS]

    CommissionDetail:
      type: object
      required:
        - id
        - commissionAmount
        - status
        - earnedAt
      properties:
        id:
          type: string
        commissionAmount:
          type: number
        status:
          type: string
          enum: [PENDING, APPROVED, PAID, CANCELLED]
        earnedAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true

    AffiliateDetailResponse:
      type: object
      description: getAffiliateDetails() — the full AffiliateProfile row plus nested user, all affiliateCodes (not just active), and the 50 most recent commissions.
      required:
        - id
        - userId
        - fullName
        - country
        - paymentMethod
        - paymentDetails
        - status
        - totalCodesDistributed
        - totalCodesUsed
        - totalEarnings
        - pendingCommissions
        - paidCommissions
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        fullName:
          type: string
        country:
          type: string
        paymentMethod:
          type: string
        paymentDetails:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION, SUSPENDED, INACTIVE]
        facebookUrl:
          type: string
          nullable: true
        instagramUrl:
          type: string
          nullable: true
        twitterUrl:
          type: string
          nullable: true
        youtubeUrl:
          type: string
          nullable: true
        tiktokUrl:
          type: string
          nullable: true
        totalCodesDistributed:
          type: integer
        totalCodesUsed:
          type: integer
        totalEarnings:
          type: number
        pendingCommissions:
          type: number
        paidCommissions:
          type: number
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        suspensionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            email:
              type: string
            name:
              type: string
              nullable: true
        affiliateCodes:
          type: array
          items:
            $ref: '#/components/schemas/AffiliateCodeDetail'
        commissions:
          type: array
          description: Most recent 50, ordered by earnedAt desc
          items:
            $ref: '#/components/schemas/CommissionDetail'

    AffiliateProfileRaw:
      type: object
      description: Raw `prisma.affiliateProfile.update()` result — every scalar column, no relations (no `user`/`affiliateCodes`/`commissions`). Returned as-is by suspend/reactivate.
      required:
        - id
        - userId
        - fullName
        - country
        - paymentMethod
        - status
        - totalCodesDistributed
        - totalCodesUsed
        - totalEarnings
        - pendingCommissions
        - paidCommissions
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        fullName:
          type: string
        country:
          type: string
        paymentMethod:
          type: string
        paymentDetails:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, PENDING_VERIFICATION, SUSPENDED, INACTIVE]
        totalCodesDistributed:
          type: integer
        totalCodesUsed:
          type: integer
        totalEarnings:
          type: number
        pendingCommissions:
          type: number
        paidCommissions:
          type: number
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        suspensionReason:
          type: string
          nullable: true
        facebookUrl:
          type: string
          nullable: true
        instagramUrl:
          type: string
          nullable: true
        twitterUrl:
          type: string
          nullable: true
        youtubeUrl:
          type: string
          nullable: true
        tiktokUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AffiliateSuspendResponse:
      type: object
      required:
        - success
        - message
        - affiliate
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Affiliate suspended'
        affiliate:
          $ref: '#/components/schemas/AffiliateProfileRaw'

    AffiliateReactivateResponse:
      type: object
      required:
        - success
        - message
        - affiliate
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Affiliate reactivated'
        affiliate:
          $ref: '#/components/schemas/AffiliateProfileRaw'

    DistributeCodesResponse:
      type: object
      description: Does NOT include the distributed codes themselves — only the count.
      required:
        - success
        - message
        - codesDistributed
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Successfully distributed 10 codes to affiliate'
        codesDistributed:
          type: integer
          example: 10

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # AFFILIATE REPORTS SCHEMAS (routes 10-14)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    CodeInventoryResponse:
      type: object
      required:
        - period
        - allTime
        - periodMetrics
        - alerts
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        allTime:
          type: object
          properties:
            totalCodes:
              type: integer
            byStatus:
              type: object
              properties:
                active:
                  type: integer
                used:
                  type: integer
                expired:
                  type: integer
                cancelled:
                  type: integer
            byReason:
              type: object
              properties:
                initial:
                  type: integer
                monthly:
                  type: integer
                adminBonus:
                  type: integer
            conversionRate:
              type: number
              description: Rounded to 1 decimal place
        periodMetrics:
          type: object
          properties:
            distributed:
              type: integer
            used:
              type: integer
            expired:
              type: integer
            periodConversionRate:
              type: number
        alerts:
          type: object
          properties:
            expiringIn7Days:
              type: integer
            lowActiveCodesWarning:
              type: boolean
              description: True when active-code count is below 50

    CodeFlowsResponse:
      type: object
      description: New in this session — GET /api/admin/affiliates/reports/code-flows. Response is wrapped in a single `report` key.
      required:
        - report
      properties:
        report:
          type: object
          required:
            [
              period,
              openingBalance,
              additions,
              reductions,
              closingBalance,
              affiliatesWithActivity,
            ]
          properties:
            period:
              type: object
              required: [start, end]
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
            openingBalance:
              type: integer
              description: ACTIVE codes as of period start (distributed before `start`, not yet used before `start`, not CANCELLED)
              example: 342
            additions:
              type: object
              required:
                [
                  monthlyDistribution,
                  initialDistribution,
                  bonusDistribution,
                  total,
                ]
              properties:
                monthlyDistribution:
                  type: integer
                initialDistribution:
                  type: integer
                bonusDistribution:
                  type: integer
                total:
                  type: integer
            reductions:
              type: object
              required: [used, expired, cancelled, total]
              properties:
                used:
                  type: integer
                expired:
                  type: integer
                cancelled:
                  type: integer
                total:
                  type: integer
            closingBalance:
              type: integer
              description: openingBalance + additions.total - reductions.total
              example: 401
            affiliatesWithActivity:
              type: integer
              description: Count of distinct affiliates with a code distributed or used in the period
              example: 18

    CommissionOwingsResponse:
      type: object
      required:
        - summary
        - affiliates
        - pagination
      properties:
        summary:
          type: object
          properties:
            totalAffiliatesOwed:
              type: integer
            affiliatesReadyForPayout:
              type: integer
            totalOwed:
              type: number
            minimumPayoutThreshold:
              type: number
              example: 50
        affiliates:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              fullName:
                type: string
              email:
                type: string
              country:
                type: string
              paymentMethod:
                type: string
              paymentDetails:
                type: object
                additionalProperties: true
                description: Raw JSON payment-info blob (missing from the prior spec's schema)
              balance:
                type: object
                properties:
                  pending:
                    type: number
                  paid:
                    type: number
                  total:
                    type: number
              pendingCount:
                type: integer
              oldestPendingDate:
                type: string
                format: date-time
                nullable: true
              readyForPayout:
                type: boolean
        pagination:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    ProfitLossResponse:
      type: object
      required:
        - period
        - revenue
        - costs
        - profit
        - volume
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        revenue:
          type: object
          properties:
            grossRevenue:
              type: number
            discounts:
              type: number
            netRevenue:
              type: number
            discountPercent:
              type: number
              description: From dynamic SystemConfig, not hardcoded
            averageTicket:
              type: number
        costs:
          type: object
          properties:
            paidCommissions:
              type: number
            pendingCommissions:
              type: number
            approvedCommissions:
              type: number
            totalCommissions:
              type: number
            commissionPercent:
              type: number
              description: From dynamic SystemConfig, not hardcoded
            averageCommission:
              type: number
        profit:
          type: object
          properties:
            netProfit:
              type: number
            margin:
              type: number
              description: Percentage, rounded to 1 decimal place
        volume:
          type: object
          properties:
            totalSales:
              type: integer
            regularPrice:
              type: number
              description: From dynamic SystemConfig (basePriceUsd)

    SalesPerformanceResponse:
      type: object
      required:
        - period
        - summary
        - topPerformers
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        summary:
          type: object
          properties:
            totalAffiliates:
              type: integer
            totalConversions:
              type: integer
            totalCommissionsEarned:
              type: number
            averageConversionsPerAffiliate:
              type: number
        topPerformers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              fullName:
                type: string
              email:
                type: string
              country:
                type: string
              metrics:
                type: object
                properties:
                  codesDistributed:
                    type: integer
                  codesUsed:
                    type: integer
                  conversionsPeriod:
                    type: integer
                  totalCommissions:
                    type: number
                  conversionRate:
                    type: number
                    description: (totalCodesUsed / totalCodesDistributed) * 100, all-time — not scoped to the report period

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # CODE & COMMISSION SCHEMAS (routes 15-16)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    CancelCodeResponse:
      type: object
      required:
        - success
        - message
        - code
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Code cancelled successfully'
        code:
          type: object
          properties:
            code:
              type: string
            status:
              type: string
              enum: [CANCELLED]
            cancelledAt:
              type: string
              format: date-time
            affiliateId:
              type: string
            affiliateName:
              type: string
            reason:
              type: string
              description: "The provided reason, or 'Admin cancellation' if none was given"
              example: 'Admin cancellation'

    PayCommissionsResponse:
      type: object
      required:
        - success
        - message
        - payment
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Commissions marked as paid'
        payment:
          type: object
          properties:
            batchId:
              type: string
              example: 'PAY-1752710400000-c123ab'
            affiliateId:
              type: string
            commissionCount:
              type: integer
            totalAmount:
              type: number
              description: Rounded to 2 decimal places
            paymentMethod:
              type: string
            paymentReference:
              type: string
            paidAt:
              type: string
              format: date-time
            paidBy:
              type: string
              description: Calling admin's session email
              nullable: true

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # SETTINGS SCHEMAS (route 17)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ConfigValue:
      type: object
      required:
        - value
        - updatedAt
      properties:
        value:
          type: number
        updatedBy:
          type: string
          nullable: true
          description: Admin user ID, or null if the setting has never been changed from its default
        updatedAt:
          type: string
          format: date-time

    AffiliateSettingsResponse:
      type: object
      required:
        - discountPercent
        - commissionPercent
        - codesPerMonth
        - basePrice
        - threeDayPrice
      properties:
        discountPercent:
          $ref: '#/components/schemas/ConfigValue'
        commissionPercent:
          $ref: '#/components/schemas/ConfigValue'
        codesPerMonth:
          $ref: '#/components/schemas/ConfigValue'
        basePrice:
          $ref: '#/components/schemas/ConfigValue'
        threeDayPrice:
          $ref: '#/components/schemas/ConfigValue'

    UpdateSettingsResponse:
      type: object
      required:
        - success
        - message
        - changes
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Affiliate settings updated. Changes will propagate across all pages within 5 minutes.'
        changes:
          type: array
          description: Only settings whose value actually changed appear here
          items:
            type: object
            properties:
              setting:
                type: string
                enum:
                  [
                    discountPercent,
                    commissionPercent,
                    codesPerMonth,
                    basePrice,
                    threeDayPrice,
                  ]
              oldValue:
                type: string
              newValue:
                type: string

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # FRAUD ALERT SCHEMAS (routes 18-19, absorbed from part-18)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    FraudAlertsPagination:
      type: object
      description: Uses `pageSize`, not `limit` — distinct from the affiliate-report pagination shape.
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    FraudAlertStats:
      type: object
      description: Flat severity counts, NOT the nested `bySeverity`/`byStatus` shape the absorbed part-18 spec previously documented. There is no status breakdown other than `pending`.
      required:
        - total
        - critical
        - high
        - medium
        - low
        - pending
      properties:
        total:
          type: integer
        critical:
          type: integer
        high:
          type: integer
        medium:
          type: integer
        low:
          type: integer
        pending:
          type: integer
          description: Count of alerts currently in PENDING status

    FraudAlertsListResponse:
      type: object
      required:
        - alerts
        - stats
        - pagination
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/FraudAlertItem'
        stats:
          $ref: '#/components/schemas/FraudAlertStats'
        pagination:
          $ref: '#/components/schemas/FraudAlertsPagination'

    FraudAlertItem:
      type: object
      required:
        - id
        - severity
        - pattern
        - status
        - userId
        - createdAt
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        pattern:
          type: string
          example: 'VELOCITY_LIMIT'
        description:
          type: string
        userId:
          type: string
        userEmail:
          type: string
        userName:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
          description: Stringified Decimal
        currency:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, REVIEWED, DISMISSED, BLOCKED]
        ipAddress:
          type: string
          nullable: true
        resolution:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
          description: Admin user ID who reviewed
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    FraudAlertDetailResponse:
      type: object
      required:
        - alert
      properties:
        alert:
          allOf:
            - $ref: '#/components/schemas/FraudAlertItem'
            - type: object
              properties:
                deviceFingerprint:
                  type: string
                  nullable: true
                additionalData:
                  type: object
                  nullable: true
                  additionalProperties: true
                updatedAt:
                  type: string
                  format: date-time
                user:
                  type: object
                  properties:
                    id:
                      type: string
                    email:
                      type: string
                    name:
                      type: string
                      nullable: true
                    tier:
                      type: string
                      enum: [FREE, PRO]
                    isActive:
                      type: boolean
                    createdAt:
                      type: string
                      format: date-time

    FraudAlertUpdateResponse:
      type: object
      required:
        - alert
        - message
      properties:
        alert:
          allOf:
            - $ref: '#/components/schemas/FraudAlertItem'
            - type: object
              properties:
                updatedAt:
                  type: string
                  format: date-time
                user:
                  type: object
                  description: Smaller than the GET-single endpoint's user object — no tier/isActive/createdAt
                  properties:
                    id:
                      type: string
                    email:
                      type: string
                    name:
                      type: string
                      nullable: true
        message:
          type: string
          example: 'Alert blocked successfully'
