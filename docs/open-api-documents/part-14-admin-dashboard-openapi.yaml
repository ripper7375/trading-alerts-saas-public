openapi: 3.0.3
info:
  title: Trading Alerts SaaS - Admin Dashboard API (Part 14)
  version: 3.0.0
  description: |
    Admin Dashboard API for Trading Alerts SaaS platform (Part 14).

    **Last Updated:** 2026-08-04 — verified against all 19 live admin route handlers under `app/api/admin/**`.

    Several field-level bugs were found and fixed versus the prior version of this file
    — see the per-operation descriptions below for what changed. The two biggest:
    `GET /api/admin/users` and `GET /api/admin/analytics` had response shapes that did
    not match their live handlers at all (different field names, different nesting,
    missing/extra fields), and `GET /api/admin/fraud-alerts` had a `stats` object shape
    (`bySeverity`/`byStatus` nested breakdowns) that the live service function does not
    return (it returns flat `critical`/`high`/`medium`/`low`/`pending` counts).

    ## Sub-domains
    - **Core Admin** (`/api/admin/users`, `/api/admin/analytics`, `/api/admin/api-usage`,
      `/api/admin/error-logs`): platform-wide metrics and lists. `api-usage` and
      `error-logs` currently return **mock data** — both handlers have explicit
      `PRODUCTION TODO` comments; no real tracking tables exist yet.
    - **Affiliate Administration** (`/api/admin/affiliates/**`, `/api/admin/codes/**`,
      `/api/admin/commissions/**`, `/api/admin/settings/affiliate`): affiliate account
      lifecycle (list/detail/suspend/reactivate/distribute-codes), code cancellation,
      commission payout, and dynamic affiliate program settings.
    - **Affiliate Reports** (`/api/admin/affiliates/reports/**`): code inventory
      (point-in-time census), code flows (period reconciliation — new in this session),
      commission owings, profit & loss, and sales performance.
    - **Fraud Alerts** (`/api/admin/fraud-alerts/**`): list/filter fraud alerts with
      stats, view/update a single alert (updating to `BLOCKED` also blocks the user
      account).

    ## Security
    **Admin Access Only**: All 19 routes require ADMIN role. Two different auth-check
    patterns are used across the codebase — each operation below notes which one its
    handler uses:
    - **Direct pattern** (`users`, `analytics`, `api-usage`, `error-logs`,
      `fraud-alerts`, `fraud-alerts/{id}`): `getServerSession(authOptions)` then a
      manual `session.user.role !== 'ADMIN'` check inline in the route handler.
    - **`requireAdmin()` pattern** (all `affiliates/**`, `codes/**`, `commissions/**`,
      `settings/affiliate`): a shared helper (`lib/auth/session.ts`) that throws a typed
      `AuthError` (401 if not logged in, 403 if not ADMIN), caught by the route and
      converted to `{ error: error.message }` with `error.statusCode`.

    The exact 403 body text differs by pattern: `users`/`analytics`/`api-usage`/
    `error-logs` return `{"error":"Forbidden: Admin access required"}`; `fraud-alerts`/
    `fraud-alerts/{id}` return the shorter `{"error":"Forbidden"}`; the `requireAdmin()`
    routes return `{"error":"You must be an administrator to access this resource"}`.

  contact:
