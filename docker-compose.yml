version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trading_alerts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Flask MT5 Service (Part 6)
  # ============================================================================
  # ⚠️  IMPORTANT: LOCAL DEVELOPMENT ONLY
  #
  # This service is for LOCAL TESTING on Linux/Mac only.
  # Docker containers CANNOT access Windows MT5 terminals.
  #
  # For PRODUCTION on Contabo Windows VPS:
  # - Run Flask service NATIVELY on Windows (no Docker)
  # - See: docs/deployment/contabo-windows-setup.md
  #
  # The MetaTrader5 Python package requires:
  # - Windows OS
  # - Direct access to MT5 terminal processes (Windows COM API)
  # - Not available in Linux Docker containers
  # ============================================================================
  mt5-service:
    build:
      context: ./mt5-service
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    environment:
      - FLASK_ENV=development  # Changed from production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/trading_alerts
      - REDIS_URL=redis://redis:6379
      - USE_MOCK_MT5=true  # Use mock data in Docker (no real MT5 access)
    volumes:
      - ./mt5-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/api/system/health']
      interval: 30s
      timeout: 10s
      retries: 3
    # Note: This container uses MOCK MT5 data for local testing
    # Real MT5 integration requires native Windows deployment

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/trading_alerts
      - REDIS_URL=redis://redis:6379
      - FLASK_MT5_URL=http://mt5-service:5001
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-secret-key-here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mt5-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/system/health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: trading-alerts-network
