# MCD0 parameters (standard Appendix C.3). Changing a value is a version change (standard section 14).
# Every threshold in mcd0.md section 6 appears here once. A change needs a new decision entry and a MINOR version
# (concept R10). 1.1.0 (ADR-101, Davin 2026-11-26): the values measured as "variant A4" on the shadow window of 19 to 25
# November 2026, where 1.0.0 flagged a timeframe on 97.0 of every 100 readings that named a state.
mcd_id: MCD0
evaluator_version: 1.1.0
parameters:
  min_coverage_bars:
    value: 60
    unit: closed bars
    boundary: '>= value passes the COVERAGE pillar (coverage = window_span_bars - t_edt_open_bar_rows)'
    why: 'File C pillar 1: N_span >= 60, which is at least 5 hours of M5 and 15 hours of M15 (walkthrough C4, architecture 2.4)'
  t_edt_open_bar_rows:
    value: 1
    unit: rows
    boundary: 'coverage in closed bars = window_span_bars - value'
    why: 'window_span_bars counts from the leftmost evaluated bar to the live bar inclusive (schema.prisma), so the still-open bar is one of its rows; same name and value as MCD1 to MCD3 (ADR-083); Davin, 2026-10-01, question (a). Whether the fit window includes the open bar is open (waiting-on)'
  min_r2_model_a:
    value: 0.00
    unit: R-squared
    boundary: '>= value passes R2_A, on the timeframes of r2_timeframes'
    why: 'ADR-101: below zero the Model A (SSA crossings) fit explains less than a flat line does; the 0.70 of 1.0.0 (ADR-019) failed it on 40.7 of every 100 M5 readings with most_recent'
  min_r2_model_b:
    value: 0.00
    unit: R-squared
    boundary: '>= value passes R2_B, on the timeframes of r2_timeframes'
    why: 'ADR-101: the same floor for Model B (close price); the 0.65 of 1.0.0 (ADR-019) failed it on 42.0 of every 100 M5 readings with most_recent'
  r2_timeframes:
    value: [M5]
    unit: timeframes
    boundary: 'a timeframe in the list applies R2_A and R2_B (unless the channel is flat); a timeframe not in it skips both and lists them in details'
    why: 'ADR-101: the M15 channel (non_b, built from older centroids) is judged on coverage, fit ratio, geo ratio and skew; with R2 applied it was flagged on 44.2 of every 100 readings even at a floor of zero'
  flat_angle_deg:
    value: 5.0
    unit: degrees
    boundary: 'abs(regression_angle) <= value: the active channel is flat and the R-squared pillar (both models) is not applied; above value it is applied'
    why: 'A flat channel explains almost no variance by slope, whichever indicator draws it; the same +-5 degree band as SIDEWAYS in MCD1 to MCD3; Davin, 2026-10-01, question (d)'
  min_fit_ratio:
    value: 1.25
    unit: ratio
    boundary: '>= value passes the FIT pillar of a model (below it: over-fitted, wicks breach)'
    why: 'ADR-101 (1.0.0: 1.50, file C pillar 3); each model uses its own MSE (Davin, 2026-10-01, question (b))'
  max_fit_ratio:
    value: 3.20
    unit: ratio
    boundary: '<= value passes the FIT pillar of a model (above it: under-fitted, too loose)'
    why: 'File C pillar 3, architecture 2.4; unchanged by ADR-101'
  min_geo_ratio:
    value: 0.50
    unit: ratio
    boundary: '>= value passes the GEO pillar'
    why: 'ADR-101 (1.0.0: 0.60, file C pillar 4); the pillar is kept although the schema calls asymmetry "reported, never penalised" (Davin, 2026-10-01, question (c))'
  max_geo_ratio:
    value: 2.00
    unit: ratio
    boundary: '<= value passes the GEO pillar'
    why: 'ADR-101 (1.0.0: 1.65, file C pillar 4): the upper bound mirrors the lower one (0.50 and 2.00 are reciprocals)'
  max_abs_skew:
    value: 1.50
    unit: skewness
    boundary: 'abs(skew) <= value passes the SKEW pillar of a model'
    why: 'File C pillar 4, architecture 2.4: absolute skew at most 1.50; each model uses its own skew (spec question Q2)'
  ratio_decimals:
    value: 4
    unit: decimals
    boundary: 'Output rounding only (R-squared, fit ratio, geo ratio in details); every verdict is decided on the unrounded values'
    why: 'The verdicts sit close to their boundaries on real data (fit ratio 1.2242 against 1.25), so two decimals would hide the reason'
  statistic_decimals:
    value: 2
    unit: decimals
    boundary: 'Output rounding only (skew, variance ratio, kurtosis in details)'
    why: 'The indicator stores these at two decimals'
